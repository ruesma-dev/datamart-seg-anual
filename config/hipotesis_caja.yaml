# config/hipotesis_caja.yaml
#
# F-140 · EL CATALOGO DE HIPOTESIS para pasar el DEVENGO de una obra a CAJA.
#
# EL DATAMART NO CONVIERTE DEVENGO EN CAJA (regla del humano): publica los
# ingredientes y este catalogo, y la conversion la hace la IA en vivo,
# declarando CADA hipotesis con su valor y su nivel (`R-CAJA-HIPOTESIS`):
# USUARIO (lo que dice quien pregunta) > OBRA (la seccion `obras` de aqui, o lo
# leido de los contratos con el cliente) > DEFECTO (el `valor_defecto` de aqui).
#
# Lo publica `build_tesoreria` cada noche en `tesoreria.hipotesis_caja` (el
# catalogo) y `tesoreria.hipotesis_caja_obra` (el valor resuelto por obra). Si
# algo de este fichero no valida, el paso FALLA con la lista de errores y no
# publica nada a medias (`etl_sigrid/domain/proyeccion_caja.py`).
#
# QUIEN LO MANTIENE (D15-A): Control de Costes propone, el humano aprueba y el
# ETL publica. Cada cambio es un commit y una imagen nueva del job.
#
# LOS DEFECTOS SON PROPUESTAS (D17-A): `validado: false` hasta que Negocio los
# apruebe; entonces `validado: true` y `fecha_validacion: AAAA-MM-DD`. La IA
# avisa de los no validados. Las cifras «medidas» salen de
# `progress/spec_F-140.md` (lecturas de solo lectura del 2026-10-24).
#
# Campos de cada hipotesis:
#   codigo           H y dos cifras, unico
#   sentido          PAGO, COBRO o AMBOS
#   descripcion      que supone la hipotesis
#   unidad           DIAS, MESES, PORCENTAJE (0-100), BOOLEANO, OPCION o MAPA_DIAS
#   valor_defecto    casa con la unidad; en OPCION, una de `opciones` (la primera)
#   opciones         solo en OPCION: el defecto y sus alternativas
#   fuente_defecto   de que dato o decision sale el defecto
#   ingrediente      objeto del datamart donde la IA lee el dato que la alimenta
#                    (null si no hay ninguno)
#   validado         true solo cuando Negocio lo aprueba
#   fecha_validacion solo con validado: true
#   admite_obra      si se puede personalizar por obra en la seccion `obras`
#   paso_receta      F-150: el paso de la receta en que se aplica, uno de DEVENGO,
#                    DOCUMENTO, COEFICIENTES, PLAZO, RETENCION, IVA o CARTERA
#
# VALORES POR OBRA (D14-A), seccion `obras`: `clave_obra` (empresa-codigo, como
# `1-0704`: R-CODIGO-POR-EMPRESA), `codigo`, `valor`, `motivo` y `fecha`. Ganan
# a lo leido de Sigrid y al defecto. Una obra o un codigo que no existan tumban
# el paso diciendo cuales.

version: 1

hipotesis:

  - codigo: H01
    sentido: PAGO
    descripcion: >-
      Plazo de pago de lo que tiene contrato de compra: el de la forma de pago
      del contrato (su formula, leida en dias de cada vencimiento y de la
      retencion).
    unidad: OPCION
    valor_defecto: CONTRATO
    opciones: [CONTRATO]
    fuente_defecto: >-
      La forma de pago pactada en el contrato (`raw.ctr.pagide`), presente en
      19.161 de 19.170 contratos.
    ingrediente: tesoreria.condiciones_contrato_compra
    validado: false
    admite_obra: true
    paso_receta: PLAZO

  - codigo: H02
    sentido: PAGO
    descripcion: >-
      Plazo de pago, en dias, de lo que NO tiene contrato, por categoria de la
      partida (CD, CI, CP, OTRO).
    unidad: MAPA_DIAS
    valor_defecto: {CD: 120, CI: 120, CP: 120, OTRO: 120}
    fuente_defecto: >-
      La forma de pago mas frecuente en los contratos de compra: 120 dias
      (5.624 de 19.170, medido).
    ingrediente: tesoreria.plazos_forma_pago
    validado: false
    admite_obra: true
    paso_receta: PLAZO

  - codigo: H03
    sentido: PAGO
    descripcion: >-
      Meses entre el mes de devengo y la fecha de la factura del proveedor,
      desde la que corre el plazo de pago.
    unidad: MESES
    valor_defecto: 0
    fuente_defecto: La factura se fecha a fin del mes de devengo (propuesta, sin medir).
    ingrediente: tesoreria.devengo_pendiente_obra_mes
    validado: false
    admite_obra: true
    paso_receta: DOCUMENTO

  - codigo: H04
    sentido: PAGO
    descripcion: >-
      Aplicar los dias fijos de pago y los meses sin pago del proveedor
      (`pagdia`, `pagmes`) cuando los tiene.
    unidad: BOOLEANO
    valor_defecto: true
    fuente_defecto: >-
      Los tienen 2.919 y 2.223 de 9.638 proveedores (medido); se aplican si
      existen.
    ingrediente: tesoreria.condiciones_contrato_compra
    validado: false
    admite_obra: true
    paso_receta: PLAZO

  - codigo: H05
    sentido: PAGO
    descripcion: Dias de retraso real sobre el plazo nominal de la forma de pago.
    unidad: DIAS
    valor_defecto: 0
    fuente_defecto: >-
      Ninguno por defecto. Medido en los efectos desde 2023: el pago real se
      alarga de 7 a 22 dias sobre el nominal (mediana por formula).
    ingrediente: tesoreria.plazos_forma_pago
    validado: false
    admite_obra: true
    paso_receta: PLAZO

  - codigo: H06
    sentido: PAGO
    descripcion: >-
      Porcentaje de retencion de garantia que se descuenta al proveedor: el del
      contrato (clases 4 y 5); sin contrato, este valor.
    unidad: PORCENTAJE
    valor_defecto: 0
    fuente_defecto: >-
      Con contrato, `retencion_garantia_porcentaje` (5 % en 6.304 contratos);
      sin contrato no hay retencion pactada.
    ingrediente: tesoreria.condiciones_contrato_compra
    validado: false
    admite_obra: true
    paso_receta: RETENCION

  - codigo: H07
    sentido: PAGO
    descripcion: >-
      Cuando se devuelve la retencion al proveedor: a fin de obra mas el plazo
      (criterio de Negocio) o a los dias de la formula de Sigrid (`NR`, desde la
      factura).
    unidad: OPCION
    valor_defecto: FIN_OBRA
    opciones: [FIN_OBRA, SIGRID]
    fuente_defecto: >-
      Decision de Negocio del 2026-09-22, publicada en
      `retenciones.fin_obra.fecha_vencimiento`.
    ingrediente: retenciones.fin_obra
    validado: false
    admite_obra: true
    paso_receta: RETENCION

  - codigo: H08
    sentido: COBRO
    descripcion: Meses entre la produccion de un mes y su certificacion al cliente.
    unidad: MESES
    valor_defecto: 1
    fuente_defecto: Se certifica el mes siguiente al de produccion (propuesta, sin medir).
    ingrediente: tesoreria.devengo_pendiente_obra_mes
    validado: false
    admite_obra: true
    paso_receta: DOCUMENTO

  - codigo: H09
    sentido: COBRO
    descripcion: Plazo de cobro del cliente, en dias desde la certificacion.
    unidad: DIAS
    valor_defecto: 60
    fuente_defecto: >-
      El del contrato con el cliente si es unico (nivel OBRA, fuente SIGRID);
      si no, 60: la forma de cobro mas frecuente, CF60 (110 de 705 contratos).
    ingrediente: tesoreria.condiciones_contrato_cliente
    validado: false
    admite_obra: true
    paso_receta: PLAZO

  - codigo: H10
    sentido: COBRO
    descripcion: Porcentaje de retencion de garantia que nos retiene el cliente.
    unidad: PORCENTAJE
    valor_defecto: 0
    fuente_defecto: >-
      El del contrato con el cliente si es unico (nivel OBRA, fuente SIGRID);
      si no, ninguno.
    ingrediente: tesoreria.condiciones_contrato_cliente
    validado: false
    admite_obra: true
    paso_receta: RETENCION

  - codigo: H11
    sentido: COBRO
    descripcion: >-
      Meses tras el fin de obra en que el cliente devuelve la retencion.
    unidad: MESES
    valor_defecto: 12
    fuente_defecto: >-
      El plazo de retencion del contrato con el cliente (`plaret`) o, si no, el
      de garantia (`plagar`), si es unico (fuente SIGRID); si no, 12, como
      `retenciones.fin_obra`.
    ingrediente: tesoreria.condiciones_contrato_cliente
    validado: false
    admite_obra: true
    paso_receta: RETENCION

  - codigo: H12
    sentido: COBRO
    descripcion: >-
      IVA de la venta que se suma al cobro (el devengo va sin IVA).
    unidad: PORCENTAJE
    valor_defecto: 21
    fuente_defecto: >-
      Tipo general. La vivienda va al 10 %: se personaliza por obra.
    ingrediente: null
    validado: false
    admite_obra: true
    paso_receta: IVA

  - codigo: H13
    sentido: PAGO
    descripcion: >-
      IVA efectivo de la compra que se suma al pago (el devengo va sin IVA).
    unidad: PORCENTAJE
    valor_defecto: 5.5
    fuente_defecto: >-
      Cuota / base de las facturas de compra de 12 meses: 7,99 / 144,53 M EUR
      (medido). La marca de inversion del sujeto pasivo no sirve: es falsa en
      todas.
    ingrediente: compras.facturas
    validado: false
    admite_obra: true
    paso_receta: IVA

  - codigo: H14
    sentido: AMBOS
    descripcion: >-
      Como se liquida el IVA con Hacienda: trimestral (dia 20 del mes
      siguiente al trimestre), mensual o no se modela.
    unidad: OPCION
    valor_defecto: TRIMESTRAL
    opciones: [TRIMESTRAL, MENSUAL, NO_MODELAR]
    fuente_defecto: Regimen general trimestral (propuesta, sin medir).
    ingrediente: null
    validado: false
    admite_obra: true
    paso_receta: IVA

  - codigo: H15
    sentido: AMBOS
    descripcion: >-
      Como se reparte un importe entre los vencimientos de una formula con
      varios (`30 60 90`).
    unidad: OPCION
    valor_defecto: PARTES_IGUALES
    opciones: [PARTES_IGUALES]
    fuente_defecto: Partes iguales entre los vencimientos (propuesta).
    ingrediente: tesoreria.plazos_forma_pago
    validado: false
    admite_obra: true
    paso_receta: PLAZO

  - codigo: H16
    sentido: AMBOS
    descripcion: >-
      Que se hace con la cartera PREVISTA ya vencida (y no antigua): al primer
      mes de la proyeccion o fuera.
    unidad: OPCION
    valor_defecto: PRIMER_MES
    opciones: [PRIMER_MES, EXCLUIR]
    fuente_defecto: Sigue viva y se paga o cobra ya (propuesta).
    ingrediente: tesoreria.efectos
    validado: false
    admite_obra: true
    paso_receta: CARTERA

  - codigo: H17
    sentido: AMBOS
    descripcion: >-
      Excluir de la caja el previsto antiguo (PREVISTO vencido hace mas de 2
      anos, `previsto_antiguo`).
    unidad: BOOLEANO
    valor_defecto: true
    fuente_defecto: >-
      F-037, D11: es deuda sin puntear que la contabilidad no sostiene, no caja.
    ingrediente: tesoreria.efectos
    validado: false
    admite_obra: false
    paso_receta: CARTERA

  - codigo: H18
    sentido: AMBOS
    descripcion: >-
      Como se descuenta lo ejecutado desde la version: por partida
      (`importe_pendiente`) o quitando solo los meses ya cerrados
      (`importe_plan_restante`).
    unidad: OPCION
    valor_defecto: POR_PARTIDA
    opciones: [POR_PARTIDA, SOLO_MESES_CERRADOS]
    fuente_defecto: >-
      D3-A: las obras van retrasadas respecto a su version (+19,2 M EUR de
      coste pendiente, medido).
    ingrediente: tesoreria.devengo_pendiente_obra_mes
    validado: false
    admite_obra: true
    paso_receta: DEVENGO

  - codigo: H19
    sentido: AMBOS
    descripcion: >-
      Que se hace con lo planificado y no ejecutado que la version ya no situa
      en ningun mes futuro (`importe_retraso_sin_perfil`).
    unidad: OPCION
    valor_defecto: PRIMER_MES
    opciones: [PRIMER_MES, REPARTIR, EXCLUIR]
    fuente_defecto: D19-A, al primer mes pendiente (5,99 M EUR de coste, medido).
