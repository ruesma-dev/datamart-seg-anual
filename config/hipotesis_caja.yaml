    validado: false
    admite_obra: true
    paso_receta: DEVENGO

  - codigo: H20
    sentido: PAGO
    descripcion: >-
      Que se hace con los albaranes recibidos y pendientes de facturar: ejecutado
      que no es devengo pendiente ni esta en la cartera.
    unidad: OPCION
    valor_defecto: MES_SIGUIENTE
    opciones: [MES_SIGUIENTE, EXCLUIR]
    fuente_defecto: >-
      Se facturan el mes siguiente al cierre (8,23 M EUR en 20 obras, medido).
    ingrediente: compras.fact_compras_linea
    validado: false
    admite_obra: true
    paso_receta: CARTERA

  - codigo: H21
