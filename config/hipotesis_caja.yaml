    descripcion: >-
      Lo emitido en la cartera despues del ultimo cierre esta en la cartera Y en
      el devengo pendiente: se descuenta del primer mes pendiente.
    unidad: OPCION
    valor_defecto: DESCONTAR
    opciones: [DESCONTAR]
    fuente_defecto: >-
      `cartera_emitida_tras_cierre` (0,86 M EUR de pagos en 12 obras, medido).
    ingrediente: tesoreria.devengo_corte_obra
    validado: false
    admite_obra: true
    paso_receta: CARTERA

  - codigo: H22
    sentido: COBRO
    descripcion: Porcentaje del cobro que no se cobra (morosidad).
    unidad: PORCENTAJE
    valor_defecto: 0
    fuente_defecto: Ninguno (propuesta, sin medir).
    ingrediente: null
    validado: false
    admite_obra: true
    paso_receta: PLAZO

  - codigo: H23
    sentido: AMBOS
    descripcion: Dia del mes en que se situa el devengo de ese mes.
    unidad: OPCION
    valor_defecto: FIN_DE_MES
    opciones: [FIN_DE_MES, MITAD_DE_MES]
    fuente_defecto: Fin de mes, como los cierres (propuesta).
    ingrediente: null
    validado: false
    admite_obra: true
    paso_receta: DEVENGO

# Valores por obra: ninguno todavia.
obras: []
