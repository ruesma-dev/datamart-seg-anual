# config/hipotesis_caja.yaml
#
# F-140 · EL CATALOGO DE HIPOTESIS para pasar el DEVENGO de una obra a CAJA.
# F-150 · LA RECETA: cada hipotesis dice en que PASO de la receta se aplica
# (`paso_receta`); la receta entera, en la ficha de `tesoreria.hipotesis_caja`.
#
# EL DATAMART NO CONVIERTE DEVENGO EN CAJA (regla del humano): publica los
# ingredientes y este catalogo, y la conversion la hace la IA en vivo,
# declarando CADA hipotesis con su valor y su nivel (`R-CAJA-HIPOTESIS`):
# USUARIO (lo que dice quien pregunta) > OBRA (la seccion `obras` de aqui, o lo
# leido de los contratos con el cliente) > DEFECTO (el `valor_defecto` de aqui).
#
# Lo publica `build_tesoreria` cada noche en `tesoreria.hipotesis_caja` (el
# catalogo) y `tesoreria.hipotesis_caja_obra` (el valor resuelto por obra). Si
# algo de este fichero no valida, el paso FALLA con la lista de errores y no
# publica nada a medias (`etl_sigrid/domain/proyeccion_caja.py`).
#
# QUIEN LO MANTIENE (D15-A): Control de Costes propone, el humano aprueba y el
# ETL publica. Cada cambio es un commit y una imagen nueva del job.
#
# LOS DEFECTOS SON PROPUESTAS (D17-A): `validado: false` hasta que Negocio los
# apruebe; entonces `validado: true` y `fecha_validacion: AAAA-MM-DD`. La IA
# avisa de los no validados. Las cifras «medidas» salen de
# `progress/spec_F-140.md` (lecturas de solo lectura del 2026-10-24).
#
# Campos de cada hipotesis:
#   codigo           H y dos cifras, unico
#   sentido          PAGO, COBRO o AMBOS
#   descripcion      que supone la hipotesis
#   unidad           DIAS, MESES, PORCENTAJE (0-100), BOOLEANO, OPCION, MAPA_DIAS
#                    o PERFIL_MESES (F-150, ver abajo)
#   valor_defecto    casa con la unidad; en OPCION, una de `opciones` (la primera)
#   opciones         solo en OPCION: el defecto y sus alternativas
#   fuente_defecto   de que dato o decision sale el defecto
#   ingrediente      objeto del datamart donde la IA lee el dato que la alimenta
#                    (null si no hay ninguno)
#   validado         true solo cuando Negocio lo aprueba
#   fecha_validacion solo con validado: true
#   admite_obra      si se puede personalizar por obra en la seccion `obras`
#   paso_receta      F-150: el paso de la receta en que se aplica, uno de DEVENGO,
#                    DOCUMENTO, COEFICIENTES, PLAZO, RETENCION, IVA o CARTERA
#
# PERFIL_MESES (F-150, R25): reparte un importe ENTERO en varios meses. Es una
# lista de pares [meses, porcentaje]: `meses` entero de 0 a 120 y estrictamente
# creciente (0 es el mismo mes del hecho), `porcentaje` > 0 y <= 100 con dos
# decimales como mucho, y la suma, exactamente 100. Ejemplos: [[0, 100]] todo en
# el mes; [[1, 50], [2, 50]] (H08: la mitad se certifica al mes siguiente y la
# otra mitad al otro); [[3, 50], [4, 50]] (H25: un cobro fraccionado en dos
# meses, a los 3 y a los 4). H03 y H08 mueven el DOCUMENTO (desde el que corre
# el plazo); H24 y H25, el DINERO (el fraccionamiento de cada pago y cobro).
#
# VALORES POR OBRA (D14-A), seccion `obras`: `clave_obra` (empresa-codigo, como
# `1-0704`: R-CODIGO-POR-EMPRESA), `codigo`, `valor`, `motivo` y `fecha`. Ganan
# a lo leido de Sigrid y al defecto. Una obra o un codigo que no existan tumban
# el paso diciendo cuales.

version: 1

hipotesis:

  - codigo: H01
    sentido: PAGO
    descripcion: >-
      Plazo de pago de lo que tiene contrato de compra: el de la forma de pago
      del contrato (su formula, leida en dias de cada vencimiento y de la
      retencion).
    unidad: OPCION
    valor_defecto: CONTRATO
    opciones: [CONTRATO]
    fuente_defecto: >-
      La forma de pago pactada en el contrato (`raw.ctr.pagide`), presente en
      19.161 de 19.170 contratos.
    ingrediente: tesoreria.condiciones_contrato_compra
    validado: false
    admite_obra: true
    paso_receta: PLAZO

  - codigo: H02
    sentido: PAGO
    descripcion: >-
      Plazo de pago, en dias, de lo que NO tiene contrato, por categoria de la
      partida (CD, CI, OTRO). Sin CP: el CP no es caja de la obra (coste de
      estructura, F-154): se excluye del devengo y se declara.
    unidad: MAPA_DIAS
    valor_defecto: {CD: 120, CI: 120, OTRO: 120}
    fuente_defecto: >-
      La forma de pago mas frecuente en los contratos de compra: 120 dias
      (5.624 de 19.170, medido).
    ingrediente: tesoreria.plazos_forma_pago
    validado: false
    admite_obra: true
    paso_receta: PLAZO

  - codigo: H03
    sentido: PAGO
    descripcion: >-
      Perfil de meses entre el mes de devengo y la fecha de la factura del
      proveedor, desde la que corre el plazo de pago. Mueve el DOCUMENTO, no el
      dinero: el fraccionamiento del pago es H24.
    unidad: PERFIL_MESES
    valor_defecto: [[0, 100]]
    fuente_defecto: >-
      Todo en el mes de devengo: la factura se fecha a fin de ese mes
      (propuesta, sin medir).
    ingrediente: tesoreria.devengo_pendiente_obra_mes
    validado: false
    admite_obra: true
    paso_receta: DOCUMENTO

  - codigo: H04
    sentido: PAGO
    descripcion: >-
      Aplicar los dias fijos de pago y los meses sin pago del proveedor
      (`pagdia`, `pagmes`) cuando los tiene.
    unidad: BOOLEANO
    valor_defecto: true
    fuente_defecto: >-
      Los tienen 2.919 y 2.223 de 9.638 proveedores (medido); se aplican si
      existen.
    ingrediente: tesoreria.condiciones_contrato_compra
    validado: false
    admite_obra: true
    paso_receta: PLAZO

  - codigo: H05
    sentido: PAGO
    descripcion: Dias de retraso real sobre el plazo nominal de la forma de pago.
    unidad: DIAS
    valor_defecto: 0
    fuente_defecto: >-
      Ninguno por defecto. Medido en los efectos desde 2023: el pago real se
      alarga de 7 a 22 dias sobre el nominal (mediana por formula).
    ingrediente: tesoreria.plazos_forma_pago
    validado: false
    admite_obra: true
    paso_receta: PLAZO

  - codigo: H06
    sentido: PAGO
    descripcion: >-
      Porcentaje de retencion de garantia que se descuenta al proveedor: el del
      contrato (clases 4 y 5); sin contrato, este valor.
    unidad: PORCENTAJE
    valor_defecto: 0
    fuente_defecto: >-
      Con contrato, `retencion_garantia_porcentaje` (5 % en 6.304 contratos);
      sin contrato no hay retencion pactada.
    ingrediente: tesoreria.condiciones_contrato_compra
    validado: false
    admite_obra: true
    paso_receta: RETENCION

  - codigo: H07
    sentido: PAGO
    descripcion: >-
      Cuando se devuelve la retencion al proveedor: a fin de obra mas el plazo
      (criterio de Negocio) o a los dias de la formula de Sigrid (`NR`, desde la
      factura).
    unidad: OPCION
    valor_defecto: FIN_OBRA
    opciones: [FIN_OBRA, SIGRID]
    fuente_defecto: >-
      Decision de Negocio del 2026-09-22, publicada en
      `retenciones.fin_obra.fecha_vencimiento`.
    ingrediente: retenciones.fin_obra
    validado: false
    admite_obra: true
    paso_receta: RETENCION

  - codigo: H08
    sentido: COBRO
    descripcion: >-
      Perfil de meses entre la produccion de un mes y su certificacion al
      cliente, desde la que corre el plazo de cobro. Mueve el DOCUMENTO, no el
      dinero: el fraccionamiento del cobro es H25.
    unidad: PERFIL_MESES
    valor_defecto: [[1, 100]]
    fuente_defecto: >-
      Todo al mes siguiente al de produccion (propuesta, sin medir). Ejemplo de
      certificacion partida: [[1, 50], [2, 50]].
    ingrediente: tesoreria.devengo_pendiente_obra_mes
    validado: false
    admite_obra: true
    paso_receta: DOCUMENTO

  - codigo: H09
    sentido: COBRO
    descripcion: Plazo de cobro del cliente, en dias desde la certificacion.
    unidad: DIAS
    valor_defecto: 60
    fuente_defecto: >-
      El del contrato con el cliente si es unico (nivel OBRA, fuente SIGRID);
      si no, 60: la forma de cobro mas frecuente, CF60 (110 de 705 contratos).
    ingrediente: tesoreria.condiciones_contrato_cliente
    validado: false
    admite_obra: true
    paso_receta: PLAZO

  - codigo: H10
    sentido: COBRO
    descripcion: >-
      Porcentaje de retencion de garantia que nos retiene el cliente. La del
      contrato de cada partida va en el devengo (`importe_retencion_contrato`);
      esta solo cubre las bases `sin_retencion_contrato`.
    unidad: PORCENTAJE
    valor_defecto: 0
    fuente_defecto: >-
      La de la obra si es unica en sus contratos con el cliente (nivel OBRA,
      fuente SIGRID); si no, 0.
    ingrediente: tesoreria.condiciones_contrato_cliente
    validado: false
    admite_obra: true
    paso_receta: RETENCION

  - codigo: H11
    sentido: COBRO
    descripcion: >-
      Meses tras el fin de obra en que el cliente devuelve la retencion.
    unidad: MESES
    valor_defecto: 12
    fuente_defecto: >-
      El plazo de retencion del contrato con el cliente (`plaret`) o, si no, el
      de garantia (`plagar`), si es unico (fuente SIGRID); si no, 12, como
      `retenciones.fin_obra`.
    ingrediente: tesoreria.condiciones_contrato_cliente
    validado: false
    admite_obra: true
    paso_receta: RETENCION

  - codigo: H12
    sentido: COBRO
    descripcion: >-
      IVA de la venta que se suma al cobro (el devengo va sin IVA). El del
      contrato de cada partida va en el devengo (`importe_iva_contrato`; 0 % en
      inversion del sujeto pasivo); esta solo cubre las bases
      `sin_iva_contrato`.
    unidad: PORCENTAJE
    valor_defecto: 21
    fuente_defecto: >-
      La ficha de la obra (su tipo de IVA, fuente SIGRID); si no, 21 %, el tipo
      general. Control de Costes puede fijar la obra en la seccion `obras`.
    ingrediente: null
    validado: false
    admite_obra: true
    paso_receta: IVA

  - codigo: H13
    sentido: PAGO
    descripcion: >-
      IVA efectivo de la compra que se suma al pago (el devengo va sin IVA).
      POR OBRA (SIGRID, F-150 N15): cuota / base de las lineas de factura de
      compra de la obra en los 12 meses hasta el build, si su base llega a
      0,5 M EUR; si no, el defecto de la empresa. Con inversion del sujeto
      pasivo la cuota es 0: una obra con mucha ISP tiene un H13 bajo.
    unidad: PORCENTAJE
    valor_defecto: 5.5
    fuente_defecto: >-
      Cuota / base de las facturas de compra de 12 meses: 8,20 / 150,10 M EUR,
      5,46 % (medido el 2026-10-29). La marca de inversion del sujeto pasivo
      no sirve: es falsa en todas. Por obra va de 0,87 % a 20,9 % (0686 2,36
      %): 16 de 21 obras con valor SIGRID; pendiente de AdP.
    ingrediente: tesoreria.hipotesis_caja_obra
    validado: false
    admite_obra: true
    paso_receta: IVA

  - codigo: H14
    sentido: AMBOS
    descripcion: >-
      Como se liquida el IVA con Hacienda: mensual (dia 20 del mes siguiente),
      trimestral (dia 20 del mes siguiente al trimestre) o no se modela.
    unidad: OPCION
    valor_defecto: MENSUAL
    opciones: [MENSUAL, TRIMESTRAL, NO_MODELAR]
    fuente_defecto: >-
      Mensual, dia 20 del mes siguiente: casi seguro (el humano, 2026-10-27);
      pendiente de que lo confirme AdP.
    ingrediente: null
    validado: false
    admite_obra: true
    paso_receta: IVA

  - codigo: H15
    sentido: AMBOS
    descripcion: >-
      Como se reparte un importe entre los vencimientos de una formula con
      varios (`30 60 90`). Solo aplica a formas con varios vencimientos; con
      uno, no aplica (D10).
    unidad: OPCION
    valor_defecto: PARTES_IGUALES
    opciones: [PARTES_IGUALES]
    fuente_defecto: Partes iguales entre los vencimientos (propuesta).
    ingrediente: tesoreria.plazos_forma_pago
    validado: false
    admite_obra: true
    paso_receta: PLAZO

  - codigo: H16
    sentido: AMBOS
    descripcion: >-
      Que se hace con la cartera PREVISTA ya vencida (y no antigua): al primer
      mes de la proyeccion o fuera.
    unidad: OPCION
    valor_defecto: PRIMER_MES
    opciones: [PRIMER_MES, EXCLUIR]
    fuente_defecto: Sigue viva y se paga o cobra ya (propuesta).
    ingrediente: tesoreria.efectos
    validado: false
    admite_obra: true
    paso_receta: CARTERA

  - codigo: H17
    sentido: AMBOS
    descripcion: >-
      Excluir de la caja el previsto antiguo (PREVISTO vencido hace mas de 2
      anos, `previsto_antiguo`).
    unidad: BOOLEANO
    valor_defecto: true
    fuente_defecto: >-
      F-037, D11: es deuda sin puntear que la contabilidad no sostiene, no caja.
    ingrediente: tesoreria.efectos
    validado: false
    admite_obra: false
    paso_receta: CARTERA

  - codigo: H18
    sentido: AMBOS
    descripcion: >-
      Como se descuenta lo ejecutado desde la version: por partida
      (`importe_pendiente`) o quitando solo los meses ya cerrados
      (`importe_plan_restante`).
    unidad: OPCION
    valor_defecto: POR_PARTIDA
    opciones: [POR_PARTIDA, SOLO_MESES_CERRADOS]
    fuente_defecto: >-
      D3-A: las obras van retrasadas respecto a su version (+19,2 M EUR de
      coste pendiente, medido).
    ingrediente: tesoreria.devengo_pendiente_obra_mes
    validado: false
    admite_obra: true
    paso_receta: DEVENGO

  - codigo: H19
    sentido: AMBOS
    descripcion: >-
      Que se hace con lo planificado y no ejecutado que la version ya no situa
      en ningun mes futuro (`importe_retraso_sin_perfil`).
    unidad: OPCION
    valor_defecto: PRIMER_MES
    opciones: [PRIMER_MES, REPARTIR, EXCLUIR]
    fuente_defecto: D19-A, al primer mes pendiente (5,99 M EUR de coste, medido).
    ingrediente: tesoreria.devengo_pendiente_obra_mes
    validado: false
    admite_obra: true
    paso_receta: DEVENGO

  - codigo: H20
    sentido: PAGO
    descripcion: >-
      Que se hace con los albaranes recibidos y pendientes de facturar: ejecutado
      que no es devengo pendiente ni esta en la cartera. A fin del mes del
      albaran se supone su factura, desde la que corre el plazo de pago; los de
      mas de H27 meses no son caja.
    unidad: OPCION
    valor_defecto: FIN_MES_ALBARAN
    opciones: [FIN_MES_ALBARAN, EXCLUIR]
    fuente_defecto: >-
      La factura es del mismo mes que el albaran en el 93 % (7 % el siguiente;
      proformas 94/6), sobre 239 M EUR (medido el 2026-10-27). Lo pendiente es
      el neto por proveedor: 8,76 M EUR en las 21 obras (la vista de compras
      suma 56,9, pero 48,2 ya estan sobrefacturados al mismo proveedor; medido
      el 2026-10-29). Las filas tras_cierre ya son devengo pendiente.
    ingrediente: tesoreria.albaranes_pendientes_neto
    validado: false
    admite_obra: true
    paso_receta: CARTERA

  - codigo: H21
    sentido: AMBOS
    descripcion: >-
      Lo emitido en la cartera despues del ultimo cierre esta en la cartera Y en
      el devengo pendiente: se descuenta del primer mes pendiente.
    unidad: OPCION
    valor_defecto: DESCONTAR
    opciones: [DESCONTAR]
    fuente_defecto: >-
      `cartera_emitida_tras_cierre` (0,86 M EUR de pagos en 12 obras, medido).
    ingrediente: tesoreria.devengo_corte_obra
    validado: false
    admite_obra: true
    paso_receta: CARTERA

  - codigo: H22
    sentido: COBRO
    descripcion: Porcentaje del cobro que no se cobra (morosidad).
    unidad: PORCENTAJE
    valor_defecto: 0
    fuente_defecto: Ninguno (propuesta, sin medir).
    ingrediente: null
    validado: false
    admite_obra: true
    paso_receta: PLAZO

  - codigo: H23
    sentido: AMBOS
    descripcion: Dia del mes en que se situa el devengo de ese mes.
    unidad: OPCION
    valor_defecto: FIN_DE_MES
    opciones: [FIN_DE_MES, MITAD_DE_MES]
    fuente_defecto: Fin de mes, como los cierres (propuesta).
    ingrediente: null
    validado: false
    admite_obra: true
    paso_receta: DEVENGO

  - codigo: H24
    sentido: PAGO
    descripcion: >-
      Fraccionamiento en meses de cada PAGO: como se reparte el importe de un
      vencimiento desde su fecha. Mueve el dinero, no el documento (eso es H03).
    unidad: PERFIL_MESES
    valor_defecto: [[0, 100]]
    fuente_defecto: >-
      Sin fraccionar: Sigrid no guarda el fraccionamiento (6 contratos de compra
      con varios vencimientos, F-150).
    ingrediente: tesoreria.plazos_forma_pago
    validado: false
    admite_obra: true
    paso_receta: PLAZO

  - codigo: H25
    sentido: COBRO
    descripcion: >-
      Fraccionamiento en meses de cada COBRO: como se reparte el importe de un
      vencimiento desde su fecha. Mueve el dinero, no el documento (eso es H08).
    unidad: PERFIL_MESES
    valor_defecto: [[0, 100]]
    fuente_defecto: >-
      Sin fraccionar: 0 contratos con el cliente con varios vencimientos
      (F-150). Ejemplo de cobro en dos meses: [[3, 50], [4, 50]].
    ingrediente: tesoreria.plazos_forma_pago
    validado: false
    admite_obra: true
    paso_receta: PLAZO

  - codigo: H26
    sentido: COBRO
    descripcion: >-
      Sumar al cobro la venta ejecutada pendiente de facturar
      (`venta_pendiente_facturar`): el hueco de facturacion NETO POR OBRA, lo
      real a origen con coeficientes menos lo facturado. Lo facturado por
      delante (`facturado_por_delante`) no se cobra.
    unidad: OPCION
    valor_defecto: INCLUIR
    opciones: [INCLUIR, NO_INCLUIR]
    fuente_defecto: >-
      Lo ejecutado tambien se cobra: ~15,3 M EUR netos en las 21 obras
      (medido el 2026-10-27).
    ingrediente: tesoreria.devengo_corte_obra
    validado: false
    admite_obra: true
    paso_receta: DEVENGO

  - codigo: H27
    sentido: PAGO
    descripcion: >-
      Antiguedad maxima, en meses, de lo pendiente de facturar (albaranes, H20)
      que se trata como caja: lo mas antiguo no se paga y se declara con su
      importe.
    unidad: MESES
    valor_defecto: 6
    fuente_defecto: >-
      Lo mas antiguo es casi siempre un albaran sin enlazar con su factura, no
      deuda (como H17). Con el neto por proveedor (FIFO), 0,52 de los 8,76 M
      EUR tienen mas de 6 meses (bruto: 22,8; medido el 2026-10-29). Lo revisa
      Control de Costes.
    ingrediente: tesoreria.albaranes_pendientes_neto
    validado: false
    admite_obra: true
    paso_receta: CARTERA

  - codigo: H28
    sentido: AMBOS
    descripcion: >-
      Si la caja de la obra parte de su SALDO DE PARTIDA (lo cobrado menos lo
