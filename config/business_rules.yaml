# config/business_rules.yaml
#
# Constantes de negocio centralizadas. Aquí vive cualquier valor que pueda cambiar
# por decisión de Negocio sin tocar código Python ni SQL.

sigrid:
  # ===========================================================================
  # REGLA CRÍTICA DE ÁMBITOS PARA EL SEGUIMIENTO MENSUAL
  # ===========================================================================
  # El data mart de seguimiento mensual usa CUATRO ámbitos de obrparpre,
  # explosionados todos con la misma mecánica (parser de obrparpre.planif):
  #
  #   amb = 3  (COSTE real)        → distribución mensual del COSTE REAL.
  #                                   Estructura: una sola fila por partida
  #                                   con fas=0 y planif. plafec informado,
  #                                   res vacía (la rellenamos con literal
  #                                   "Coste real").
  #
  #   amb = 7  (VENTA real)        → distribución mensual de la PRODUCCIÓN
  #                                   REAL. Misma estructura que amb=3.
  #
  #   amb = 8  (MASTER COSTE)      → fuente de Coste Directo, Indirecto y
  #                                   Proporcional PLANIFICADOS. Múltiples
  #                                   versiones (fas = 2, 3, 4, ...), cada una
  #                                   identificada con "Versión N (DD/MM/YYYY)"
  #                                   en obrfasamb.res. Las tres categorías
  #                                   comparten ámbito y se diferencian por
  #                                   el tipo de partida (aux.tipo_partida:
  #                                   DIRECTO / INDIRECTO /
  #                                   INDIRECTO_INFRAESTRUCTURA / PROPORCIONAL).
  #
  #   amb = 11 (MASTER VENTA)      → fuente de Producción PLANIFICADA.
  #                                   Mismo patrón que amb=8.
  #
  # Los demás ámbitos (5 CERTIFICACION, 10 COSTE PENDIENTE, 13 CER_PEC...) NO
  # se usan en el seguimiento mensual.
  #
  # La comparativa en mart es:
  #     amb=3  (real coste)         vs  amb=8  (master coste planificado)
  #     amb=7  (real venta/producc) vs  amb=11 (master venta planificado)
  #
  # Para cada mes real, la versión de master que rige es la que estaba
  # vigente entonces (regla temporal basada en obrfasamb.fec, resuelta en
  # mart con stg.plan_mensual.version_fec_creacion).
  # ===========================================================================
  ambitos:
    seguimiento:
      coste_real_id:    3   # Coste incurrido real
      venta_real_id:    7   # Venta / producción real
      master_coste_id:  8   # Master de coste → CD, CI, CP planificados
      master_venta_id:  11  # Master de venta → Producción planificada

    # Tipos lógicos que asigna la vista stg.ambitos basándose en res.
    # Tabla de mapeo (basada en raw.auxobramb real de Ruesma):
    #   ide  cod      res                     tipo
    #   3    COS      COSTE                   COSTE                ← usado (real)
    #   5    VEN      CERTIFICACION           CERTIFICACION
    #   7    PROD     VENTA                   VENTA                ← usado (real)
    #   8    MAS      MASTER COSTE            MASTER_COSTE         ← usado (master)
    #   9    MASV     MASTER CERTIFICACION    MASTER_CERTIFICACION
    #   10   COP      COSTE PENDIENTE         COSTE
    #   11   MASP     MASTER VENTA            MASTER_VENTA         ← usado (master)
    #   13   CER_PEC  CERTIFICACIÓN PEC       CERTIFICACION
    #   15   PRO_JO   PRODUCCIÓN REAL         PRODUCCION_REAL
    #   resto                                 OTRO

  # Campo extendido (tabla conext) que indica la versión vigente del master
  # de cada obra. Sigrid guarda la versión activa con cod='15' y valn=<n>.
  # NOTA: stg.plan_mensual NO filtra por esto (trae todas las versiones).
  # Lo usa mart para identificar "la última conocida" en el cierre actual.
  campos_extendidos:
    cod_version_master_vigente: "15"

  # ===========================================================================
  # PRECISIÓN DE CÁLCULOS DE IMPORTE
  # ===========================================================================
  # En Sigrid de Ruesma, la columna obrparpre.pre se almacena con 4 decimales
  # (ej: 18.8085) pero TODOS los cálculos visibles de Sigrid en la pestaña de
  # Seguimiento usan internamente el precio REDONDEADO a 2 decimales (18,81).
  #
  # Ejemplo real (obra 0707, partida 01.02 EXCAVACION VACIADOS, amb=7 venta):
  #   - can = 18.378,23
  #   - pre = 18.8085  (lo que devuelve la API)
  #   - can * pre              = 345.666,94  ← cálculo "puro"
  #   - can * ROUND(pre, 2)    = 345.694,51  ← lo que muestra Sigrid ✓
  #
  # Para que el seguimiento cuadre céntimo a céntimo con Sigrid, nuestro modelo
  # calcula DOS VERSIONES de cada importe:
  #
  #   - importe_mes / importe_origen        (usan precio redondeado, cuadra con Sigrid)
  #   - importe_mes_raw / importe_origen_raw (usan precio sin redondear, cálculo puro)
  #
  # Ambas conviven en stg.plan_mensual y mart.fact_seguimiento_mensual. Power BI
  # puede consumir la que prefiera. Las versiones _raw son útiles para detectar
  # discrepancias o investigar diferencias.
  precision:
    # Decimales a los que redondear el precio antes de calcular los importes
    # "compatibles con Sigrid". Cambiar a null para deshabilitar (importe = raw).
    redondear_precio_a_decimales: 2


# Las 5 categorías del seguimiento mensual. Orden importa para que la matriz
# de Power BI muestre las filas en este orden.
categorias_seguimiento:
  - { categoria: "Venta",           orden: 1 }
  - { categoria: "Coste Directo",   orden: 2 }
  - { categoria: "Coste Indirecto", orden: 3 }
  - { categoria: "Gasto General",   orden: 4 }
  - { categoria: "Beneficio",       orden: 5 }


escenarios:
  - { escenario: "Real",        orden: 1 }
  - { escenario: "Planificado", orden: 2 }


# Métodos de amortización soportados para partidas tipo INDIRECTO_INFRAESTRUCTURA.
# Hoy solo LINEAL (importe total / plazo en meses). Mañana se podrán añadir
# ACELERADA, AL_FINAL, CURVA_S, etc. sin tocar el pipeline:
#   1. Añadir la rama en sql/mart/fact_seguimiento_mensual.sql.j2
#   2. Documentar parámetros aquí
#   3. Negocio cambia el método en la columna metodo_amortizacion del Excel
amortizacion:
  default_metodo: LINEAL
  metodos_soportados:
    - LINEAL


# ===========================================================================
# LA VENTANA DE NEGOCIO: QUE OBRAS SE RECONSTRUYEN CADA NOCHE (F-025)
# ===========================================================================
#
# Decidido por el humano el 2026-09-02, con el censo delante: "las obras que
# esten cerradas no se actualizan", "que no se reconstruyan, pero que no se
# borren, y que la informacion este consultable".
#
# Se congela toda obra que cumpla AL MENOS UNA de las tres reglas, en UNION.
# Censo sobre el universo del codigo -raw.obr JOIN raw.con, 920 obras-: 880
# congeladas y 40 vivas, de las cuales 38 publican en el fact. Por regla, sin
# repartir solapes: 693 por estado, 226 por codigo de seis digitos y 872 por
# quietud (remedido el 2026-09-03).
#
# ESTO ES REGLA DE NEGOCIO Y VIVE AQUI a proposito: cambiar el criterio no
# debe exigir tocar codigo Python ni SQL. Los interruptores de OPERACION
# -encender la ventana, el dia de la reconstruccion completa, el rescate- son
# otra cosa y estan en el entorno (PG_VENTANA_*, ver config/settings.py).
#
# LA CONTRAPARTIDA, ACEPTADA POR EL HUMANO CON EL DATO DELANTE: hay 48 obras
# con actividad en los ultimos 12 meses y 8 quedan igualmente congeladas -7
# CERRADAS (estado 25) y 1 de seis digitos, la 180501-, asi que sus datos
# pueden llevar hasta 6 dias de retraso entre reconstrucciones completas. Esta
# spec propuso un veto -no congelar nunca una obra con actividad reciente- y
# el humano lo rechazo explicitamente: "pon las reglas que te he dicho".
#
# OJO: al humano se le presento un 40 donde son 8. Aquella cifra se midio
# sobre maestro.obras con coalesce(fecha_fin, fecha_inicio), no con la
# definicion del ETL -raw.obr JOIN raw.con y MAX(make_date(...)) de stg.fases,
# o sea SQL_ESTADO_OBRAS-. Remedido el 2026-09-03; su decision NO cambia
# -880/40 cuadra al dedillo- y la contrapartida real es MENOR que la que
# acepto. El detalle, en specs/F-025-ventana-negocio-build/decisiones.md.
#
# ALTERNATIVA NO ELEGIDA, anotada por si algun dia se cambia el criterio: la
# formulacion EN POSITIVO -solo se actualizan a diario las EN CURSO (15) y las
# ADJUDICADAS DEFINITIVAMENTE (9)-. Es mas robusta, porque una lista de
# estados que se actualizan es cerrada y una de estados que se congelan hay
# que ir ampliandola. Se le enseno la ventaja y respondio: "dejalo en
# negativo".
ventana:
  # REGLA 1. Estados de Sigrid que congelan. El catalogo esta VERIFICADO
  # (2026-09-02): vive en `conest`, el tipo de las obras es el 42 y se llega
  # por `con.est`. "25 = CERRADA" no es una suposicion nuestra.
  #
  #    1 EN ESTUDIO (226 obras)   ·   3 PRESENTADA (0)
  #    5 PRESENTADA CON ACLARACIONES (0)  ·  7 ADJUDICADA PROVISIONAL (0)
  #    9 ADJUDICADA DEFINITIVAMENTE (33)  ·  11 NO PRESENTADA (2)
  #   13 NO ADJUDICADA (0)        ·  15 EN CURSO (176)
  #   17 PARADA (7)               ·  19 TERMINADA (2)
  #   21 RECIBIDA PROVISIONAL (3) ·  23 RECIBIDA DEFINITIVAMENTE (4)
  #   25 CERRADA (465)            ·  999 PLANTILLA (1)
  #
  # Los tres de aqui suman 693 obras. Anadir 1 y 11 al 25 NO anade ni una
  # obra al censo -las 226 EN ESTUDIO y las 2 NO PRESENTADAS caian ya por la
  # regla 3, porque ninguna tiene fases-: lo que cambia es que queda escrito
  # POR QUE se congela cada una, en vez de deducirlo de su quietud.
  estados_que_congelan: [1, 11, 25]

  # REGLA 2. Obras administrativas: 222 con codigo de seis digitos, y NINGUNA
  # llega al fact (0 de 222). Son presupuestos y estudios de 2009-2015.
  # Ahorro sin riesgo de negocio, y por eso el criterio no necesita una lista
  # de codigos que mantener.
  #
  # El patron va ANCLADO por los dos extremos: sin el `$` congelaria tambien
  # los codigos de siete digitos, y sin el `^` cualquiera que los contenga.
  patron_codigo_administrativo: "^[0-9]{6}$"

  # REGLA 3. Meses sin actividad. Actividad = mes mas reciente con fase
  # cerrada (stg.fases). 840 obras no tienen ninguna en 12 meses, y 217 no
  # tienen ni una fase en toda su vida.
  #
  # El limite NO congela: una obra que cerro fase justo hace doce meses cuenta
  # como CON actividad. Se prefiere trabajar de mas a dejar un dato viejo
  # publicado, que es el modo de fallo de F-052.
  meses_sin_actividad: 12
