# config/cobertura_excepciones.yaml
#
# Los descartes que HOY son aceptables para `python main.py check-cobertura`
# (F-052, R16), el guardian que contrasta lo que entra en `stg` con lo que sale
# en `mart` obra a obra.
#
# POR QUE EXISTE. Sin excepciones el guardian sale en rojo todas las noches por
# cosas que ya sabemos y que no dependen de esta feature -las 12 partidas en
# ciclo de raw.obrparpar, las obras administrativas que stg/03_obras.sql excluye
# a proposito y las tres que dependen de F-053-, y un guardian que siempre esta
# rojo no lo mira nadie. Mismo criterio y mismo patron que `pendientes` en
# `config/objetos_pendientes.yaml`: DESCARTE CORRECTO O EXCEPCION DECLARADA.
#
# ES UN TRINQUETE: SOLO BAJA. La constante EXCEPCIONES_MAX de
# tests/test_f052_cobertura.py vale exactamente lo que hay aqui, y bajarla es
# parte de la tarea que cierra la causa, no un apano posterior.
#
# CADA ENTRADA DECLARA:
#   tipo          obra_invisible | filas_huerfanas | ambas
#   motivo        POR QUE se acepta. Obligatorio: una excepcion sin porque se
#                 convierte en permanente a la primera.
#   codigo_obra   el codigo de la obra, O BIEN
#   patron_nombre un trozo de su nombre, para las obras que NO tienen ficha en
#                 stg.obras y cuyo codigo, por tanto, no siempre se resuelve
#   ambito_id     (opcional) acota la excepcion a un ambito
#   feature       (opcional) que feature la cerrara
#
# NO SE DECLARA UN TOPE DE FILAS a proposito. Habria que medirlo contra la base
# y desde el puesto no hay conexion directa (connection timeout expired contra
# psql-albaranes-rs9k2, 2026-08-31). Un tope inventado seria peor que ninguno:
# de mas, tapa; de menos, alarma falsa. T15 -manual, del humano- fija la linea
# base real y ahi se podra afinar.
#
# -----------------------------------------------------------------------------
# POR QUE SE DECLARA TODO EL RESIDUO. DECISION DEL HUMANO, 2026-09-02.
# -----------------------------------------------------------------------------
# Cerrada la fase 2 de F-052 el guardian seguia en rojo por 20 obras invisibles
# y 294 filas huerfanas que ya estaban medidas y entendidas. Habia dos salidas:
# dejarlo rojo con la linea base escrita, o declararlas. EL HUMANO ELIGIO
# DECLARARLAS, y este es su motivo, que es el mismo por el que este fichero
# existe:
#
#   un guardian que nace en rojo permanente manda un correo cada noche que no
#   significa nada, y en dos semanas no lo mira nadie; con todo declarado, el
#   dia que aparezca una obra invisible NUEVA el correo significara algo.
#
# La contrapartida esta asumida y hay que decirla: cada linea de aqui abajo es
# una alarma que se apaga. Por eso ninguna entra sin motivo medido y sin quien
# la cierra, y por eso las cuatro obras ciegas SOLO en master van acotadas con
# `ambito_id` en vez de en general: si manana una de ellas desapareciera del
# ambito 3 -coste real, dinero- eso seria un agujero nuevo y el guardian tiene
# que gritar.

excepciones:

  # -------------------------------------------------------------------------
  # 1. Las 12 partidas en ciclo de raw.obrparpar (DA-3, DA-5)
  # -------------------------------------------------------------------------
  # No son alcanzables desde ninguna raiz -su cadena de padide da vueltas- asi
  # que no llegan a stg.partidas y sus filas de plan_mensual quedan huerfanas.
  # Es dato mal metido en Sigrid, y se avisa a quien lo administra (R26); el ETL
  # no espera al saneamiento. Prioridad real solo la 0686, que sigue viva.

  - codigo_obra: "0565"
    tipo: filas_huerfanas
    motivo: >-
      Bucle mutuo en raw.obrparpar entre los ide 279988 (20.12) y 279997
      (20.12.09), que arrastra a los hermanos que cuelgan de la pareja: diez de
      las doce partidas en ciclo. Obra terminada en 2020-12. Avisado a quien
      administra Sigrid.

  - codigo_obra: "0630"
    tipo: filas_huerfanas
    motivo: >-
      Auto-bucle (padide = ide) del ide 310512 CHIMENEA IGNIFUGA. Obra terminada
      en 2022-12. Avisado a quien administra Sigrid.

  - codigo_obra: "0686"
    tipo: filas_huerfanas
    motivo: >-
      Auto-bucle (padide = ide) del ide 375474 LEGALIZACION Y PUESTA EN MARCHA,
      creado en 2024. UNICA DE LAS TRES QUE SIGUE VIVA (ultima fase 2026-07-31):
      hoy son 86 filas a 0,00 EUR, manana pueden ser dinero. Es la unica con
      prioridad real en el aviso a Sigrid (DA-5).

  # -------------------------------------------------------------------------
  # 2. Las obras que stg/03_obras.sql excluye A PROPOSITO
  # -------------------------------------------------------------------------
  # No son obras: son papeleras administrativas. La lista negra de
  # stg/03_obras.sql:106-116 las deja fuera de stg.obras, y por eso sus filas de
  # plan_mensual salen sin ficha de obra. El descarte es CORRECTO, medido: 15 de
  # las 19 obras ausentes de stg.obras son de este grupo.
  #
  # Se identifican por NOMBRE y no por codigo porque, al no tener ficha en
  # stg.obras, su codigo solo se puede recuperar de raw y no siempre esta.

  - patron_nombre: "OBRA PRUEBA"
    tipo: ambas
    motivo: >-
      Obra de prueba, excluida a proposito de stg.obras: su codigo son seis
      digitos seguidos (170705, 180501, 221101...) y stg/03_obras.sql:113 los
      descarta con `con.cod !~ '[0-9]{5,}'`. Descarte correcto, no un defecto.
      TIPO `ambas` DESDE EL 2026-09-02: al no tener ficha en stg.obras es las
      dos cosas a la vez -todas sus filas de plan_mensual son huerfanas Y no
      publica una sola fila en el fact-, y declarada solo `filas_huerfanas`
      tapaba la mitad. Salian las 15 como obra invisible.

  - patron_nombre: "POSTVENTA"
    tipo: ambas
    motivo: >-
      Papelera de postventa, excluida a proposito de stg.obras (codigos POSTV y
      POSTV2 de la lista negra de stg/03_obras.sql:107). Descarte correcto.
      TIPO `ambas` DESDE EL 2026-09-02, por el mismo motivo que OBRA PRUEBA: sin
      ficha en stg.obras es obra invisible ADEMAS de traer filas huerfanas.

  - codigo_obra: "VAR"
    tipo: ambas
    motivo: >-
      Papelera de varios, excluida a proposito de stg.obras por la lista negra
      de stg/03_obras.sql:107. Descarte correcto. TIPO `ambas` DESDE EL
      2026-09-02: sin ficha en stg.obras es obra invisible ademas de huerfana.

  # -------------------------------------------------------------------------
