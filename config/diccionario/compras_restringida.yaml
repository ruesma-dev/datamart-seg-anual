# config/diccionario/compras_restringida.yaml
#
# Fichas del esquema `compras_restringida` (F-138, 2026-10-14): las alarmas
# COMPLETAS de los documentos de Sigrid, con las de recursos (familia 33) y
# partes de trabajo (35), que nombran trabajadores y bajas.
#
# SOLO LA LEEN el perfil total del MCP (el login `mcp_sigrid_dm_total`, F-136)
# y el grupo `sigrid_dm_autorizado_ro`. El rol estandar del MCP y de Power BI
# (`mcp_sigrid_dm_ro`) la tiene VETADA: `apply_grants` se la revoca y lo
# comprueba cada noche. La ficha EMPIEZA por el aviso de acceso restringido
# porque el MCP no filtra el diccionario por perfil. Decision del humano del
# 2026-10-14 (D9): «mete esas alarmas en lectura solo para el perfil admin y no
# el estandar». Regla dura `R-PERFILES`.
#
# Lo construye `build_compras` (`15_alarmas_liquidatoria.sql`) y de aqui sale
# la general, `compras.documento_alarmas`. Solo recuentos, ni nombres de nadie.
#
# F-141 (2026-10-17): «restringida» = reservada al perfil total. El perfil
# restringido del MCP (administrativos, grupo `sigrid_dm_perfil_restringido_ro`)
# ve MENOS que el estandar y NO la lee (`R-PERFILES`).
#
# F-128 (2026-10-18): el esquema guarda YA DOS COSAS. Ademas de las alarmas
# completas, `documento_cuenta_bancaria`: la cuenta bancaria del proveedor que
# lleva cada factura o albaran (D4-B del humano, 2026-10-17: es dato del
# proveedor, y personal si es autonomo). La construye `build_compras`
# (`01_documentos.sql`, su ultima seccion). Ni un numero de cuenta en este
# fichero: solo agregados.

version: 1
esquema: compras_restringida

objetos:

  documento_alarmas:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **ACCESO RESTRINGIDO: solo el perfil total del MCP.** Si no lo tienes, la
      consulta devuelve «permission denied»: usa `compras.documento_alarmas`
      (`R-PERFILES`), sin reintentar ni buscar otro camino.

      **TODAS LAS ALARMAS DE LOS DOCUMENTOS DE SIGRID** (F-138): una fila por
      alarma de texto libre pegada a un documento (`raw.conala`), ~45.750 el
      2026-10-14, con `restringido` y `motivo_restriccion`. Es
      `compras.documento_alarmas` MAS las alarmas de recursos (familia 33, 3 el
      2026-10-14) y de partes de trabajo (35, 24), que nombran trabajadores y
      sus bajas. Las dos tablas NUNCA se suman ni se unen: la completa ya
      contiene a la general. Las alarmas de empleados (43) no estan en el
      datamart.

      Valen las mismas columnas y la misma regla de clasificacion que en la
      general (`clase_liquidacion`, ver `compras.documento_alarmas`): la marca
      «liquidatoria» es texto libre de una alarma y la regla es heuristica.
      `creada_por` es el LOGIN de quien creo la alarma (dato personal).

      **SIN EMPRESA NI OBRA: mezcla las 38 empresas** (F-147,
      `R-EMPRESA-POR-DEFECTO`): no se puede filtrar por Construcciones Ruesma;
      la respuesta dice que la cifra es de todas las empresas y no dice «he
      supuesto Construcciones Ruesma».
    grano: >-
      Una fila por alarma, identificada por `alarma_id` (`conala.ide`), clave
      primaria declarada. Un documento puede tener varias alarmas.
    clave_negocio: [alarma_id]
    paso_etl: build_compras
    refresco: nocturno
    columnas:
      alarma_id:
        significado: Identificador de la alarma en Sigrid (`conala.ide`).
        agregacion: no_sumable
      documento_id:
        significado: >-
          El documento del que cuelga la alarma (`conala.conide`, un `con.ide`).
          En RECURSO es el recurso y en PARTE_TRABAJO el parte.
        agregacion: no_sumable
      tipo_documento_codigo:
        significado: Tipo de documento de Sigrid (`con.tip`), el numero de `familia`.
        valores: [1, 4, 5, 11, 12, 14, 15, 17, 20, 25, 33, 35, 40, 42, 44, 46, 54]
        agregacion: no_sumable
      familia:
        significado: >-
          Familia del documento. RECURSO (33) y PARTE_TRABAJO (35) son las que
          solo estan aqui.
        valores: [INFORME, CLIENTE, PROVEEDOR, FACTURA_VENTA, OFERTA, ALBARAN, FACTURA, CUENTA_AUXILIAR, ASIENTO, EFECTO_PAGO, RECURSO, PARTE_TRABAJO, OTRA, OBRA, CONTRATO, COMPARATIVO, CONTRATO_VENTA]
      tipo_documento:
        significado: >-
          Tipo de documento de negocio de `compras.fn_tipo_documento`: FACTURA,
          ABONO, ALBARAN, PROFORMA, NOTA, CONTRATO u OTRO.
        nulo_significa: El documento no es una factura, albaran o contrato de compra (familias 14, 15 y 44).
      codigo_documento:
        significado: Codigo del documento tal y como se ve en Sigrid (`PT12/00099` en un parte).
      tipo_alarma_codigo:
        significado: Codigo del tipo de alarma (`auxala.cod`), casi siempre 03 INFORMATIVA.
        nulo_significa: La alarma no tiene tipo en Sigrid.
      tipo_alarma:
        significado: Nombre del tipo de alarma (`auxala.res`).
        nulo_significa: La alarma no tiene tipo en Sigrid, o el tipo no tiene nombre.
      texto:
        significado: >-
          El texto de la alarma, INTEGRO y tal cual se escribio en Sigrid
          (`conala.tex`). En recursos y partes nombra trabajadores y bajas.
        nulo_significa: La alarma no tiene texto.
      ver_al_abrir:
        significado: Cierto si la alarma salta sola al abrir el documento en Sigrid. Nunca nulo.
      creada_el:
        significado: Fecha y hora en que se creo la alarma (`crefec` + `crehor`).
        nulo_significa: Fecha u hora de creacion vacia o imposible en Sigrid.
        agregacion: no_sumable
      creada_por:
        significado: LOGIN de Sigrid de quien creo la alarma (`conala.creusu`). DATO PERSONAL.
        nulo_significa: Sigrid no guarda quien la creo.
      clase_liquidacion:
        significado: >-
          Que dice la alarma de la liquidacion (`compras.fn_clase_liquidacion`),
          igual que en la general.
        valores: [LIQUIDATORIA, NEGADA, CARTA_LIQUIDACION, DUDOSA, REMITE]
        nulo_significa: La alarma no habla de liquidacion ni remite a otro sitio.
      restringido:
        significado: >-
          Cierto si la alarma es de un recurso o de un parte de trabajo: la que
          NO esta en `compras.documento_alarmas`. Nunca nulo.
      motivo_restriccion:
        significado: La familia que la restringe, RECURSO o PARTE_TRABAJO.
        valores: [RECURSO, PARTE_TRABAJO]
        nulo_significa: La alarma no es restringida (esta tambien en la general).
    relaciones:
      - de: alarma_id
        a: compras.documento_alarmas.alarma_id
        cardinalidad: "1:1"
        porque: >-
          La misma alarma en la general, solo si no es restringida. No se
          suman: la completa ya la contiene.
    ejemplos_preguntas:
      - Que alarmas tienen los partes de trabajo de la obra X
      - Cuantas alarmas de recursos y de partes hay y de cuando son

  documento_cuenta_bancaria:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **ACCESO RESTRINGIDO: solo el perfil total del MCP.** Si no lo tienes, la
      consulta devuelve «permission denied»: dilo asi y no busques la cuenta
      por otro camino (`R-PERFILES`). Las cuentas de proveedor no
      tienen version general.

      **LA CUENTA BANCARIA DEL PROVEEDOR EN CADA DOCUMENTO** (F-128, decision
      del humano del 2026-10-17, D4-B): una fila por factura (`raw.dcf`) o
      albaran (`raw.dca`, proformas y notas incluidas) que lleva la cuenta
      informada. Medido el 2026-10-17: 17.706 facturas (10,6 %) y 17.756
      albaranes (5,7 %), de 638 y 530 proveedores distintos. Es la cuenta que
      llevaba el DOCUMENTO, **no la ficha actual del proveedor**: coincide con
      la cuenta que hoy tiene su ficha solo en el 31 % de las facturas y el
      72 % de los albaranes (la ficha conserva cuenta en 1.032 de 9.618
      proveedores, y 61 proveedores llevan mas de una cuenta en sus facturas).
      Formato tal cual, sin normalizar ni convertir: con forma de IBAN el 44 %
      de las facturas y el 68 % de los albaranes, CCC de 20 digitos casi todo el
      resto. Banco y sucursal resueltos contra `raw.auxban`.

      El banco y la sucursal de la FACTURA (no la cuenta) los publica tambien
      `compras.v_facturas_pago` para todos los perfiles. Aqui no estan el tipo
      de cuenta (`bantipide`, su catalogo no se ingiere) ni la cuenta PROPIA del
      albaran (`dca.banide`).

      **SIN EMPRESA NI OBRA: mezcla las 38 empresas** (F-147,
      `R-EMPRESA-POR-DEFECTO`): no se puede filtrar por Construcciones Ruesma;
      la respuesta dice que la cifra es de todas las empresas y no dice «he
      supuesto Construcciones Ruesma».

      Sin el perfil total no hay otro camino (`R-PERFILES`): ni `raw` ni
      reconstruirla con el banco y la sucursal de `compras.v_facturas_pago`,
      que no son la cuenta.
    grano: >-
      Una fila por documento con cuenta, identificada por `documento_id` (el
      `ide` de la factura o del albaran), clave primaria declarada: no hay
      ningun `ide` comun entre facturas y albaranes.
    clave_negocio: [documento_id]
    paso_etl: build_compras
    refresco: nocturno
    columnas:
      documento_id:
        significado: >-
          Identificador del documento: `compras.facturas.factura_id` si
          `tipo_documento` es FACTURA, `compras.albaranes.albaran_id` si es
          ALBARAN.
        agregacion: no_sumable
      tipo_documento:
        significado: De que tabla viene el documento. ALBARAN incluye proformas y notas.
        valores: [FACTURA, ALBARAN]
      codigo_documento:
        significado: Codigo del documento tal y como se ve en Sigrid (`con.cod`).
        nulo_significa: El documento no tiene ficha en `con` (no deberia pasar).
      fecha_documento:
        significado: Fecha del documento del proveedor (`fecdoc`).
        nulo_significa: El documento no trae fecha propia.
        agregacion: no_sumable
      proveedor_id:
        significado: El proveedor del documento (`entide`).
        nulo_significa: El documento no tiene proveedor informado.
        agregacion: no_sumable
      proveedor_nombre:
        significado: Nombre ACTUAL del proveedor (`con.res`).
        nulo_significa: Sin proveedor, o proveedor sin ficha.
      banco_id:
        significado: Banco de la cuenta (`banban`, catalogo `raw.auxban`).
        nulo_significa: La cuenta no trae el banco desglosado (los IBAN sin desglose).
        agregacion: no_sumable
      banco:
        significado: Nombre del banco (`raw.auxban.res`).
        nulo_significa: Sin banco desglosado, o fuera del catalogo.
      sucursal_id:
        significado: Sucursal de la cuenta (`bansuc`, catalogo `raw.auxban`).
        nulo_significa: La cuenta no trae la sucursal desglosada.
        agregacion: no_sumable
      sucursal:
        significado: Nombre de la sucursal (`raw.auxban.res`).
        nulo_significa: Sin sucursal desglosada, o fuera del catalogo.
      digitos_control:
        significado: Digitos de control de la cuenta (`bandig`), texto.
        nulo_significa: La cuenta no trae el desglose (3.361 facturas y 7.817 albaranes con IBAN sin desglose).
      numero_cuenta:
        significado: Numero de cuenta desglosado (`bancue`), texto.
        nulo_significa: La cuenta no trae el desglose.
      cuenta_bancaria:
        significado: >-
          La cuenta completa tal como la lleva el documento (`ban`), IBAN o CCC,
          sin normalizar. DATO DEL PROVEEDOR (personal si es autonomo). Nunca
          es NULL: sin cuenta, el documento no esta en la tabla.
    relaciones:
      - de: documento_id
        a: compras.facturas.factura_id
        cardinalidad: "1:1"
        porque: >-
          La factura, cuando `tipo_documento = 'FACTURA'`. Filtra antes por
          tipo: el mismo `documento_id` no es nunca factura y albaran a la vez.
      - de: documento_id
        a: compras.albaranes.albaran_id
        cardinalidad: "1:1"
        porque: La cabecera del albaran, cuando `tipo_documento = 'ALBARAN'`.
      - de: proveedor_id
        a: maestro.proveedores.proveedor_id
        cardinalidad: "N:1"
        porque: La ficha actual del proveedor (que puede tener hoy otra cuenta).
    ejemplos_preguntas:
      - A que cuenta pidio el proveedor P que se le pagara la factura X
      - Que proveedores han cambiado de cuenta entre sus facturas
