# config/diccionario/mart.yaml
#
# Fichas del esquema `mart`: el seguimiento mensual listo para consumo.
#
# Es la superficie principal del datamart. Lo que lo hace consultable
# directamente, y no `stg`, es que aqui la VERSION MASTER VIGENTE ya esta
# resuelta mes a mes: en `stg.plan_mensual` conviven todas las versiones y
# consultarla sin filtrar multiplica los importes.
#
# Todos los nombres y granos de este fichero estan verificados contra el DDL
# real de `etl_sigrid/infrastructure/postgres/sql/mart/`.

version: 1
esquema: mart

objetos:

  fact_seguimiento_mensual:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      El hecho central del seguimiento: cuanto se ha producido y cuanto se habia
      planificado, mes a mes, para cada partida de cada obra, en las cuatro
      combinaciones de coste/venta y real/planificado. Es la tabla a la que hay
      que ir para cualquier pregunta de planificacion o de produccion mensual.
    grano: >-
      Una fila por (`obra_id`, `partida_id`, `anio_mes`, `escenario`). La clave
      identifica una fila: se puede unir por ella sin fan-out y `count(*)`
      cuenta lo que parece.

      **Se comprueba con esta consulta, que hoy devuelve 0 y hasta el build
      de F-042 devolvia 8.778:**

      `SELECT count(*) FROM (SELECT obra_id, partida_id, anio_mes, escenario FROM
      mart.fact_seguimiento_mensual GROUP BY 1,2,3,4 HAVING count(*) > 1) d`

      **No siempre devolvio 0, y conviene saberlo para leer un informe viejo.**
      Hasta el build de F-042 esa misma consulta daba **8.778** claves repetidas
      (17.556 filas, **9** obras), porque **22** obras tienen dos fases que
      Sigrid guarda con el mismo `ano` y el mismo `mes` —dos cierres de quincena,
      o una fase plurimensual archivada en su mes de arranque— y las dos caian
      en el mismo `anio_mes` sin que ninguna columna publicada las distinguiera.
      De esas 22, solo **9** llegaban a duplicar filas aqui: las demas no tenian
      presupuesto en el mes en conflicto. Cualquier `SUM` de una columna
      acumulada a origen contaba dos veces: el valor estaba **DOBLADO** en
      **35 celdas de 7 obras**, **30.425.881,56 EUR**, medido el 2026-08-28.

      **La regla que lo resuelve, y que hay que conocer para interpretar el
      dato:** en los ambitos reales, cuando un mes tiene mas de un cierre se
      publica **uno solo, el de numero de fase mas alto entre los que tienen el
      acumulado distinto de cero**. Si todos estan a cero, el mas alto. El
      cierre descartado **sigue existiendo en `raw` y en `stg.fases`**: lo que
      no tiene es fila aqui. Decision de Negocio del 2026-08-28: el mes no se
      parte en dos y la clave del datamart no crece.

      **Consecuencia visible en 9 obras:** `version_descripcion` de un mes con
      dos cierres es la del cierre que mando, no la del descartado, y en
      `stg.plan_mensual` la numeracion de fase queda con huecos.

      **Que se puede sumar y que no. Sigue sin ser lo mismo para todas las
      columnas, y esto no lo cambio F-042:**

      - **Las medidas del MES se suman con normalidad**: `importe_mes`,
        `importe_mes_raw`, `can_mes` y `total_incurrido_mes` **telescopean**
        —cada fila trae la diferencia con la anterior—. Medido:
        `SUM(importe_mes)` iguala al ultimo `importe_origen` en **200 de 200**
        series. Que siga cumpliendose es la razon por la que el arreglo
        **renumera el orden interno** en vez de limitarse a borrar la fila
        sobrante: sin renumerar, el `LAG` dejaria de ser consecutivo y el
        movimiento del mes se dispararia.
      - **Las medidas ACUMULADAS A ORIGEN no se suman NUNCA**: `importe_origen`,
        `importe_origen_raw`, `can_origen` y `total_incurrido` traen el llevado
        hasta ese mes. Son `ultimo_valor` por naturaleza, con duplicado o sin
        el.

      Los ambitos master (8 y 11) nunca estuvieron afectados: alli `fas` es el
      numero de version, no el mes. "Escenario" es el cruce de magnitud
      (COSTE o VENTA) y naturaleza (REAL o PLANIFICADO): hasta cuatro filas por
      celda. Los meses futuros solo tienen los dos escenarios planificados; los
      meses pasados de una obra que arranco sin master, solo los dos reales.
    clave_negocio: [obra_id, partida_id, anio_mes, escenario]
    paso_etl: build_mart
    refresco: nocturno

    columnas:
      fact_id:
        significado: >-
          Clave tecnica de la fila. BIGSERIAL: se reasigna en cada build, asi
          que no identifica nada de forma estable.
        agregacion: clave_sustituta
      obra_id:
        significado: >-
          Identificador de la obra en Sigrid (`con.ide`). Es estable entre
          builds, al contrario que `fact_id`, y es la clave de union con el
          resto de esquemas.
        agregacion: no_sumable
      codigo_obra: >-
        Codigo de obra tal y como se teclea en Sigrid: cuatro digitos, con
        posible sufijo alfabetico ('0675', '0675B').
      nombre_obra: >-
        Nombre legible de la obra. Viene de `con.res`; en Sigrid no existe
        ninguna columna `nom`.
      partida_id:
        significado: >-
          Identificador de la partida o capitulo en Sigrid (`obrparpar.ide`).
          Es el unico eje que une el mundo del seguimiento con el mundo
          documental de compras.
        agregacion: no_sumable
      codigo_partida: >-
        Codigo jerarquico de la partida dentro de su obra ('01.02'). Unico por
        obra, no entre obras.
      descripcion_partida: Descripcion corta de la partida, tal y como la escribio el jefe de obra.
      unidad_medida: >-
        Unidad de medicion de la partida (m3, m2, ud, kg...), de
        `obrparpar.unimed`.
      categoria:
        significado: >-
          Clasificacion del coste. Se DERIVA por heuristica del codigo del
          capitulo raiz, no de un catalogo: no es una taxonomia oficial.
        valores: [CD, CI, CP, OTRO]
      capitulo_raiz_cod: Codigo del capitulo raiz del que cuelga la partida. Informativo.
      ruta_capitulos: >-
        Camino completo de capitulos hasta la partida, separado por ' > ' ("CD >
        01 > 01.02"). Es lo que permite reconstruir el arbol sin recursion.
      anio_mes:
        significado: >-
          Mes al que se imputa la fila, como fecha del dia 1. Es la columna
          temporal por la que se filtra y se agrupa.
        agregacion: no_sumable
      anio:
        significado: Ano de `anio_mes`, desnormalizado para filtrar barato.
        agregacion: no_sumable
      mes:
        significado: Numero de mes (1-12) de `anio_mes`.
        agregacion: no_sumable
      nombre_mes: >-
        Etiqueta del mes en castellano con su ano ("Octubre 2025"). Se genera
        sin depender del locale del servidor.
      escenario:
        significado: >-
          El cruce de magnitud y naturaleza, y la columna por la que de verdad
          se filtra. Estos cuatro literales son exactos.
        valores: [Coste Real, Coste Planificado, Venta Real, Venta Planificada]
      tipo_dato:
        significado: Naturaleza del dato, la mitad "real o previsto" del escenario.
        valores: [REAL, PLANIFICADO]
      concepto:
        significado: Magnitud, la mitad "coste o venta" del escenario.
        valores: [COSTE, VENTA]
      ambito_id:
        significado: >-
          Ambito de Sigrid del que sale la fila, para trazabilidad: 3 coste
          real, 7 venta real, 8 coste master, 11 venta master.
        agregacion: no_sumable
      importe_mes:
        significado: >-
          Importe imputado A ESE MES concreto, ya desacumulado. Es el que se usa
          para cualquier serie temporal.
        unidad: EUR
        agregacion: suma_solo_dentro_del_mes
      importe_origen:
        significado: >-
          Importe ACUMULADO desde el inicio de la obra hasta ese mes, tal y como
          viene de Sigrid. Sumarlo a lo largo del tiempo multiplica el resultado
          por unas nueve veces: para un total de un periodo se toma el valor del
          ultimo mes, no la suma.
        unidad: EUR
        agregacion: ultimo_valor
      importe_mes_raw:
        significado: >-
          El mismo importe del mes calculado con el precio SIN redondear a dos
          decimales. Es una referencia para cuadrar contra Sigrid, no la cifra
          que se da al usuario.
        unidad: EUR
        agregacion: suma_solo_dentro_del_mes
      importe_origen_raw:
        significado: Version sin redondear de `importe_origen`. Misma advertencia de acumulado.
        unidad: EUR
        agregacion: ultimo_valor
      can_mes:
        significado: >-
          Cantidad medida imputada al mes, en la unidad de la partida. En las
          partidas de tipo porcentaje (los CP) puede ser un coeficiente con seis
          decimales, no una cantidad fisica.
        agregacion: suma_solo_dentro_del_mes
      can_origen:
        significado: Cantidad acumulada a origen. Misma advertencia que `importe_origen`.
        agregacion: ultimo_valor
      precio_unitario:
        significado: >-
          Precio unitario de la partida con hasta seis decimales. Redondearlo
          antes de multiplicar cambia el importe.
        unidad: EUR
        agregacion: no_sumable
      version_master:
        significado: Numero de la version master vigente de la que sale el planificado.
        nulo_significa: La fila es REAL; los reales no tienen version.
        agregacion: no_sumable
      version_descripcion: >-
        Etiqueta legible de la version en las filas planificadas ("Version 11
        (04/02/2026)"); en las filas reales, la etiqueta del mes.
      version_tex:
        significado: >-
          Texto libre que escribio el jefe de obra al crear la version master
          ("ABC", "PLANIFICACION CUATRIMESTRAL FEB-26"). Es de donde se deriva
          `tipo_master`.
        nulo_significa: La fila es REAL.
      version_fec_creacion:
        significado: Fecha en que se creo la version master.
        nulo_significa: La fila es REAL.
        agregacion: no_sumable
      tipo_master:
        significado: >-
          Clasificacion de la version derivada de `version_tex`. Solo 'Planif
          Inicial', 'ABC' y 'Cuatrimestral' cuentan como master vigente: las de
          'Cierre mensual' NO reemplazan al plan.
        valores: [ABC, Planif Inicial, Cuatrimestral, Cierre mensual, Sin clasificar]
        nulo_significa: La fila es REAL.
      total_incurrido:
        significado: >-
          Calculo paralelo de Sigrid del incurrido a origen (columna "Imp.
          Incurrido"). Normalmente coincide con cantidad por precio, pero a veces
          difiere en centimos. Solo tiene valor en el coste real (ambito 3).
        unidad: EUR
        agregacion: ultimo_valor
        nulo_significa: La fila no es de coste real.
      total_incurrido_mes:
        significado: >-
          El incurrido de Sigrid del mes ("Imp. Incurrido Parcial"). Solo en
          coste real.
        unidad: EUR
        agregacion: suma_solo_dentro_del_mes
        nulo_significa: La fila no es de coste real.
      _built_at:
        significado: >-
          Instante en que se construyo la fila. Instrumentacion del ETL, no
          negocio: para la frescura del esquema se consulta `_meta.v_frescura`.
        agregacion: no_sumable

    relaciones:
      - de: obra_id
        a: stg.obras.obra_id
        cardinalidad: "N:1"
        porque: >-
          Universo del SEGUIMIENTO, que excluye obras administrativas y codigos
          de cinco o mas digitos. Es el universo que ya esta aplicado aqui.
      - de: obra_id
        a: maestro.obras.obra_id
        cardinalidad: "N:1"
        porque: >-
          Para poner cliente, estado y fechas de alta y baja a la obra. OJO:
          `maestro.obras` NO filtra nada y es superconjunto de `stg.obras`.
      - de: partida_id
        a: stg.partidas.partida_id
        cardinalidad: "N:1"
        porque: Para el arbol completo de capitulos y el nivel de la partida.
      - de: partida_id
        a: compras.v_pbi_partida_coste.partida_id
        cardinalidad: "N:N"
        porque: >-
          Es el unico eje que une el coste PLANIFICADO de una partida con su
          coste INCURRIDO documental, y la relacion mas valiosa del datamart.
          Las dos puntas tienen varias filas por partida: hay que agregar este
          lado por `(obra_id, partida_id)` —eligiendo antes el escenario— y unir
          por ese par. Hoy no lo explota ninguna vista: la vista puente es
          F-039. Ojo, `compras` no filtra por `stg.obras`.
      - de: obra_id
        a: cierre.fact_cierre_mensual.obra_id
        cardinalidad: "N:N"
        porque: >-
          Para contrastar el seguimiento mensual contra el cierre economico de
          la obra. NO se unen por `obra_id` a secas: las dos tienen muchas filas
          por obra y el JOIN duplicaria importes. Hay que agregar cada lado y
          unir por `(obra_id, anio_mes)`. Ojo tambien con la frescura: `cierre`
          no se refresca de noche y el seguimiento si.

    ejemplos_preguntas:
      - Cual es la planificacion mensual de la obra 0704 en 2025
      - Dame la evolucion mensual del coste directo de la obra X en el ano A
      - Que obras estan mal configuradas, sin planificado en algun mes
      - Cuanto llevamos produciendo este ano frente a lo planificado

  fact_seguimiento_categoria:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      El mismo hecho que `fact_seguimiento_mensual` pero preagregado por
      categoria de coste (CD, CI, CP, OTRO), sin bajar a partida. Existe para no
      tener que agregar millones de filas en cada consulta de KPI; NO sustituye a
      la tabla de detalle, la complementa.
    grano: >-
      Una fila por (`obra_id`, `anio_mes`, `categoria`, `escenario`), que es su
      clave de negocio. Es la suma de todas las partidas de esa obra y mes que
      comparten categoria.

      **`importe_origen` e `importe_origen_raw` se leen y se dan por buenos.**
      Hasta el build de F-042 no era asi: estaban **DOBLADOS** en **35 celdas de
      7 obras — 30.425.881,56 EUR**, medido el 2026-08-28, porque el agregado
      hace `SUM(importe_origen)` sobre `mart.fact_seguimiento_mensual` y alli
      cada mes en conflicto traia dos filas con el **mismo acumulado**. La causa
      eran **22** obras con dos fases que Sigrid guarda con el mismo `ano` y
      `mes`, de las que **9** llegaban a duplicar filas en el fact. La consulta
      que lo comprueba esta en el grano de `mart.fact_seguimiento_mensual`, y
      hoy devuelve **0** frente a las **8.778** de antes.

      Lo que dejo dicho ese defecto y sigue valiendo: **que una fila sea unica
      no dice nada de si su importe es correcto**. Esta tabla agrega, asi que
      nunca duplico filas; el numero de dentro era el que estaba mal. Un
      recuento de duplicados no lo habria visto.

      **Medida a medida:** `importe_mes` es el movimiento del mes, **telescopea**
      —cada fila trae la diferencia con la anterior— y se suma con normalidad;
      `importe_origen` e `importe_origen_raw` son acumulados a origen y **no se
      suman entre meses** —son `ultimo_valor`—, que es distinto de estar mal.
    clave_negocio: [obra_id, anio_mes, categoria, escenario]
    paso_etl: build_mart
    refresco: nocturno

    columnas:
      fact_cat_id:
        significado: >-
          Clave tecnica de la fila. BIGSERIAL: se reasigna en cada build y no
          identifica nada de forma estable.
        agregacion: clave_sustituta
      obra_id:
        significado: Identificador de la obra en Sigrid (`con.ide`). Estable entre builds.
        agregacion: no_sumable
      codigo_obra: Codigo de obra tal y como se teclea en Sigrid.
      nombre_obra: Nombre legible de la obra, de `con.res`.
      anio_mes:
        significado: Mes al que se imputa la fila, como fecha del dia 1.
        agregacion: no_sumable
      anio:
        significado: Ano de `anio_mes`.
        agregacion: no_sumable
      mes:
        significado: Numero de mes (1-12) de `anio_mes`.
        agregacion: no_sumable
      nombre_mes: Etiqueta del mes en castellano con su ano ("Octubre 2025").
      categoria:
        significado: >-
          Clasificacion del coste, derivada por heuristica del codigo del
          capitulo raiz. CD son costes directos, CI indirectos, CP
          proporcionales.
        valores: [CD, CI, CP, OTRO]
      escenario:
        significado: El cruce de magnitud y naturaleza. Literales exactos.
        valores: [Coste Real, Coste Planificado, Venta Real, Venta Planificada]
      tipo_dato:
        significado: Naturaleza del dato.
        valores: [REAL, PLANIFICADO]
      concepto:
        significado: Magnitud del dato.
        valores: [COSTE, VENTA]
      ambito_id:
        significado: Ambito de Sigrid de origen (3, 7, 8 u 11), para trazabilidad.
        agregacion: no_sumable
      importe_mes:
        significado: >-
          Suma del importe del mes de todas las partidas de esa categoria. No se
          suma entre meses distintos.

          Telescopea: cada fila trae la diferencia con la anterior y su suma
          es exactamente el movimiento del periodo (comprobado, 200 de 200
          series). Nunca estuvo afectada por el duplicado del fact, y F-042
          renumera el orden interno de las fases precisamente para que lo siga
          sin estar.
        unidad: EUR
        agregacion: suma_solo_dentro_del_mes
      importe_origen:
        significado: >-
          Suma del acumulado a origen de esas partidas. Ya es acumulado: sumarlo
          en el tiempo multiplica.

          Se lee y se da por bueno. Hasta el build de F-042 este valor estaba
          **DOBLADO en 35 celdas de 7 obras — 30.425.881,56 EUR**, porque el
          agregado sumaba las dos filas gemelas que
          `mart.fact_seguimiento_mensual` traia en los meses con dos cierres. La
          causa eran **22** obras con dos fases que Sigrid guarda con el mismo
          `ano` y `mes`, de las que **9** llegaban a duplicar filas alli.

          La leccion que dejo aquel defecto, y que sigue valiendo: **que una
          fila sea unica no dice nada de si su importe es correcto**. Esta tabla
          agrega, asi que nunca duplico filas; el numero de dentro era el malo.
        unidad: EUR
        agregacion: ultimo_valor
      importe_mes_raw:
        significado: Version sin redondear de `importe_mes`, para cuadrar contra Sigrid.
        unidad: EUR
        agregacion: suma_solo_dentro_del_mes
      importe_origen_raw:
        significado: >-
          Version sin redondear de `importe_origen`. Comparte con el todo lo
          dicho alli, incluido que hasta el build de F-042 venia **DOBLADO** por
          la misma causa —**22** obras con dos fases en el mismo mes, de las que
          **9** duplicaban filas en el fact— y que ahora no.

          Sigue siendo un **acumulado a origen**: no se suma entre meses.
        unidad: EUR
        agregacion: ultimo_valor
        agregacion: ultimo_valor
      num_partidas:
        significado: >-
          Cuantas partidas distintas se han sumado en esa fila. Sirve para
          detectar celdas construidas sobre una sola partida.
        agregacion: no_sumable
      _built_at:
        significado: Instante de construccion de la fila. Instrumentacion, no negocio.
        agregacion: no_sumable

    relaciones:
      - de: obra_id
        a: mart.fact_seguimiento_mensual.obra_id
        cardinalidad: "N:N"
        porque: >-
          Para bajar de la categoria al detalle por partida. La categoria se
          llama igual en las dos tablas a proposito, pero el JOIN va por
          `(obra_id, anio_mes, categoria, escenario)`: por `obra_id` solo
          multiplicaria las filas.
      - de: obra_id
        a: maestro.obras.obra_id
        cardinalidad: "N:1"
        porque: Para poner cliente y estado a la obra.

    ejemplos_preguntas:
      - Que obras se desvian mas de su master vigente en coste directo
      - Cual es el reparto entre coste directo, indirecto y proporcional de la obra X

  v_pbi_fact:
    tipo: vista
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      La tabla de hecho aligerada: los mismos hechos que
      `mart.fact_seguimiento_mensual` pero solo con identificadores e importes,
      sin los textos que se repiten millones de veces. Pensada para modelos en
      estrella, donde los nombres los ponen las dimensiones.
    grano: >-
      El mismo que la tabla de la que sale: una fila por (`obra_id`,
      `partida_id`, `anio_mes`, `escenario`). Es un `SELECT ... FROM
      mart.fact_seguimiento_mensual` sin filtro ni agregacion, asi que **lo que
      hay en la tabla llega intacto a Power BI**, para bien y para mal.

      Eso incluye el arreglo de F-042: hasta ese build, las 8.778 combinaciones
      duplicadas de la tabla llegaban tal cual a los informes. Ahora la clave
      identifica una fila y se puede unir por ella sin fan-out. El grano de
      `mart.fact_seguimiento_mensual` cuenta la regla de «un cierre por mes» y a
      que obras les cambia la numeracion de fase.

      **Que se puede sumar**: las medidas del MES (`importe_mes` y sus
      hermanas) **telescopean** y sumarlas es correcto —comprobado, 200 de 200
      series—. Las acumuladas a origen (`importe_origen`…) son `ultimo_valor`:
      no se suman entre meses, nunca.
    clave_negocio: [obra_id, partida_id, anio_mes, escenario]
    paso_etl: build_mart
    refresco: nocturno
    columnas:
      fact_id:
        significado: Clave tecnica heredada del hecho. Cambia en cada build.
        agregacion: clave_sustituta
      obra_id:
        significado: Identificador de la obra en Sigrid. Se une a la dimension de obra.
        agregacion: no_sumable
      partida_id:
        significado: Identificador de la partida en Sigrid. Se une a la dimension de partida.
        agregacion: no_sumable
      anio_mes:
        significado: Mes de imputacion, como fecha del dia 1. Se une a la dimension de fecha.
        agregacion: no_sumable
      escenario:
        significado: Cruce de magnitud y naturaleza. Se une a la dimension de escenario.
        valores: [Coste Real, Coste Planificado, Venta Real, Venta Planificada]
      importe_mes:
        significado: Importe imputado a ese mes concreto, ya desacumulado.
        unidad: EUR
        agregacion: suma_solo_dentro_del_mes
      importe_origen:
        significado: Importe acumulado desde el inicio hasta ese mes. No se suma en el tiempo.
        unidad: EUR
        agregacion: ultimo_valor
      importe_mes_raw:
        significado: El importe del mes con el precio sin redondear. Referencia de cuadre.
        unidad: EUR
        agregacion: suma_solo_dentro_del_mes
      importe_origen_raw:
        significado: Version sin redondear del acumulado a origen.
        unidad: EUR
        agregacion: ultimo_valor
      can_mes:
        significado: Cantidad medida imputada al mes, en la unidad de la partida.
        agregacion: suma_solo_dentro_del_mes
      can_origen:
        significado: Cantidad acumulada a origen.
        agregacion: ultimo_valor
      precio_unitario:
        significado: Precio unitario de la partida, con hasta seis decimales.
        unidad: EUR
        agregacion: no_sumable
      version_master:
        significado: Numero de la version master vigente del planificado.
        nulo_significa: La fila es REAL.
        agregacion: no_sumable
      version_descripcion: Etiqueta legible de la version, o del mes en las filas reales.
      tipo_master:
        significado: >-
          Clasificacion de la version master. Solo 'Planif Inicial', 'ABC' y
          'Cuatrimestral' son master vigente.
        valores: [ABC, Planif Inicial, Cuatrimestral, Cierre mensual, Sin clasificar]
        nulo_significa: La fila es REAL.
      total_incurrido:
        significado: Incurrido a origen calculado por Sigrid. Solo en coste real.
        unidad: EUR
        agregacion: ultimo_valor
      total_incurrido_mes:
        significado: Incurrido del mes calculado por Sigrid. Solo en coste real.
        unidad: EUR
        agregacion: suma_solo_dentro_del_mes
    relaciones:
      - de: fact_id
        a: mart.fact_seguimiento_mensual.fact_id
        cardinalidad: "1:1"
        porque: >-
          Es literalmente la misma fila. Para los textos (nombre de obra,
          descripcion de partida) se va a la tabla o a las dimensiones.
      - de: obra_id
        a: mart.v_pbi_dim_obra.obra_id
        cardinalidad: "N:1"
        porque: Dimension de obra del modelo en estrella.
      - de: partida_id
        a: mart.v_pbi_dim_partida.partida_id
        cardinalidad: "N:1"
        porque: Dimension de partida del modelo en estrella.
      - de: anio_mes
        a: mart.v_pbi_dim_fecha.anio_mes
        cardinalidad: "N:1"
        porque: Calendario mensual del modelo.
      - de: escenario
        a: mart.v_pbi_dim_escenario.escenario
        cardinalidad: "N:1"
        porque: Dimension de escenario, que ademas aporta el orden de presentacion.
    ejemplos_preguntas:
      - Dame los importes mensuales de la obra X sin los textos repetidos
      - Cuanto suma el coste real de la obra X en el mes M

  v_pbi_fact_categoria:
    tipo: vista
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      Version aligerada del preagregado por categoria: identificadores, importes
      y cuantas partidas se han sumado. Para tarjetas de KPI y matrices por
      capitulo sin bajar a partida.

      **Es la vista que Power BI abre de verdad y la que sirve las tarjetas de
      KPI**, asi que lo que aqui no se diga no llega a nadie. Eso costo caro una
      vez: mientras `mart.fact_seguimiento_categoria` avisaba en mayusculas de
      que su `importe_origen` venia doblado, esta ficha no lo decia, y un agente
      que consultara la vista —lo natural, porque es la superficie de consumo—
      no se enteraba de nada.
    grano: >-
      Una fila por (`obra_id`, `anio_mes`, `categoria`, `escenario`): la suma de
      todas las partidas de esa obra y mes que comparten categoria. La clave
      identifica una fila.

      **`importe_origen` se lee y se da por bueno.** Hasta el build de F-042
      venia **DOBLADO** en **35 celdas de 7 obras — 30.425.881,56 EUR**, medido
      el 2026-08-28, porque el agregado sumaba dos veces el mismo acumulado de
      las filas gemelas del fact. La causa eran **22** obras con dos fases que
      Sigrid guarda con el mismo `ano` y `mes`, de las que **9** llegaban a
      duplicar filas; hoy se publica **un solo cierre por mes**, el mas moderno
      con acumulado distinto de cero, y el agregado sale correcto sin que se
      haya tocado el `SUM`. La consulta que lo comprueba esta en el grano de
      `mart.fact_seguimiento_mensual`, y hoy devuelve **0** frente a las
      **8.778** de antes.

      **`importe_mes` es el movimiento del mes, telescopea y se suma;
      `importe_origen` es un acumulado y no se suma entre meses.** Esa
      distincion no la cambio F-042 y es la que hay que tener presente al montar
      una tarjeta de KPI.
    clave_negocio: [obra_id, anio_mes, categoria, escenario]
    paso_etl: build_mart
    refresco: nocturno
    columnas:
      fact_cat_id:
        significado: Clave tecnica heredada del preagregado. Cambia en cada build.
        agregacion: clave_sustituta
      obra_id:
        significado: Identificador de la obra en Sigrid.
        agregacion: no_sumable
      anio_mes:
        significado: Mes de imputacion, como fecha del dia 1.
        agregacion: no_sumable
      categoria:
        significado: Clasificacion del coste, derivada por heuristica del capitulo raiz.
        valores: [CD, CI, CP, OTRO]
      escenario:
        significado: Cruce de magnitud y naturaleza.
        valores: [Coste Real, Coste Planificado, Venta Real, Venta Planificada]
      importe_mes:
        significado: >-
          Importe del mes sumado sobre todas las partidas de la categoria.

          Telescopea: cada fila trae la diferencia con la anterior y su suma
          es exactamente el movimiento del periodo (comprobado, 200 de 200
          series). Nunca estuvo afectada por el duplicado del fact, y F-042
          renumera el orden interno de las fases precisamente para que lo siga
          sin estar.
        unidad: EUR
        agregacion: suma_solo_dentro_del_mes
      importe_origen:
        significado: >-
          Acumulado a origen de esas partidas. No se suma en el tiempo.

          Se lee y se da por bueno. Hasta el build de F-042 venia **DOBLADO**
          en **35 celdas de 7 obras — 30.425.881,56 EUR** porque el agregado
          sumaba dos veces el mismo acumulado de las filas gemelas del fact. La
          causa eran **22** obras con dos fases en el mismo mes, de las que
          **9** duplicaban filas. Con un solo cierre por mes eso desaparecio sin
          tocar el agregado.

          Lo que no ha cambiado: **es un acumulado a origen**. Sumarlo entre
          meses multiplica; para el total de un periodo se usa `importe_mes`.
        unidad: EUR
        agregacion: ultimo_valor
      num_partidas:
        significado: Cuantas partidas distintas se han sumado en la fila.
        agregacion: no_sumable
    relaciones:
      - de: fact_cat_id
        a: mart.fact_seguimiento_categoria.fact_cat_id
        cardinalidad: "1:1"
        porque: Es la misma fila, sin los textos de obra ni de mes.
      - de: obra_id
        a: mart.v_pbi_dim_obra.obra_id
        cardinalidad: "N:1"
        porque: Dimension de obra.
    ejemplos_preguntas:
      - Cual es el reparto CD/CI/CP del coste real de la obra X este ano

  v_pbi_dim_obra:
    tipo: vista
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      Dimension de obra del modelo en estrella. Sale de `stg.obras`, es decir del
      universo del SEGUIMIENTO: no estan las obras administrativas ni los codigos
      con cinco o mas digitos. Para el universo completo, con cliente y estado,
      se va a `maestro.obras`.
    grano: >-
      Una fila por `obra_id`, del universo de seguimiento.
    clave_negocio: [obra_id]
    paso_etl: build_mart
    refresco: nocturno
    columnas:
      obra_id:
        significado: Identificador de la obra en Sigrid (`con.ide`). Clave de la dimension.
        agregacion: no_sumable
      codigo_obra: Codigo de obra tal y como se teclea en Sigrid.
      nombre_obra: Nombre legible de la obra, de `con.res`.
      obra_label: >-
        Codigo y nombre juntos, para segmentadores ("0704 · REFORMA..."). Es
        presentacion, no un dato.
    relaciones:
      - de: obra_id
        a: maestro.obras.obra_id
        cardinalidad: "1:1"
        porque: >-
          Para el cliente, el estado y las fechas de alta y baja. OJO: el
          maestro tiene MAS obras, porque no filtra las administrativas.
    ejemplos_preguntas:
      - Que obras hay en el seguimiento
      - Como se llama la obra 0704

  v_pbi_dim_partida:
    tipo: vista
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      Dimension de partida del modelo en estrella, con los atributos para bajar
      por la jerarquia: categoria, capitulo raiz y ruta completa de capitulos.
      Incluye tanto las partidas como los capitulos, porque en Sigrid un capitulo
      es tambien una fila de partidas.
    grano: >-
      Una fila por `partida_id`: una partida o un capitulo de una obra.
    clave_negocio: [partida_id]
    paso_etl: build_mart
    refresco: nocturno
    columnas:
      partida_id:
        significado: Identificador de la partida en Sigrid (`obrparpar.ide`). Clave.
        agregacion: no_sumable
      obra_id:
        significado: >-
          Obra a la que pertenece. Una partida pertenece siempre a una sola
          obra: los codigos de partida solo son unicos dentro de su obra.
        agregacion: no_sumable
      codigo_partida: Codigo jerarquico de la partida dentro de su obra ('01.02').
      descripcion_partida: Descripcion corta que escribio el jefe de obra.
      unidad_medida: Unidad de medicion (m3, m2, ud, kg...).
      categoria:
        significado: >-
          Clasificacion del coste, DERIVADA por heuristica del codigo del
          capitulo raiz. No es una taxonomia oficial de Sigrid.
        valores: [CD, CI, CP, OTRO]
      capitulo_raiz_cod: Codigo del capitulo raiz del que cuelga la partida.
      ruta_capitulos: Camino de capitulos hasta la partida, separado por ' > '.
      nivel:
        significado: Profundidad en el arbol de capitulos. 0 es el raiz.
        agregacion: no_sumable
      activa: >-
        Marca de partida vigente. Ojo: la columna equivalente de `stg.obras`
        esta cableada a TRUE; esta viene del origen.
      partida_label: Codigo y descripcion juntos, para segmentadores. Es presentacion.
      es_hoja: >-
        **HEURISTICA, no una comprobacion de si la partida tiene hijos.** Vale
        TRUE cuando `nivel >= 2` o el `codigo_partida` lleva un punto, y nada
        mas. Un **capitulo** intermedio de nivel 2 con descendientes —`CI.2`,
        con `CI.2.1` debajo— sale marcado como hoja igual que ellas.

        Por eso **no evita el doble conteo**: filtrando por `es_hoja` se suman a
        la vez el capitulo y sus hijas. Sirve como filtro de presentacion en
        Power BI, para quitar de un visual los capitulos de primer nivel. Para
        agregar sin duplicar hay que bajar al ultimo nivel de la jerarquia de
        `stg.partidas`, no fiarse de esta columna.
    relaciones:
      - de: obra_id
        a: mart.v_pbi_dim_obra.obra_id
        cardinalidad: "N:1"
        porque: Una partida cuelga de una obra.
      - de: partida_id
        a: stg.partidas.partida_id
        cardinalidad: "1:1"
        porque: Es la fila de origen; la vista solo renombra y anade etiquetas.
    ejemplos_preguntas:
      - Que partidas tiene la obra X y de que capitulo cuelgan
      - Cuantas partidas de coste directo tiene la obra X

  v_pbi_dim_partida_niveles:
    tipo: vista
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      Lo mismo que `mart.v_pbi_dim_partida` mas seis columnas `nivel_1` a
      `nivel_6` con "codigo · nombre" de cada escalon de la ruta de capitulos.
      Existe para pintar el arbol del presupuesto sin recursion. Misma clave, asi
      que se puede sustituir una por otra.
    grano: >-
      Una fila por `partida_id`, igual que la dimension base.
    clave_negocio: [partida_id]
    paso_etl: build_mart
    refresco: nocturno
    columnas:
      partida_id:
        significado: Identificador de la partida en Sigrid. Clave.
        agregacion: no_sumable
      obra_id:
        significado: Obra a la que pertenece la partida.
        agregacion: no_sumable
      codigo_partida: Codigo jerarquico de la partida dentro de su obra.
      descripcion_partida: Descripcion corta de la partida.
      unidad_medida: Unidad de medicion de la partida.
      categoria:
        significado: Clasificacion del coste, derivada por heuristica del capitulo raiz.
        valores: [CD, CI, CP, OTRO]
      capitulo_raiz_cod: Codigo del capitulo raiz.
      ruta_capitulos: Camino de capitulos separado por ' > '. Es la fuente de los niveles.
      nivel:
        significado: Profundidad en el arbol de capitulos.
        agregacion: no_sumable
      activa: Marca de partida vigente en el origen.
      partida_label: Codigo y descripcion juntos. Presentacion.
      es_hoja: >-
        **HEURISTICA, no una comprobacion de si la partida tiene hijos.** Vale
        TRUE cuando `nivel >= 2` o el `codigo_partida` lleva un punto, y nada
        mas. Un **capitulo** intermedio de nivel 2 con descendientes —`CI.2`,
        con `CI.2.1` debajo— sale marcado como hoja igual que ellas.

        Por eso **no evita el doble conteo**: filtrando por `es_hoja` se suman a
        la vez el capitulo y sus hijas. Sirve como filtro de presentacion en
        Power BI, para quitar de un visual los capitulos de primer nivel. Para
        agregar sin duplicar hay que bajar al ultimo nivel de la jerarquia de
        `stg.partidas`, no fiarse de esta columna.
      nivel_1: Primer escalon de la ruta ("CD · COSTES DIRECTOS"), como codigo y nombre.
      nivel_2: Segundo escalon de la ruta.
      nivel_3:
        significado: Tercer escalon de la ruta.
        nulo_significa: La rama no llega a esa profundidad.
      nivel_4:
        significado: Cuarto escalon de la ruta.
        nulo_significa: La rama no llega a esa profundidad.
      nivel_5:
        significado: Quinto escalon de la ruta.
        nulo_significa: La rama no llega a esa profundidad.
      nivel_6:
        significado: Sexto escalon de la ruta.
        nulo_significa: La rama no llega a esa profundidad.
    relaciones:
      - de: partida_id
        a: mart.v_pbi_dim_partida.partida_id
        cardinalidad: "1:1"
        porque: Es un superconjunto de columnas de la misma fila.
    ejemplos_preguntas:
      - Dame el arbol de presupuesto de la obra X por niveles

  v_pbi_dim_escenario:
    tipo: vista
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      Catalogo ESTATICO de los cuatro escenarios del seguimiento, con el ambito
      de Sigrid del que sale cada uno y su orden de presentacion. No lee ninguna
      tabla: son cuatro filas escritas en la propia vista.
    grano: Una fila por escenario. Siempre cuatro.
    clave_negocio: [escenario]
    paso_etl: build_mart
    refresco: nocturno
    columnas:
      escenario:
        significado: >-
          Literal exacto del escenario. Es la clave y lo que se pone en un
          `WHERE` sobre las tablas de hecho.
        valores: [Coste Real, Coste Planificado, Venta Real, Venta Planificada]
      tipo_dato:
        significado: Naturaleza, la mitad "real o previsto".
        valores: [REAL, PLANIFICADO]
      concepto:
        significado: Magnitud, la mitad "coste o venta".
        valores: [COSTE, VENTA]
      ambito_id:
        significado: Ambito de Sigrid del que sale el escenario (3, 8, 7 u 11).
        agregacion: no_sumable
      orden:
        significado: Orden de presentacion (1 a 4). Es presentacion, no un dato.
        agregacion: no_sumable
    relaciones: []
    ejemplos_preguntas:
      - Que escenarios existen en el seguimiento y de que ambito sale cada uno

  v_pbi_dim_fecha:
    tipo: vista
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      Calendario MENSUAL, no diario: una fila por mes desde el primero con datos
      en el seguimiento hasta doce meses despues del ultimo. Los nombres de mes
      se generan en castellano sin depender del idioma del servidor.
    grano: >-
      Una fila por `anio_mes`, es decir por mes y no por dia: el grano de todo
      el seguimiento es mensual.
    clave_negocio: [anio_mes]
    paso_etl: build_mart
    refresco: nocturno
    columnas:
      anio_mes:
        significado: Primer dia del mes. Clave de la dimension.
        agregacion: no_sumable
      anio:
        significado: Ano al que pertenece el mes de la fila.
        agregacion: no_sumable
      mes:
        significado: Numero de mes, de 1 a 12.
        agregacion: no_sumable
      trimestre:
        significado: Numero de trimestre, de 1 a 4.
        agregacion: no_sumable
      nombre_mes_solo: Nombre del mes en castellano, sin ano ("Octubre").
      nombre_mes_anio: Nombre del mes con su ano ("Octubre 2025").
      anio_mes_iso: El mes en formato ordenable como texto ("2025-10").
      trimestre_label: Etiqueta del trimestre con su ano ("T4 2025").
      es_pasado_o_actual: >-
        Marca los meses hasta el actual incluido. Sirve para no mezclar el
        futuro planificado con lo ya ocurrido.
      es_mes_actual: Marca el mes en curso. Se recalcula en cada consulta.
    relaciones: []
    ejemplos_preguntas:
      - Que meses cubre el seguimiento
      - Dame los meses cerrados de 2025

  v_master_versiones_tipadas:
    tipo: vista
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      Catalogo de las versiones master de planificacion de cada obra, con su tipo
      DEDUCIDO del texto libre que escribio el jefe de obra. Es la vista que
      explica por que una obra tiene o no tiene plan vigente en un mes.
    grano: >-
      Una fila por (`obra_id`, `ambito_id`, `version`), que es su clave de
      negocio. Solo ambitos 8 (coste) y 11 (venta), y solo versiones con fecha
      efectiva resuelta.
    clave_negocio: [obra_id, ambito_id, version]
    paso_etl: build_mart
    refresco: nocturno
    columnas:
      obra_id:
        significado: Identificador de la obra en Sigrid.
        agregacion: no_sumable
      ambito_id:
        significado: Ambito master del que sale la version, 8 en coste y 11 en venta.
        agregacion: no_sumable
      version:
        significado: >-
          Numero de version master. OJO: en los ambitos master el campo `fas` de
          Sigrid es este numero de version, no un mes.
        agregacion: no_sumable
      version_fec_creacion:
        significado: Fecha en que se creo la version en Sigrid.
        agregacion: no_sumable
      version_fec_efectiva:
        significado: >-
          Fecha desde la que la version rige de verdad. Coincide con la de
          creacion salvo en las cuatrimestrales entregadas tarde, donde se
          adelanta al periodo que representan.
        agregacion: no_sumable
      version_descripcion: Etiqueta legible de la version ("Version 11 (04/02/2026)").
      version_tex: >-
        Texto libre que escribio el jefe de obra al crear la version ("ABC",
        "PLANIFICACION CUATRIMESTRAL FEB-26"). Es la fuente de `tipo_master`.
      tipo_master:
        significado: >-
          Tipo deducido del texto, con prioridad estricta. Solo 'Planif Inicial',
          'ABC' y 'Cuatrimestral' cuentan como master vigente: las de 'Cierre
          mensual' NO reemplazan al plan, y una obra que solo tenga cierres en un
          mes se queda sin planificado ese mes.
        valores: [ABC, Planif Inicial, Cuatrimestral, Cierre mensual, Sin clasificar]
    relaciones:
      - de: obra_id
        a: mart.v_pbi_dim_obra.obra_id
        cardinalidad: "N:1"
        porque: Para poner codigo y nombre a la obra.
      - de: obra_id
        a: stg.plan_mensual.obra_id
        cardinalidad: "N:N"
        porque: >-
          Es la tabla de la que sale, filtrando los ambitos master. Hay muchas
          filas por obra en las dos puntas: el JOIN va por
          `(obra_id, ambito_id, version)`, y aun asi consultar `stg.plan_mensual`
          sin elegir version multiplica los importes.
    ejemplos_preguntas:
      - Que versiones de planificacion tiene la obra X y de que tipo son
      - Que obras solo tienen versiones de cierre mensual

  v_master_vigente_anual:
    tipo: vista
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      Para cada obra y ano, cual es la version master que rige: la ultima de tipo
      'Planif Inicial', 'ABC' o 'Cuatrimestral' con fecha efectiva anterior al
      corte. El corte es el 31 de diciembre si el ano ya paso, y hoy si es el ano
      en curso. **NUNCA SE CONSULTA SIN FILTRAR POR OBRA**: medido el
      2026-08-25, `SELECT * ... LIMIT 5` agota los 40 s, y
      `WHERE obra_id = ... AND anio = ...` responde en **20 s**. Un `LIMIT` no
      la salva, porque el limite se aplica DESPUES de calcular la vista entera.
      Ver R-COSTE-CONSULTA.
    grano: >-
      Una fila por (`obra_id`, `anio`, `ambito_id`), que es su clave de
      negocio.
    clave_negocio: [obra_id, anio, ambito_id]
    paso_etl: build_mart
    refresco: nocturno
    columnas:
      obra_id:
        significado: Identificador de la obra en Sigrid.
        agregacion: no_sumable
      anio:
        significado: Ano para el que se resuelve la version vigente.
        agregacion: no_sumable
      ambito_id:
        significado: Ambito master, 8 en coste y 11 en venta.
        agregacion: no_sumable
      version:
        significado: Numero de la version master que rige ese ano.
        agregacion: no_sumable
      version_fec_efectiva:
        significado: Fecha desde la que rige la version elegida.
        agregacion: no_sumable
      version_descripcion: Etiqueta legible de la version elegida.
      version_tex: Texto libre original de la version elegida.
      tipo_master:
        significado: >-
          Tipo de la version elegida. Aqui solo pueden aparecer los tres tipos
          que cuentan como master vigente.
        valores: [ABC, Planif Inicial, Cuatrimestral]
    relaciones:
      - de: obra_id
        a: mart.v_master_versiones_tipadas.obra_id
        cardinalidad: "N:N"
        porque: >-
          Es el catalogo del que se elige, filtrando por fecha efectiva. Una
          version concreta se identifica con `(obra_id, ambito_id, version)`:
          unir por `obra_id` trae todas las versiones de la obra.
      - de: obra_id
        a: mart.v_pbi_dim_obra.obra_id
        cardinalidad: "N:1"
        porque: Para poner codigo y nombre a la obra.
    ejemplos_preguntas:
      - Que version de plan rige en la obra X para 2025
      - Que obras no tienen ninguna version master vigente

  v_pbi_cp_tipologia:
    tipo: vista
    capa: consumo
    consumo_recomendado: false
    motivo_no_consumo: >-
      **NO SE PUEDE CONSULTAR HOY.** Agota los 40 s con `SELECT * ... LIMIT 5` y
      los **60 s filtrada a una sola obra** (medido el 2026-08-25), asi que no
      hay forma de sacarle una fila dentro de la ventana util. Estaba marcada
      como recomendada mientras no respondia nada. Ver R-COSTE-CONSULTA. Su
      contenido sigue siendo el correcto para la pregunta; lo que falta es que
      se pueda ejecutar, y eso pasa por materializarla.
    descripcion: >-
      Desglose ANUAL de los Costes Proporcionales por tipologia de negocio
      (seguros, avales, levantamiento, contratacion, medio ambiente y aporte a
      gastos generales), comparando real y planificado sobre la MISMA ventana de
      meses. Solo salen las filas con algun importe distinto de cero.
    grano: >-
      Una fila por (`obra_id`, `anio`, `tipologia`), que es su clave de
      negocio. El plan y el real se suman sobre la MISMA ventana
      [enero .. mes de corte]: 12 si el ano ya paso, y el ultimo mes con cierre
      real si es el ano en curso. Cortar el plan en el mes de calendario lo
      dejaria siempre por delante del real.
    clave_negocio: [obra_id, anio, tipologia]
    paso_etl: build_mart
    refresco: nocturno
    columnas:
      obra_id:
        significado: Identificador de la obra en Sigrid.
        agregacion: no_sumable
      anio:
        significado: Ano al que se refiere la agregacion.
        agregacion: no_sumable
      tipologia:
        significado: >-
          Agrupacion de negocio de los CP. Se deduce del subcapitulo cuando este
          es definitorio (CP.1 a CP.4, CP.6, CP.9, CP.12) y, si no, por el texto
          de la descripcion. Lo que no encaja en ninguna regla va a APORTE GG.
        valores:
          - LEVANTAMIENTO
          - SEGUROS
          - AVALES
          - CONTRATACION
          - MEDIO AMBIENTE
          - APORTE GG
      orden_tipologia:
        significado: Orden de presentacion de la tipologia. Es presentacion, no un dato.
        agregacion: no_sumable
      cp_real:
        significado: >-
          Coste proporcional real, **sumado** sobre la ventana del ano
          [enero .. mes de corte]. "Acumulado" aqui es el total de esos meses,
          no un acumulado a origen como el de `stg.presupuesto`: cada mes entra
          una sola vez, asi que sumar dos anos suma meses distintos y es
          correcto.
        unidad: EUR
        agregacion: suma
      cp_planificado:
        significado: Coste proporcional planificado en la MISMA ventana, segun la version vigente.
        unidad: EUR
        agregacion: suma
      cp_desviacion:
        significado: >-
          Real menos planificado. Positivo significa gastado de mas frente al
          plan.
        unidad: EUR
        agregacion: suma
    relaciones:
      - de: obra_id
        a: mart.v_pbi_dim_obra.obra_id
        cardinalidad: "N:1"
        porque: Para poner codigo y nombre a la obra.
      - de: obra_id
        a: mart.v_master_vigente_anual.obra_id
        cardinalidad: "N:N"
        porque: >-
          Es la version de plan que se usa para la columna planificada. El JOIN
          va por `(obra_id, anio)`: por `obra_id` solo trae la version de todos
          los anos. El ambito no es una dimension de esta union: el SQL fija
          `ambito_id = 8` (coste) como filtro constante sobre el destino, y esta
          vista ni siquiera proyecta esa columna.
    ejemplos_preguntas:
      - Cuanto llevamos de seguros y avales en la obra X este ano
      - Que obras se desvian mas en costes proporcionales

  v_fact_periodificado:
    tipo: vista
    capa: consumo
    consumo_recomendado: false
    motivo_no_consumo: >-
      HOY NO PERIODIFICA NADA. `aux.periodificacion_partida` se crea vacia por
      diseno, asi que la vista devuelve exactamente lo mismo que
      `mart.fact_seguimiento_mensual` mas dos columnas de trazabilidad, y todas
      sus filas salen marcadas 'NO_PERIODIFICADO'. Usar la tabla de hecho es mas
      barato y menos confuso. Cuando se carguen reglas, esta ficha cambia.
    descripcion: >-
      El hecho del seguimiento con las reglas de periodificacion aplicadas: coge
      un coste imputado de golpe —un seguro, un aval— y lo reparte a lo largo de
      su plazo. Solo periodifica COSTE; la venta pasa siempre directa.
    grano: >-
      Una fila por (`obra_id`, `partida_id`, `anio_mes`, `escenario`), igual que
      la tabla de hecho, salvo en las filas periodificadas, donde una imputacion
      de un mes se convierte en tantas filas como meses tenga su plazo.

      **"Igual que la tabla de hecho" incluye lo bueno y lo malo**: es un paso
      a traves mientras la tabla de reglas siga vacia, asi que hereda el grano
      del fact tal cual. Hasta el build de F-042 eso incluia sus 8.778
      combinaciones duplicadas; con un cierre por mes, la clave identifica una
      fila tambien aqui.

      **Que se puede sumar**: las medidas del MES (`importe_mes` y sus
      hermanas) **telescopean**, asi que sumarlas es correcto
      —comprobado, 200 de 200 series—. Las acumuladas a origen
      (`importe_origen`…) son el llevado hasta ese mes, y por eso
      son `ultimo_valor`: no se suman nunca. Ver el grano de
      `mart.fact_seguimiento_mensual` para la causa completa.
    clave_negocio: [obra_id, partida_id, anio_mes, escenario]
    paso_etl: build_mart
    refresco: nocturno
    columnas:
      fact_id:
        significado: Clave tecnica de la fila original.
        nulo_significa: La fila es derivada, no existe en la tabla de hecho.
        agregacion: clave_sustituta
      obra_id:
        significado: Identificador de la obra en Sigrid.
        agregacion: no_sumable
      codigo_obra: Codigo de obra tal y como se teclea en Sigrid.
      nombre_obra: Nombre legible de la obra.
      partida_id:
        significado: Identificador de la partida en Sigrid.
        agregacion: no_sumable
      codigo_partida: Codigo jerarquico de la partida dentro de su obra.
      descripcion_partida: Descripcion corta de la partida.
      unidad_medida: Unidad de medicion de la partida.
      categoria:
        significado: Clasificacion del coste, derivada del capitulo raiz.
        valores: [CD, CI, CP, OTRO]
      capitulo_raiz_cod: Codigo del capitulo raiz.
      ruta_capitulos: Camino de capitulos separado por ' > '.
      anio_mes:
        significado: Mes al que queda imputada la fila DESPUES de periodificar.
        agregacion: no_sumable
      anio:
        significado: Ano de `anio_mes`.
        agregacion: no_sumable
      mes:
        significado: Numero de mes de `anio_mes`.
        agregacion: no_sumable
      nombre_mes: Etiqueta del mes en castellano con su ano.
      escenario:
        significado: Cruce de magnitud y naturaleza.
        valores: [Coste Real, Coste Planificado, Venta Real, Venta Planificada]
      tipo_dato:
        significado: Naturaleza del dato.
        valores: [REAL, PLANIFICADO]
      concepto:
        significado: Magnitud del dato. Solo se periodifica COSTE.
        valores: [COSTE, VENTA]
      ambito_id:
        significado: Ambito de Sigrid de origen.
        agregacion: no_sumable
      importe_mes:
        significado: >-
          Importe imputado al mes YA periodificado. En las filas repartidas es el
          total dividido entre el plazo.
        unidad: EUR
        agregacion: suma_solo_dentro_del_mes
      importe_origen:
        significado: >-
          Acumulado a origen. OJO: en las filas periodificadas NO es un
          acumulado, se repite el importe del mes; el acumulado se calcula en
          consumo.
        unidad: EUR
        agregacion: ultimo_valor
      importe_mes_raw:
        significado: Version sin redondear del importe del mes periodificado.
        unidad: EUR
        agregacion: suma_solo_dentro_del_mes
      importe_origen_raw:
        significado: Version sin redondear del acumulado, con la misma advertencia.
        unidad: EUR
        agregacion: ultimo_valor
      can_mes:
        significado: Cantidad imputada al mes.
        nulo_significa: La fila es periodificada; el reparto no conserva cantidades.
        agregacion: suma_solo_dentro_del_mes
      can_origen:
        significado: Cantidad acumulada a origen.
        nulo_significa: La fila es periodificada.
        agregacion: ultimo_valor
      precio_unitario:
        significado: Precio unitario de la partida.
        unidad: EUR
        agregacion: no_sumable
      version_master:
        significado: Numero de la version master del planificado.
        nulo_significa: La fila es REAL.
        agregacion: no_sumable
      version_descripcion: Etiqueta legible de la version, o del mes en las filas reales.
      version_tex:
        significado: Texto libre de la version master.
        nulo_significa: La fila es REAL.
      version_fec_creacion:
        significado: Fecha de creacion de la version master.
        nulo_significa: La fila es REAL.
        agregacion: no_sumable
      tipo_master:
        significado: Tipo de la version master, deducido del texto.
        valores: [ABC, Planif Inicial, Cuatrimestral, Cierre mensual, Sin clasificar]
        nulo_significa: La fila es REAL.
      total_incurrido:
        significado: Incurrido a origen de Sigrid. Solo en coste real y sin periodificar.
        unidad: EUR
        agregacion: ultimo_valor
      total_incurrido_mes:
        significado: Incurrido del mes de Sigrid. Solo en coste real y sin periodificar.
        unidad: EUR
        agregacion: suma_solo_dentro_del_mes
      regla_id_aplicada:
        significado: >-
          Regla de `aux.periodificacion_partida` que se aplico a la fila. Al
          contrario que el resto de claves BIGSERIAL del datamart, esta SI es
          estable: su tabla se crea con `CREATE TABLE IF NOT EXISTS` y ningun
          build la reconstruye.
        nulo_significa: No se aplico ninguna regla; la fila pasa tal cual.
        agregacion: no_sumable
      marca:
        significado: >-
          Si la fila viene tal cual de la tabla de hecho o es resultado de un
          reparto. Hoy todas son 'NO_PERIODIFICADO'.
        valores: [NO_PERIODIFICADO, PERIODIFICADO]
    relaciones:
      - de: fact_id
        a: mart.fact_seguimiento_mensual.fact_id
        cardinalidad: "1:1"
        porque: >-
          Las filas no periodificadas son las mismas. Las periodificadas no
          tienen equivalente y traen `fact_id` nulo.
      - de: regla_id_aplicada
        a: aux.periodificacion_partida.regla_id
        cardinalidad: "N:1"
        porque: Para saber que regla reparte el importe y con que plazo.
    ejemplos_preguntas:
      - Como quedaria el coste de la obra X si se periodificaran los seguros
