      Funcion auxiliar del build de ventas, usada solo dentro del SQL que
      construye el esquema.
    descripcion: >-
      Traduce la clase de recargo de Sigrid a COEFICIENTES (0), RETESP (1),
      GARANTIA (hoy 4 y 5) u OTRAS. Es el UNICO punto de la decision D4 en el
      SQL: cambiar las clases de garantia se hace aqui y en
      `CLASES_GARANTIA` del dominio, y nada mas.
    grano: null
    clave_negocio: []
    paso_etl: build_ventas
    refresco: nocturno
    columnas: {}
    relaciones: []
    ejemplos_preguntas: []
