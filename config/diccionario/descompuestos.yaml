      precio: {significado: 'Precio del elemento; la base en los porcentajes.', unidad: EUR, agregacion: no_sumable}
      importe_unitario: {significado: 'ROUND(factor x rendimiento x precio, 2); suma por partida = su precio si cuadra.', unidad: EUR, agregacion: suma}
      cantidad_total: {significado: 'Cantidad total del elemento a la medicion ACTUAL (ya lleva el factor); mezcla unidades.', agregacion: no_sumable}
      importe_total: {significado: 'ROUND(cantidad_total x precio, 2) a la medicion ACTUAL: NO es el importe de Estudios.', unidad: EUR, agregacion: suma}
      es_porcentaje: {significado: 'TRUE en los tipos 4 y 13 (porcentajes).'}
      porcentaje: {significado: 'Porcentaje en tanto por cien (2 = 2 %), sin el factor.', agregacion: no_sumable}
      base_porcentaje: {significado: 'Base sobre la que se aplica el porcentaje.', unidad: EUR, agregacion: no_sumable}
      factor: {significado: 'El FACTOR de la linea (campo 14 `factor x rendimiento`, F-120); 1 si no tiene.', agregacion: no_sumable, nulo_significa: 'Campo 14 vacio o raro.'}
    relaciones:
