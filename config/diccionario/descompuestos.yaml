      21,5 MB) y las versiones del master ya cargadas (1.616.461 filas y 2,14
      GB cuando esten las 3.023). Lo escribe `ingest_descompuestos`, version a
      version y en una transaccion con su fila de `_versiones_cargadas`; NUNCA
      se trunca (`--full` no la toca): es la primera tabla del datamart que no
      se reconstruye de cero.
    grano: Una fila por fila de `obrparpre` con descompuesto, `presupuesto_id` (partida x ambito x fase).
    clave_negocio: [presupuesto_id]
    paso_etl: ingest_descompuestos
    refresco: nocturno
    columnas:
      presupuesto_id: {significado: 'La fila de `obrparpre` (`obrparpre.ide`).', agregacion: no_sumable}
      obra_id: {significado: 'La obra (`obrparpre.obride`); 0 en las 227 filas huerfanas.', agregacion: no_sumable}
      partida_id: {significado: 'La partida (`obrparpre.paride`).', agregacion: no_sumable}
      ambito_id: {significado: '3 (ambito 3 fase 0) u 8 (master).', valores: [3, 8], agregacion: no_sumable}
      fase_num: {significado: 'La fase; en el master, la version.', agregacion: no_sumable}
      cantidad: {significado: 'La medicion de la partida (`obrparpre.can`) al cargar.', agregacion: no_sumable}
      precio: {significado: 'El precio de la partida (`obrparpre.pre`) al cargar.', unidad: EUR, agregacion: no_sumable}
      haydes: {significado: 'La marca de Sigrid de que hay descompuesto (`obrparpre.haydes`).'}
      des: {significado: 'El texto del descompuesto, registros `~D|...` separados por salto de linea.'}
      batch_id: {significado: 'La ejecucion que cargo la fila, como en `_meta.etl_runs.batch_id`.'}
    relaciones: []
    ejemplos_preguntas: []

  _versiones_cargadas:
    tipo: tabla
    capa: preparacion
    consumo_recomendado: false
    motivo_no_consumo: >-
      Es el ESTADO del incremental del master. Para saber si el master de una
      obra esta completo sirve, pero las preguntas de negocio van a
      `descompuestos.lineas`.
    descripcion: >-
      Una fila por version del master (ambito 8) ya cargada en `_des_texto`: la
      huella que tenia en Sigrid al cargarla (filas, bytes y un CHECKSUM del
      texto), de que ejecucion viene y con que SQL se troceo. Cada noche
      `ingest_descompuestos` compara esta huella con la de Sigrid y relee las
      versiones nuevas, la vigente de cada obra y las de huella distinta, hasta
      300 MB. La primera carga se hizo el 2026-09-29 (3.025 versiones): si una
      version del master esta en `descompuestos.lineas`, aqui esta su fila. Si se
      corrompe: vaciarla y lanzar `ingest-descompuestos --sin-tope`.
    grano: Una fila por version del master cargada (obra_id, fase_num).
    clave_negocio: [obra_id, fase_num]
    paso_etl: ingest_descompuestos
    refresco: nocturno
    columnas:
      obra_id: {significado: 'La obra de la version (`obrparpre.obride`).', agregacion: no_sumable}
      fase_num: {significado: 'La version del master (`obrparpre.fas`).', agregacion: no_sumable}
      filas: {significado: 'Filas con descompuesto de la version en Sigrid al cargarla.', agregacion: suma}
      bytes: {significado: 'Bytes de texto de la version en Sigrid al cargarla (DATALENGTH).', agregacion: suma}
      huella: {significado: 'CHECKSUM_AGG del texto, la medicion y el precio de la version al cargarla.', agregacion: no_sumable}
      batch_id: {significado: 'La ejecucion que cargo la version, como en `_meta.etl_runs.batch_id`.'}
      cargada_at: {significado: 'Cuando se cargo la version, en UTC sin zona como todo `_meta`.'}
      sello_troceado: {significado: 'El sello del SQL con que se troceo la version (R11).', nulo_significa: 'Releida y pendiente de trocear.'}
      troceada_at: {significado: 'Cuando se troceo por ultima vez, en UTC sin zona.', nulo_significa: 'Nunca se ha troceado.'}
      atributos_troceado: {significado: 'Huella del origen y las marcas que llevan sus lineas; si cambia, se actualizan.'}
    relaciones:
      - de: obra_id
        a: maestro.obras.obra_id
        cardinalidad: "N:1"
        porque: La ficha de la obra de la version.
    ejemplos_preguntas: []

  fn_trocear:
    tipo: funcion
    capa: operacion
    consumo_recomendado: false
    motivo_no_consumo: >-
      Funcion auxiliar del build de descompuestos: trocea el texto crudo. Lo
      troceado ya esta en `descompuestos.lineas`.
    descripcion: >-
      Parte el texto `des` en una fila por registro `~D|` (por salto de linea
      seguido de `~<letra>|`, nunca por cualquier salto) y mapea cada campo por
      su posicion, con el tipo traducido y los importes. El campo 14 es
      `factor x rendimiento` (F-120): lo parte en `factor` y `rendimiento`, y el
      importe unitario lleva el factor. Una sola definicion para el ambito 3 y
      el master; su texto, el de `00_setup.sql` y el de `03_lineas_master.sql`
      forman el sello del troceado.
    grano: null
    clave_negocio: []
    paso_etl: build_descompuestos
    refresco: nocturno
    columnas: {}
    relaciones: []
    ejemplos_preguntas: []

  fn_num:
    tipo: funcion
    capa: operacion
    consumo_recomendado: false
    motivo_no_consumo: >-
      Funcion auxiliar del build de descompuestos, usada solo dentro del SQL
      que construye el esquema.
    descripcion: >-
      Convierte un campo del texto `des` en numero; lo que no es un numero
      (vacio, texto, coma decimal, un exponente de mas de tres cifras) es NULL,
      para que el build no falle por un registro mal escrito.
    grano: null
    clave_negocio: []
    paso_etl: build_descompuestos
    refresco: nocturno
    columnas: {}
    relaciones: []
    ejemplos_preguntas: []

  fn_fecha:
    tipo: funcion
    capa: operacion
    consumo_recomendado: false
    motivo_no_consumo: >-
      Funcion auxiliar del build de descompuestos, usada solo dentro del SQL
      que construye el esquema.
    descripcion: >-
      Convierte una fecha de Sigrid --un entero AAAAMMDD-- en una fecha de
      verdad, tratando el 0 como ausencia de fecha. Copia local de la de los
      otros esquemas modulo, para no depender de ninguno.
    grano: null
    clave_negocio: []
    paso_etl: build_descompuestos
    refresco: nocturno
    columnas: {}
    relaciones: []
    ejemplos_preguntas: []
