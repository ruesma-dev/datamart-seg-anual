        cardinalidad: "N:1"
        porque: La ficha de la obra.
      - de: partida_id
        a: stg.partidas.partida_id
        cardinalidad: "N:1"
        porque: La partida en su arbol de capitulos.
    ejemplos_preguntas:
      - Que partidas de la obra X no cuadran con su descompuesto
      - Que partidas con precio no tienen ni descompuesto ni planificacion en la obra X

  elementos:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **EL CATALOGO DE ELEMENTOS DE DESCOMPUESTO, POR OBRA** (F-097, D9): una
      fila por (obra, codigo de elemento), con la descripcion y la unidad mas
      frecuentes, el tipo, cuantas lineas tiene en cada origen y el PRODUCTO de
      compras cuando se conoce. El grano es la obra porque los codigos de
      Estudios son LIBRES por obra: 31.726 codigos distintos en el ambito 3 y
      solo 253 son codigos de producto (2026-09-27). `via_producto` dice como se
      encontro el producto: por el enlace a la planificacion (fiable) o por
      coincidir el codigo con un producto de la MISMA empresa que la obra.
    grano: Una fila por (obra_id, codigo_elemento).
    clave_negocio: [obra_id, codigo_elemento]
    paso_etl: build_descompuestos
    refresco: nocturno
    columnas:
      obra_id:
        significado: La obra, la de `maestro.obras.obra_id`.
        agregacion: no_sumable
      codigo_elemento:
        significado: El codigo del elemento, tal cual en `descompuestos.lineas`.
      descripcion:
        significado: La descripcion mas frecuente del codigo en la obra.
      unidad:
        significado: La unidad mas frecuente del codigo en la obra.
      tipo_elemento:
        significado: El tipo mas frecuente sin contar SIN_TIPO (D8; 3 y 11 provisionales).
        valores: [MANO_OBRA, MAQUINARIA, MATERIAL, SUBCONTRATA, OTROS, PORCENTAJE, MEDIOS_AUXILIARES, SIN_TIPO, DESCONOCIDO]
      num_lineas:
        significado: Lineas del codigo en la obra, en todos los origenes y versiones.
        agregacion: no_sumable
      lineas_estudio:
        significado: Lineas del codigo en la obra con origen ESTUDIO (solo hay en las obras sin master 0).
        agregacion: no_sumable
      lineas_planif_jo:
        significado: Lineas del codigo en la obra con origen PLANIF_JO.
        agregacion: no_sumable
      lineas_master_estudio:
        significado: >-
          Lineas del codigo en la obra con origen MASTER_ESTUDIO, la version 0
          del master: Estudios en las obras con master 0. Hasta F-123 se
          llamaba `lineas_master_inicial`.
        agregacion: no_sumable
      lineas_master_pre_abc:
        significado: Lineas del codigo en la obra con origen MASTER_PRE_ABC (todas sus versiones).
        agregacion: no_sumable
      lineas_master_planif_jo:
        significado: Lineas del codigo en la obra con origen MASTER_PLANIF_JO (todas sus versiones).
        agregacion: no_sumable
      producto_id:
        significado: El producto de compras (`pro.ide`) del elemento, cuando se conoce.
        agregacion: no_sumable
        nulo_significa: Codigo libre de Estudios que no es de ningun producto de la empresa.
      via_producto:
        significado: >-
          Como se encontro el producto: ENLACE_PLANIFICACION (el de sus lineas
          enlazadas a `dncpro`) o CODIGO_PRODUCTO_EMPRESA (un producto de la
          empresa de la obra con ese codigo).
        valores: [ENLACE_PLANIFICACION, CODIGO_PRODUCTO_EMPRESA]
        nulo_significa: Sin producto.
    relaciones:
      - de: obra_id
        a: maestro.obras.obra_id
        cardinalidad: "N:1"
        porque: La ficha de la obra.
    ejemplos_preguntas:
      - Que elementos de la obra X tienen producto de compras
      - Cuantos codigos de Estudios de la obra X no son productos

  v_pbi_estudio:
    tipo: vista
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      Las lineas de origen ESTUDIO de `descompuestos.lineas`, con el origen
      CABLEADO: Estudios en las obras SIN master 0 (F-123), la «Descomposicion»
      del ambito 3 fase 0 (la fase viva), solo de las partidas cuya
      «Descomposicion» no es copia de la planificacion. En las obras con master
      0, Estudios esta en `v_pbi_master_estudio`, con las MISMAS columnas: juntas
      son Estudios entero y cada obra esta en una sola. Para Power BI y para no
      mezclar origenes sin acordarse del filtro.

      **ESTUDIOS ES EL MASTER 0** (F-123). Donde hay version 0 del master con
      descompuesto, Estudios es MASTER_ESTUDIO, con la medicion de Estudios, y
      esta vista no tiene filas de esa obra. En las obras sin master 0, ESTUDIO
      tiene precios de Estudios pero medicion ACTUAL: su importe de Estudios es
      medicion x precio de la version 0 (`stg.presupuesto`, ambito 8, fase 0),
      no la suma de `importe_total`. Ejemplos: 0713 02.01.01.04 HORMIGON EN
      ESCALERAS (sin master 0), medicion 24,03 en la version 0 y 25,95 hoy, por
      unidad 207,20: importe de Estudios 4.979,02 frente a 5.376,84 de sumar
      lineas; 0726 04.02 FORJ. RETICULAR 35+10: sus 10 lineas, 134,35 por unidad
      y 527.564,24 a la medicion de Estudios 3.926,79, estan en
      MASTER_ESTUDIO, no aqui.
