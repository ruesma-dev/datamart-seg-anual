      unidad: {significado: 'Unidad del elemento en el descompuesto.'}
      codigo_alternativo: {significado: 'Codigo alternativo del elemento (campo 7).'}
      tipo_elemento_codigo: {significado: 'El tipo de elemento tal cual en Sigrid (campo 16).'}
      tipo_elemento: {significado: 'El tipo traducido (D8; 3 OTROS y 11 SUBCONTRATA, provisionales).'}
