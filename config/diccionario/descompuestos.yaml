# config/diccionario/descompuestos.yaml
#
# Fichas del esquema `descompuestos` (F-097, 2026-09-28): de que se compone cada
# partida —los elementos o precios simples: hormigon, acero, mano de obra...—,
# con su ORIGEN separado. Lo construyen DOS pasos de la nocturna:
# `ingest_descompuestos` trae de Sigrid el texto `obrparpre.des` (el ambito 3
# entero cada noche; el master, version a version por huella) a las dos tablas
# de estado `_des_texto` y `_versiones_cargadas`, y `build_descompuestos` lo
# trocea y publica desde ahi y desde `raw`.
#
# Las cifras estan MEDIDAS el 2026-09-27 y el 2026-09-28 en solo lectura contra
# Sigrid, ANTES del primer build: se remiden con la primera carga (T17-T18).
#
# LAS CINCO COSAS QUE HAY QUE SABER ANTES DE ESCRIBIR UNA CONSULTA AQUI
# (regla dura `R-DESCOMPUESTO-ORIGEN`):
#
# 1. **Nunca se suman ni se mezclan origenes.** Estudios es MASTER_ESTUDIO (la
#    version 0 del master) donde hay master 0 y ESTUDIO (la «Descomposicion» de
#    COSTE) solo donde no lo hay (F-123); PLANIF_JO la planificacion de compras
#    del jefe de obra (la «Planificacion compras» de COSTE, tabla `dncpro`), el
#    descompuesto de la FASE VIVA; MASTER_* es la «Descomposicion» de MASTER
#    COSTE, una copia POR VERSION. Se filtra siempre por `origen`, o se usan las
#    vistas `v_pbi_*`.
# 2. **El master tiene una copia por version**: sin filtrar `fase_num` (o
#    `es_vigente`) se cuenta cada linea tantas veces como versiones tenga la obra.
# 3. **La «Descomposicion» de COSTE se reescribe con la planificacion**: en
#    7.866 de las 42.958 partidas con descompuesto en el ambito 3 ese texto es
#    copia de su planificacion (campo 36 = `dncpro.ide`). Esas NO se publican
#    como ESTUDIO: el cuadre las marca SUSTITUIDO_POR_PLANIFICACION. Es una de
#    las razones de F-123: donde hay master 0, Estudios es MASTER_ESTUDIO.
# 4. **La primera carga del master se hizo el 2026-09-29** (3.025 versiones).
#    Si una version esta cargada lo dice `_versiones_cargadas`; la nocturna
#    relee cada noche las nuevas, la vigente de cada obra y las cambiadas.
# 5. **Los tipos 3 (OTROS) y 11 (SUBCONTRATA) son PROVISIONALES** (D8): la
#    traduccion esta sin validar con Negocio.
# 6. **El FACTOR** (F-120): `importe_unitario` = factor x rendimiento x precio;
#    `factor` vale 1 en las lineas sin factor y `cantidad_total` ya lo lleva.
# 7. **Estudios es el master 0** (F-123): MASTER_ESTUDIO en las obras con
#    version 0 del master con descompuesto, con la medicion de Estudios; en las
#    obras sin master 0, ESTUDIO, con precios de Estudios pero medicion ACTUAL
#    (su importe de Estudios es medicion x precio de la version 0, no la suma de
#    `importe_total`). Estudios entero: `v_pbi_master_estudio` + `v_pbi_estudio`.

version: 1
esquema: descompuestos

objetos:

  lineas:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **UNA FILA POR LINEA DEL DESCOMPUESTO DE CADA PARTIDA, CON SU ORIGEN**
      (F-097). Cinco origenes, que son tres pestanas de Sigrid y NO se mezclan
      (`R-DESCOMPUESTO-ORIGEN`): ESTUDIO (la «Descomposicion» del ambito 3 fase
      0, la FASE VIVA, SOLO en las obras sin master 0 y solo de las partidas sin
      ningun registro enlazado a la planificacion: Estudios donde no hay master
      0, ~11.800 lineas en 44 obras previstas), PLANIF_JO (la «Planificacion
      compras», el descompuesto de la fase viva: las lineas de `dncpro` de la
      necesidad de la obra, ~289.000, con proveedor recomendado, contrato y
      linea adjudicados y fecha maxima; su `precio` es el ADJUDICADO, aviso de
      F-038) y los tres del master, una copia POR VERSION (~4,5 M lineas):
      MASTER_ESTUDIO la version 0 (170 obras el 2026-10-02, «CIERRE
      INICIAL_ESTUDIO»), que ES Estudios (F-123), MASTER_PRE_ABC las versiones
      anteriores a la primera ABC (1.665) y MASTER_PLANIF_JO desde la primera
      ABC (1.190), donde el 98,6 % de las partidas ya es la planificacion del
      jefe de obra.

      **LA PRIMERA CARGA DEL MASTER SE HIZO EL 2026-09-29** (3.025 versiones).
      Si una version esta cargada lo dice `descompuestos._versiones_cargadas`
      (una fila por obra y version); la nocturna relee cada noche las nuevas, la
      vigente de cada obra y las de huella distinta.

      **EL FACTOR** (F-120). Es el FACTOR de la pantalla de Descomposicion de
      Sigrid: un multiplicador del rendimiento de la linea. En el texto de
      Sigrid el campo del rendimiento viene como `factor x rendimiento`
      (`1.22x0.003`) cuando la linea tiene factor y como un numero cuando no. Se
      publica separado: `factor` (1 si la linea no tiene) y `rendimiento`
      limpio, e `importe_unitario` = factor x rendimiento x precio;
      `cantidad_total` ya lleva el factor. En PLANIF_JO el factor sale de
      `dncpro.faccan` (cuando `dncpro.factip` = 1). EJEMPLO: 0713, partida
      400854, version 6, «DESPLAZAMIENTO BOMBA DE 62 MT»: 1,22 x 0,003 x 339,39 =
      1,24 EUR/m2, y las 19 lineas de la partida suman 249,41 = su precio. Las
      ~95.000 lineas con el campo del rendimiento VACIO y precio siguen sin
      rendimiento ni importe unitario: es otra causa (F-122).

      **ESTUDIOS ES EL MASTER 0** (F-123). En las obras con version 0 del
      master con descompuesto (170 el 2026-10-02), Estudios es MASTER_ESTUDIO,
      con la medicion de Estudios, y no se publica ESTUDIO: alli ESTUDIO
      repetia las lineas de la version 0 en el 99,5 % de las partidas que
      tenian las dos (medido el 2026-10-02). En las obras sin master 0 (44, la
      0713 entre ellas) Estudios es ESTUDIO, con precios de Estudios pero
      medicion ACTUAL: su importe de Estudios es medicion x precio de la version
      0 (`stg.presupuesto`, ambito 8, fase 0), no la suma de `importe_total`.
      Ejemplos: 0713 02.01.01.04 HORMIGON EN ESCALERAS (sin master 0), medicion
      24,03 en la version 0 y 25,95 hoy, por unidad 207,20: importe de Estudios
      4.979,02 frente a 5.376,84 de sumar lineas ESTUDIO; 0726 04.02 FORJ.
      RETICULAR 35+10, 10 lineas MASTER_ESTUDIO que suman 134,35 por unidad =
      precio de la version 0, a la medicion de Estudios 3.926,79: 527.564,24, y
      ninguna ESTUDIO.

      **LOS TIPOS 3 (OTROS) Y 11 (SUBCONTRATA) SON PROVISIONALES** (D8): la
      traduccion del campo 16 esta sin validar con Negocio.

      **EJEMPLO**: la partida 04.02 «FORJ. RETICULAR 35+10» de la 0726
      (`partida_id` 419079, la D05DF210 de Juan) tiene 10 lineas MASTER_ESTUDIO
      (version 0) cuya suma de `importe_unitario` es 134,35 = su precio; las
      mismas 10 en MASTER_PRE_ABC (version 1); ninguna ESTUDIO (la obra tiene
      master 0) y ninguna en PLANIF_JO: el jefe de obra aun no la ha
      planificado.

      Las 227 filas de Sigrid con `obride = 0` (version 26) se conservan con
      `obra_id` 0: no son de ninguna obra y el cuadre las deja fuera. Un `|`
      dentro del texto largo de un registro desplaza sus campos: queda a la
      vista como linea sin rendimiento ni importe.
    grano: >-
      Una fila por linea de descompuesto: (origen, obra_id, partida_id,
      ambito_id, fase_num, orden). En el master `fase_num` es la VERSION, asi
      que la misma linea existe una vez por version de la obra.
    clave_negocio: [origen, obra_id, partida_id, ambito_id, fase_num, orden]
    paso_etl: build_descompuestos
    refresco: nocturno
    columnas:
      origen:
        significado: >-
          De donde sale la linea. Nunca se suman origenes distintos
          (`R-DESCOMPUESTO-ORIGEN`). Estudios es MASTER_ESTUDIO en las obras
          con master 0 y ESTUDIO en las demas: una obra nunca tiene los dos.
        valores: [ESTUDIO, PLANIF_JO, MASTER_ESTUDIO, MASTER_PRE_ABC, MASTER_PLANIF_JO]
      obra_id:
        significado: >-
          La obra, con el mismo identificador que `maestro.obras.obra_id`. 0 en
          las 227 filas huerfanas de la version 26 del master.
        agregacion: no_sumable
      partida_id:
        significado: >-
          La partida (`obrparpar.ide`), la de `stg.partidas.partida_id`. Se
          identifica por aqui y no por codigo: el codigo se repite (F-109).
        agregacion: no_sumable
      presupuesto_id:
        significado: >-
          La fila de `obrparpre` de la que sale el descompuesto (partida x
          ambito x fase).
        agregacion: no_sumable
        nulo_significa: Linea de PLANIF_JO, que no sale de `obrparpre` sino de `dncpro`.
      ambito_id:
        significado: >-
          El ambito de Sigrid: 3 (COSTE) en ESTUDIO y PLANIF_JO, 8 (MASTER
          COSTE) en los MASTER_*.
        valores: [3, 8]
        agregacion: no_sumable
      fase_num:
        significado: >-
          La fase: 0 en el ambito 3; en el master, la VERSION. Filtrar por ella
          (o por `es_vigente`) es obligatorio al sumar master.
        agregacion: no_sumable
      orden:
        significado: >-
          Posicion de la linea dentro del descompuesto, desde 1: el orden del
          texto en ESTUDIO y master, y `pos, ide` de `dncpro` en PLANIF_JO.
        agregacion: no_sumable
      codigo_elemento:
        significado: >-
          Codigo del elemento (campo 1). En Estudios es LIBRE por obra; en la
          planificacion es el codigo del producto de compras.
        nulo_significa: El registro no trae codigo.
      descripcion:
        significado: Descripcion del elemento (campo 2; `dncpro.res` en PLANIF_JO).
      unidad:
        significado: Unidad del elemento (campo 5; `dncpro.unimed`).
      codigo_alternativo:
        significado: >-
          Codigo alternativo (campo 7), que en las lineas sincronizadas con la
          planificacion es `dncpro.cod2`: el codigo de la partida.
      tipo_elemento_codigo:
        significado: El tipo de elemento tal cual lo guarda Sigrid (campo 16).
        nulo_significa: >-
          Sin tipo: es lo normal en las lineas copiadas de la planificacion y en
          todas las de PLANIF_JO, que se clasifican por naturaleza.
      tipo_elemento:
        significado: >-
          El tipo traducido (D8): 8 MANO_OBRA, 9 MAQUINARIA, 10 MATERIAL, 4
          PORCENTAJE, 13 MEDIOS_AUXILIARES y, PROVISIONALES sin validar con
          Negocio, 3 OTROS y 11 SUBCONTRATA. Vacio SIN_TIPO; cualquier otro,
          DESCONOCIDO.
        valores: [MANO_OBRA, MAQUINARIA, MATERIAL, SUBCONTRATA, OTROS, PORCENTAJE, MEDIOS_AUXILIARES, SIN_TIPO, DESCONOCIDO]
      naturaleza_codigo:
        significado: >-
          Codigo de la naturaleza del elemento (campo 11; en PLANIF_JO,
          `auxpronat.cod` de `dncpro.natide`).
      naturaleza:
        significado: >-
          Nombre de la naturaleza (campo 17; en PLANIF_JO, `auxpronat.res`):
          'HORMIGONES Y MORTEROS PREPARADOS EN CENTRAL', 'CARPINTERIA DE MADERA'.
      rendimiento:
        significado: >-
          Cantidad del elemento por UNIDAD de partida, sin el factor (el campo 14
          partido, F-120; `dncpro.canren` en PLANIF_JO). En los porcentajes es el
          tanto por uno (0.02 = 2 %).
        agregacion: no_sumable
        nulo_significa: >-
          El campo 14 esta vacio (las ~95.000 lineas de F-122), no es un numero
          ni la forma factor, o es `a x` sin rendimiento.
      precio:
        significado: >-
          Precio del elemento (campo 3). En PLANIF_JO es `dncpro.pre`, el precio
          ADJUDICADO (F-038). En los porcentajes es la BASE.
        unidad: EUR
        agregacion: no_sumable
      importe_unitario:
        significado: >-
          `ROUND(factor x rendimiento x precio, 2)` (F-120): lo que aporta el
          elemento a UNA unidad de partida. Sumado dentro de (origen, partida,
          ambito, fase) es el precio por descompuesto que compara
          `cuadre_partida`. NULL si falta el factor, el rendimiento o el precio.
        unidad: EUR
        agregacion: suma
      cantidad_total:
        significado: >-
          Cantidad total del elemento para la medicion de la partida (campo 4;
          `dncpro.can`): ya lleva el factor (1091,5 x 1,00021 x 1 = 1091,729).
          Mezcla unidades: no se suma entre elementos. En ESTUDIO sigue la
          medicion ACTUAL, no la de Estudios.
        agregacion: no_sumable
      importe_total:
        significado: '`ROUND(cantidad_total x precio, 2)`: el importe del elemento para toda la medicion, sin volver a aplicar el factor (la cantidad ya lo lleva). En ESTUDIO, a la medicion ACTUAL.'
        unidad: EUR
        agregacion: suma
      es_porcentaje:
        significado: TRUE en los tipos 4 y 13, cuyo precio es una base y su rendimiento un tanto por uno.
      porcentaje:
        significado: 'El porcentaje en tanto por cien (`rendimiento x 100`, sin el factor; el importe si lo lleva): 2 = 2 %.'
        agregacion: no_sumable
        nulo_significa: La linea no es un porcentaje.
      base_porcentaje:
        significado: La base sobre la que se aplica el porcentaje (el `precio` de la linea).
        unidad: EUR
        agregacion: no_sumable
        nulo_significa: La linea no es un porcentaje.
      dncpro_id:
        significado: >-
          La linea de necesidad de compra (`dncpro.ide`): en PLANIF_JO la propia
          linea; en el master, el enlace del campo 36. Es la llave hacia el
          comparativo y el contrato (F-038).
        agregacion: no_sumable
        nulo_significa: La linea no viene de la planificacion (siempre en ESTUDIO).
      producto_id:
        significado: >-
          El producto de compras (`pro.ide`) de la linea de necesidad enlazada.
          F-092 le pondra nombre.
        agregacion: no_sumable
        nulo_significa: Sin enlace a la planificacion, o la linea de necesidad no lleva producto.
      proveedor_recomendado_id:
        significado: Proveedor recomendado de la linea de planificacion (`dncpro.entide`). Solo PLANIF_JO.
        agregacion: no_sumable
        nulo_significa: Sin proveedor recomendado, o la linea no es de PLANIF_JO.
      contrato_id:
        significado: Contrato adjudicado (`dncpro.adjctride`). Solo PLANIF_JO.
        agregacion: no_sumable
        nulo_significa: Sin adjudicar, o la linea no es de PLANIF_JO.
      contrato_linea_id:
        significado: Linea del contrato adjudicado (`dncpro.adjctrlin`, una `ctrpro.ide`). Solo PLANIF_JO.
        agregacion: no_sumable
        nulo_significa: Sin adjudicar, o la linea no es de PLANIF_JO.
      fecha_maxima:
        significado: >-
          Fecha maxima de la linea de planificacion (`dncpro.fec`). Informada en
          5 lineas: el mes previsto de compra no existe en la practica (D10).
        nulo_significa: Sin fecha, casi siempre.
      grupo_planificacion_id:
        significado: Grupo de planificacion de compra (`dncpro.gpcide`). Solo PLANIF_JO.
        agregacion: no_sumable
      nivel:
        significado: >-
          Nivel de la linea en la planificacion (`dncpro.niv`). Se publica tal
          cual: no hay partidas auxiliares anidadas en el dato (D6).
        agregacion: no_sumable
      es_nivel_padre:
        significado: La linea de planificacion es un nivel padre (`dncpro.nivpad`). Solo PLANIF_JO.
      es_version_inicial:
        significado: TRUE en la version 0 del master. Solo MASTER_*.
      es_primera_abc:
        significado: >-
          TRUE en la primera version cuyo texto contiene «ABC» (la regla de
          mart), desde la que el origen es MASTER_PLANIF_JO. Solo MASTER_*.
      es_vigente:
        significado: >-
          TRUE en la version vigente del master de la obra (`conext`, cod de
          `business_rules.yaml`). Se recalcula cada noche. Solo MASTER_*.
      es_ultima:
        significado: TRUE en la mayor version del master de la obra. Solo MASTER_*.
      tipo_version:
        significado: >-
          El tipo de la version por su texto, con la regla de
          `mart.v_master_versiones_tipadas`. Solo MASTER_*.
        valores: [ABC, Planif Inicial, Cuatrimestral, Cierre mensual, Sin clasificar]
      texto_version:
        significado: >-
          El texto de la version (`obrfasamb.tex`), por ejemplo 'CIERRE
          DICIEMBRE-25/ ABC'. Solo MASTER_*.
      factor:
        significado: >-
          El FACTOR de la linea en la pantalla de Descomposicion de Sigrid
          (F-120): multiplica al rendimiento. Viene en el campo 14 como `factor x
          rendimiento` (`1.22x0.003`); vale 1 si la linea no tiene factor.
          `importe_unitario` = factor x rendimiento x precio. En PLANIF_JO es
          `dncpro.faccan` cuando `dncpro.factip` = 1 (1 si es 0). Puede ser 0
          (importe 0) o negativo. Va la ultima columna (D8).
        agregacion: no_sumable
        nulo_significa: >-
          Sin campo 14 (vacio) o con una forma rara, un `dncpro.factip` que no es
          0 ni 1, o una version del master aun no retroceada con F-120.
    relaciones:
      - de: obra_id
        a: maestro.obras.obra_id
        cardinalidad: "N:1"
        porque: La ficha de la obra del descompuesto.
      - de: partida_id
        a: stg.partidas.partida_id
        cardinalidad: "N:1"
        porque: La partida en su arbol de capitulos, con su codigo y su ruta.
    ejemplos_preguntas:
      - De que se compone la partida 04.02 forjado reticular de la 0726
      - Compara el descompuesto de Estudios con la planificacion del jefe de obra en la partida X
      - Que lineas del master vigente de la obra X son mano de obra

  cuadre_partida:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **EL CUADRE DESCOMPUESTO-PRECIO DE CADA PARTIDA** (F-097): una fila por
      (origen, partida hoja con precio distinto de 0, ambito, fase), con la
      suma de `importe_unitario` de sus lineas frente al precio de la partida
      (`obrparpre.pre` redondeado a 2) y su estado: CUADRA (diferencia de 0,01
      o menos), NO_CUADRA, SIN_DESCOMPUESTO o SUSTITUIDO_POR_PLANIFICACION (solo
      ESTUDIO: su «Descomposicion» es copia de la planificacion). Las del
      ambito 3 salen como PLANIF_JO y, SOLO en las obras sin master 0 (F-123),
      tambien como ESTUDIO: donde hay master 0, el cuadre de Estudios es el de
      MASTER_ESTUDIO (version 0). «No existe» no tiene estado propio: una
      partida sin descompuesto de Estudios sale SIN_DESCOMPUESTO en su origen de
      Estudios (MASTER_ESTUDIO o ESTUDIO); con PLANIF_JO tambien en
      SIN_DESCOMPUESTO, es un tanto alzado. En F-097 (2026-09-27, antes de
      F-123) cuadraban el 76,8 % de las PLANIF_JO con precio (71.643 de 93.320);
      el master 0 cuadra en 34.174 de 34.849 partidas (2026-10-02). Ejemplo: la
      03.05.02 de la 0695 (`partida_id` 377070), PLANIF_JO CUADRA en 177,95.
      Desde F-120 la suma
      lleva el FACTOR de cada linea (antes las lineas con factor no tenian
      importe unitario y su partida salia NO_CUADRA sin serlo): la 400854 de la
      0713, version 6, CUADRA en 249,41.

      **LA PRIMERA CARGA DEL MASTER SE HIZO EL 2026-09-29**: hay filas del
      master para cada version cargada, y cuales lo estan lo dice
      `descompuestos._versiones_cargadas`.

      **ESTUDIOS ES EL MASTER 0** (F-123). En las obras con version 0 del
      master con descompuesto, Estudios es MASTER_ESTUDIO, con la medicion de
      Estudios. En las obras sin master 0 es ESTUDIO, que compara bien por
      unidad pero tiene medicion ACTUAL: su importe de Estudios es medicion x
      precio de la version 0, no la suma de `importe_total`. Ejemplos: 0713
      02.01.01.04 HORMIGON EN ESCALERAS (sin master 0), por unidad 207,20:
      importe de Estudios 4.979,02 frente a 5.376,84 de sumar lineas ESTUDIO;
      0726 04.02 FORJ. RETICULAR 35+10, MASTER_ESTUDIO CUADRA en 134,35 = precio
      de la version 0, a la medicion de Estudios 3.926,79: 527.564,24, y sin
      fila ESTUDIO.
    grano: >-
      Una fila por (origen, partida_id, ambito_id, fase_num) de cada partida
      hoja con precio: en el ambito 3, PLANIF_JO siempre y ESTUDIO solo en las
      obras sin master 0; en el master, una por partida y version.
    clave_negocio: [origen, partida_id, ambito_id, fase_num]
    paso_etl: build_descompuestos
    refresco: nocturno
    columnas:
      origen:
        significado: El origen de las lineas que se suman. Nunca se comparan filas de origenes distintos como si fueran la misma cosa. Estudios es MASTER_ESTUDIO (obras con master 0) o ESTUDIO (obras sin master 0).
        valores: [ESTUDIO, PLANIF_JO, MASTER_ESTUDIO, MASTER_PRE_ABC, MASTER_PLANIF_JO]
      obra_id:
        significado: La obra, la de `maestro.obras.obra_id`.
        agregacion: no_sumable
      partida_id:
        significado: La partida hoja (sin hijos en `obrparpar`), la de `stg.partidas.partida_id`.
        agregacion: no_sumable
      ambito_id:
        significado: 3 (COSTE) en ESTUDIO y PLANIF_JO, 8 (MASTER COSTE) en los MASTER_*.
        valores: [3, 8]
        agregacion: no_sumable
      fase_num:
        significado: La fase; en el master, la VERSION.
        agregacion: no_sumable
      presupuesto_id:
        significado: La fila de `obrparpre` de la partida en ese ambito y fase.
        agregacion: no_sumable
      precio_partida:
        significado: El precio de la partida en Sigrid (`obrparpre.pre`), redondeado a 2 decimales como lo muestra Sigrid.
        unidad: EUR
        agregacion: no_sumable
      suma_descompuesto:
        significado: La suma de `importe_unitario` de las lineas de ese origen para la partida (0 si no hay).
        unidad: EUR
        agregacion: no_sumable
      diferencia:
        significado: '`precio_partida - suma_descompuesto`: positiva si el descompuesto no llega al precio.'
        unidad: EUR
        agregacion: no_sumable
      num_lineas:
        significado: Cuantas lineas de ese origen tiene la partida en ese ambito y fase.
        agregacion: no_sumable
      estado:
        significado: >-
          CUADRA si la diferencia es de 0,01 o menos; NO_CUADRA si no;
          SIN_DESCOMPUESTO si no hay lineas; SUSTITUIDO_POR_PLANIFICACION (solo
          ESTUDIO) si la «Descomposicion» es copia de la planificacion.
