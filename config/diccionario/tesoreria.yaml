# config/diccionario/tesoreria.yaml
#
# Fichas del esquema `tesoreria` (F-037, fase 1, 2026-10-13): la CARTERA de
# cobros y pagos tal cual la tiene Sigrid -una fila por efecto de `raw.pag` y
# `raw.cob`-, SIN los pagos de personal (nominas, embargos, cuotas), que viven
# en `tesoreria_restringida` y solo lee el perfil total del MCP (decision del
# humano del 2026-10-13: «los pagos de nominas deben quedar restringidos»).
#
# Lo construye `build_tesoreria` cada noche, DELANTE de `build_compras`: la
# tabla `compras.vencimientos` de F-080 es desde F-037 una vista de
# `tesoreria.efectos`.
#
# Las cifras son de la nocturna del 2026-10-13, leidas en solo lectura; aqui
# solo hay recuentos y agregados, ni nombres ni importes de nadie.
#
# F-140 (2026-10-25) anade los INGREDIENTES de la proyeccion de caja: lo
# pactado (`plazos_forma_pago`, `condiciones_contrato_compra`,
# `condiciones_contrato_cliente`), el devengo pendiente descontado por partida
# (`devengo_pendiente_partida`, `devengo_pendiente_obra_mes`,
# `devengo_corte_obra`) y las hipotesis para pasarlo a caja (`hipotesis_caja`,
# `hipotesis_caja_manual`, `hipotesis_caja_obra`). No hay caja proyectada: la
# hace quien consulta, declarando las hipotesis (`R-CAJA-HIPOTESIS`). Y la
# obra de los pagos sin centro sale de su factura (`obra_via`, D10-A).

version: 1
esquema: tesoreria

objetos:

  efectos:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **No disponible para el perfil restringido** (F-141, `R-PERFILES`):
      con su login la consulta devuelve «permission denied», y eso no se rodea:
      responde que el perfil no lo incluye.

      **LA CARTERA DE COBROS Y PAGOS** (F-037, fase 1): una fila por EFECTO de
      Sigrid -cada pago a proveedor o acreedor (`raw.pag`, sentido `PAGO`) y
      cada cobro de cliente (`raw.cob`, sentido `COBRO`)-, con su tercero, su
      vencimiento, su fecha real, su importe, su medio de pago, su estado y, si
      lo tiene, la obra de su centro de coste. Es lo que responde «que pagos
      vencen este mes», «que nos deben los clientes» y es el ingrediente de un
      flujo de caja. 219.899 pagos y 21.914 cobros el 2026-10-13 (241.813).

      **NO ESTAN LOS PAGOS DE PERSONAL** (`R-PERFILES`): 37.053
      pagos de nomina, embargo y cuota (naturaleza informada, cuenta de
      personal, tercero empleado o documento de nomina) viven solo en
      `tesoreria_restringida.efectos`. Cuantos faltan, por empresa y mes, lo
      dice `tesoreria.efectos_restringidos_mes` (solo recuentos). Todos los
      previstos de personal estan vencidos: la cartera FUTURA no pierde nada.

      **EL ESTADO MANDA, Y BAJA NO SE SUMA NUNCA** (`R-TESORERIA-ESTADO`):
      `estado_tesoreria` es BAJA (efecto dividido, agrupado o anulado: 78.672
      pagos y 8.548 cobros, 35 %), REALIZADO o PREVISTO. Sumar sin filtrar el
      estado cuenta el mismo dinero hasta tres veces. **`fecha_real` vacia NO
      es pendiente**: desde 2020 el pago por remesa queda Pagado (estado 10)
      sin fecha real (41.884 pagos y 2.106 cobros). La cartera de un flujo de
      caja es `estado_tesoreria = 'PREVISTO' AND NOT previsto_antiguo`.

      **EL PREVISTO ANTIGUO** (`previsto_antiguo`): PREVISTO vencido hace mas
      de 2 anos (2.361 pagos, 3,9 M EUR, y 398 cobros, 2,2 M EUR). Es deuda sin
      puntear en Sigrid que la contabilidad ya no sostiene, no caja: en 223
      cuentas de proveedor el saldo cuadra al centimo SOLO si se quita.

      **CONTRASTE CON LA CONTABILIDAD (2026-10-13), Y SU PORQUE.** PAGO
      previsto 80,1 M EUR frente al saldo del grupo 40+41 de
      `contabilidad.mayor`, 78,8 M EUR: no es un cuadre, son dos errores que se
      compensan: (+) 3,9 M EUR de previsto antiguo que la contabilidad no
      sostiene y (-) saldo sin efecto (anticipos 407, 415, 419 y facturas aun
      sin efecto). Sin el antiguo, 76,2 frente a 78,8. Cuenta a cuenta no se
      puede cuadrar: al emitir un pagare la deuda pasa de 400/410 a 401/411 y
      el efecto conserva su cuenta de origen; el contraste honrado es el del
      grupo 40+41 entero. COBRO previsto 40,2 M EUR frente al saldo del grupo
      43, 47,5 M EUR: las 433 y 434 (empresas del grupo y asociadas) suman
      12,0 M EUR de saldo y solo 1,1 de efectos, porque se facturan sin efecto
      de cobro; y en sentido contrario, 2,2 M EUR de previsto antiguo.

      **LOS COBROS ESTAN FLOJOS** (sin F-040): 21.914 efectos sin documento de
      venta (las ventas no se ingieren), sin CIF del cliente y con la remesa
      solo por su codigo. DUDA DECLARADA: los cobros de BAJA con retencion
      (19,9 M EUR) podrian no ser fantasma (F-094 vio 13,8 M EUR de retencion
      de cliente en la contabilidad); no se ha resuelto.

      **ES CAJA Y CARTERA, NO DEVENGO** (`R-CAJA-HIPOTESIS`). Lo que la
      obra aun no ha facturado no esta aqui: el devengo pendiente de cada obra
      esta en `tesoreria.devengo_corte_obra` (F-140), y su frontera con esta
      cartera, en sus columnas `cartera_viva` y `cartera_emitida_tras_cierre`,
      para no contar dos veces lo ya emitido. Pasar devengo a caja lo hace
      quien consulta declarando las hipotesis (`tesoreria.hipotesis_caja_obra`).
      La obra sale del centro de coste del efecto y, en los pagos sin centro,
      de su factura (F-140; `obra_via`).
    grano: >-
      Una fila por efecto, identificada por `efecto_id` (el `ide` de `raw.pag`
      o de `raw.cob`, unico entre los dos: es un `con.ide`). Clave primaria
      declarada. Una factura tiene varios efectos, asi que contar filas no
      cuenta facturas.
    clave_negocio: [efecto_id]
    paso_etl: build_tesoreria
    refresco: nocturno
    columnas:
      efecto_id:
        significado: >-
          Identificador del efecto en Sigrid (`pag.ide` o `cob.ide`). Es tambien
          el `ide` de su fila en `raw.con`: el efecto ES un documento.
        agregacion: no_sumable
      sentido:
        significado: >-
          PAGO (sale dinero: `raw.pag`, efecto de tipo 25) o COBRO (entra:
          `raw.cob`, tipo 24).
        valores: [PAGO, COBRO]
      empresa_id:
        significado: Empresa del efecto (`con.emp` de su propia ficha). Nunca vacia.
        agregacion: no_sumable
      codigo_efecto:
        significado: >-
          Codigo del efecto tal como lo ensena Sigrid (`FR26/06051_01`), literal
          de `con.cod`: el sufijo viene almacenado, no se compone.
      descripcion_efecto:
        significado: Descripcion del efecto en Sigrid (`con.res`), texto libre del ERP.
      serie_efecto:
        significado: >-
          Prefijo alfabetico del codigo del efecto (`tesoreria.fn_serie`, la
          misma logica que `compras.fn_serie`): FR el inicial, DIV una division,
          AGR una agrupacion al remesar. Dice POR QUE existe el efecto.
      documento_id:
        significado: >-
          Documento del que nace el efecto (`conide`): la factura de compra en
          la mayoria de pagos, el documento de venta en los cobros.
        agregacion: no_sumable
        nulo_significa: >-
          El efecto no cuelga de ningun documento (23.897 pagos y 1.493 cobros:
          pagos y cobros sueltos).
      codigo_documento:
        significado: Codigo del documento origen tal como se ve en Sigrid (`FR25/04222`).
        nulo_significa: El efecto no cuelga de ningun documento.
      tipo_documento:
        significado: >-
          Tipo de Sigrid (`con.tip`) del documento origen: 15 factura de compra,
          11 documento de venta, 306 nomina (este no aparece en la general).
        agregacion: no_sumable
        nulo_significa: El efecto no cuelga de ningun documento.
      es_factura_compra:
        significado: >-
          Cierto si el documento origen es una factura de compra (`raw.dcf`).
          Es el filtro de la vista `compras.vencimientos`. Siempre falso en COBRO.
      tercero_id:
        significado: >-
          Proveedor, acreedor o cliente del efecto (`entide`, un `con.ide`).
        agregacion: no_sumable
        nulo_significa: El efecto no tiene tercero informado.
      tercero_nombre:
        significado: Nombre del tercero (`con.res` de su ficha).
        nulo_significa: El efecto no tiene tercero informado.
      tercero_cif:
        significado: CIF del proveedor (`raw.prv`). Solo en PAGO.
        nulo_significa: >-
          COBRO (los clientes no se ingieren con su CIF hasta F-040), o el
          tercero del pago no esta en el maestro de proveedores `raw.prv`.
      fecha_emision:
        significado: Fecha de emision del efecto, ya tipada.
        agregacion: no_sumable
        nulo_significa: El efecto no tiene fecha de emision informada.
      fecha_vencimiento:
        significado: >-
          Fecha en la que vence el efecto: el eje de cualquier pregunta de
          «que vence en...» y de un flujo de caja.
        agregacion: no_sumable
        nulo_significa: El efecto no tiene vencimiento informado (57 en toda la cartera).
      fecha_real:
        significado: >-
          Fecha real de pago o cobro, cuando esta punteada. NO es el estado:
          desde 2020 el pago por remesa queda REALIZADO sin fecha real.
        agregacion: no_sumable
        nulo_significa: >-
          Sin fecha real anotada. NO quiere decir que este pendiente: mira
          `estado_tesoreria` (41.884 pagos y 2.106 cobros realizados no la
          tienen).
      importe:
        significado: >-
          Importe del efecto (`tot`), con el signo de origen (un abono es
          negativo). No se suma sin filtrar `estado_tesoreria`: la BAJA repite
          el dinero de sus hijos.
        unidad: EUR
        agregacion: suma
      importe_flujo:
        significado: >-
          El importe con el signo de la caja: +importe en COBRO, -importe en
          PAGO. Es la columna que se suma para un flujo de caja neto, siempre
          con `estado_tesoreria` filtrado.
        unidad: EUR
        agregacion: suma
      estado_tesoreria:
        significado: >-
          BAJA si el efecto esta dado de baja o sustituido (estado 14
          Agrupados, 15 Divididos); si no, REALIZADO si tiene fecha real o
          estado 10 (Pagado/Cobrado); si no, PREVISTO. BAJA gana. Igual en los
          dos sentidos (criterio de F-094).
        valores: [PREVISTO, REALIZADO, BAJA]
      estado_codigo:
        significado: Codigo del estado del efecto en Sigrid (`con.est`). 10 es Pagado/Cobrado.
        agregacion: no_sumable
      estado_sigrid:
        significado: >-
          Nombre del estado en Sigrid, leido de `raw.conest` con el tipo del
          efecto (25 en pagos, 24 en cobros): Pendiente, Aprobado, Emitido, En
          cartera, Remesado, Pagado, Devuelto, Agrupados, Divididos...
        nulo_significa: El estado no existe en el catalogo de Sigrid.
      efecto_anulado:
        significado: >-
          Cierto si el efecto tiene fecha de baja en Sigrid (`con.fecbaj`). Toda
          fila anulada es BAJA, pero hay BAJA sin anular (estados 14 y 15).
      fecha_anulacion:
        significado: Fecha de baja del efecto, ya tipada.
        agregacion: no_sumable
        nulo_significa: El efecto no esta anulado.
      medio_pago_id:
        significado: Medio de pago del efecto (`efeide`, catalogo `raw.auxefp`).
        agregacion: no_sumable
        nulo_significa: El efecto no tiene medio de pago informado.
      medio_pago:
        significado: Nombre del medio de pago (TRANSFERENCIA, PAGARE, CONFIRMING, RECIBO...).
        nulo_significa: El efecto no tiene medio de pago informado.
      naturaleza_pago_id:
        significado: >-
          Naturaleza del pago (`natide`, catalogo `raw.auxnap`). Las tres que
          existen son NOMINAS, EMBARGO y CUOTAS: por eso en esta tabla general
          esta SIEMPRE vacia.
        agregacion: no_sumable
        nulo_significa: El efecto no tiene naturaleza (todos los de esta tabla).
      naturaleza_pago:
        significado: Nombre de la naturaleza del pago; vacia en toda la general.
        nulo_significa: El efecto no tiene naturaleza (todos los de esta tabla).
      cuenta_contable_id:
        significado: Cuenta contable del efecto (`cueide`), la auxiliar del tercero.
        agregacion: no_sumable
        nulo_significa: El efecto no tiene cuenta contable informada.
      cuenta_contable:
        significado: >-
          Numero de la cuenta contable (`4100006400`), leido de `raw.con`. Es la
          cuenta de ORIGEN: un pagare emitido sigue en la 400/410 aunque la
          contabilidad ya lo tenga en la 401/411.
        nulo_significa: El efecto no tiene cuenta contable informada.
      cuenta_contable_nombre:
        significado: Nombre de la cuenta contable, de `con.res`.
        nulo_significa: El efecto no tiene cuenta contable informada.
      banco_id:
        significado: Entidad bancaria del efecto (`banban`, `ide` de `raw.auxban`).
        agregacion: no_sumable
        nulo_significa: El efecto no tiene banco informado.
      banco:
        significado: Nombre de la entidad bancaria, de `auxban.res`.
        nulo_significa: El efecto no tiene banco informado.
      sucursal_id:
        significado: Sucursal bancaria (`bansuc`, otra union al mismo catalogo `raw.auxban`).
        agregacion: no_sumable
        nulo_significa: El efecto no tiene sucursal informada.
      sucursal:
        significado: Nombre de la sucursal, de `auxban.res`.
        nulo_significa: El efecto no tiene sucursal informada.
      retencion_id:
        significado: >-
          Retencion asociada al efecto (`retide`). Las retenciones de garantia
          se consultan en el esquema `retenciones`.
        agregacion: no_sumable
        nulo_significa: El efecto no tiene retencion asociada.
      centro_coste_id:
        significado: Centro de coste del efecto (`cenide`), traducible con `maestro.centros_coste`.
        agregacion: no_sumable
        nulo_significa: El efecto no tiene centro de coste.
      obra_id:
        significado: >-
          Obra del efecto. Primero la de su centro de coste
          (`maestro.centros_coste`); un centro que NO es obra (estructura,
          delegacion) deja el efecto sin obra. Solo en los PAGOS SIN centro,
          desde F-140 (D10-A), la de su factura: la obra unica de sus
          contratos, la de su cabecera o la unica de sus lineas, en ese orden
          (`obra_via` dice cual). +113 pagos y 0,23 M EUR medidos el
          2026-10-25: el 86,95 % de los pagos no de baja tiene obra. Los
          cobros, solo por el centro.
        agregacion: no_sumable
        nulo_significa: >-
          Sin centro y sin factura que la de, o con un centro que no es obra:
          pagos sueltos, agrupaciones (`AGR`, Sigrid no guarda su vinculo),
          facturas de estructura y la nomina. No hay obra que buscar en otro
          sitio.
      codigo_obra:
        significado: Codigo de la obra del efecto (la de `obra_id`).
        nulo_significa: El efecto no tiene obra.
      nombre_obra:
        significado: Nombre de la obra del efecto (la de `obra_id`).
        nulo_significa: El efecto no tiene obra.
      remesa_id:
        significado: Remesa en la que va el efecto (`remide`).
        agregacion: no_sumable
        nulo_significa: El efecto no esta en ninguna remesa.
      codigo_remesa:
        significado: Codigo de la remesa (`RP26/0254`), leido de `raw.con`.
        nulo_significa: El efecto no esta en ninguna remesa.
      fecha_remesa:
        significado: Fecha de la remesa de pago (`rpa.fecrem`). Solo PAGO.
        agregacion: no_sumable
        nulo_significa: Sin remesa, o remesa de cobro (sus datos no se ingieren).
      importe_remesa:
        significado: >-
          Importe TOTAL de la remesa de pago, repetido en cada efecto de la
          misma remesa: no es el importe del efecto y no se suma.
        unidad: EUR
        agregacion: no_sumable
        nulo_significa: >-
          Sin remesa, remesa de cobro, o remesa que lleva algun pago de
          personal (1 el 2026-10-13): su total delataria la nomina que va dentro.
      previsto_antiguo:
        significado: >-
          Cierto si el efecto es PREVISTO y vencio hace mas de 2 anos, a la
          fecha del build. Deuda por depurar en Sigrid, no caja: un flujo de
          caja la excluye.
      obra_via:
        significado: >-
          Por donde se asigno `obra_id` (F-140, D10-A): CENTRO (su centro de
          coste), CONTRATO (la obra unica de los contratos de su factura),
          FACTURA_CABECERA (la obra de la cabecera de la factura) o
          FACTURA_LINEAS (la obra unica de sus lineas). Las tres ultimas solo
          en pagos sin centro.
        valores: [CENTRO, CONTRATO, FACTURA_CABECERA, FACTURA_LINEAS]
        nulo_significa: El efecto no tiene obra.
    relaciones:
      - de: obra_id
        a: maestro.obras.obra_id
        cardinalidad: "N:1"
        porque: La ficha de la obra del efecto (`obra_via` dice de donde sale).
      - de: centro_coste_id
        a: maestro.centros_coste.centro_coste_id
        cardinalidad: "N:1"
        porque: El centro de coste del efecto, del que sale la obra.
    ejemplos_preguntas:
      - Que pagos a proveedores vencen el mes que viene y por cuanto
      - Flujo de caja comprometido por mes de los proximos seis meses
      - Cuanto nos deben los clientes y cuando vence
      - Que efectos previstos de la obra X estan vencidos

  efectos_restringidos_mes:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **No disponible para el perfil restringido** (F-141, `R-PERFILES`):
      con su login la consulta devuelve «permission denied», y eso no se rodea:
      responde que el perfil no lo incluye.

      **CUANTO LE FALTA A LA CARTERA GENERAL** (F-037): por empresa, sentido,
      ano y mes de vencimiento y estado, cuantos efectos de PERSONAL (nominas,
      embargos, cuotas) no estan en `tesoreria.efectos` (37.053 pagos y 0
      cobros el 2026-10-13). SOLO RECUENTOS, nunca importes: el importe por
      empresa y mes seria la nomina neta mensual, que es lo que se protege.
      Sirve para decir «esta cartera no incluye N pagos de personal» en vez de
      presentar un total recortado como completo (`R-PERFILES`).
    grano: >-
      Una fila por (`empresa_id`, `sentido`, `anio`, `mes`, `estado_tesoreria`)
      con algun efecto restringido. `anio` y `mes` valen 0 si el efecto no tiene
      vencimiento; `empresa_id` 0 si no tiene empresa (hoy ninguno).
    clave_negocio: [empresa_id, sentido, anio, mes, estado_tesoreria]
    paso_etl: build_tesoreria
    refresco: nocturno
    columnas:
      empresa_id:
        significado: Empresa de los efectos restringidos (0 si no tienen empresa).
        agregacion: no_sumable
      sentido:
        significado: PAGO o COBRO (hoy solo hay pagos de personal).
        valores: [PAGO, COBRO]
      anio:
        significado: Ano de vencimiento de los efectos (0 si no tienen vencimiento).
        agregacion: no_sumable
      mes:
        significado: Mes de vencimiento, de 1 a 12 (0 si no tienen vencimiento).
        agregacion: no_sumable
      estado_tesoreria:
        significado: Estado de los efectos restringidos, con el mismo criterio que la cartera.
        valores: [PREVISTO, REALIZADO, BAJA]
      num_efectos:
        significado: Efectos de personal de ese corte que no estan en `tesoreria.efectos`.
        agregacion: suma
    relaciones: []
    ejemplos_preguntas:
      - Cuantos pagos de nomina faltan en la cartera de la empresa 1 este ano
      - Esta completa la cartera de pagos de marzo de 2026

  fn_fecha:
    tipo: funcion
    capa: operacion
    consumo_recomendado: false
    motivo_no_consumo: >-
      Funcion auxiliar del build de tesoreria, usada solo dentro del SQL que
      construye el esquema.
    descripcion: >-
      Convierte una fecha de Sigrid --un entero AAAAMMDD-- en una fecha de
      verdad, tratando el 0 como ausencia de fecha. Copia local de la de
      `compras`, para no depender de un esquema que se construye despues.
    grano: null
    clave_negocio: []
    paso_etl: build_tesoreria
    refresco: nocturno
    columnas: {}
    relaciones: []
    ejemplos_preguntas: []

  fn_serie:
    tipo: funcion
    capa: operacion
    consumo_recomendado: false
    motivo_no_consumo: >-
      Funcion auxiliar del build de tesoreria, usada solo dentro del SQL que
      construye el esquema.
    descripcion: >-
      Serie documental de un codigo de Sigrid: su prefijo alfabetico en
      mayusculas ('FR26/06051_01' da FR). Copia local de `compras.fn_serie`.
    grano: null
    clave_negocio: []
    paso_etl: build_tesoreria
    refresco: nocturno
    columnas: {}
    relaciones: []
    ejemplos_preguntas: []

  # =========================================================================
  # F-140 (2026-10-25): LOS INGREDIENTES DE LA PROYECCION DE CAJA
  # =========================================================================

  devengo_corte_obra:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **No disponible para el perfil restringido** (F-141, `R-PERFILES`):
      con su login la consulta devuelve «permission denied», y eso no se rodea:
      responde que el perfil no lo incluye.

      **EL PUNTO DE PARTIDA DE CUALQUIER PROYECCION DE CAJA DE UNA OBRA**
      (F-140): por obra y concepto (COSTE, VENTA), lo que su ULTIMA version
      master (V) todavia espera devengar despues del ultimo mes cerrado,
      DESCONTADO partida a partida lo ya ejecutado desde que V entro en vigor.
      **No es caja** (`R-CAJA-HIPOTESIS`): es devengo SIN IVA. Pasarlo a caja
      lo hace quien consulta, aplicando y DECLARANDO las hipotesis de
      `tesoreria.hipotesis_caja_obra`.

      **QUE OBRAS**: las que tienen algun mes PLANIFICADO en
      `mart.fact_seguimiento_mensual` despues de su ultimo mes REAL: 21 en
      coste y 21 en venta el 2026-10-25, todas con una sola version
      pendiente. **PENDIENTE frente a PLAN RESTANTE**: el plan restante de V
      tras el cierre es 113,98 M EUR de coste y 115,42 de venta, pero lo
      pendiente es 133,20 y 132,37, porque las obras van retrasadas: lo
      planificado y no ejecutado del intervalo (`retrasado`) sigue pendiente.
      `sobre_ejecutado` es lo ejecutado POR ENCIMA de todo el plan de V, que
      no resta de otras partidas.

      **LA FRONTERA CON LA CARTERA** (`tesoreria.efectos`, del sentido del
      concepto: COSTE es PAGO, VENTA es COBRO): `cartera_viva` es lo PREVISTO
      no antiguo (ya emitido, CON IVA) y `cartera_emitida_tras_cierre` lo
      emitido despues del cierre. Lo emitido es parte de lo devengado: sumar
      devengo pendiente y cartera viva sin pensarlo cuenta dos veces lo que
      ya se facturo despues del ultimo cierre.

      **Lee `mart.fact_seguimiento_mensual`** (los meses REAL y los
      planificados de cada obra) y se construyo despues de F-042: el duplicado
      de filas que ese build corrigio no le alcanza.
    grano: >-
      Una fila por (`obra_id`, `concepto`) con algun mes planificado
      pendiente. Clave primaria declarada.
    clave_negocio: [obra_id, concepto]
    paso_etl: build_tesoreria
    refresco: nocturno
    columnas:
      obra_id:
        significado: Obra (la de `mart.fact_seguimiento_mensual`).
        agregacion: no_sumable
      empresa_id:
        significado: Empresa de la obra (`maestro.v_obra_fichas`).
        agregacion: no_sumable
      clave_obra:
        significado: >-
          Empresa y codigo de la obra (`1-0462`): la clave con la que se dan
          valores por obra en `config/hipotesis_caja.yaml`.
      concepto:
        significado: Lado del devengo, COSTE o VENTA.
        valores: [COSTE, VENTA]
      version_master:
        significado: >-
          La version V: la del ULTIMO mes planificado pendiente en `mart`. Es
          el plan que se proyecta (`R-VERSION-MASTER`).
        agregacion: no_sumable
      tipo_master:
        significado: Tipo de la version V (`mart.master_versiones_tipadas`).
        nulo_significa: La version no esta tipada.
      mes_version:
        significado: Primer dia del mes en que V entro en vigor (`version_fec_efectiva`).
        agregacion: no_sumable
      mes_ultimo_cierre:
        significado: Ultimo mes con dato REAL del concepto en la obra.
        agregacion: no_sumable
        nulo_significa: La obra no tiene ningun mes real (aun no ha empezado).
      primer_mes_pendiente:
        significado: Primer mes planificado posterior al ultimo cierre.
        agregacion: no_sumable
      num_versiones_pendientes:
        significado: >-
          Cuantas versiones distintas planifican los meses pendientes en
          `mart` (hoy 1 en todas). Mas de una: V cambio despues del cierre.
        agregacion: no_sumable
      num_partidas:
        significado: Partidas con plan en V (las de `tesoreria.devengo_pendiente_partida`).
        agregacion: suma
      plan_desde_version:
        significado: Plan de V desde su mes de entrada en vigor. SIN IVA.
        unidad: EUR
        agregacion: suma
      plan_intervalo:
        significado: Plan de V entre su mes y el ultimo cierre, ambos incluidos.
        unidad: EUR
        agregacion: suma
      ejecutado_intervalo:
        significado: >-
          Lo REAL de esas partidas entre el mes de V y el ultimo cierre
          (`importe_mes` de las filas REAL de `mart`, sumado en el intervalo).
        unidad: EUR
        agregacion: suma
      plan_restante:
        significado: >-
          Plan de V despues del ultimo cierre: el perfil futuro.
        unidad: EUR
        agregacion: suma
      pendiente:
        significado: >-
          Suma por partida de max(0, plan desde V - ejecutado): lo que falta
          por devengar. Es el devengo que se convierte en caja. SIN IVA.
        unidad: EUR
        agregacion: suma
      sobre_ejecutado:
        significado: Suma por partida de lo ejecutado por encima de todo su plan de V.
        unidad: EUR
        agregacion: suma
      adelantado:
        significado: Suma por partida de max(0, ejecutado - plan del intervalo).
        unidad: EUR
        agregacion: suma
      retrasado:
        significado: Suma por partida de max(0, plan del intervalo - ejecutado).
        unidad: EUR
        agregacion: suma
      ejecutado_sin_plan:
        significado: >-
          Lo ejecutado en el intervalo en partidas que V no planifica: no
          tiene pendiente.
        unidad: EUR
        agregacion: suma
      retraso_sin_perfil:
        significado: >-
          Pendiente de partidas sin plan despues del cierre: V ya no lo situa
          en ningun mes y va entero al primer mes pendiente (D19-A).
        unidad: EUR
        agregacion: suma
      real_origen_corte:
        significado: Real a origen hasta el ultimo cierre (suma de `importe_mes` REAL).
        unidad: EUR
        agregacion: suma
      plan_total:
        significado: El plan entero de V, todos los meses.
        unidad: EUR
        agregacion: suma
      cartera_viva:
        significado: >-
          Efectos de `tesoreria.efectos` de la obra y del sentido del
          concepto, PREVISTOS y no antiguos: ya emitidos y por pagar o cobrar.
          CON IVA.
        unidad: EUR
        agregacion: suma
      cartera_emitida_tras_cierre:
        significado: >-
          Efectos no de baja emitidos despues del ultimo cierre: devengo que
          ya se facturo y no hay que volver a convertir. CON IVA.
        unidad: EUR
        agregacion: suma
      venta_real_origen_con_coeficientes:
        significado: >-
          Venta real a origen hasta el ultimo cierre, partida a partida por su
          coeficiente de venta; la de partidas sin ninguno, por el coeficiente
          medio de la obra (`venta_real_media_obra`). SIN IVA (F-150, H26).
        unidad: EUR
        agregacion: suma
        nulo_significa: COSTE.
      venta_real_media_obra:
        significado: >-
          La parte de `venta_real_origen_con_coeficientes` de partidas sin
          coeficiente propio, valorada con la media ponderada de la obra
          (MEDIA_OBRA). Se declara: no es el coeficiente de ninguna partida.
        unidad: EUR
        agregacion: suma
        nulo_significa: COSTE.
      facturado_origen:
        significado: >-
          Lo facturado al cliente a origen: suma de la base de sus facturas de
          venta (`raw.dvf.totbas`), rectificativas incluidas. SIN IVA.
        unidad: EUR
        agregacion: suma
        nulo_significa: COSTE.
      venta_pendiente_facturar:
        significado: >-
          El hueco de facturacion de H26, NETO POR OBRA: max(0, venta real con
          coeficientes - facturado). Ejecutado y sin facturar: tambien se cobra.
        unidad: EUR
        agregacion: suma
        nulo_significa: COSTE.
      facturado_por_delante:
        significado: >-
          max(0, facturado - venta real con coeficientes): lo facturado por
          delante de lo ejecutado. NO se cobra otra vez.
        unidad: EUR
        agregacion: suma
        nulo_significa: COSTE.
      iva_pendiente_facturar_contrato:
        significado: >-
          IVA del hueco: repartido por el peso de cada contrato en la venta
          real con coeficientes de la obra, por su IVA.
        unidad: EUR
        agregacion: suma
        nulo_significa: COSTE.
      base_pendiente_facturar_sin_iva_contrato:
        significado: >-
          La parte del hueco de contratos (o partidas sin contrato) sin IVA: la
          base sobre la que se aplica H12.
        unidad: EUR
        agregacion: suma
        nulo_significa: COSTE.
      retencion_pendiente_facturar_contrato:
        significado: >-
          Retencion del hueco: repartida por el peso de cada contrato, por su
          retencion.
        unidad: EUR
        agregacion: suma
        nulo_significa: COSTE.
      base_pendiente_facturar_sin_retencion_contrato:
        significado: >-
          La parte del hueco sin retencion de contrato: la base sobre la que se
          aplica H10.
        unidad: EUR
        agregacion: suma
        nulo_significa: COSTE.
    relaciones:
      - de: obra_id
        a: maestro.obras.obra_id
        cardinalidad: "N:1"
        porque: La ficha de la obra.
    ejemplos_preguntas:
      - Que caja necesitara la obra X los proximos seis meses
      - Cuanto le queda por facturar y por pagar a la obra X

  devengo_pendiente_obra_mes:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **No disponible para el perfil restringido** (F-141, `R-PERFILES`):
      con su login la consulta devuelve «permission denied», y eso no se rodea:
      responde que el perfil no lo incluye.

      **EL DEVENGO PENDIENTE, MES A MES** (F-140): el `pendiente` de cada
      partida repartido en proporcion a su plan de V en los meses posteriores
      al cierre, agregado por obra, mes, concepto y categoria. Es el perfil
      temporal sobre el que se aplican los plazos de cobro y pago. **No es
      caja** (`R-CAJA-HIPOTESIS`): mes de DEVENGO y SIN IVA.

      El reparto redondea al centimo y el ultimo mes de cada partida se lleva
      el resto: la suma por obra y concepto es exactamente la de
      `tesoreria.devengo_pendiente_partida` (lo comprueba el build). Lo
      pendiente de una partida SIN plan futuro va al primer mes pendiente y
      tambien a `importe_retraso_sin_perfil` (6,0 M EUR de coste y 6,1 de
      venta el 2026-10-25): es retraso que la version ya no situa, y quien
      proyecta decide donde ponerlo (hipotesis H19). `mes_pasado_sin_cierre`
      marca meses ya pasados y aun sin cerrar.

      **Lee `mart.fact_seguimiento_mensual`** (los meses REAL y los
      planificados de cada obra) y se construyo despues de F-042: el duplicado
      de filas que ese build corrigio no le alcanza.
    grano: >-
      Una fila por (`obra_id`, `anio_mes`, `concepto`, `categoria`) con plan
      restante o pendiente (474 de coste y 161 de venta el 2026-10-25).
    clave_negocio: [obra_id, anio_mes, concepto, categoria]
    paso_etl: build_tesoreria
    refresco: nocturno
    columnas:
      obra_id:
        significado: Obra cuyo devengo pendiente se mide.
        agregacion: no_sumable
      empresa_id:
        significado: Empresa de la obra.
        agregacion: no_sumable
      clave_obra:
        significado: Empresa y codigo de la obra (`1-0462`).
      anio_mes:
        significado: Mes de DEVENGO (primer dia del mes), no de cobro ni de pago.
        agregacion: no_sumable
      concepto:
        significado: Lado del devengo, COSTE o VENTA.
        valores: [COSTE, VENTA]
      categoria:
        significado: Categoria de la partida (CD, CI, CP, OTRO), la de `mart`.
        valores: [CD, CI, CP, OTRO]
      version_master:
        significado: La version V de la obra y concepto.
        agregacion: no_sumable
      mes_ultimo_cierre:
        significado: Ultimo mes con dato REAL del concepto en la obra.
        agregacion: no_sumable
        nulo_significa: La obra no tiene ningun mes real.
      importe_plan_restante:
        significado: Plan de V en ese mes (las partidas de la categoria). SIN IVA.
        unidad: EUR
        agregacion: suma
      importe_pendiente:
        significado: >-
          Pendiente repartido en ese mes: lo que se proyecta devengar. SIN IVA.
        unidad: EUR
        agregacion: suma
      importe_retraso_sin_perfil:
        significado: >-
          La parte de `importe_pendiente` que viene de partidas sin plan
          futuro (solo en el primer mes pendiente).
        unidad: EUR
        agregacion: suma
      num_partidas:
        significado: Partidas con plan o pendiente en ese mes y categoria.
        agregacion: no_sumable
      mes_pasado_sin_cierre:
        significado: Cierto si el mes es anterior al mes del build y aun no esta cerrado.
      importe_pendiente_con_coeficientes:
        significado: >-
          El pendiente con coeficientes de cada partida repartido en ese mes con
          el mismo perfil que `importe_pendiente`. SIN IVA. Lleva coeficientes:
          no se suma ni se compara con el coste ni con la venta sin ellos.
        unidad: EUR
        agregacion: suma
        nulo_significa: COSTE.
      coeficiente_venta:
        significado: >-
          Cociente `importe_pendiente_con_coeficientes / importe_pendiente`, 6
          decimales: el coeficiente medio de ese mes, solo para leer.
        agregacion: no_sumable
        nulo_significa: COSTE, o `importe_pendiente` es 0.
      importe_iva_contrato:
        significado: >-
          IVA del contrato de cada partida sobre su parte con coeficientes,
          sumado y redondeado al final. Solo partidas con IVA en su contrato.
        unidad: EUR
        agregacion: suma
        nulo_significa: COSTE.
      base_sin_iva_contrato:
        significado: >-
          Parte con coeficientes de las partidas SIN IVA en su contrato: es la
          base sobre la que se aplica H12.
        unidad: EUR
        agregacion: suma
        nulo_significa: COSTE.
      importe_retencion_contrato:
        significado: >-
          Retencion del contrato de cada partida sobre su parte con
          coeficientes (base sin IVA), sumada y redondeada al final.
        unidad: EUR
        agregacion: suma
        nulo_significa: COSTE.
      base_sin_retencion_contrato:
        significado: >-
          Parte con coeficientes de las partidas SIN retencion en su contrato:
          es la base sobre la que se aplica H10.
        unidad: EUR
        agregacion: suma
        nulo_significa: COSTE.
    relaciones:
      - de: obra_id
        a: maestro.obras.obra_id
        cardinalidad: "N:1"
        porque: La ficha de la obra.
    ejemplos_preguntas:
      - Cuanto devengara la obra X cada mes hasta que termine
      - Perfil mensual de coste pendiente de la obra X por categoria

  devengo_pendiente_partida:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **No disponible para el perfil restringido** (F-141, `R-PERFILES`):
      con su login la consulta devuelve «permission denied», y eso no se rodea:
      responde que el perfil no lo incluye.

      **EL DEVENGO PENDIENTE DE CADA PARTIDA** (F-140): por obra, partida y
      concepto con plan en la ultima version master (V), el plan desde V, el
      del intervalo hasta el ultimo cierre, lo ejecutado en ese intervalo y lo
      que falta (`pendiente`). Es el detalle de `tesoreria.devengo_corte_obra`
      y lo que explica por que lo pendiente supera al plan restante: 913
      partidas de coste y 322 de venta van sobre-ejecutadas, y las retrasadas
      arrastran su retraso. **No es caja** (`R-CAJA-HIPOTESIS`): SIN IVA.

      **Lee `mart.fact_seguimiento_mensual`** (los meses REAL y los
      planificados de cada obra) y se construyo despues de F-042: el duplicado
      de filas que ese build corrigio no le alcanza.
    grano: >-
      Una fila por (`obra_id`, `partida_id`, `concepto`) con plan en V
      (20.565 de coste y 18.997 de venta el 2026-10-25). Clave primaria
      declarada.
    clave_negocio: [obra_id, partida_id, concepto]
    paso_etl: build_tesoreria
    refresco: nocturno
    columnas:
      obra_id:
        significado: Obra cuyo devengo pendiente se mide.
        agregacion: no_sumable
      empresa_id:
        significado: Empresa de la obra.
        agregacion: no_sumable
      clave_obra:
        significado: Empresa y codigo de la obra (`1-0462`).
      partida_id:
        significado: Partida del presupuesto (la de `mart`).
        agregacion: no_sumable
      codigo_partida:
        significado: Codigo de la partida.
        nulo_significa: La partida no esta en la dimension de partidas.
      concepto:
        significado: Lado del devengo, COSTE o VENTA.
        valores: [COSTE, VENTA]
      categoria:
        significado: Categoria de la partida (CD, CI, CP, OTRO).
        valores: [CD, CI, CP, OTRO]
        nulo_significa: La partida no esta en la dimension de partidas (hoy ninguna).
      version_master:
        significado: La version V de la obra y concepto.
        agregacion: no_sumable
      tipo_master:
        significado: Tipo de la version V.
        nulo_significa: La version no esta tipada.
      mes_version:
        significado: Mes en que V entro en vigor.
        agregacion: no_sumable
      mes_ultimo_cierre:
        significado: Ultimo mes con dato REAL del concepto en la obra.
        agregacion: no_sumable
        nulo_significa: La obra no tiene ningun mes real.
      plan_desde_version:
        significado: Plan de V de la partida desde el mes de V.
        unidad: EUR
        agregacion: suma
      plan_intervalo:
        significado: Plan de V de la partida entre el mes de V y el cierre.
        unidad: EUR
        agregacion: suma
      ejecutado_intervalo:
        significado: Lo REAL de la partida entre el mes de V y el cierre.
        unidad: EUR
        agregacion: suma
      plan_restante:
        significado: Plan de V de la partida despues del cierre.
        unidad: EUR
        agregacion: suma
      pendiente:
        significado: max(0, plan desde V - ejecutado). SIN IVA.
        unidad: EUR
        agregacion: suma
      sobre_ejecutado:
        significado: max(0, ejecutado - plan desde V).
        unidad: EUR
        agregacion: suma
      contrato_cliente_id:
        significado: >-
          El contrato con el cliente de la partida (`obrparpar.ctride`), solo si
          es de la misma obra (F-150).
        agregacion: no_sumable
        nulo_significa: COSTE, o partida de venta sin contrato.
      coeficiente_venta:
        significado: >-
          El coeficiente de venta de la partida: el de su contrato si lo tiene;
          si no, el del master de V (certificacion, ambito 9; si no, venta,
          ambito 11). Nunca un coeficiente medio de obra.
        agregacion: no_sumable
        nulo_significa: COSTE.
      fuente_coeficiente:
        significado: De donde sale `coeficiente_venta`.
        valores: [CONTRATO, MASTER_CERT, MASTER_VENTA, SIN]
        nulo_significa: COSTE.
      coeficiente_master:
        significado: >-
          El coeficiente del master de V (`importe_oficial / importe`, ambito 9
          y si no 11), aunque mande el contrato: para comparar los dos.
        agregacion: no_sumable
        nulo_significa: COSTE, o la partida no tiene importe en el master.
      pendiente_con_coeficientes:
        significado: >-
          ROUND(pendiente x coeficiente_venta, 2): lo pendiente tal como se
          factura al cliente. SIN IVA. Lleva coeficientes: no se suma ni se
          compara con el coste, lo ejecutado ni la venta sin ellos.
        unidad: EUR
        agregacion: suma
        nulo_significa: COSTE.
      iva_porcentaje:
        significado: El IVA del contrato de la partida, en tanto por cien.
        unidad: "%"
        agregacion: no_sumable
        nulo_significa: COSTE, o su contrato no lo tiene (`fuente_iva` SIN).
      fuente_iva:
        significado: CONTRATO si la partida tiene IVA de su contrato; SIN si no (lo cubre H12).
        valores: [CONTRATO, SIN]
        nulo_significa: COSTE.
      retencion_porcentaje:
        significado: >-
          La retencion del contrato de la partida, en tanto por cien (la de
          `condiciones_contrato_cliente.retencion_porcentaje`).
        unidad: "%"
        agregacion: no_sumable
        nulo_significa: COSTE, o su contrato no la tiene (`fuente_retencion` SIN).
      fuente_retencion:
        significado: CONTRATO si la partida tiene retencion de su contrato; SIN si no (lo cubre H10).
        valores: [CONTRATO, SIN]
        nulo_significa: COSTE.
    relaciones:
      - de: obra_id
        a: maestro.obras.obra_id
        cardinalidad: "N:1"
        porque: La ficha de la obra.
    ejemplos_preguntas:
      - Que partidas de la obra X tienen mas coste pendiente
      - Que partidas de la obra X van por encima de su planificacion

  hipotesis_caja:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **No disponible para el perfil restringido** (F-141, `R-PERFILES`):
      con su login la consulta devuelve «permission denied», y eso no se rodea:
      responde que el perfil no lo incluye.

      **EL CATALOGO DE HIPOTESIS PARA PASAR DEVENGO A CAJA** (F-140): las 23
      hipotesis (H01-H23) que hay que fijar para convertir el devengo
      pendiente en cobros y pagos, con su valor por DEFECTO, de que dato sale
      (`fuente_defecto`) y donde esta el dato que la alimenta
      (`ingrediente`): plazos de pago y de cobro, retenciones, IVA y su
      liquidacion, certificacion, que hacer con lo retrasado... **Ninguna esta
      validada por Negocio hoy** (`validado` falso): son propuestas.
      `R-CAJA-HIPOTESIS` obliga a declararlas TODAS, con valor y nivel. Lo
      mantiene Control de Costes en `config/hipotesis_caja.yaml` y lo aprueba
      el humano (D15).
    grano: Una fila por hipotesis, identificada por `codigo` (23).
    clave_negocio: [codigo]
    paso_etl: build_tesoreria
    refresco: nocturno
    columnas:
      codigo:
        significado: Codigo de la hipotesis (H01 a H23).
      sentido:
        significado: A que lado de la caja afecta.
        valores: [PAGO, COBRO, AMBOS]
      descripcion:
        significado: Que fija la hipotesis.
      unidad:
        significado: >-
          Como se lee el valor: DIAS, MESES, PORCENTAJE, BOOLEANO, OPCION (una
          de `opciones`), MAPA_DIAS (dias por categoria) o PERFIL_MESES (F-150:
          pares [meses, porcentaje] que reparten un importe ENTERO; suman 100).
        valores: [DIAS, MESES, PORCENTAJE, BOOLEANO, OPCION, MAPA_DIAS, PERFIL_MESES]
      valor_defecto:
        significado: El valor por defecto, en JSON (un numero, un booleano, un texto o un mapa).
      opciones:
        significado: Los valores posibles de una hipotesis de unidad OPCION, en JSON.
        nulo_significa: La hipotesis no es de unidad OPCION.
      fuente_defecto:
        significado: De que dato o decision sale el valor por defecto.
      ingrediente:
        significado: El objeto del datamart donde esta el dato que la alimenta.
        nulo_significa: >-
          No hay dato que la alimente: es una decision (IVA, liquidacion...).
      validado:
        significado: Cierto si Negocio aprobo el valor por defecto. Si es falso, hay que avisarlo.
      fecha_validacion:
        significado: Fecha en que Negocio valido el valor.
        agregacion: no_sumable
        nulo_significa: No validada.
      admite_obra:
        significado: Cierto si la hipotesis admite un valor distinto por obra.
      paso_receta:
        significado: >-
          El paso de la receta en que se aplica (F-150). COEFICIENTES no tiene
          ninguna: los coeficientes son dato del contrato y del master.
        valores: [DEVENGO, DOCUMENTO, COEFICIENTES, PLAZO, RETENCION, IVA, CARTERA]
    relaciones: []
    ejemplos_preguntas:
      - Que hipotesis hay que fijar para proyectar la caja de una obra
      - Que plazo de cobro se supone por defecto y de donde sale

  hipotesis_caja_obra:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **No disponible para el perfil restringido** (F-141, `R-PERFILES`):
      con su login la consulta devuelve «permission denied», y eso no se rodea:
      responde que el perfil no lo incluye.

      **EL VALOR DE CADA HIPOTESIS EN CADA OBRA** (F-140): para cada obra con
      devengo pendiente (o con un valor manual), las 23 hipotesis del catalogo
      con el valor que toca y su NIVEL: es la lista entera que hay que
      declarar. La que no admite valor por obra (H17) va siempre por DEFECTO.
      MANUAL (el de la seccion
      `obras` del YAML) gana a SIGRID, y SIGRID al DEFECTO. SIGRID solo existe
      para H09 (plazo de cobro), H10 (retencion) y H11 (devolucion de la
      retencion), y solo cuando TODOS los contratos con el cliente de la obra
      dan el mismo valor: el 2026-10-25, 16, 16 y 4 de las 21 obras. Si el
      usuario da otro valor en la conversacion, manda el suyo, con nivel
      USUARIO (`R-CAJA-HIPOTESIS`). **Nada se aplica aqui**: es lo que hay que
      declarar.
    grano: >-
      Una fila por (`obra_id`, `codigo`): las 23 hipotesis del catalogo en
      cada obra, 483 filas de 21 obras el 2026-10-25.
    clave_negocio: [obra_id, codigo]
    paso_etl: build_tesoreria
    refresco: nocturno
    columnas:
      obra_id:
        significado: Obra a la que se aplica la hipotesis.
        agregacion: no_sumable
      empresa_id:
        significado: Empresa de la obra.
        agregacion: no_sumable
      clave_obra:
        significado: Empresa y codigo de la obra (`1-0462`).
      codigo:
        significado: Codigo de la hipotesis (de `tesoreria.hipotesis_caja`).
      valor:
        significado: El valor que toca en la obra, en JSON.
      nivel:
        significado: >-
          OBRA (dado para esta obra, por el YAML o por sus contratos) o
          DEFECTO (el del catalogo). En la conversacion existe un tercero,
          USUARIO, que manda sobre los dos.
        valores: [OBRA, DEFECTO]
      fuente:
        significado: MANUAL (el YAML), SIGRID (los contratos con el cliente) o DEFECTO.
        valores: [MANUAL, SIGRID, DEFECTO]
      motivo:
        significado: Por que la obra tiene ese valor (el del YAML o de donde se leyo).
        nulo_significa: Valor por defecto.
    relaciones:
      - de: obra_id
        a: maestro.obras.obra_id
        cardinalidad: "N:1"
        porque: La ficha de la obra.
      - de: codigo
        a: tesoreria.hipotesis_caja.codigo
        cardinalidad: "N:1"
        porque: La definicion de la hipotesis.
    ejemplos_preguntas:
      - Con que hipotesis se proyecta la caja de la obra X
      - A cuantos dias cobra la obra X segun sus contratos

  hipotesis_caja_manual:
    tipo: tabla
    capa: operacion
    consumo_recomendado: false
    motivo_no_consumo: >-
      Es la seccion `obras` del YAML tal cual, ya resuelta en
      `tesoreria.hipotesis_caja_obra`, que es la que se consulta.
    descripcion: >-
      **No disponible para el perfil restringido** (F-141, `R-PERFILES`):
      con su login la consulta devuelve «permission denied», y eso no se rodea:
      responde que el perfil no lo incluye.

      Los valores de hipotesis dados a mano por obra en la seccion `obras` de
      `config/hipotesis_caja.yaml` (F-140), validados y cargados cada noche
      por `build_tesoreria`. Vacia el 2026-10-25.
    grano: Una fila por (`clave_obra`, `codigo`).
    clave_negocio: [clave_obra, codigo]
    paso_etl: build_tesoreria
    refresco: nocturno
    columnas:
      clave_obra:
        significado: Empresa y codigo de la obra (`1-0462`), como se escribe en el YAML.
      codigo:
        significado: Codigo de la hipotesis.
      valor:
        significado: El valor dado, en JSON.
      motivo:
        significado: Por que la obra tiene ese valor.
      fecha:
        significado: Fecha en que se dio el valor.
        agregacion: no_sumable
    relaciones: []
    ejemplos_preguntas: []

  condiciones_contrato_compra:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **No disponible para el perfil restringido** (F-141, `R-PERFILES`):
      con su login la consulta devuelve «permission denied», y eso no se rodea:
      responde que el perfil no lo incluye.

      **LO PACTADO CON CADA PROVEEDOR** (F-140): por contrato de compra, la
      forma de pago con su formula LEIDA (dias de cada vencimiento y de la
      retencion), los dias fijos de pago y los meses sin pago del proveedor
      tal cual, la retencion de garantia del contrato (recargo de clase 4 o 5,
      en tanto por cien) y el importe base e IVA de su cabecera. 19.170
      contratos el 2026-10-25: 19.161 con formula reconocida, 6.358 con
      garantia, 14.657 de un proveedor con dias fijos de pago. **Es un
      ingrediente**: ningun plazo se aplica a ninguna fecha
      (`R-CAJA-HIPOTESIS`). El plazo de devolucion de la garantia NO esta en
      el contrato: es la `NR` de la formula o el fin de obra (H07).
    grano: >-
      Una fila por contrato de compra (`contrato_id`, el de
      `compras.contratos`). Sin los de un tercero empleado (hoy 0).
    clave_negocio: [contrato_id]
    paso_etl: build_tesoreria
    refresco: nocturno
    columnas:
      contrato_id:
        significado: Contrato (`ctr.ide`), el `contrato_id` de `compras.contratos`.
        agregacion: no_sumable
      codigo_contrato:
        significado: Codigo del contrato en Sigrid.
      empresa_id:
        significado: Empresa del contrato.
        agregacion: no_sumable
      obra_id:
        significado: Obra del contrato.
        agregacion: no_sumable
        nulo_significa: Contrato sin obra (10).
      codigo_obra:
        significado: Codigo de la obra.
        nulo_significa: Contrato sin obra.
      proveedor_id:
        significado: Proveedor del contrato.
        agregacion: no_sumable
        nulo_significa: Contrato sin tercero.
      proveedor_nombre:
        significado: Nombre del proveedor.
        nulo_significa: Contrato sin tercero.
      estado_id:
        significado: Codigo numerico del estado del contrato en Sigrid.
        agregacion: no_sumable
      estado:
        significado: Nombre del estado (tipo 44 de `raw.conest`).
        nulo_significa: Estado sin traducir (hoy ninguno).
      importe_base:
        significado: Importe base de la cabecera del contrato (`totbas`), SIN IVA.
        unidad: EUR
        agregacion: suma
      importe_iva:
        significado: IVA de la cabecera del contrato (`totiva`).
        unidad: EUR
        agregacion: suma
      forma_pago_id:
        significado: Forma de pago del contrato (`auxpag.ide`).
        agregacion: no_sumable
        nulo_significa: Contrato sin forma de pago (9).
      forma_pago_codigo:
        significado: Codigo de la forma de pago.
        nulo_significa: Contrato sin forma de pago.
      forma_pago:
        significado: Nombre de la forma de pago.
        nulo_significa: Contrato sin forma de pago.
      medio_pago:
        significado: Medio de pago de la forma (transferencia, pagare, confirming...).
        nulo_significa: Sin forma de pago o forma sin medio.
      plazo_formula:
        significado: La formula de plazo de Sigrid TAL CUAL (`30 60 90`, `120 450R`).
        nulo_significa: Contrato sin forma de pago.
      dias_vencimientos:
        significado: >-
          Dias de cada vencimiento, en el orden escrito (`{30,60,90}`), desde
          la fecha que fije la hipotesis (H02-H05). Vacio si no se reconoce.
        nulo_significa: Contrato sin forma de pago.
      num_vencimientos:
        significado: Cuantos vencimientos tiene la formula.
        agregacion: no_sumable
        nulo_significa: Contrato sin forma de pago.
      dias_retencion:
        significado: Dias del efecto de retencion (la `NR` de la formula).
        agregacion: no_sumable
        nulo_significa: La formula no tiene retencion, o no hay formula.
      formula_reconocida:
        significado: >-
          Cierto si la formula casa con su gramatica (numeros y como mucho un
          NR). Si no, no se interpreta: sin dias ni retencion.
        nulo_significa: Contrato sin forma de pago.
      proveedor_dias_fijos_pago:
        significado: Dias fijos de pago del proveedor tal cual (`15,30`).
        nulo_significa: El proveedor no tiene dias fijos.
      proveedor_meses_sin_pago:
        significado: Meses en que el proveedor no cobra, tal cual (`8,12`).
        nulo_significa: El proveedor no tiene meses sin pago.
      retencion_garantia_porcentaje:
        significado: Porcentaje de retencion de garantia del contrato (5 es el 5 %).
        unidad: "%"
        agregacion: no_sumable
        nulo_significa: El contrato no tiene retencion de garantia.
      retencion_garantia_concepto:
        significado: Nombre del recargo de garantia.
        nulo_significa: El contrato no tiene retencion de garantia.
      retencion_garantia_clase:
        significado: Clase del recargo (4 o 5, las de garantia).
        agregacion: no_sumable
        nulo_significa: El contrato no tiene retencion de garantia.
    relaciones:
      - de: contrato_id
        a: compras.contratos.contrato_id
        cardinalidad: "1:1"
        porque: La cabecera del contrato.
      - de: obra_id
        a: maestro.obras.obra_id
        cardinalidad: "N:1"
        porque: La ficha de la obra.
    ejemplos_preguntas:
      - Con que plazo pagamos al proveedor Y
      - Que retencion de garantia tienen los contratos de la obra X

  condiciones_contrato_cliente:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **No disponible para el perfil restringido** (F-141, `R-PERFILES`):
      con su login la consulta devuelve «permission denied», y eso no se rodea:
      responde que el perfil no lo incluye.

      **LO PACTADO CON CADA CLIENTE** (F-140): por contrato con el cliente
      (`raw.obrctr`), la forma de COBRO con su formula leida, la retencion que
      nos hace el cliente (`coegar` o, si no, el recargo del contrato), los
      plazos de retencion y de garantia y el inicio de la garantia. 970
      contratos de 450 obras el 2026-10-25: 705 con formula reconocida, 265 sin
      forma de cobro, 525 con retencion. De aqui salen los valores SIGRID de
      H09-H11 en `tesoreria.hipotesis_caja_obra`. **Es un ingrediente**:
      ningun plazo se aplica a ninguna fecha (`R-CAJA-HIPOTESIS`).
    grano: Una fila por contrato con el cliente (`contrato_cliente_id`).
    clave_negocio: [contrato_cliente_id]
    paso_etl: build_tesoreria
    refresco: nocturno
    columnas:
      contrato_cliente_id:
        significado: Contrato con el cliente (`obrctr.ide`).
        agregacion: no_sumable
      codigo_contrato:
        significado: Codigo del contrato con el cliente.
      descripcion:
        significado: Descripcion del contrato.
      empresa_id:
        significado: Empresa de la obra del contrato.
        agregacion: no_sumable
      obra_id:
        significado: Obra del contrato.
        agregacion: no_sumable
      codigo_obra:
        significado: Codigo de la obra.
      cliente_id:
        significado: Cliente del contrato.
        agregacion: no_sumable
        nulo_significa: Contrato sin cliente.
      cliente_nombre:
        significado: Nombre del cliente.
        nulo_significa: Contrato sin cliente.
      forma_cobro_id:
        significado: Forma de cobro (`auxcob.ide`).
        agregacion: no_sumable
        nulo_significa: Contrato sin forma de cobro (265).
      forma_cobro_codigo:
        significado: Codigo de la forma de cobro.
        nulo_significa: Contrato sin forma de cobro.
      forma_cobro:
        significado: Nombre de la forma de cobro.
        nulo_significa: Contrato sin forma de cobro.
      medio_cobro:
        significado: Medio de cobro (`auxefc`).
        nulo_significa: Sin forma de cobro o forma sin medio.
      plazo_formula:
        significado: La formula de plazo de Sigrid TAL CUAL.
        nulo_significa: Contrato sin forma de cobro.
      dias_vencimientos:
        significado: Dias de cada vencimiento, en el orden escrito. Vacio si no se reconoce.
        nulo_significa: Contrato sin forma de cobro.
      num_vencimientos:
        significado: Cuantos vencimientos tiene la formula.
        agregacion: no_sumable
        nulo_significa: Contrato sin forma de cobro.
      dias_retencion:
        significado: Dias del efecto de retencion (la `NR` de la formula).
        agregacion: no_sumable
        nulo_significa: La formula no tiene retencion, o no hay formula.
      formula_reconocida:
        significado: Cierto si la formula casa con su gramatica.
        nulo_significa: Contrato sin forma de cobro.
      retencion_porcentaje:
        significado: >-
          Retencion que nos hace el cliente, en tanto por cien: `coegar` y, si
          no tiene, el porcentaje del recargo del contrato.
        unidad: "%"
        agregacion: no_sumable
        nulo_significa: El contrato no tiene retencion.
      retencion_fuente:
        significado: De donde sale el porcentaje.
        valores: [COEGAR, RECARGO]
        nulo_significa: El contrato no tiene retencion.
      retencion_concepto:
        significado: Nombre del recargo de retencion del contrato.
        nulo_significa: El contrato no tiene recargo de retencion.
      plazo_retencion_meses:
        significado: Plazo de retencion del contrato, en meses (`plaret`).
        agregacion: no_sumable
        nulo_significa: Sin plazo (0 en Sigrid).
      plazo_garantia_meses:
        significado: Plazo de garantia del contrato, en meses (`plagar`).
        agregacion: no_sumable
        nulo_significa: Sin plazo (0 en Sigrid).
      fecha_inicio_garantia:
        significado: Inicio de la garantia (`fecinigar`).
        agregacion: no_sumable
        nulo_significa: Sin fecha de inicio de garantia.
      coeficientes_texto:
        significado: >-
          Los coeficientes del contrato tal cual estan en Sigrid (`coestr`): una
          linea por concepto, `CODIGO|etiqueta|valor||base` (F-150).
        nulo_significa: >-
          El contrato no tiene coeficientes en Sigrid (`coestr` vacio); sus
          partidas toman el coeficiente del master.
      coeficientes_reconocidos:
        significado: >-
          Cierto si `coeficientes_texto` se entiende entero: todos sus codigos
          conocidos y sus valores numeros. Falso si esta vacio, es nulo o trae
          algo desconocido; entonces sus partidas toman el coeficiente del
          master (F-150).
      coeficiente_gg:
        significado: >-
          Gastos generales del contrato, en puntos (`COEF_RECGG`, tambien la
          forma combinada «Gastos Generales+Beneficio Industrial»).
        unidad: "%"
        agregacion: no_sumable
        nulo_significa: No los declara, o `coestr` no se reconoce.
      coeficiente_bi:
        significado: Beneficio industrial del contrato, en puntos (`COEF_RECBI`).
        unidad: "%"
        agregacion: no_sumable
        nulo_significa: No lo declara, o `coestr` no se reconoce.
      coeficiente_otros:
        significado: >-
          Control de calidad y seguridad y salud (`COEF_RECCC`, `COEF_RECSYS`),
          sumados, en puntos.
        unidad: "%"
        agregacion: no_sumable
        nulo_significa: No los declara, o `coestr` no se reconoce.
      coeficiente_baja:
        significado: >-
          Baja de adjudicacion (`COEF_DESADJ`), en puntos y negativa. Va en
          CASCADA sobre el subtotal de contrata, no sumada a GG y BI.
        unidad: "%"
        agregacion: no_sumable
        nulo_significa: No la declara, o `coestr` no se reconoce.
      retencion_coestr:
        significado: >-
          La retencion declarada DENTRO de `coestr` (`RETN`, `RETESP`, `RETNT`),
          en tanto por cien. NO es un coeficiente: es un dato aparte de
          `retencion_porcentaje`.
        unidad: "%"
        agregacion: no_sumable
        nulo_significa: No la declara en `coestr`, o `coestr` no se reconoce.
      coeficiente_contrato:
        significado: >-
          El coeficiente de venta del contrato, a 6 decimales: (1 + (gg + bi +
          otros) / 100) x (1 + baja / 100). GG 13 y BI 6 dan 1,19; con una baja
          del 12,77 %, 1,038. Manda sobre el del master en
          `devengo_pendiente_partida`.
        agregacion: no_sumable
        nulo_significa: >-
          Sin coeficientes reconocidos (o solo una retencion): sus partidas
          toman el del master.
      iva_id:
        significado: El tipo de IVA del contrato (`ivaide`, del catalogo `raw.iva`).
        agregacion: no_sumable
        nulo_significa: El contrato no tiene tipo de IVA.
      iva_porcentaje:
        significado: >-
          El IVA del contrato en tanto por cien, 4 decimales. 0 es inversion del
          sujeto pasivo: un valor, no la falta de el.
        unidad: "%"
        agregacion: no_sumable
        nulo_significa: Sin tipo de IVA, o sin fila en el catalogo.
    relaciones:
      - de: obra_id
        a: maestro.obras.obra_id
        cardinalidad: "N:1"
        porque: La ficha de la obra.
    ejemplos_preguntas:
      - A cuantos dias nos paga el cliente de la obra X
      - Que retencion nos hace el cliente de la obra X y cuando la devuelve

