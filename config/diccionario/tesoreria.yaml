        agregacion: no_sumable
      empresa_id:
        significado: Empresa de la obra.
        agregacion: no_sumable
      clave_obra:
        significado: Empresa y codigo de la obra (`1-0462`).
      partida_id:
        significado: Partida del presupuesto (la de `mart`).
        agregacion: no_sumable
      codigo_partida:
        significado: Codigo de la partida.
        nulo_significa: La partida no esta en la dimension de partidas.
      concepto:
        significado: Lado del devengo, COSTE o VENTA.
        valores: [COSTE, VENTA]
      categoria:
        significado: Categoria de la partida (CD, CI, CP, OTRO).
        valores: [CD, CI, CP, OTRO]
        nulo_significa: La partida no esta en la dimension de partidas (hoy ninguna).
      version_master:
        significado: La version V de la obra y concepto.
        agregacion: no_sumable
      tipo_master:
        significado: Tipo de la version V.
        nulo_significa: La version no esta tipada.
      mes_version:
        significado: Mes en que V entro en vigor.
        agregacion: no_sumable
      mes_ultimo_cierre:
        significado: Ultimo mes con dato REAL del concepto en la obra.
        agregacion: no_sumable
        nulo_significa: La obra no tiene ningun mes real.
      plan_desde_version:
        significado: Plan de V de la partida desde el mes de V.
        unidad: EUR
        agregacion: suma
      plan_intervalo:
        significado: Plan de V de la partida entre el mes de V y el cierre.
        unidad: EUR
        agregacion: suma
      ejecutado_intervalo:
        significado: Lo REAL de la partida entre el mes de V y el cierre.
        unidad: EUR
        agregacion: suma
      plan_restante:
        significado: Plan de V de la partida despues del cierre.
        unidad: EUR
        agregacion: suma
      pendiente:
        significado: max(0, plan desde V - ejecutado). SIN IVA.
        unidad: EUR
        agregacion: suma
      sobre_ejecutado:
        significado: max(0, ejecutado - plan desde V).
        unidad: EUR
        agregacion: suma
      contrato_cliente_id:
        significado: >-
          El contrato con el cliente de la partida (`obrparpar.ctride`), solo si
          es de la misma obra (F-150).
        agregacion: no_sumable
        nulo_significa: COSTE, o partida de venta sin contrato.
      coeficiente_venta:
        significado: >-
          El coeficiente de venta de la partida: el de su contrato si lo tiene;
          si no, el del master de V (certificacion, ambito 9; si no, venta,
          ambito 11). Nunca un coeficiente medio de obra.
        agregacion: no_sumable
        nulo_significa: COSTE.
      fuente_coeficiente:
        significado: De donde sale `coeficiente_venta`.
        valores: [CONTRATO, MASTER_CERT, MASTER_VENTA, SIN]
        nulo_significa: COSTE.
      coeficiente_master:
        significado: >-
          El coeficiente del master de V (`importe_oficial / importe`, ambito 9
          y si no 11), aunque mande el contrato: para comparar los dos.
        agregacion: no_sumable
        nulo_significa: COSTE, o la partida no tiene importe en el master.
      pendiente_con_coeficientes:
        significado: >-
          ROUND(pendiente x coeficiente_venta, 2): lo pendiente tal como se
          factura al cliente. SIN IVA. Lleva coeficientes: no se suma ni se
          compara con el coste, lo ejecutado ni la venta sin ellos.
        unidad: EUR
        agregacion: suma
        nulo_significa: COSTE.
      iva_porcentaje:
        significado: El IVA del contrato de la partida, en tanto por cien.
        unidad: "%"
        agregacion: no_sumable
        nulo_significa: COSTE, o su contrato no lo tiene (`fuente_iva` SIN).
      fuente_iva:
        significado: CONTRATO si la partida tiene IVA de su contrato; SIN si no (lo cubre H12).
        valores: [CONTRATO, SIN]
        nulo_significa: COSTE.
      retencion_porcentaje:
        significado: >-
          La retencion del contrato de la partida, en tanto por cien (la de
          `condiciones_contrato_cliente.retencion_porcentaje`).
        unidad: "%"
        agregacion: no_sumable
        nulo_significa: COSTE, o su contrato no la tiene (`fuente_retencion` SIN).
      fuente_retencion:
        significado: CONTRATO si la partida tiene retencion de su contrato; SIN si no (lo cubre H10).
        valores: [CONTRATO, SIN]
        nulo_significa: COSTE.
      cuota_personal:
        significado: >-
          La parte de PERSONAL propio de la partida: coste de sus partes de
          recursos PERSONA internos hasta el cierre entre su real a origen, con
          tope 1 (F-150, N16). 0 si no tiene partes o real, y en CP.
        agregacion: no_sumable
        nulo_significa: VENTA.
      pendiente_personal:
        significado: >-
          `pendiente` x `cuota_personal` al centimo: se paga el ULTIMO DIA del
          mes de su devengo (regla fija, sin hipotesis).
        unidad: EUR
        agregacion: suma
        nulo_significa: VENTA.
      fuente_personal:
        significado: >-
          PARTES si la partida tiene partes de personal; SIN_PARTES si no (una
          obra sin partes no tiene cuota: dilo); CP, coste proporcional, fuera.
        valores: [PARTES, SIN_PARTES, CP]
        nulo_significa: VENTA.
    relaciones:
      - de: obra_id
        a: maestro.obras.obra_id
        cardinalidad: "N:1"
        porque: La ficha de la obra.
    ejemplos_preguntas:
      - Que partidas de la obra X tienen mas coste pendiente
      - Que partidas de la obra X van por encima de su planificacion

  devengo_pendiente_contrato_mes:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **No disponible para el perfil restringido** (F-141, `R-PERFILES`):
      con su login la consulta devuelve «permission denied», y eso no se rodea:
      responde que el perfil no lo incluye.

      **EL COSTE PENDIENTE DE LA OBRA POR CONTRATO DE COMPRA** (F-150, N17):
      por obra, mes, categoria y contrato, el devengo pendiente de COSTE SIN el
      coste proporcional (CP: no es caja de la obra) ni el PERSONAL (que se
      paga el ultimo dia del mes de su devengo: `importe_pendiente_personal`
      de `devengo_pendiente_obra_mes`). Cada partida se reparte entre los
      contratos de compra de la obra que la tienen (las lineas del contrato,
      `raw.ctrpro.paride`; ni Terminados ni Rescindidos) por lo que les queda
      por SERVIR, hasta su pendiente. Las filas con `contrato_id` se pagan con
      la forma de pago del contrato (H01, H15), los dias del proveedor (H04) y
      su retencion de garantia (H06), en
      `tesoreria.condiciones_contrato_compra`. La fila de `contrato_id`
      vacio es el RESTO, sin contrato: va con H02 de su `categoria`. Es el
      ingrediente de los pasos 4 y 5 de la receta (`tesoreria.hipotesis_caja`).
      **No es caja**: devengo SIN IVA.

      **CUANTO CUBRE**: medido el 2026-10-31 en las 21 obras de la receta, 48,9
      de 112,85 M EUR (43 %; 0686: 1,64 de 2,39). Lo que no enlaza es devengo
      sin contrato (modificados, contratos por firmar, obras sin contratos como
      la 0608 y la 0715). Lo contratado pendiente de servir que supera el
      devengo no se publica: no es devengo. Declara la parte enlazada
      (`pendiente_enlazado_contrato` de `devengo_corte_obra`).

      **Lee `mart.fact_seguimiento_mensual`** (a traves del reparto del devengo
      pendiente) y se construyo despues de F-042: el duplicado de filas que ese
      build corrigio no le alcanza.
    grano: >-
      Una fila por (`obra_id`, `anio_mes`, `categoria`, `contrato_id`) con
      importe; `contrato_id` vacio es la fila sin contrato.
    clave_negocio: [obra_id, anio_mes, categoria, contrato_id]
    paso_etl: build_tesoreria
    refresco: nocturno
    columnas:
      obra_id:
        significado: La obra del devengo.
        agregacion: no_sumable
      empresa_id:
        significado: Empresa de la obra (`R-CODIGO-POR-EMPRESA`).
        agregacion: no_sumable
      clave_obra:
        significado: La obra como empresa-codigo (1-0686).
      anio_mes:
        significado: Primer dia del mes del devengo (el reparto de `devengo_pendiente_obra_mes`).
      categoria:
        significado: >-
          Categoria de las partidas (CD, CI, OTRO); nunca CP. Sin contrato, es
          la clave de H02.
        valores: [CD, CI, OTRO]
      contrato_id:
        significado: >-
          El contrato de compra (`tesoreria.condiciones_contrato_compra`) por
          el que se paga este trozo: H01, H04 y H06 de ese contrato.
        agregacion: no_sumable
        nulo_significa: Sin contrato (el resto de la partida), que va con H02.
      importe_pendiente:
        significado: >-
          El pendiente sin CP ni personal de ese mes que va por ese contrato
          (o sin contrato), al centimo. SIN IVA. Suma por obra = la de
          `devengo_pendiente_obra_mes` sin CP ni personal.
        unidad: EUR
        agregacion: suma
      num_partidas:
        significado: Partidas que aportan a la fila.
        agregacion: no_sumable
    relaciones:
      - de: obra_id
        a: maestro.obras.obra_id
        cardinalidad: "N:1"
        porque: La ficha de la obra.
      - de: contrato_id
        a: tesoreria.condiciones_contrato_compra.contrato_id
        cardinalidad: "N:1"
        porque: La forma de pago y la retencion del contrato (H01, H06).
    ejemplos_preguntas:
      - Que parte del coste pendiente de la obra X va por contrato
      - A que proveedores pagara la obra X lo que queda por ejecutar

  albaranes_pendientes_neto:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **No disponible para el perfil restringido** (F-141, `R-PERFILES`):
      con su login la consulta devuelve «permission denied», y eso no se rodea:
      responde que el perfil no lo incluye.

      **LO QUE DE VERDAD QUEDA POR FACTURAR DE LOS ALBARANES DE UNA OBRA**
      (F-150, N11): por obra, proveedor, contrato de compra y mes del albaran,
      lo pendiente de facturar NETO por proveedor.
      `compras.v_pbi_albaranes_sin_facturar` suma solo las lineas con
      pendiente > 0, pero muchas lineas estan SOBREFACTURADAS (pendiente < 0)
      y eso ya paga otras entregas del mismo proveedor: el 2026-10-29, en las
      21 obras de la receta, 56,9 M EUR de lineas positivas y 48,2
      sobrefacturados dejan 8,76 de neto. Es el ingrediente del paso 7 de la
      receta (`tesoreria.hipotesis_caja`), con H20 y H27. **No es caja**: SIN
      IVA, y la fecha de pago la pone H20.

      **COMO SE COMPENSA (FIFO, una suposicion)**: por (obra, proveedor), lo
      sobrefacturado compensa primero las entregas MAS ANTIGUAS (orden fecha,
      linea): `importe_compensado` es lo quitado a las lineas positivas y
      `importe_pendiente_neto` = `importe_pendiente_bruto` −
      `importe_compensado`. La suma del neto de un (obra, proveedor) es
      max(0, Σ bruto − Σ sobrefacturado): el residuo sobrefacturado, Σ
      `importe_sobrefacturado` − Σ `importe_compensado`, no es caja y no se
      publica como negativo. Sin proveedor, la linea no compensa. Lo avala
      que el 93 % de las facturas son del mes del albaran: con FIFO el neto
      queda en los dos ultimos meses (7,96 de 8,76).

      **QUE ENTRA**: las lineas de albaran (serie AC) y proforma (PROF) de
      las obras de `tesoreria.devengo_corte_obra`, con el pendiente de
      `compras.albaran_lineas` y sin las lineas de importe absurdo
      (`R-ALBARAN-ABSURDO`). Se calcula desde `raw` en la misma noche.
      `tras_cierre`: el mes del albaran es posterior al ultimo cierre de la
      obra (o la obra no tiene cierre): eso ya esta en el devengo pendiente y
      no se suma otra vez (0,47 M EUR en 7 obras el 2026-10-29).
    grano: >-
      Una fila por (`obra_id`, `proveedor_id`, `contrato_id`, `mes_albaran`)
      con algo bruto o sobrefacturado; sin proveedor, sin contrato o sin
      fecha son claves validas (vacias).
    clave_negocio: [obra_id, proveedor_id, contrato_id, mes_albaran]
    paso_etl: build_tesoreria
    refresco: nocturno
    columnas:
      obra_id:
        significado: La obra de la linea del albaran.
        agregacion: no_sumable
      empresa_id:
        significado: Empresa de la obra (`R-CODIGO-POR-EMPRESA`).
        agregacion: no_sumable
      clave_obra:
        significado: La obra como empresa-codigo (1-0686).
      proveedor_id:
        significado: >-
          El proveedor del albaran. Vacio si el albaran no lo tiene: esas lineas
          no se compensan con nada.
        agregacion: no_sumable
        nulo_significa: Albaran sin proveedor.
      contrato_id:
        significado: >-
          El contrato de compra: el de la cabecera del albaran y, si no, el de
          la linea. Su forma de pago (H01, `tesoreria.condiciones_contrato_compra`)
          es la del pago; sin contrato, H02 `OTRO`.
        agregacion: no_sumable
        nulo_significa: Sin contrato de compra.
      mes_albaran:
        significado: Primer dia del mes del albaran. H20 supone la factura a fin de ese mes.
        nulo_significa: Albaran sin fecha.
      importe_pendiente_bruto:
        significado: Σ del pendiente de facturar de las lineas positivas. SIN IVA.
        unidad: EUR
        agregacion: suma
      importe_sobrefacturado:
        significado: >-
          Σ |pendiente| de las lineas negativas (facturado de mas). Compensa
          las positivas del mismo proveedor en la obra. SIN IVA.
        unidad: EUR
        agregacion: suma
      importe_compensado:
        significado: >-
          Lo que la compensacion FIFO quita a las lineas positivas de la fila.
          Entre 0 y el bruto. SIN IVA.
        unidad: EUR
        agregacion: suma
      importe_pendiente_neto:
        significado: >-
          Bruto − compensado: lo que de verdad queda por facturar. El
          ingrediente del paso 7. SIN IVA.
        unidad: EUR
        agregacion: suma
      meses_antiguedad:
        significado: >-
          Meses desde `mes_albaran` hasta el mes del build. Mas de H27 (o
          vacio) no es caja: se excluye y se declara.
        unidad: meses
        agregacion: no_sumable
        nulo_significa: Albaran sin fecha.
      tras_cierre:
        significado: >-
          Verdadero si el mes es posterior al ultimo cierre de la obra (o no hay
          cierre): ya es devengo pendiente, no se suma en el paso 7.
    relaciones:
      - de: obra_id
        a: maestro.obras.obra_id
        cardinalidad: "N:1"
        porque: La ficha de la obra.
      - de: contrato_id
        a: tesoreria.condiciones_contrato_compra.contrato_id
        cardinalidad: "N:1"
        porque: La forma de pago del contrato (H01).
    ejemplos_preguntas:
      - Cuanto queda de verdad por facturar de albaranes en la obra X
      - Cuando se pagaran los albaranes pendientes de la obra X

  saldo_partida_obra:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **No disponible para el perfil restringido** (F-141, `R-PERFILES`):
      con su login la consulta devuelve «permission denied», y eso no se rodea:
      responde que el perfil no lo incluye.

      **LA CAJA QUE LA OBRA YA MOVIO: EL SALDO DE PARTIDA** (F-150, N14): por
      obra de la receta (`tesoreria.devengo_corte_obra`), lo cobrado y lo
      pagado REALIZADO hasta `fecha_corte` (el dia del build), CON IVA (los
      efectos lo llevan), y el coste del personal de sus partes. Es el
      ingrediente del paso 0 (SALDO) de la receta (`tesoreria.hipotesis_caja`),
      con H28 (con o sin saldo) y H29 (los agrupados). **No es el saldo**: son
      sus piezas, y la cuenta la hace quien consulta declarando H28 y H29.

      **LOS PAGARES AGRUPADOS (AGR)**: Sigrid agrupa efectos de pago en un
      pagare AGR que muchas veces pierde la obra; los efectos ORIGINALES
      quedan de BAJA con `estado_codigo` 14 y conservan la suya. Con H29 =
      `ORIGINALES` (defecto) el pagado suma `agrupados_vencidos` (pagado en su
      vencimiento) y no los AGR con obra; `agrupados_pendientes` va a la
      proyeccion. Con H29 = `AGR`, `pagado_agr_con_obra` y
      `cartera_viva_agr_con_obra`. Sumar originales de BAJA rompe
      `R-TESORERIA-ESTADO` a proposito: es una hipotesis y se declara.

      **EL PERSONAL**: las nominas no estan en esta cartera; el personal va
      por el coste de sus partes (`personal_coste_partes`, sin IVA) hasta el
      ultimo cierre, y lo de despues por el devengo pendiente. El coste
      proporcional (`CP`) de lo pagado no es caja de la obra: se resta.

      **EL IVA** (N15): lo pagado lleva IVA soportado y lo cobrado repercutido
      (con inversion del sujeto pasivo, casi nada). El saldo suma el IVA NETO
      ya recuperado (soportado − repercutido) segun H30: con `MENSUAL_REDEME`
      (defecto) solo las columnas `_hasta_4m`.
    grano: Una fila por obra (`obra_id`) de `tesoreria.devengo_corte_obra` (las de la receta).
    clave_negocio: [obra_id]
    paso_etl: build_tesoreria
    refresco: nocturno
    columnas:
      obra_id:
        significado: La obra de la receta (una fila por obra).
        agregacion: no_sumable
      empresa_id:
        significado: Empresa de la obra (`R-CODIGO-POR-EMPRESA`).
        agregacion: no_sumable
      clave_obra:
        significado: La obra como empresa-codigo (1-0686).
      fecha_corte:
        significado: El dia del build. Vencido es antes de esta fecha.
      mes_ultimo_cierre:
        significado: >-
          Primer dia del mes del ultimo cierre de la obra: el personal de los
          partes se cuenta hasta el.
        nulo_significa: La obra no tiene cierre (no hay personal en el saldo).
      cobrado_realizado:
        significado: Σ de los cobros REALIZADO de la obra. CON IVA.
        unidad: EUR
        agregacion: suma
      pagado_realizado_sin_agr:
        significado: Σ de los pagos REALIZADO de la obra que no son pagares AGR. CON IVA.
        unidad: EUR
        agregacion: suma
      pagado_agr_con_obra:
        significado: >-
          Σ de los pagares AGR REALIZADO que conservan la obra. Solo con H29 =
          `AGR`. CON IVA.
        unidad: EUR
        agregacion: suma
      agrupados_vencidos:
        significado: >-
          Σ de los efectos ORIGINALES agrupados (PAGO de BAJA, estado 14) con
          vencimiento anterior a `fecha_corte`: pagados en su fecha. Solo con
          H29 = `ORIGINALES`. CON IVA.
        unidad: EUR
        agregacion: suma
      agrupados_pendientes:
        significado: >-
          Σ de los originales agrupados que vencen desde `fecha_corte`: pago
          futuro, va a la proyeccion (paso 7) con H29 = `ORIGINALES`. CON IVA.
        unidad: EUR
        agregacion: suma
      cartera_viva_agr_con_obra:
        significado: >-
          Σ de los pagares AGR PREVISTO vivos con obra: con H29 = `ORIGINALES`
          no se suman en la proyeccion (ya estan en sus originales). CON IVA.
        unidad: EUR
        agregacion: suma
      pagado_coste_proporcional:
        significado: >-
          La parte `CP` de `pagado_realizado_sin_agr` (la cuota de coste
          proporcional de su factura, como en `devengo_corte_obra`): no es caja
          de la obra y se resta. Puede ser negativa.
        unidad: EUR
        agregacion: suma
      agrupados_vencidos_coste_proporcional:
        significado: >-
          La parte `CP` de `agrupados_vencidos`: se resta solo con H29 =
          `ORIGINALES`. Puede ser negativa.
        unidad: EUR
        agregacion: suma
      personal_coste_partes:
        significado: >-
          Σ del coste de los partes (`raw.hmores.tot`) de los recursos PERSONA
          internos de la obra hasta `mes_ultimo_cierre`. SIN IVA.
        unidad: EUR
        agregacion: suma
      iva_soportado_pagado:
        significado: >-
          El IVA soportado de lo pagado (sin AGR y los originales vencidos):
          importe del efecto × cuota / total a pagar de su factura (`raw.dcf`).
          Con inversion del sujeto pasivo, 0.
        unidad: EUR
        agregacion: suma
      iva_repercutido_cobrado:
        significado: >-
          El IVA repercutido de lo cobrado: importe del efecto × cuota / total de
          su factura de venta (`raw.dvf`).
        unidad: EUR
        agregacion: suma
      iva_soportado_pagado_hasta_4t:
        significado: >-
          La parte de `iva_soportado_pagado` pagada antes del 1 de enero del ano
          de `fecha_corte`: la ya recuperada con H30 `ANUAL`.
        unidad: EUR
        agregacion: suma
      iva_repercutido_cobrado_hasta_4t:
        significado: >-
          La parte de `iva_repercutido_cobrado` cobrada antes del 1 de enero del
          ano de `fecha_corte` (H30 `ANUAL`).
        unidad: EUR
        agregacion: suma
      iva_soportado_pagado_hasta_4m:
        significado: >-
          La parte de `iva_soportado_pagado` pagada en un mes 4 o mas meses antes
          del de `fecha_corte`: la ya devuelta con H30 `MENSUAL_REDEME` (defecto).
        unidad: EUR
        agregacion: suma
      iva_repercutido_cobrado_hasta_4m:
        significado: >-
          La parte de `iva_repercutido_cobrado` cobrada en un mes 4 o mas meses
          antes del de `fecha_corte` (H30 `MENSUAL_REDEME`).
        unidad: EUR
        agregacion: suma
    relaciones:
      - de: obra_id
        a: maestro.obras.obra_id
        cardinalidad: "1:1"
        porque: La ficha de la obra.
      - de: obra_id
        a: tesoreria.devengo_corte_obra.obra_id
        cardinalidad: "1:N"
        porque: El corte del devengo de la misma obra (una fila por concepto).
    ejemplos_preguntas:
      - Cuanto ha cobrado y pagado ya la obra X
      - Cual es el saldo de caja de la obra X hasta hoy

  hipotesis_caja:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **No disponible para el perfil restringido** (F-141, `R-PERFILES`):
      con su login la consulta devuelve «permission denied», y eso no se rodea:
      responde que el perfil no lo incluye.

      **EL CATALOGO DE HIPOTESIS PARA PASAR DEVENGO A CAJA** (F-140, F-150):
      las 30 hipotesis (H01-H30) que hay que fijar para convertir el devengo
      pendiente en cobros y pagos, con su valor por DEFECTO, de que dato sale
      (`fuente_defecto`) y donde esta el dato que la alimenta
      (`ingrediente`): plazos de pago y de cobro, retenciones, IVA y su
      liquidacion, certificacion, que hacer con lo retrasado... **Ninguna esta
      validada por Negocio hoy** (`validado` falso): son propuestas.
      `R-CAJA-HIPOTESIS` obliga a declararlas TODAS, con valor y nivel. Lo
      mantiene Control de Costes en `config/hipotesis_caja.yaml` y lo aprueba
      el humano (D15).

      **LA RECETA: DE DEVENGO A CAJA, EN ESTE ORDEN** (F-150). Cada hipotesis
      dice en `paso_receta` en que paso se aplica; declaralas TODAS con valor
      y nivel (`R-CAJA-HIPOTESIS`). COSTE se paga (PAGO) y VENTA se cobra
      (COBRO). Los perfiles (`PERFIL_MESES`, pares `[meses, porcentaje]` que
      suman 100) reparten el importe ENTERO: `[[0, 100]]` es todo en el mes de
      partida y `[[1, 50], [2, 50]]`, la mitad uno y dos meses despues.
      Redondea solo al final.

      0. SALDO: la caja que la obra YA movio, de
      `tesoreria.saldo_partida_obra` (CON IVA, hasta `fecha_corte`, el dia del
      build). Con H28 `CON_SALDO`, saldo = `cobrado_realizado` −
      (`pagado_realizado_sin_agr` + [H29 `ORIGINALES`: `agrupados_vencidos` |
      `AGR`: `pagado_agr_con_obra`] − CP) − `personal_coste_partes` + el IVA
      neto ya recuperado (`iva_soportado_pagado` − `iva_repercutido_cobrado`
      segun H30: `MENSUAL_REDEME`: _hasta_4m; `COMPENSA_EMPRESA`: todo;
      `ANUAL`: _hasta_4t; el IVA aun no recuperado es caja futura), con CP =
      `pagado_coste_proporcional` (+ `agrupados_vencidos_coste_proporcional`
      con `ORIGINALES`): el coste proporcional no es caja de la obra; con
      `SIN_SALDO`, 0, y la proyeccion parte de hoy. H29 es una HIPOTESIS que
      rompe `R-TESORERIA-ESTADO` a proposito: los originales agrupados estan
      de BAJA, y se cuentan pagados en su vencimiento; declarala. El personal
      del saldo es el coste de sus partes hasta el ultimo cierre (sin IVA); lo
      de despues esta en el devengo. No hay retenciones aparte: las
      retenciones entran al cobrarse o pagarse (son efectos propios), y las
      pendientes van en la cartera del paso 7.

      1. DEVENGO: el del mes, `importe_pendiente` de
      `tesoreria.devengo_pendiente_obra_mes` (H18; o `importe_plan_restante`),
      lo retrasado sin perfil segun H19, situado el dia H23. Sin IVA. Si H26
      es INCLUIR, suma al cobro del primer mes pendiente la venta ejecutada sin
      facturar (`venta_pendiente_facturar` de `tesoreria.devengo_corte_obra`,
      ya con coeficientes); lo `facturado_por_delante` NO se cobra: declaralo.
      Solo el coste de la OBRA: el coste PROPORCIONAL (`categoria` = `CP`,
      estructura) NO es caja de la obra: exclúyelo y declara su importe. El
      PERSONAL de la obra ya está aquí, como coste del RECURSO con sus cargas
      sociales: NO sumes pagos de personal de la cartera (nominas, embargos,
      cuotas de `tesoreria_restringida`) ni digas que faltan. Su parte del
      devengo es `importe_pendiente_personal` (por partida,
      `pendiente_personal` y `fuente_personal`) y se paga el ULTIMO DIA del mes
      de su devengo, sin IVA ni retencion: es una regla, no una hipotesis (N16).
      Las partidas con `fuente_personal` = `SIN_PARTES` (sin partes de
      personal hasta el cierre) no llevan personal: si pesan, dilo.

      2. DOCUMENTO: el devengo de cada mes se factura (pago, perfil H03) o se
      certifica (cobro, perfil H08). Su mes es el del IVA del paso 6.

      3. COEFICIENTES (solo cobro): se certifica y se cobra CON los
      coeficientes del contrato de cada partida:
      `importe_pendiente_con_coeficientes` (por partida,
      `pendiente_con_coeficientes` y `fuente_coeficiente` de
      `tesoreria.devengo_pendiente_partida`), nunca un coeficiente medio de
      obra; jamas lo compares con el coste ni con lo ejecutado
      (`R-VENTA-COEFICIENTES`). **Aviso**: la revision de precios y lo que se
      certifica fuera del coeficiente NO estan (F-040).

      4. PLAZO: desde el documento, la forma de pago del contrato (H01,
      `tesoreria.condiciones_contrato_compra`; con varios vencimientos, H15) o,
      sin contrato, la de su categoria (H02), con los dias fijos y meses sin
      pago del proveedor (H04) y el retraso real (H05); el cobro, a H09
      (`tesoreria.condiciones_contrato_cliente`) y menos la morosidad H22.
      Cada pago y cada cobro se FRACCIONA en meses con H24 (pago) o H25
      (cobro). El coste del paso 1 SIN el personal va por contrato en
      `tesoreria.devengo_pendiente_contrato_mes`: las filas con `contrato_id`,
      con la forma de pago de ese contrato (H01, H15) y los dias del proveedor
      (H04); las de `contrato_id` vacio, con H02 de su `categoria`. Declara la
      parte enlazada (`pendiente_enlazado_contrato` de
      `tesoreria.devengo_corte_obra`). Los albaranes netos del paso 7, con la
      forma de pago de su `contrato_id` (H01) y, sin el, H02 `OTRO`.

      5. RETENCION, sobre la base SIN IVA: en el cobro,
      `importe_retencion_contrato` (y `retencion_pendiente_facturar_contrato`)
      ya es la del contrato; H10 solo se aplica a las bases
      `sin_retencion_contrato`. En el pago, H06 solo en las filas con contrato
      (su `retencion_garantia_porcentaje`); sin contrato, el valor de H06; el
      personal, nunca. Se devuelve segun H11 o H07.

      6. IVA: en el cobro, `importe_iva_contrato` (y
      `iva_pendiente_facturar_contrato`) es el del contrato (0 % en inversion
      del sujeto pasivo); H12 solo se aplica a las bases `sin_iva_contrato`.
      En el pago, la base por el H13 DE LA OBRA (SIGRID: el IVA efectivo de
      sus compras), no el de la empresa, sobre la base SIN personal. Se cobra o paga con su documento; la liquidacion con
      Hacienda (repercutido menos soportado) va segun H14, y el IVA a devolver
      vuelve a caja segun H30 (con `MENSUAL_REDEME`, a los 4 meses). **Aviso**: H13 y
      H14 estan pendientes de validar con Administracion (AdP): dilo al dar
      la caja.

      7. CARTERA, SIN DUPLICAR: suma lo PREVISTO vivo de `tesoreria.efectos`
      en su vencimiento (H16; el previsto antiguo, H17) y los albaranes
      pendientes de facturar NETOS por proveedor (`importe_pendiente_neto` de
      `tesoreria.albaranes_pendientes_neto`; NUNCA sumes las lineas positivas
      de `compras.v_pbi_albaranes_sin_facturar`: lo sobrefacturado a un
      proveedor ya paga sus otras entregas), sin las filas `tras_cierre`, que
      ya son devengo pendiente. H20: la factura, a fin de `mes_albaran`, y el
      plazo desde ahi; las de `meses_antiguedad` mayor que H27 (o sin mes) NO
      son caja: excluyelas y declara su importe. Quita del primer mes
      pendiente lo emitido tras el cierre (H21, `cartera_emitida_tras_cierre`,
      CON IVA). De la cartera de PAGO resta lo de CP
      (`cartera_viva_coste_proporcional` y
      `cartera_emitida_tras_cierre_coste_proporcional` de
      `tesoreria.devengo_corte_obra`), y declaralo. Con los agrupados por sus
      ORIGINALES (paso 0), resta `cartera_viva_agr_con_obra` (ya estan en sus
      originales) y suma los originales pendientes (`agrupados_pendientes` de
      `tesoreria.saldo_partida_obra`) a su vencimiento: en `tesoreria.efectos`,
      `sentido` PAGO, `estado_tesoreria` BAJA, `estado_codigo` 14 y
      `fecha_vencimiento` desde hoy.
    grano: Una fila por hipotesis, identificada por `codigo` (30).
    clave_negocio: [codigo]
    paso_etl: build_tesoreria
    refresco: nocturno
    columnas:
      codigo:
        significado: Codigo de la hipotesis (H01 a H30).
      sentido:
        significado: A que lado de la caja afecta.
        valores: [PAGO, COBRO, AMBOS]
      descripcion:
        significado: Que fija la hipotesis.
      unidad:
        significado: >-
          Como se lee el valor: DIAS, MESES, PORCENTAJE, BOOLEANO, OPCION (una
          de `opciones`), MAPA_DIAS (dias por categoria) o PERFIL_MESES (F-150:
          pares [meses, porcentaje] que reparten un importe ENTERO; suman 100).
        valores: [DIAS, MESES, PORCENTAJE, BOOLEANO, OPCION, MAPA_DIAS, PERFIL_MESES]
      valor_defecto:
        significado: El valor por defecto, en JSON (un numero, un booleano, un texto o un mapa).
      opciones:
        significado: Los valores posibles de una hipotesis de unidad OPCION, en JSON.
        nulo_significa: La hipotesis no es de unidad OPCION.
      fuente_defecto:
        significado: De que dato o decision sale el valor por defecto.
      ingrediente:
        significado: El objeto del datamart donde esta el dato que la alimenta.
        nulo_significa: >-
          No hay dato que la alimente: es una decision (IVA, liquidacion...).
      validado:
        significado: Cierto si Negocio aprobo el valor por defecto. Si es falso, hay que avisarlo.
      fecha_validacion:
        significado: Fecha en que Negocio valido el valor.
        agregacion: no_sumable
        nulo_significa: No validada.
      admite_obra:
        significado: Cierto si la hipotesis admite un valor distinto por obra.
      paso_receta:
        significado: >-
          El paso de la receta en que se aplica (F-150). COEFICIENTES no tiene
          ninguna: los coeficientes son dato del contrato y del master.
        valores: [SALDO, DEVENGO, DOCUMENTO, COEFICIENTES, PLAZO, RETENCION, IVA, CARTERA]
    relaciones: []
    ejemplos_preguntas:
      - Como se pasa paso a paso el devengo de una obra a caja
      - Que hipotesis hay que fijar para proyectar la caja de una obra
      - Que plazo de cobro se supone por defecto y de donde sale

  hipotesis_caja_obra:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **No disponible para el perfil restringido** (F-141, `R-PERFILES`):
      con su login la consulta devuelve «permission denied», y eso no se rodea:
      responde que el perfil no lo incluye.

      **EL VALOR DE CADA HIPOTESIS EN CADA OBRA** (F-140): para cada obra con
      devengo pendiente (o con un valor manual), las 30 hipotesis del catalogo
      con el valor que toca y su NIVEL: es la lista entera que hay que
      declarar. La que no admite valor por obra (H17) va siempre por DEFECTO.
      MANUAL (el de la seccion
      `obras` del YAML) gana a SIGRID, y SIGRID al DEFECTO. SIGRID existe
      para H09 (plazo de cobro), H10 (retencion) y H11 (devolucion de la
      retencion), solo cuando TODOS los contratos con el cliente de la obra
      dan el mismo valor (el 2026-10-25, 16, 16 y 4 de las 21 obras), y desde
      F-150 para H12, el tipo de IVA de la ficha de la obra. H10 y H12 solo
      cubren la base SIN el dato del contrato: el del contrato ya va en el
      devengo (`importe_retencion_contrato`, `importe_iva_contrato`). Si el
      usuario da otro valor en la conversacion, manda el suyo, con nivel
      USUARIO (`R-CAJA-HIPOTESIS`). **Nada se aplica aqui**: es lo que hay que
      declarar.
    grano: >-
      Una fila por (`obra_id`, `codigo`): las 30 hipotesis del catalogo en
      cada obra, 567 filas de 21 obras con F-150 (483 con las 23 de F-140).
    clave_negocio: [obra_id, codigo]
    paso_etl: build_tesoreria
    refresco: nocturno
    columnas:
      obra_id:
        significado: Obra a la que se aplica la hipotesis.
        agregacion: no_sumable
      empresa_id:
        significado: Empresa de la obra.
        agregacion: no_sumable
      clave_obra:
        significado: Empresa y codigo de la obra (`1-0462`).
      codigo:
        significado: Codigo de la hipotesis (de `tesoreria.hipotesis_caja`).
      valor:
        significado: El valor que toca en la obra, en JSON.
      nivel:
        significado: >-
          OBRA (dado para esta obra, por el YAML o por sus contratos) o
          DEFECTO (el del catalogo). En la conversacion existe un tercero,
          USUARIO, que manda sobre los dos.
        valores: [OBRA, DEFECTO]
      fuente:
        significado: >-
          MANUAL (el YAML), SIGRID (los contratos con el cliente; H12, la ficha de
          la obra) o DEFECTO.
        valores: [MANUAL, SIGRID, DEFECTO]
      motivo:
        significado: Por que la obra tiene ese valor (el del YAML o de donde se leyo).
        nulo_significa: Valor por defecto.
    relaciones:
      - de: obra_id
        a: maestro.obras.obra_id
        cardinalidad: "N:1"
        porque: La ficha de la obra.
      - de: codigo
        a: tesoreria.hipotesis_caja.codigo
        cardinalidad: "N:1"
        porque: La definicion de la hipotesis.
    ejemplos_preguntas:
      - Con que hipotesis se proyecta la caja de la obra X
      - A cuantos dias cobra la obra X segun sus contratos

  hipotesis_caja_manual:
    tipo: tabla
    capa: operacion
    consumo_recomendado: false
    motivo_no_consumo: >-
      Es la seccion `obras` del YAML tal cual, ya resuelta en
      `tesoreria.hipotesis_caja_obra`, que es la que se consulta.
    descripcion: >-
      **No disponible para el perfil restringido** (F-141, `R-PERFILES`):
      con su login la consulta devuelve «permission denied», y eso no se rodea:
      responde que el perfil no lo incluye.

      Los valores de hipotesis dados a mano por obra en la seccion `obras` de
      `config/hipotesis_caja.yaml` (F-140), validados y cargados cada noche
      por `build_tesoreria`. Vacia el 2026-10-25.
    grano: Una fila por (`clave_obra`, `codigo`).
    clave_negocio: [clave_obra, codigo]
    paso_etl: build_tesoreria
    refresco: nocturno
    columnas:
      clave_obra:
        significado: Empresa y codigo de la obra (`1-0462`), como se escribe en el YAML.
      codigo:
        significado: Codigo de la hipotesis.
      valor:
        significado: El valor dado, en JSON.
      motivo:
        significado: Por que la obra tiene ese valor.
      fecha:
        significado: Fecha en que se dio el valor.
        agregacion: no_sumable
    relaciones: []
    ejemplos_preguntas: []

  condiciones_contrato_compra:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **No disponible para el perfil restringido** (F-141, `R-PERFILES`):
      con su login la consulta devuelve «permission denied», y eso no se rodea:
      responde que el perfil no lo incluye.

      **LO PACTADO CON CADA PROVEEDOR** (F-140): por contrato de compra, la
      forma de pago con su formula LEIDA (dias de cada vencimiento y de la
      retencion), los dias fijos de pago y los meses sin pago del proveedor
      tal cual, la retencion de garantia del contrato (recargo de clase 4 o 5,
      en tanto por cien) y el importe base e IVA de su cabecera. 19.170
      contratos el 2026-10-25: 19.161 con formula reconocida, 6.358 con
      garantia, 14.657 de un proveedor con dias fijos de pago. **Es un
      ingrediente**: ningun plazo se aplica a ninguna fecha
      (`R-CAJA-HIPOTESIS`). El plazo de devolucion de la garantia NO esta en
      el contrato: es la `NR` de la formula o el fin de obra (H07).
    grano: >-
      Una fila por contrato de compra (`contrato_id`, el de
      `compras.contratos`). Sin los de un tercero empleado (hoy 0).
    clave_negocio: [contrato_id]
    paso_etl: build_tesoreria
    refresco: nocturno
    columnas:
      contrato_id:
        significado: Contrato (`ctr.ide`), el `contrato_id` de `compras.contratos`.
        agregacion: no_sumable
      codigo_contrato:
        significado: Codigo del contrato en Sigrid.
      empresa_id:
        significado: Empresa del contrato.
        agregacion: no_sumable
      obra_id:
        significado: Obra del contrato.
        agregacion: no_sumable
        nulo_significa: Contrato sin obra (10).
      codigo_obra:
        significado: Codigo de la obra.
        nulo_significa: Contrato sin obra.
      proveedor_id:
        significado: Proveedor del contrato.
        agregacion: no_sumable
        nulo_significa: Contrato sin tercero.
      proveedor_nombre:
        significado: Nombre del proveedor.
        nulo_significa: Contrato sin tercero.
      estado_id:
        significado: Codigo numerico del estado del contrato en Sigrid.
        agregacion: no_sumable
      estado:
        significado: Nombre del estado (tipo 44 de `raw.conest`).
        nulo_significa: Estado sin traducir (hoy ninguno).
      importe_base:
        significado: Importe base de la cabecera del contrato (`totbas`), SIN IVA.
        unidad: EUR
        agregacion: suma
      importe_iva:
        significado: IVA de la cabecera del contrato (`totiva`).
        unidad: EUR
        agregacion: suma
      forma_pago_id:
        significado: Forma de pago del contrato (`auxpag.ide`).
        agregacion: no_sumable
        nulo_significa: Contrato sin forma de pago (9).
      forma_pago_codigo:
        significado: Codigo de la forma de pago.
        nulo_significa: Contrato sin forma de pago.
      forma_pago:
        significado: Nombre de la forma de pago.
        nulo_significa: Contrato sin forma de pago.
      medio_pago:
        significado: Medio de pago de la forma (transferencia, pagare, confirming...).
        nulo_significa: Sin forma de pago o forma sin medio.
      plazo_formula:
        significado: La formula de plazo de Sigrid TAL CUAL (`30 60 90`, `120 450R`).
        nulo_significa: Contrato sin forma de pago.
      dias_vencimientos:
        significado: >-
          Dias de cada vencimiento, en el orden escrito (`{30,60,90}`), desde
          la fecha que fije la hipotesis (H02-H05). Vacio si no se reconoce.
        nulo_significa: Contrato sin forma de pago.
      num_vencimientos:
        significado: Cuantos vencimientos tiene la formula.
        agregacion: no_sumable
        nulo_significa: Contrato sin forma de pago.
      dias_retencion:
        significado: Dias del efecto de retencion (la `NR` de la formula).
        agregacion: no_sumable
        nulo_significa: La formula no tiene retencion, o no hay formula.
      formula_reconocida:
        significado: >-
          Cierto si la formula casa con su gramatica (numeros y como mucho un
          NR). Si no, no se interpreta: sin dias ni retencion.
        nulo_significa: Contrato sin forma de pago.
      proveedor_dias_fijos_pago:
        significado: Dias fijos de pago del proveedor tal cual (`15,30`).
        nulo_significa: El proveedor no tiene dias fijos.
      proveedor_meses_sin_pago:
        significado: Meses en que el proveedor no cobra, tal cual (`8,12`).
        nulo_significa: El proveedor no tiene meses sin pago.
      retencion_garantia_porcentaje:
        significado: Porcentaje de retencion de garantia del contrato (5 es el 5 %).
        unidad: "%"
        agregacion: no_sumable
        nulo_significa: El contrato no tiene retencion de garantia.
      retencion_garantia_concepto:
        significado: Nombre del recargo de garantia.
        nulo_significa: El contrato no tiene retencion de garantia.
      retencion_garantia_clase:
        significado: Clase del recargo (4 o 5, las de garantia).
        agregacion: no_sumable
        nulo_significa: El contrato no tiene retencion de garantia.
    relaciones:
      - de: contrato_id
        a: compras.contratos.contrato_id
        cardinalidad: "1:1"
        porque: La cabecera del contrato.
      - de: obra_id
        a: maestro.obras.obra_id
        cardinalidad: "N:1"
        porque: La ficha de la obra.
    ejemplos_preguntas:
      - Con que plazo pagamos al proveedor Y
      - Que retencion de garantia tienen los contratos de la obra X

  condiciones_contrato_cliente:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **No disponible para el perfil restringido** (F-141, `R-PERFILES`):
      con su login la consulta devuelve «permission denied», y eso no se rodea:
      responde que el perfil no lo incluye.

      **LO PACTADO CON CADA CLIENTE** (F-140): por contrato con el cliente
      (`raw.obrctr`), la forma de COBRO con su formula leida, la retencion que
      nos hace el cliente (`coegar` o, si no, el recargo del contrato), los
      plazos de retencion y de garantia y el inicio de la garantia. 970
      contratos de 450 obras el 2026-10-25: 705 con formula reconocida, 265 sin
      forma de cobro, 525 con retencion. De aqui salen los valores SIGRID de
      H09-H11 en `tesoreria.hipotesis_caja_obra`. **Es un ingrediente**:
      ningun plazo se aplica a ninguna fecha (`R-CAJA-HIPOTESIS`).

      **LOS COEFICIENTES Y EL IVA DEL CONTRATO** (F-150): `coeficientes_texto`
      es el `coestr` de Sigrid (una linea por concepto,
      `CODIGO|etiqueta|valor||base`), desglosado POR CODIGO en gastos
      generales, beneficio industrial, otros, baja de adjudicacion y la
      retencion que trae (`retencion_coestr`, aparte: no es coeficiente).
      `coeficiente_contrato` es el factor `(1 + (GG + BI + otros) / 100) x
      (1 + baja / 100)` a 6 decimales: la baja va en cascada sobre el subtotal
      de contrata. Vacio o con un codigo desconocido no hay coeficiente
      (`coeficientes_reconocidos` falso) y sus partidas toman el del master.
      `iva_porcentaje` es el tipo de IVA del contrato (`raw.iva`; 0 en
      inversion del sujeto pasivo). De aqui sale el coeficiente, el IVA y la
      retencion de cada partida de venta de `tesoreria.devengo_pendiente_partida`.
    grano: Una fila por contrato con el cliente (`contrato_cliente_id`).
    clave_negocio: [contrato_cliente_id]
    paso_etl: build_tesoreria
    refresco: nocturno
    columnas:
      contrato_cliente_id:
        significado: Contrato con el cliente (`obrctr.ide`).
        agregacion: no_sumable
      codigo_contrato:
        significado: Codigo del contrato con el cliente.
      descripcion:
        significado: Descripcion del contrato.
      empresa_id:
        significado: Empresa de la obra del contrato.
        agregacion: no_sumable
      obra_id:
        significado: Obra del contrato.
        agregacion: no_sumable
      codigo_obra:
        significado: Codigo de la obra.
      cliente_id:
        significado: Cliente del contrato.
        agregacion: no_sumable
        nulo_significa: Contrato sin cliente.
      cliente_nombre:
        significado: Nombre del cliente.
        nulo_significa: Contrato sin cliente.
      forma_cobro_id:
        significado: Forma de cobro (`auxcob.ide`).
        agregacion: no_sumable
        nulo_significa: Contrato sin forma de cobro (265).
      forma_cobro_codigo:
        significado: Codigo de la forma de cobro.
        nulo_significa: Contrato sin forma de cobro.
      forma_cobro:
        significado: Nombre de la forma de cobro.
        nulo_significa: Contrato sin forma de cobro.
      medio_cobro:
        significado: Medio de cobro (`auxefc`).
        nulo_significa: Sin forma de cobro o forma sin medio.
      plazo_formula:
        significado: La formula de plazo de Sigrid TAL CUAL.
        nulo_significa: Contrato sin forma de cobro.
      dias_vencimientos:
        significado: Dias de cada vencimiento, en el orden escrito. Vacio si no se reconoce.
        nulo_significa: Contrato sin forma de cobro.
      num_vencimientos:
        significado: Cuantos vencimientos tiene la formula.
        agregacion: no_sumable
        nulo_significa: Contrato sin forma de cobro.
      dias_retencion:
        significado: Dias del efecto de retencion (la `NR` de la formula).
        agregacion: no_sumable
        nulo_significa: La formula no tiene retencion, o no hay formula.
      formula_reconocida:
        significado: Cierto si la formula casa con su gramatica.
        nulo_significa: Contrato sin forma de cobro.
      retencion_porcentaje:
        significado: >-
          Retencion que nos hace el cliente, en tanto por cien: `coegar` y, si
          no tiene, el porcentaje del recargo del contrato.
        unidad: "%"
        agregacion: no_sumable
        nulo_significa: El contrato no tiene retencion.
      retencion_fuente:
        significado: De donde sale el porcentaje.
        valores: [COEGAR, RECARGO]
        nulo_significa: El contrato no tiene retencion.
      retencion_concepto:
        significado: Nombre del recargo de retencion del contrato.
        nulo_significa: El contrato no tiene recargo de retencion.
      plazo_retencion_meses:
        significado: Plazo de retencion del contrato, en meses (`plaret`).
        agregacion: no_sumable
        nulo_significa: Sin plazo (0 en Sigrid).
      plazo_garantia_meses:
        significado: Plazo de garantia del contrato, en meses (`plagar`).
        agregacion: no_sumable
        nulo_significa: Sin plazo (0 en Sigrid).
      fecha_inicio_garantia:
        significado: Inicio de la garantia (`fecinigar`).
        agregacion: no_sumable
        nulo_significa: Sin fecha de inicio de garantia.
      coeficientes_texto:
        significado: >-
          Los coeficientes del contrato tal cual estan en Sigrid (`coestr`): una
          linea por concepto, `CODIGO|etiqueta|valor||base` (F-150).
        nulo_significa: >-
          El contrato no tiene coeficientes en Sigrid (`coestr` vacio); sus
          partidas toman el coeficiente del master.
      coeficientes_reconocidos:
        significado: >-
          Cierto si `coeficientes_texto` se entiende entero: todos sus codigos
          conocidos y sus valores numeros. Falso si esta vacio, es nulo o trae
          algo desconocido; entonces sus partidas toman el coeficiente del
          master (F-150).
      coeficiente_gg:
        significado: >-
          Gastos generales del contrato, en puntos (`COEF_RECGG`, tambien la
          forma combinada «Gastos Generales+Beneficio Industrial»).
        unidad: "%"
        agregacion: no_sumable
        nulo_significa: No los declara, o `coestr` no se reconoce.
      coeficiente_bi:
        significado: Beneficio industrial del contrato, en puntos (`COEF_RECBI`).
        unidad: "%"
        agregacion: no_sumable
        nulo_significa: No lo declara, o `coestr` no se reconoce.
      coeficiente_otros:
        significado: >-
          Control de calidad y seguridad y salud (`COEF_RECCC`, `COEF_RECSYS`),
          sumados, en puntos.
        unidad: "%"
        agregacion: no_sumable
        nulo_significa: No los declara, o `coestr` no se reconoce.
      coeficiente_baja:
        significado: >-
          Baja de adjudicacion (`COEF_DESADJ`), en puntos y negativa. Va en
          CASCADA sobre el subtotal de contrata, no sumada a GG y BI.
        unidad: "%"
        agregacion: no_sumable
        nulo_significa: No la declara, o `coestr` no se reconoce.
      retencion_coestr:
        significado: >-
          La retencion declarada DENTRO de `coestr` (`RETN`, `RETESP`, `RETNT`),
          en tanto por cien. NO es un coeficiente: es un dato aparte de
          `retencion_porcentaje`.
        unidad: "%"
        agregacion: no_sumable
        nulo_significa: No la declara en `coestr`, o `coestr` no se reconoce.
      coeficiente_contrato:
        significado: >-
          El coeficiente de venta del contrato, a 6 decimales: (1 + (gg + bi +
          otros) / 100) x (1 + baja / 100). GG 13 y BI 6 dan 1,19; con una baja
          del 12,77 %, 1,038. Manda sobre el del master en
          `devengo_pendiente_partida`.
        agregacion: no_sumable
        nulo_significa: >-
          Sin coeficientes reconocidos (o solo una retencion): sus partidas
          toman el del master.
      iva_id:
        significado: El tipo de IVA del contrato (`ivaide`, del catalogo `raw.iva`).
        agregacion: no_sumable
        nulo_significa: El contrato no tiene tipo de IVA.
      iva_porcentaje:
        significado: >-
          El IVA del contrato en tanto por cien, 4 decimales. 0 es inversion del
          sujeto pasivo: un valor, no la falta de el.
        unidad: "%"
        agregacion: no_sumable
        nulo_significa: Sin tipo de IVA, o sin fila en el catalogo.
    relaciones:
      - de: obra_id
        a: maestro.obras.obra_id
        cardinalidad: "N:1"
        porque: La ficha de la obra.
    ejemplos_preguntas:
      - A cuantos dias nos paga el cliente de la obra X
      - Que retencion nos hace el cliente de la obra X y cuando la devuelve

  plazos_forma_pago:
    tipo: vista
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **No disponible para el perfil restringido** (F-141, `R-PERFILES`):
      con su login la consulta devuelve «permission denied», y eso no se rodea:
      responde que el perfil no lo incluye.

      **LAS FORMAS DE PAGO Y DE COBRO CON SU FORMULA LEIDA** (F-140): las 70
      de pago (`auxpag`) y las 52 de cobro (`auxcob`), con la formula de plazo
      de Sigrid tal cual y leida: dias de cada vencimiento en el orden escrito
      y dias del efecto de retencion (`NR`). Las 122 se reconocen
      (2026-10-25). Las dadas de baja tambien estan, con su `fecha_baja`. Es
      el catalogo; lo pactado en cada contrato esta en
      `tesoreria.condiciones_contrato_compra` y
      `tesoreria.condiciones_contrato_cliente`.
    grano: >-
      Una fila por (`sentido`, `forma_id`): cada catalogo tiene su numeracion.
    clave_negocio: [sentido, forma_id]
    paso_etl: build_tesoreria
    refresco: nocturno
    columnas:
      sentido:
        significado: PAGO (forma de pago) o COBRO (forma de cobro).
        valores: [PAGO, COBRO]
      forma_id:
        significado: Identificador de la forma en su catalogo.
        agregacion: no_sumable
      codigo:
        significado: Codigo de la forma (`CF60`).
      nombre:
        significado: Nombre de la forma.
      medio_id:
        significado: Medio de pago o de cobro de la forma.
        agregacion: no_sumable
        nulo_significa: La forma no tiene medio.
      medio:
        significado: Nombre del medio (transferencia, pagare, confirming, recibo...).
        nulo_significa: La forma no tiene medio.
      plazo_formula:
        significado: >-
          La formula de plazo de Sigrid TAL CUAL (`30 60 90`, `120 450R`); cadena
          vacia si la forma no tiene formula (y entonces no se reconoce).
      dias_vencimientos:
        significado: Dias de cada vencimiento, en el orden escrito. Vacio si no se reconoce.
      num_vencimientos:
        significado: Cuantos vencimientos tiene la formula.
        agregacion: no_sumable
      dias_retencion:
        significado: Dias del efecto de retencion (la `NR`).
        agregacion: no_sumable
        nulo_significa: La formula no tiene retencion.
      formula_reconocida:
        significado: Cierto si la formula casa con su gramatica; si no, no se interpreta.
      fecha_baja:
        significado: Fecha de baja de la forma en Sigrid.
        agregacion: no_sumable
        nulo_significa: La forma esta en uso.
    relaciones: []
    ejemplos_preguntas:
      - Que significa la forma de pago CF60
      - Que formas de cobro tienen retencion y a cuantos dias

