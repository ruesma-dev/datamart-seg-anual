# config/diccionario/contabilidad_restringida.yaml
#
# Fichas del esquema `contabilidad_restringida` (F-135, 2026-10-11): la
# contabilidad COMPLETA -el plan, el mayor y los saldos de F-056, con las
# mismas filas, columnas y cifras que `contabilidad` publicaba hasta ese dia-
# mas la marca de lo que es informacion de PERSONAL.
#
# SOLO LA LEEN el perfil total del MCP (el login `mcp_sigrid_dm_total`,
# F-136, miembro del grupo) y el grupo `sigrid_dm_autorizado_ro` (y el dueno y
# el administrador de la base). El rol general del MCP y de Power BI
# (`mcp_sigrid_dm_ro`) tiene el esquema VETADO: `apply_grants` se lo revoca y
# lo comprueba cada noche. Desde la v50 (F-136) cada ficha EMPIEZA por el aviso
# de acceso restringido: el MCP no filtra el diccionario por perfil. Origen: correo de Juan Romero (Dir. Administracion y
# Control de Costes) del 2026-10-09. Regla dura `R-PERFILES`.
#
# Lo construye `build_contabilidad` (01-03) y de aqui sale la contabilidad
# general (04-07). Las cifras de las fichas son las de F-056 (2026-09-26) y las
# de F-135 (2026-10-09), en solo lectura; aqui solo hay recuentos y agregados,
# ni nombres ni importes de nadie.
#
# F-141 (2026-10-17): «restringida» = reservada al perfil total. El perfil
# restringido del MCP (administrativos, grupo `sigrid_dm_perfil_restringido_ro`)
# ve MENOS que el estandar y NO la lee (`R-PERFILES`).
#
# F-127 (2026-11-20): EL MAYOR ANALITICO COMPLETO (`mayor_analitico`) y sus
# saldos (`saldos_cuenta_analitica_mes`), con las cuentas de contrapartida de
# los trabajadores. Lo construye `build_contabilidad` (08-09); el general sale
# en `contabilidad` (10-12).

version: 1
esquema: contabilidad_restringida

objetos:

  plan_cuentas:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **ACCESO RESTRINGIDO: solo el perfil total del MCP.** Si no lo tienes, la
      consulta devuelve «permission denied»: usa `contabilidad.plan_cuentas`
      (`R-PERFILES`), sin reintentar ni buscar otro camino.

      **SOLO PARA EL ROL AUTORIZADO** (`sigrid_dm_autorizado_ro`, F-135, del
      que es miembro el perfil total del MCP): es el plan COMPLETO, con el nombre de todas las cuentas, tambien las de
      personal (prestamos, anticipos y embargos a nombre de trabajadores). El
      rol general lee `contabilidad.plan_cuentas`, con esas 521 cuentas
      enmascaradas (`R-PERFILES`).

      **EL PLAN DE CUENTAS FINANCIERO COMO ARBOL** (F-056): una fila por nodo
      del plan de las 38 empresas, sin filtrar altas ni bajas. 78.974 nodos el
      2026-09-26: **44.778 grupos** (`con.tip = 16`, codigos de 1 a 4 digitos:
      321 grupos, 2.673 subgrupos, 15.017 cuentas y 26.767 subcuentas) y
      **34.196 cuentas auxiliares** (`raw.cua`, `con.tip = 17`, todas de 10
      digitos), que son las unicas imputables: solo ellas tienen apuntes.

      **NO ES EL PLAN ANALITICO de `maestro.cuentas_analiticas`**: aquel son
      las cuentas de la contabilidad analitica (`caa`), una por centro de coste
      (184.234); esto es el plan financiero del Plan General Contable.

      **EL ARBOL ES DE PREFIJOS, DENTRO DE LA EMPRESA**: el padre de un grupo
      es el grupo de su MISMA empresa cuyo codigo es el suyo sin el ultimo
      digito (el 100 % de los grupos de 2-4 digitos lo tiene) y el de una
      cuenta auxiliar, el grupo de sus 4 primeros digitos. 17 auxiliares no
      tienen ese grupo y van con padre NULL. Sigrid declara ademas un padre
      (`cuenta_padre_declarada_id`, solo auxiliares): coincide con el prefijo
      en 33.838, esta a 0 en 352 y **difiere en 6** (empresas 12, 17 y 18,
      `padre_declarado_difiere`). Los grupos de 1 a 4 digitos del PGC:
      grupo (1), subgrupo (2), cuenta (3), subcuenta (4).

      **EL CODIGO SOLO ES UNICO DENTRO DE SU EMPRESA** (`R-CODIGO-POR-EMPRESA`):
      por codigo se cruza siempre con `empresa_id`, o por `clave_cuenta`
      ('1-4308000197'). Ejemplo: la cuenta `1-4308000197` es AHORRAMAS, S.A.,
      Retenciones; su ruta es '4 > 43 > 430 > 4308 > 4308000197' (grupo 4
      ACREEDORES Y DEUDORES, 43 CLIENTES, 4308 Clientes, retenciones).
    grano: >-
      Una fila por nodo del plan (grupo o cuenta auxiliar) de una empresa,
      identificada por `cuenta_id`. El par (`empresa_id`, `codigo_cuenta`) y
      `clave_cuenta` tambien son unicos; el codigo solo, no.
    clave_negocio: [cuenta_id]
    paso_etl: build_contabilidad
    refresco: nocturno
    columnas:
      cuenta_id:
        significado: >-
          Identificador del nodo en Sigrid (`con.ide`; en las auxiliares, el
          mismo que `cua.ide`). Es el valor de `contabilidad.mayor.cuenta_id`.
        agregacion: no_sumable
      empresa_id:
        significado: >-
          Empresa de Sigrid del nodo (`con.emp`); `1` es Ruesma. Con
          `codigo_cuenta` es unica: es la clave alternativa que
          `check-unicidad` vigila en `contabilidad.plan_cuentas`, que tiene los
          mismos nodos (F-108).
        agregacion: no_sumable
      empresa_nombre:
        significado: Nombre de la empresa (`raw.auxemp.res` por `numemp`).
      codigo_cuenta:
        significado: >-
          Codigo del nodo (`con.cod`): 1 a 4 digitos en los grupos, 10 en las
          auxiliares. Repetido entre empresas: se cruza junto con `empresa_id`.
      clave_cuenta:
        significado: >-
          La clave legible '<empresa>-<codigo>' ('1-4308000197'), unica. Es la
          forma de pedir una cuenta concreta sin equivocarse de empresa.
      nombre_cuenta:
        significado: Nombre del nodo (`con.res`).
      nivel:
        significado: >-
          Nivel en el arbol: 1 a 4 en los grupos (la longitud del codigo) y 5
          en las cuentas auxiliares.
        agregacion: no_sumable
        valores: [1, 2, 3, 4, 5]
      nombre_nivel:
        significado: El nivel con nombre.
        valores: [GRUPO, SUBGRUPO, CUENTA, SUBCUENTA, CUENTA_AUXILIAR]
      es_imputable:
        significado: >-
          TRUE en las cuentas auxiliares (nivel 5), las unicas que reciben
          apuntes. Los grupos solo agregan.
      grupo_pgc:
        significado: >-
          El primer digito del codigo: el grupo del Plan General Contable
          (1-5 balance, 6 gastos, 7 ingresos).
      cuenta_padre_id:
        significado: >-
          El padre por PREFIJO: el grupo de la misma empresa cuyo codigo es el
          prefijo inmediato (nivel 5: los 4 primeros digitos).
        agregacion: no_sumable
        nulo_significa: >-
          Nivel 1 (no tiene padre), o una auxiliar sin grupo de su prefijo en
          su empresa (17 el 2026-09-26).
      cuenta_padre_declarada_id:
        significado: >-
          El padre que DECLARA Sigrid para la auxiliar (`cua.padide`). Coincide
          con el de prefijo salvo en 6 cuentas: informativo, el arbol va por
          prefijo.
        agregacion: no_sumable
        nulo_significa: Un grupo (niveles 1-4), o una auxiliar con `padide` a 0 (352).
      padre_declarado_difiere:
        significado: >-
          TRUE si la auxiliar declara un padre distinto del de prefijo (6 el
          2026-09-26, empresas 12, 17 y 18). FALSE en los grupos.
      grupo_id:
        significado: >-
          El nodo de nivel 1 de su rama (el propio nodo si es de nivel 1). Con
          los otros tres ancestros permite agregar el balance por cualquier
          nivel con un GROUP BY.
        agregacion: no_sumable
      subgrupo_id:
        significado: El nodo de nivel 2 de su rama (el propio si es de nivel 2).
        agregacion: no_sumable
        nulo_significa: El nodo es de nivel 1.
      cuenta_3_id:
        significado: El nodo de nivel 3 de su rama (el propio si es de nivel 3).
        agregacion: no_sumable
        nulo_significa: El nodo es de nivel 1 o 2.
      subcuenta_id:
        significado: El nodo de nivel 4 de su rama (el propio si es de nivel 4).
        agregacion: no_sumable
        nulo_significa: El nodo es de nivel 1 a 3, o una auxiliar sin grupo de su prefijo.
      ruta_codigos:
        significado: >-
          Los codigos de la rama, de la raiz al nodo: '4 > 43 > 430 > 4308 >
          4308000197'.
      fecha_baja:
        significado: Fecha de baja del nodo en Sigrid (`con.fecbaj`).
        nulo_significa: El nodo esta de alta.
      es_activa:
        significado: >-
          TRUE si el nodo no tiene baja. Es BANDERA, no filtro: una cuenta de
          baja tiene historia en el mayor.
    relaciones:
      - de: cuenta_padre_id
        a: contabilidad_restringida.plan_cuentas.cuenta_id
        cardinalidad: "N:1"
        porque: El padre por prefijo es otro nodo del mismo plan y de la misma empresa.
      - de: grupo_id
        a: contabilidad_restringida.plan_cuentas.cuenta_id
        cardinalidad: "N:1"
        porque: El ancestro de nivel 1, para agregar por grupo del PGC.
      - de: subgrupo_id
        a: contabilidad_restringida.plan_cuentas.cuenta_id
        cardinalidad: "N:1"
        porque: El ancestro de nivel 2.
      - de: cuenta_3_id
        a: contabilidad_restringida.plan_cuentas.cuenta_id
        cardinalidad: "N:1"
        porque: El ancestro de nivel 3.
      - de: subcuenta_id
        a: contabilidad_restringida.plan_cuentas.cuenta_id
        cardinalidad: "N:1"
        porque: El ancestro de nivel 4, que es la subcuenta de la que cuelgan las auxiliares.
    ejemplos_preguntas:
      - Que cuentas cuelgan de la subcuenta 4308 de la empresa 1
      - Como se llama la cuenta 4308000197 de Ruesma y en que rama esta

  mayor:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **ACCESO RESTRINGIDO: solo el perfil total del MCP.** Si no lo tienes, la
      consulta devuelve «permission denied»: usa `contabilidad.mayor`
      (`R-PERFILES`), sin reintentar ni buscar otro camino.

      **SOLO PARA EL ROL AUTORIZADO** (`sigrid_dm_autorizado_ro`, F-135, del
      que es miembro el perfil total del MCP): es el mayor COMPLETO, el que hasta el 2026-10-11 publicaba
      `contabilidad.mayor`, con las mismas filas, columnas y cifras, y tres
      columnas mas al final que marcan lo que es de PERSONAL: los asientos de
      nomina enteros y las cuentas de trabajadores (55.504 apuntes, el 2,55 %,
      medidos el 2026-10-09). El rol general lee `contabilidad.mayor`, que es
      esta tabla con `restringido = false`. **No se suman los dos esquemas**:
      el completo ya contiene al general (`R-PERFILES`).

      **EL MAYOR CONTABLE** (F-056): una fila por apunte de `raw.apu`, SIN
      FILTRAR NINGUNO: 2.166.701 apuntes de 38 empresas desde 2008 (la empresa
      1, Ruesma, 1.948.503: el 89,9 %). Cada apunte con su fecha, su empresa,
      su cuenta del plan financiero, debe, haber e `importe` = debe - haber
      (positivo = saldo deudor), la clase del asiento, el saldo, la obra y el
      tercero. Es lo que responde "el mayor de la cuenta X".

      **LA TRAMPA: CIERRE Y APERTURA** (`R-SALDO-CONTABLE`). Cada ejercicio
      la contabilidad cierra cada cuenta y la reabre el siguiente con el mismo
      importe (52.414 apuntes de CIERRE y 52.413 de APERTURA). El saldo es
      `importe_saldo` (0 en CIERRE y APERTURA) y `saldo_acumulado`. Caso
      medido: la cuenta `1-4308000197` (AHORRAMAS, S.A., Retenciones) tiene 641
      apuntes de 2009 a 2026 y un saldo de **1.189.275,13**; sumar su historico
      quitando solo los CIERRE da **7.742.538,38**, porque cada APERTURA se
      suma encima del movimiento que ya resume. La apertura sin cierre previo
      de la cuenta es SALDO_INICIAL y SI cuenta: 1.433 apuntes (1.315 de 2008,
      lo anterior a Sigrid, y los arranques de empresas nuevas). Dentro de UN
      ejercicio, la apertura es el saldo de partida: la subcuenta 434 de la
      empresa 1 en 2026, sumando sus auxiliares sin los CIERRE, da
      5.345.557,80, lo mismo que la pantalla de Sigrid del 03-09.

      **UNA OPERACION DEJA VARIOS APUNTES**: la factura, otro en la remesa de
      cobro o pago y otro en «totales». Contar apuntes no es contar
      operaciones, y sumar el debe de todas las cuentas de un tercero cuenta
      la misma operacion varias veces.

      **CONTABILIDAD NO ES ANALITICA NI SEGUIMIENTO** (F-063): esto es lo que se
      contabilizo en el plan financiero; el coste analitico por centro esta en
      `raw.apa` (F-061) y el seguimiento de obra en `mart` y `cierre`. Persiguen
      cosas distintas y no cuadran por construccion.

      **LA OBRA solo sale del centro de coste del apunte** (`apu.cenide`,
      traducido por `maestro.centros_coste`): 1.161.574 apuntes (53,6 %). Por
      grupo del PGC: 6 (gastos) el **90,3 %** (425.520 de 471.188), 7 el
      **61,4 %**, 4 el **46,8 %**, 5 el 24,5 %, 1 el 18,4 %, 2 el 9,6 % y 3 casi
      nada. Lo que no lleva centro, o lleva uno que no es obra (estructura,
      delegacion), va sin obra y NO se reparte.

      **LAS DOS FECHAS**: `fecha` es la del apunte (`apu.fec`, la que usa el
      mayor de Sigrid) y `fecha_asiento` la del asiento. Coinciden salvo en
      **297** apuntes de 2017, que llevan el ultimo dia del mes y su asiento el
      primero (`fecha_difiere`).
    grano: >-
      Una fila por apunte contable, y `apunte_id` es clave primaria: ninguna
      union multiplica (el build falla si el recuento no es el de `raw.apu`).
      Incluye cierres y aperturas: para sumar saldos, `importe_saldo`.
    clave_negocio: [apunte_id]
    paso_etl: build_contabilidad
    refresco: nocturno
    columnas:
      apunte_id:
        significado: Identificador del apunte en Sigrid (`apu.ide`). Destino de `raw.apa.apuide` (F-061).
        agregacion: no_sumable
      asiento_id:
        significado: El asiento del apunte (`apu.asiide`, que es un `con.ide`).
        agregacion: no_sumable
      codigo_asiento:
        significado: Numero del asiento (`con.cod` del asiento).
      posicion:
        significado: Posicion del apunte dentro de su asiento (`apu.pos`).
        agregacion: no_sumable
      fecha:
        significado: Fecha contable del apunte (`apu.fec`). Es la que ordena el mayor.
      fecha_asiento:
        significado: Fecha del asiento (`con.fec` del asiento), por los dos saltos.
        nulo_significa: El apunte no tiene asiento (0 el 2026-09-26).
      fecha_difiere:
        significado: TRUE si `fecha` y `fecha_asiento` no coinciden (297, todos de 2017).
      ejercicio:
        significado: Ano de `fecha`. Es el ejercicio contable del apunte.
        agregacion: no_sumable
      mes:
        significado: Mes de `fecha` (1-12).
        agregacion: no_sumable
      empresa_id:
        significado: >-
          Empresa del ASIENTO (`con.emp`); la de la cuenta coincide en el 100 %.
        agregacion: no_sumable
      cuenta_id:
        significado: La cuenta auxiliar del apunte (`apu.cueide`), un nodo de `contabilidad_restringida.plan_cuentas`.
        agregacion: no_sumable
        nulo_significa: El apunte no lleva cuenta (294 apuntes, todos de importe cero).
      codigo_cuenta:
        significado: Codigo de la cuenta. Repetido entre empresas.
        nulo_significa: El apunte no lleva cuenta.
      nombre_cuenta:
        significado: Nombre de la cuenta.
        nulo_significa: El apunte no lleva cuenta.
      clave_cuenta:
        significado: La clave legible de la cuenta, '<empresa>-<codigo>'.
        nulo_significa: El apunte no lleva cuenta.
      concepto:
        significado: Texto del apunte (`apu.res`). De aqui sale en parte la clase del asiento.
      documento:
        significado: Documento del apunte segun Sigrid (`apu.doc`). Casi nunca informado; el enlace con la factura es `raw.rac` (F-091).
      punteo:
        significado: Marca de punteo del apunte (`apu.pun`), tal cual.
        agregacion: no_sumable
      clase_origen:
        significado: >-
          La clase que trae Sigrid (`apu.cla`): 3 cierre, -1 apertura, 1
          regularizacion, 0 el resto. Incompleta: los cierres de 2020, las
          aperturas de 2021 y 290 regularizaciones vienen con 0. Para decidir,
          `clase_asiento`.
        agregacion: no_sumable
      clase_asiento:
        significado: >-
          Que es el apunte, evaluado en este orden: CIERRE (`cla` 3 o concepto
          'Asiento de cierre...'), SALDO_INICIAL (apertura de una cuenta sin
          cierre el ejercicio anterior), APERTURA (el resto de aperturas),
          REGULARIZACION (`cla` 1 o 'Asiento de regulariz...'; deja los grupos
          6 y 7 a cero al cerrar el ejercicio) y NORMAL. El 2026-09-26: NORMAL
          2.056.147, CIERRE 52.414, APERTURA 52.413, REGULARIZACION 4.294,
          SALDO_INICIAL 1.433.
        valores: [NORMAL, APERTURA, SALDO_INICIAL, CIERRE, REGULARIZACION]
      debe:
        significado: Debe del apunte.
        unidad: EUR
        agregacion: suma
      haber:
        significado: Haber del apunte.
        unidad: EUR
        agregacion: suma
      importe:
        significado: >-
          Debe menos haber, CON SIGNO (positivo = saldo deudor). Sumarlo sin
          filtrar `clase_asiento` mete los cierres y las aperturas: el saldo es
          `importe_saldo`.
        unidad: EUR
        agregacion: suma
      importe_saldo:
        significado: >-
          Lo que el apunte aporta al saldo: `importe` en NORMAL, REGULARIZACION y
          SALDO_INICIAL, 0 en CIERRE y APERTURA. Es la columna que se suma.
        unidad: EUR
        agregacion: suma
      saldo_acumulado:
        significado: >-
          Saldo de la cuenta tras el apunte: suma de `importe_saldo` de la
          cuenta hasta el apunte inclusive, por fecha, asiento, posicion y
          apunte. El saldo a una fecha es el del ultimo apunte hasta esa fecha.
        unidad: EUR
        agregacion: ultimo_valor
      centro_coste_id:
        significado: Centro de coste del apunte (`apu.cenide`), tal cual. No es la obra.
        agregacion: no_sumable
        nulo_significa: El apunte no lleva centro.
      obra_id:
        significado: >-
          La obra del centro de coste del apunte, por `maestro.centros_coste`:
          el mismo identificador que `maestro.obras.obra_id`, la ficha de su
          empresa.
        agregacion: no_sumable
        nulo_significa: >-
          El apunte no lleva centro, o su centro no es una obra (estructura,
          delegacion). No se reparte.
      codigo_obra:
        significado: Codigo de la obra, sin la empresa. Repetido entre empresas.
        nulo_significa: El apunte no tiene obra.
      clave_obra:
        significado: La clave legible de la obra, '<empresa>-<codigo>', la de `maestro.obras`.
        nulo_significa: El apunte no tiene obra.
      tercero_id:
        significado: >-
          El tercero del apunte (`apu.empide`): proveedor, cliente o acreedor,
          un `con.ide`. Informado en 1.030.078 apuntes (47,5 %).
        agregacion: no_sumable
        nulo_significa: El apunte no lleva tercero.
      tercero_nombre:
        significado: Nombre del tercero (`con.res`).
        nulo_significa: El apunte no lleva tercero.
      restringido:
        significado: >-
          TRUE si el apunte es de PERSONAL y por tanto NO esta en
          `contabilidad.mayor`: el de una cuenta restringida entera (prefijos
          640, 641, 642, 643, 644, 645, 649, 465, 466, 476, 460, 461, 544 y
          4753, en cualquier clase de asiento) o el de un asiento de personal
          entero (todos sus apuntes NORMAL y alguno en esas cuentas o con
          «nomina» en el concepto; la caja, el banco y el IVA de ese asiento
          tambien). Tambien el de una cuenta que NO resuelve en el plan (trae
          cuenta y su codigo no esta): se restringe por si acaso y hace de
          personal a su asiento. Nunca NULL. Criterio de Juan Romero
          (2026-10-09): ante la duda, restringir de mas.
      motivo_restriccion:
        significado: >-
          Por que esta restringido: CUENTA si la cuenta es restringida entera
          (aunque el asiento tambien sea de personal), CUENTA_SIN_RESOLVER si
          trae cuenta y esta no resuelve en el plan (falla cerrado; hoy 0),
          ASIENTO_PERSONAL si solo lo es el asiento.
        valores: [CUENTA, CUENTA_SIN_RESOLVER, ASIENTO_PERSONAL]
        nulo_significa: El apunte es visible (`restringido = false`).
      saldo_acumulado_visible:
        significado: >-
          Lo que publica `contabilidad.mayor` como `saldo_acumulado`: el saldo
          de la cuenta sumando SOLO los apuntes visibles. En las cuentas
          mixtas (bancos, IVA, proveedores) difiere de `saldo_acumulado`, que
          es el de verdad.
        unidad: EUR
        agregacion: ultimo_valor
        nulo_significa: El apunte esta restringido.
    relaciones:
      - de: cuenta_id
        a: contabilidad_restringida.plan_cuentas.cuenta_id
        cardinalidad: "N:1"
        porque: La cuenta del apunte en el arbol, con su rama y sus ancestros para agregar.
      - de: obra_id
        a: maestro.obras.obra_id
        cardinalidad: "N:1"
        porque: La ficha de la obra (y de su empresa) del apunte.
      - de: centro_coste_id
        a: maestro.centros_coste.centro_coste_id
        cardinalidad: "N:1"
        porque: El centro de coste del apunte, del que sale la obra.
    ejemplos_preguntas:
      - Dame el mayor completo de la cuenta 4308000197 de Ruesma
      - Cuantos apuntes de personal tiene la empresa 1 en 2025 y en que cuentas
      - Cual es el saldo de la cuenta X a 31 de diciembre de 2025
      - Que gastos del grupo 6 se han contabilizado en la obra X este ano

  saldos_cuenta_mes:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **ACCESO RESTRINGIDO: solo el perfil total del MCP.** Si no lo tienes, la
      consulta devuelve «permission denied»: usa `contabilidad.saldos_cuenta_mes`
      (`R-PERFILES`), sin reintentar ni buscar otro camino.

      **SOLO PARA EL ROL AUTORIZADO** (`sigrid_dm_autorizado_ro`, F-135, del
      que es miembro el perfil total del MCP): son los saldos COMPLETOS, los que hasta el 2026-10-11 publicaba
      `contabilidad.saldos_cuenta_mes`, con las mismas filas, columnas y
      cifras. Los generales solo suman lo visible y marcan con `incompleto` el
      mes al que le falta algo (`R-PERFILES`).

      **LOS SALDOS POR CUENTA Y MES** (F-056), construidos desde
      `contabilidad_restringida.mayor`: una fila por cuenta, empresa, ejercicio y mes con
      algun apunte (400.342 el 2026-09-26). El importe va partido por clase
      --apertura (APERTURA + SALDO_INICIAL), movimiento (NORMAL),
      regularizacion y cierre-- para que la trampa del CIERRE y la APERTURA no
      se pueda cometer sin verla: `importe_saldo` ya los excluye y
      `saldo_acumulado` es el saldo a fin de mes. La suma de `importe_saldo` por
      cuenta es la del mayor. Los apuntes sin cuenta van con `cuenta_id` = 0,
      una fila por empresa y mes, de importe cero. Para el balance o la cuenta
      de resultados, agregar por los ancestros de `contabilidad.plan_cuentas`;
      en los grupos 6 y 7 la REGULARIZACION deja el ejercicio a cero, asi que
      el resultado del ejercicio se lee sin ella (`importe_movimiento`).
    grano: >-
      Una fila por (`cuenta_id`, `empresa_id`, `ejercicio`, `mes`) con algun
      apunte. Los meses sin apuntes no tienen fila: el saldo de un mes sin
      movimiento es el `saldo_acumulado` del ultimo mes con fila.
    clave_negocio: [cuenta_id, empresa_id, ejercicio, mes]
    paso_etl: build_contabilidad
    refresco: nocturno
    columnas:
      cuenta_id:
        significado: La cuenta auxiliar (`contabilidad_restringida.plan_cuentas.cuenta_id`), o 0 para los apuntes sin cuenta.
        agregacion: no_sumable
      empresa_id:
        significado: Empresa de los apuntes (la del asiento).
        agregacion: no_sumable
      ejercicio:
        significado: Ano contable de los apuntes (el de su fecha).
        agregacion: no_sumable
      mes:
        significado: Mes de los apuntes dentro del ejercicio (1-12).
        agregacion: no_sumable
      num_apuntes:
        significado: Apuntes de la cuenta ese mes, de todas las clases.
        agregacion: suma
      debe:
        significado: Debe del mes, de todas las clases (cierres y aperturas incluidos).
        unidad: EUR
        agregacion: suma
      haber:
        significado: Haber del mes, de todas las clases (cierres y aperturas incluidos).
        unidad: EUR
        agregacion: suma
      importe_apertura:
        significado: Importe de las APERTURA y los SALDO_INICIAL del mes (en la practica, enero).
        unidad: EUR
        agregacion: suma
      importe_movimiento:
        significado: Importe de los apuntes NORMAL del mes.
        unidad: EUR
        agregacion: suma
      importe_regularizacion:
        significado: Importe de la REGULARIZACION del mes (grupos 6 y 7, al cerrar).
        unidad: EUR
        agregacion: suma
      importe_cierre:
        significado: Importe de los CIERRE del mes. No se suma al saldo.
        unidad: EUR
        agregacion: suma
      importe_saldo:
        significado: >-
          Lo que el mes aporta al saldo: NORMAL + REGULARIZACION +
          SALDO_INICIAL, sin CIERRE ni APERTURA. Es la columna que se suma.
        unidad: EUR
        agregacion: suma
      saldo_acumulado:
        significado: Saldo de la cuenta a fin de mes. No se suma entre meses.
        unidad: EUR
        agregacion: ultimo_valor
    relaciones:
      - de: cuenta_id
        a: contabilidad_restringida.plan_cuentas.cuenta_id
        cardinalidad: "N:1"
        porque: La cuenta en el arbol, para agregar por grupo, subgrupo o subcuenta.
    ejemplos_preguntas:
      - Saldo de la subcuenta 434 de Ruesma mes a mes en 2026
      - Gastos del grupo 62 por empresa y mes

  # F-127 (2026-11-20): EL MAYOR ANALITICO COMPLETO y sus saldos. Cifras del
  # SELECT equivalente al build (con D9), en solo lectura sobre el `raw` de la
  # nocturna del 2026-11-21 (`progress/impl_F-127.md`, pasada 2). Solo cuentas
  # y recuentos.
  mayor_analitico:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **ACCESO RESTRINGIDO: solo el perfil total del MCP.** Si no lo tienes, la
      consulta devuelve «permission denied»: usa `contabilidad.mayor_analitico`
      (`R-PERFILES`), sin reintentar ni buscar otro camino.

      **SOLO PARA EL ROL AUTORIZADO** (`sigrid_dm_autorizado_ro`, F-127, del
      que es miembro el perfil total del MCP): es el mayor analitico COMPLETO,
      con las cuentas de contrapartida (CP) de los trabajadores, que llevan su
      coste de nomina. El rol general lee `contabilidad.mayor_analitico`, que es
      esta tabla con `restringido = false`; el perfil restringido y el de
      postventa no leen ninguna de las dos. **No se suman los dos esquemas**: el
      completo ya contiene al general.

      **EL MAYOR ANALITICO** (F-127): una fila por fila de `raw.apa` (el
      desglose analitico de Sigrid), SIN FILTRAR NINGUNA: 722.704 filas medidas
      el 2026-11-21, de 2008 a 2026. Cada fila con su asiento, fecha, empresa,
      centro de coste y obra, su cuenta ANALITICA (las de
      `maestro.cuentas_analiticas`, no las del plan financiero), debe, haber e
      `importe` = debe - haber. Dos clases de asiento (`tipo_asiento`):
      CONTABLE (639.034 filas el 2026-11-20, cuelgan de un apunte financiero, `apunte_id`) y
      ANALITICO (83.597 filas de 5.766 asientos `ANA...` de 2009-01 a 2026-07,
      sin apunte financiero: imputan los partes de trabajo a las obras y abonan
      la CP del trabajador).

      **EL SALDO SI ES `debe - haber`**: la analitica no tiene cierres ni
      aperturas (0 de 639.034 filas enlazadas cuelgan de un apunte que no sea
      NORMAL), asi que `SUM(importe)` y `saldo_acumulado` son el saldo, al
      contrario que en el mayor financiero (`R-SALDO-CONTABLE`). No es partida
      doble: el debe y el haber de todo el mayor no cuadran entre si. **No se
      suma con `contabilidad_restringida.mayor`** ni con `contabilidad.mayor`:
      una fila analitica es el reparto por centro de un apunte financiero, y
      sumar los dos cuenta el mismo gasto dos veces.

      **QUE ES RESTRINGIDO** (criterio V2 de F-135, R23): la fila cuyo apunte
      financiero es restringido en el mayor completo, la de un asiento de
      personal, y la de una CP: la de algun recurso
      (`personal.recursos.cuenta_analitica_contrapartida_id`) o una cuenta del
      centro de una CP con abono en un asiento ANALITICO (CP de antes que el
      recurso ya no declara: 7 cuentas, 5.857 filas, enteras), o TODA cuenta
      del centro `CP` (el de codigo `CP`, uno por empresa; D9, 2026-11-21: tres
      cuentas `CP.*` sin recurso ni abono, 60 filas). Se restringe DE MAS.
      Medido el 2026-11-21: 181.804 restringidas (el 25,2 %, 1.000 cuentas):
      174.295 por CONTRAPARTIDA y 7.509 por APUNTE_RESTRINGIDO.

      **LAS CP EN 2026, OJO** (Juan Romero, Control de Costes, correo del 2026-11-20). (1) LA NOMINA: hasta marzo de 2026,
      incluido, la nomina se hacia en Sigrid y su asiento cargaba la CP de cada
      trabajador (~0,9-1,1 M EUR al mes); desde abril de 2026 se cierra en
      Cegid y a Sigrid solo llega el asiento global, asi que las CP ya no
      reciben la nomina por trabajador. Las CP siguen restringidas porque
      guardan el historico de las nominas. (2) LOS PARTES: el asiento ANALITICO
      que abona la CP solo nace cuando el parte pasa a IMP (imputado); un parte
      en CER (cerrado) ya no se edita pero aun no tiene asiento. De marzo a
      septiembre de 2026 casi todo esta en CER (abonos de 31-44 mil EUR al mes
      de marzo a julio, frente a ~0,9-1,0 M EUR hasta enero), no hay ninguno
      desde agosto de 2026 y octubre y noviembre siguen en registro: el hueco
      es de partes sin imputar, no un fallo del dato. (3) EL SALDO DE UNA CP es
      «nomina menos partes» solo hasta marzo de 2026; despues no tiene ese
      sentido y no se publica nada derivado.

      **RECETA: SALDO Y MOVIMIENTOS DE LA CP DEL TRABAJADOR X EN LA OBRA Y, Y SU
      CRUCE CON SUS PARTES.** (1) La CP es
      `personal.recursos.cuenta_analitica_contrapartida_id` del recurso (por
      `clave_recurso`). (2) Sus movimientos: las filas con `cuenta_analitica_id`
      = esa CP, por `fecha`; el saldo a una fecha es el `saldo_acumulado` de la
      ultima fila hasta ella. Los cargos (nomina, suministros) no llevan obra:
      van al centro de la CP. (3) Lo imputado a la obra Y: los abonos de
      `tipo_asiento = 'ANALITICO'` con `obra_imputada_id` = la obra (la obra
      del asiento, no la del centro de la fila, que es el de la CP), sumando
      `haber`. (4) El cruce: `SUM(importe)` de `personal.partes_lineas` con
      `obra_id` = la obra y `recurso_id` de TODOS los recursos con esa CP: 430
      de las 853 CP estan compartidas por hasta 8 recursos, asi que el cruce va
      por CP, no por recurso. En 2025 cuadraron al euro 162 de 238 CP, y en
      total 11.622.909 de abono frente a 12.016.833 de partes (96,7 %).
    grano: >-
      Una fila por fila de `raw.apa`, y `apunte_analitico_id` es clave
      primaria: ninguna union multiplica (el build falla si el recuento no es
      el de `raw.apa`). Varias filas por apunte financiero: es su reparto por
      centro.
    clave_negocio: [apunte_analitico_id]
    paso_etl: build_contabilidad
    refresco: nocturno
    columnas:
      apunte_analitico_id:
        significado: Identificador de la fila analitica en Sigrid (`apa.ide`).
        agregacion: no_sumable
      asiento_id:
        significado: >-
          El asiento de la fila (`apa.conide`, un `con.ide`): el asiento contable
          (el `asiento_id` del mayor) o el asiento ANALITICO.
        agregacion: no_sumable
      tipo_asiento:
        significado: >-
          CONTABLE si el asiento es contable (`con.tip = 20`: la fila cuelga de
          un apunte financiero), ANALITICO si es un asiento analitico puro
          (`con.tip = 32`, codigo `ANA...`: la imputacion de los partes), OTRO si
          no (0 el 2026-11-20).
        valores: [CONTABLE, ANALITICO, OTRO]
      codigo_asiento:
        significado: Numero del asiento (`con.cod`); los analiticos empiezan por `ANA`.
      posicion:
        significado: Posicion de la fila dentro de su asiento (`apa.pos`).
        agregacion: no_sumable
      fecha:
        significado: Fecha de la fila (`apa.fec`); coincide con la de su apunte en 639.030 de 639.034.
      ejercicio:
        significado: Ano de `fecha`.
        agregacion: no_sumable
      mes:
        significado: Mes de `fecha` (1-12).
        agregacion: no_sumable
      empresa_id:
        significado: Empresa del ASIENTO (`con.emp`); la de la cuenta coincide en el 100 %.
        agregacion: no_sumable
      centro_coste_id:
        significado: >-
          Centro de coste de la fila (`apa.cenide`). En una CP es el centro de
          la CP, no la obra: la obra de su abono es `obra_imputada_id`.
        agregacion: no_sumable
        nulo_significa: La fila no lleva centro (120 filas).
      codigo_centro:
        significado: Codigo del centro de coste, de `maestro.centros_coste`.
        nulo_significa: La fila no lleva centro.
      obra_id:
        significado: >-
          La obra del centro de coste de la fila, por `maestro.centros_coste`
          (el `obra_id` de `maestro.obras`). Ningun otro campo de obra de la
          fila se lee.
        agregacion: no_sumable
        nulo_significa: >-
          La fila no lleva centro, o su centro no es una obra (estructura,
          delegacion, el centro de las CP). No se reparte.
      codigo_obra:
        significado: Codigo de la obra, sin la empresa. Repetido entre empresas.
        nulo_significa: La fila no tiene obra.
      clave_obra:
        significado: La clave legible de la obra, '<empresa>-<codigo>', la de `maestro.obras`.
        nulo_significa: La fila no tiene obra.
      cuenta_analitica_id:
        significado: >-
          La cuenta ANALITICA de la fila (`apa.cueide`, una cuenta de
          `maestro.cuentas_analiticas`), no una del plan financiero.
        agregacion: no_sumable
        nulo_significa: La fila no lleva cuenta (127 filas).
      codigo_cuenta_analitica:
        significado: Codigo de la cuenta analitica (`con.cod`); empieza por el codigo del centro.
        nulo_significa: La fila no lleva cuenta.
      descripcion_cuenta_analitica:
        significado: >-
          Descripcion de la cuenta analitica (`con.res`). En las CP suele llevar
          el nombre del trabajador.
        nulo_significa: La fila no lleva cuenta.
      es_contrapartida_recurso:
        significado: >-
          TRUE si la cuenta es una cuenta de contrapartida (CP) de trabajador:
          la de algun recurso hoy, una CP antigua de su centro (D7) o cualquier
          cuenta del centro `CP` (D9). Es la condicion C3 de lo restringido.
      concepto:
        significado: Texto de la fila (`apa.res`); coincide con el de su apunte en el 96,6 %.
      documento:
        significado: Documento de la fila segun Sigrid (`apa.doc`), tal cual.
      punteo:
        significado: Marca de punteo de la fila (`apa.pun`), tal cual.
        agregacion: no_sumable
      debe:
        significado: Debe de la fila.
        unidad: EUR
        agregacion: suma
      haber:
        significado: Haber de la fila. En una CP, el abono de lo que sus partes imputan a la obra.
        unidad: EUR
        agregacion: suma
      importe:
        significado: >-
          Debe menos haber, con signo. AQUI SI SE SUMA: la analitica no tiene
          cierres ni aperturas.
        unidad: EUR
        agregacion: suma
      saldo_acumulado:
        significado: >-
          Saldo de la cuenta analitica tras la fila: suma de `importe` de la
          cuenta hasta la fila inclusive, por fecha, asiento, posicion y fila.
          El saldo a una fecha es el de la ultima fila hasta esa fecha.
        unidad: EUR
        agregacion: ultimo_valor
      apunte_id:
        significado: >-
          El apunte financiero del que cuelga la fila (`apa.apuide`), el
          `apunte_id` de `contabilidad_restringida.mayor`.
        agregacion: no_sumable
        nulo_significa: Fila de un asiento ANALITICO, sin apunte financiero.
      cuenta_id:
        significado: La cuenta FINANCIERA de ese apunte (`contabilidad_restringida.mayor.cuenta_id`).
        agregacion: no_sumable
        nulo_significa: La fila no cuelga de un apunte, o el apunte no lleva cuenta.
      codigo_cuenta:
        significado: Codigo de la cuenta financiera del apunte (640..., 628...).
        nulo_significa: La fila no cuelga de un apunte, o el apunte no lleva cuenta.
      obra_imputada_id:
        significado: >-
          En un asiento ANALITICO, la UNICA obra a la que cargan sus filas que no
          son de CP, repetida en todas las filas del asiento: es la obra del
          abono de la CP (38.876 de las 38.943 filas de abono de CP).
        agregacion: no_sumable
        nulo_significa: >-
          El asiento no es ANALITICO, o sus filas de cargo van a ninguna obra o
          a varias.
      clave_obra_imputada:
        significado: La clave legible de `obra_imputada_id`, '<empresa>-<codigo>'.
        nulo_significa: No hay obra imputada.
      restringido:
        significado: >-
          TRUE si la fila NO esta en `contabilidad.mayor_analitico`: su apunte
          financiero es restringido, su asiento es de personal, su cuenta es una
          CP, o su apunte no esta en el mayor completo (falla cerrado). Nunca
          NULL.
      motivo_restriccion:
        significado: >-
          Por que esta restringida, en este orden: CONTRAPARTIDA (la cuenta es
          CP), APUNTE_SIN_RESOLVER (su apunte no esta en el mayor completo; hoy
          0), APUNTE_RESTRINGIDO (su apunte es restringido), ASIENTO_PERSONAL
          (solo lo es el asiento; hoy 0: coincide con el anterior).
        valores: [CONTRAPARTIDA, APUNTE_SIN_RESOLVER, APUNTE_RESTRINGIDO, ASIENTO_PERSONAL]
        nulo_significa: La fila es visible (`restringido = false`).
      saldo_acumulado_visible:
        significado: >-
          Lo que publica `contabilidad.mayor_analitico` como `saldo_acumulado`:
          el saldo de la cuenta sumando SOLO lo visible. Difiere de
          `saldo_acumulado` en las cuentas mixtas.
        unidad: EUR
        agregacion: ultimo_valor
        nulo_significa: La fila esta restringida.
    relaciones:
      - de: cuenta_analitica_id
        a: maestro.cuentas_analiticas.cuenta_analitica_id
        cardinalidad: "N:1"
        porque: La cuenta analitica en el catalogo, con su padre, su nivel y su centro.
      - de: centro_coste_id
        a: maestro.centros_coste.centro_coste_id
        cardinalidad: "N:1"
        porque: El centro de coste de la fila, del que sale la obra.
      - de: obra_id
        a: maestro.obras.obra_id
        cardinalidad: "N:1"
        porque: La ficha de la obra del centro de la fila.
      - de: obra_imputada_id
        a: maestro.obras.obra_id
        cardinalidad: "N:1"
        porque: La ficha de la obra a la que el asiento ANALITICO imputa los partes.
      - de: apunte_id
        a: contabilidad_restringida.mayor.apunte_id
        cardinalidad: "N:1"
        porque: El apunte financiero del que la fila es reparto, con su cuenta del plan y su tercero.
      - de: cuenta_analitica_id
        a: personal.recursos.cuenta_analitica_contrapartida_id
        cardinalidad: "N:N"
        porque: >-
          Los recursos cuya CP es la cuenta de la fila (hasta 8 por CP). Solo
          casan las CP: en el resto de cuentas no hay recurso, y check-relaciones
          avisa de una cobertura parcial que es la esperada.
    ejemplos_preguntas:
      - Saldo de la cuenta de contrapartida del recurso X en la obra Y
      - CP del recurso X frente a sus partes
      - Mayor analitico de la cuenta X del centro Y
      - Cuantas filas analiticas restringidas hay por motivo en 2025

  saldos_cuenta_analitica_mes:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **ACCESO RESTRINGIDO: solo el perfil total del MCP.** Si no lo tienes, la
      consulta devuelve «permission denied»: usa
      `contabilidad.saldos_cuenta_analitica_mes` (`R-PERFILES`), sin reintentar
      ni buscar otro camino.

      **SOLO PARA EL ROL AUTORIZADO** (`sigrid_dm_autorizado_ro`, F-127): los
      saldos ANALITICOS COMPLETOS, con las cuentas de contrapartida (CP) de los
      trabajadores. Los generales solo suman lo visible y marcan con
      `incompleto` lo que esta recortado.

      **LOS SALDOS POR CUENTA ANALITICA, CENTRO Y MES** (F-127), construidos
      desde `contabilidad_restringida.mayor_analitico`: una fila por cuenta
      analitica, centro, empresa, ejercicio y mes con alguna fila (182.457 el
      2026-11-21). Sin columnas por clase: la analitica no tiene cierres ni
      aperturas, y `importe` (debe - haber) SI se suma. La suma de `importe` por
      cuenta es la del mayor analitico. El centro va en la clave porque el
      reparto lleva filas de una cuenta a otro centro: el saldo de una cuenta es
      la suma de sus centros. Las filas sin cuenta o sin centro van con 0.
      **No se suma con `contabilidad_restringida.saldos_cuenta_mes`**, que es
      el mayor financiero.

      **EL SALDO DE UNA CP** (Juan Romero, Control de Costes, correo del 2026-11-20): es «nomina menos partes» solo hasta marzo
      de 2026. Desde abril de 2026 la nomina se cierra en Cegid y la CP ya no
      recibe la de cada trabajador; y el abono de los partes solo llega cuando
      el parte pasa de CER (cerrado) a IMP (imputado), asi que en 2026 falta
      casi todo. Restringidas todas las CP: las de los recursos y las del
      centro `CP`.
    grano: >-
      Una fila por (`cuenta_analitica_id`, `centro_coste_id`, `empresa_id`,
      `ejercicio`, `mes`) con alguna fila analitica. Un mes sin movimiento no
      tiene fila: su saldo es el `saldo_acumulado` del ultimo mes con fila.
    clave_negocio: [cuenta_analitica_id, centro_coste_id, empresa_id, ejercicio, mes]
    paso_etl: build_contabilidad
    refresco: nocturno
    columnas:
      cuenta_analitica_id:
        significado: La cuenta analitica (`maestro.cuentas_analiticas`), o 0 para las filas sin cuenta.
        agregacion: no_sumable
      centro_coste_id:
        significado: El centro de coste de las filas, o 0 para las filas sin centro.
        agregacion: no_sumable
      empresa_id:
        significado: Empresa de las filas (la del asiento).
        agregacion: no_sumable
      ejercicio:
        significado: Ano de las filas (el de su fecha).
        agregacion: no_sumable
      mes:
        significado: Mes de las filas (1-12).
        agregacion: no_sumable
      num_apuntes:
        significado: Filas analiticas de esa cuenta, centro y mes.
        agregacion: suma
      debe:
        significado: Debe de las filas del mes.
        unidad: EUR
        agregacion: suma
      haber:
        significado: Haber de las filas del mes.
        unidad: EUR
        agregacion: suma
      importe:
        significado: Debe menos haber del mes. Se suma entre meses.
        unidad: EUR
        agregacion: suma
      saldo_acumulado:
        significado: Saldo de (cuenta, centro, empresa) a fin de mes. No se suma entre meses.
        unidad: EUR
        agregacion: ultimo_valor
    relaciones:
      - de: cuenta_analitica_id
        a: maestro.cuentas_analiticas.cuenta_analitica_id
        cardinalidad: "N:1"
        porque: La cuenta analitica en el catalogo (el 0 de las filas sin cuenta no casa).
      - de: centro_coste_id
        a: maestro.centros_coste.centro_coste_id
        cardinalidad: "N:1"
