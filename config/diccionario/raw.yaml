      Es una tabla de traduccion. Quien pregunte en que estado esta un contrato tiene que mirar el estado del documento y traducirlo aqui, y eso lo resolvera F-067 en `stg`.
    descripcion: >-
      **CATALOGO DE ESTADOS DE DOCUMENTO** (193 filas, 17 columnas). Sin ella, el estado de un contrato o de una factura es un numero suelto que nadie puede interpretar.

      **La traduccion va por `tip`, el tipo de documento**, y esto es lo que hay que saber antes de usarla: la tabla cubre 29 tipos distintos y **la misma cifra significa cosas distintas en cada uno**. Traducir el estado de una factura con la fila de un contrato da un nombre plausible y falso. Para los contratos, los siete estados medidos el 2026-09-06 son 1 pendiente de firma previa, 3 enviado, 5 recibido, 6 comprometido, 7 firmado, 8 terminado y 9 resuelto; 13.418 contratos estan en el 7.

      Lo que ni esta tabla ni ninguna otra guardan es **cuando** un documento entro en su estado actual. Lo mas cercano es la marca de ultima modificacion del concepto, que sirve de aproximacion mientras F-067 no acumule su foto diaria.

      **Que significa cada columna**: esta ficha no las documenta (DA-2). El diccionario completo de campos, tipos e indices esta en `azure-apps/sigrid_tablas.md`, en el bloque `conest`, y se localiza con `grep -n "^| conest " azure-apps/sigrid_tablas.md`. No se copia aqui porque seria una segunda version que acabaria divergiendo.

      **Como se carga.** El job nocturno arranca `run-all --full` --lo fija el `CMD` del `Dockerfile`, y `infra/80_create_job.ps1` avisa de que el alcance esta escrito ahi y en ningun sitio mas--, asi que cada noche la tabla se **recarga entera** desde Sigrid: lo que cambio ayer en Sigrid esta aqui esta manana.

      **No se traen** 13 columnas de binario o texto ilimitado: la lista estandar de documentos que comparten todas las tablas de compras del ETL; esta tabla no tiene la mayoria de esos nombres, y excluir un nombre inexistente es inofensivo. Preguntar por ellas aqui no devuelve nulo, devuelve "columna inexistente".
