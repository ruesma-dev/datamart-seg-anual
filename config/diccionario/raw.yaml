      de `cierre` y el presupuesto.

      El ETL no lee de aqui ningun `cod`, `res` ni `fec`: los toma de `con`.
      Que exista o no un campo con ese nombre en la tabla de Sigrid **no se
      afirma en esta ficha**, porque la unica fuente que lo diria es el
      catalogo en PDF y no es verificable; para eso, el puntero de abajo.

      **Que significa cada columna**: esta ficha no las documenta (DA-2), y
