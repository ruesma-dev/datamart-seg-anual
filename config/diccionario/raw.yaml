    grano: Una fila por extension de concepto, identificada por `ide`.
    clave_negocio: [ide]
    paso_etl: ingest_raw
    refresco: nocturno
    columnas: {}

  obr:
    tipo: tabla
    capa: origen
    consumo_recomendado: false
    motivo_no_consumo: >-
      El codigo, el nombre y las fechas que el datamart publica salen de `con`:
      `maestro/01_obras.sql` toma `c.cod`, `c.res` y `c.fec` de `raw.con` y de
      aqui solo `entide`. Consultarla sola da una obra sin ninguno de los tres.
      Lo unido y traducido esta en `maestro.obras` y en `stg.obras`.
    descripcion: >-
      **Obras.** "Propiedades de `con`" en 1:1: la parte especifica de obra
