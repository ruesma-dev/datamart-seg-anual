# config/diccionario/raw.yaml
#
# Fichas del esquema `raw`: la copia literal de Sigrid, tabla a tabla.
#
# **A NIVEL DE OBJETO, NO DE COLUMNA** (DA-2 de la spec). Son 31 tablas con
# cientos de campos de cuatro letras cuyo diccionario completo —tipos, indices y
# referencias— ya existe y esta mantenido en `azure-apps/sigrid_tablas.md`.
# Copiarlo aqui crearia una segunda version que divergiria; cada ficha apunta
# alli. Lo que SI se documenta es lo que ese documento no dice: que tabla
# alimenta que parte del datamart, cual esta vacia, y cual se ingiere sin que
# nadie la use.
#
# **NINGUNA de estas tablas es superficie de consulta.** No es una preferencia
# de estilo: aqui no hay semantica de negocio, y quien pregunte sobre negocio
# tiene la respuesta ya traducida aguas abajo. Cada ficha dice donde.
#
# ---------------------------------------------------------------------------
# LA REGLA DE ORO DE SIGRID
# ---------------------------------------------------------------------------
# Sin esto, `raw` es ilegible; con esto, casi todo encaja. Verificado en la
# entidad `con` de `sigrid_tablas.md` (pagina 94) y en las cabeceras de las
# demas tablas.
#
# 1. **`ide` es la clave de TODAS las tablas.** Se llama igual en las 31, es el
#    INDICE PRIMARIO y es unico. Un campo que acabe en `ide` en otra tabla
#    —`conide`, `entide`, `obride`— es una referencia a ese `ide`.
# 2. **Muchas tablas son "Propiedades de `con`" en 1:1.** Es literalmente lo que
#    pone su cabecera en Sigrid. `obr`, `prv`, `cen`, `ctr`, `com`, `dca`,
#    `dcf`, `cob`, `pag` y `rec` NO son entidades completas: son la extension
#    especifica de un CONCEPTO, y comparten su `ide` con la fila de `con`.
# 3. **`cod`, `res` y `fec` viven en `con`, no en la tabla especifica.** El
#    codigo, la descripcion y la fecha de alta de una obra, de un proveedor o de
#    una factura estan todos en `con`. Por eso casi todas las consultas del ETL
#    empiezan uniendo la tabla con `con` por `ide`.
# 4. **`con.nom` NO EXISTE.** El nombre legible es `con.res` ("Resumen"). Es el
#    error mas facil de cometer al escribir una consulta contra Sigrid, y no
#    falla con un dato raro: falla con "columna inexistente".
# 5. **Las fechas son ENTEROS `YYYYMMDD`**, tipo "Entero tipo fecha" en Sigrid.
#    Y **`0` no es una fecha, es el NULL**: Sigrid no guarda nulos en los
#    enteros. Un `MIN(fecha)` sin excluir el cero devuelve cero.
#
# Esta regla se publica ademas como `R-SIGRID-CON` en el bloque global, para que
# el agente la reciba entera antes de escribir ninguna consulta.
#
# ---------------------------------------------------------------------------
# Lo que dice cada ficha
# ---------------------------------------------------------------------------
# - Que es la tabla en Sigrid, con la descripcion literal del autodocumentador.
# - **Que parte del datamart la usa**, o que NO la usa nadie. Seis de las 31 se
#   ingieren y no las lee ningun SQL: se dice en su ficha, porque una tabla que
#   se carga cada noche sin consumidor cuesta tiempo de ventana y hace creer que
#   hay una funcionalidad que no existe. Una de esas seis, `auxobrtca`, tampoco
#   se consulta pero SI se comprueba: `build_stg` aborta si le faltan columnas.
#   Que ningun SQL lea una tabla no significa que se pueda dejar de ingerir.
# - Si la carga es INCREMENTAL por `tiemod` o completa cada noche.
# - Que columnas NO se traen (`exclude_columns` de `config/tables_sigrid.yaml`):
#   son textos largos, observaciones e imagenes. Preguntar por ellas en `raw`
#   no devuelve nulo, devuelve "columna inexistente".
#
# Contrastado con `config/tables_sigrid.yaml` (las 31 entradas, sus
# `incremental_column` y sus `exclude_columns`) y con los SQL de
# `etl_sigrid/infrastructure/postgres/sql/` para saber quien consume cada una.

version: 1
esquema: raw

objetos:

  con:
    tipo: tabla
    capa: origen
    consumo_recomendado: false
    motivo_no_consumo: >-
      Es la tabla central de Sigrid, no una tabla de negocio: mezcla obras,
      proveedores, facturas, albaranes y todo lo demas en las mismas filas,
      distinguidos por `tip`. Para obras esta `maestro.obras`, para proveedores
      `maestro.proveedores` y para documentos de compra `compras.contratos`,
      `compras.albaranes` y `compras.facturas`.
    descripcion: >-
      **Conceptos.** El corazon del modelo de Sigrid y la tabla de la que
      cuelga casi todo lo demas. Aqui viven `cod` (codigo), `res` (el nombre
      legible; **no existe `nom`**), `fec` (fecha de alta como entero
      `YYYYMMDD`), `est` (estado), `fecbaj` (fecha de baja) y `obr`. Las
      tablas "Propiedades de `con`" —`obr`, `prv`, `ctr`, `dcf` y las demas—
      comparten su `ide` con una fila de aqui, y por eso casi toda consulta
      contra Sigrid empieza uniendo con esta tabla.

      Se carga por **append por `MAX(ide)`**: cada noche se piden a Sigrid
      solo las filas con `ide` mayor que el maximo ya guardado. La
      consecuencia practica es que **una fila modificada en Sigrid no se
      refresca** aqui, y una borrada alli se queda. La recarga completa
      existe —`--full-refresh`, que hace `TRUNCATE`— pero **`run-all` no la
      pasa**: hay que lanzarla a mano.

      **No se traen** 2 columnas de esta tabla: textos largos, observaciones
      e imagenes. Preguntar por ellas aqui no devuelve nulo, devuelve
      "columna inexistente".

      **Que significa cada columna**: esta ficha no las documenta (DA-2), y
      el diccionario completo de campos, tipos e indices esta en
      `azure-apps/sigrid_tablas.md`, en el bloque `con`. Se busca con `grep
      -n "^| con " azure-apps/sigrid_tablas.md`. No se copia aqui porque
      seria una segunda version que acabaria divergiendo.
    grano: Una fila por concepto, identificada por `ide`.
    clave_negocio: [ide]
    paso_etl: ingest_raw
    refresco: nocturno
    columnas: {}

  conext:
    tipo: tabla
    capa: origen
    consumo_recomendado: false
    motivo_no_consumo: >-
      Campos configurables cuyo significado depende de como los use cada
      empresa. Lo que el datamart saca de aqui ya esta interpretado en
      `stg.obras` y en la eleccion de version master.
    descripcion: >-
      **Campos extendidos de concepto.** Atributos adicionales que Sigrid
      deja definir por encima de los fijos de `con`. El ETL los lee en
      `stg/03_obras` y en `stg/07_version_master_vigente`.

      Se carga por **append por `MAX(ide)`**: cada noche se piden a Sigrid
      solo las filas con `ide` mayor que el maximo ya guardado. La
      consecuencia practica es que **una fila modificada en Sigrid no se
      refresca** aqui, y una borrada alli se queda. La recarga completa
      existe —`--full-refresh`, que hace `TRUNCATE`— pero **`run-all` no la
      pasa**: hay que lanzarla a mano.

      **Que significa cada columna**: esta ficha no las documenta (DA-2), y
      el diccionario completo de campos, tipos e indices esta en
      `azure-apps/sigrid_tablas.md`, en el bloque `conext`. Se busca con
      `grep -n "^| conext " azure-apps/sigrid_tablas.md`. No se copia aqui
      porque seria una segunda version que acabaria divergiendo.
    grano: Una fila por extension de concepto, identificada por `ide`.
    clave_negocio: [ide]
    paso_etl: ingest_raw
    refresco: nocturno
    columnas: {}

  obr:
    tipo: tabla
    capa: origen
    consumo_recomendado: false
    motivo_no_consumo: >-
      El codigo y las fechas de la obra estan en `con`, no aqui, asi que
      consultarla sola da una obra sin codigo. Lo unido y traducido esta en
      `maestro.obras` y en `stg.obras`, que ademas toman el nombre de `con.res`
      —no del `obr.res` propio, que es otro campo—.
    descripcion: >-
      **Obras.** "Propiedades de `con`" en 1:1: la parte especifica de obra
      de un concepto. Alimenta `stg.obras`, `maestro.obras`, las cabeceras
      de `cierre` y el presupuesto.

      **Tiene campos propios que se llaman igual que los de `con`**:
      `obr.res` es "Nombre completo", distinto del `con.res` que el datamart
      publica como `nombre_obra`. Es una de las excepciones que
      `R-SIGRID-CON` nombra: no asumas que el nombre esta solo en `con`, ni
      que el de aqui es el mismo.

      Se carga por **append por `MAX(ide)`**: cada noche se piden a Sigrid
      solo las filas con `ide` mayor que el maximo ya guardado. La
      consecuencia practica es que **una fila modificada en Sigrid no se
      refresca** aqui, y una borrada alli se queda. La recarga completa
      existe —`--full-refresh`, que hace `TRUNCATE`— pero **`run-all` no la
      pasa**: hay que lanzarla a mano.

      **Que significa cada columna**: esta ficha no las documenta (DA-2), y
      el diccionario completo de campos, tipos e indices esta en
      `azure-apps/sigrid_tablas.md`, en el bloque `obr`. Se busca con `grep
      -n "^| obr " azure-apps/sigrid_tablas.md`. No se copia aqui porque
      seria una segunda version que acabaria divergiendo.
    grano: >-
      Una fila por obra, identificada por `ide`, que es el mismo `ide` de su
      fila en `raw.con`.
    clave_negocio: [ide]
    paso_etl: ingest_raw
    refresco: nocturno
    columnas: {}

