    grano: Una fila por linea de presupuesto, identificada por `ide`.
    clave_negocio: [ide]
    paso_etl: ingest_raw
    refresco: nocturno
    columnas: {}

  obrfas:
    tipo: tabla
    capa: origen
    consumo_recomendado: false
    motivo_no_consumo: >-
      Su campo `fasnum` es el `fas` ambiguo de Sigrid sin interpretar.
      `stg.fases` ya lo trae con su descripcion y sus fechas, y
      `mart.v_master_versiones_tipadas` ademas deduce el tipo de master.
    descripcion: >-
      **Obras: Fases.** Las fases de cada obra, que segun el ambito son
      MESES o VERSIONES del master. El campo se llama aqui `fasnum`, y
      `fase_num` / `version` aguas abajo. Alimenta `stg.fases`.

      Se carga por **append por `MAX(ide)`**: cada noche se piden a Sigrid
      solo las filas con `ide` mayor que el maximo ya guardado. La
      consecuencia practica es que **una fila modificada en Sigrid no se
