    descripcion: >-
      **Obras: Partidas.** El arbol de capitulos y partidas de cada obra. Es
      de donde sale `stg.partidas`, incluida la heuristica de categoria
      sobre el codigo del capitulo raiz.

      Se carga por **append por `MAX(ide)`**: cada noche se piden a Sigrid
