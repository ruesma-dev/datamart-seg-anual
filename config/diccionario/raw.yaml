# config/diccionario/raw.yaml
#
# Fichas del esquema `raw`: la copia de Sigrid, tabla a tabla.
#
# **A NIVEL DE OBJETO, NO DE COLUMNA** (DA-2 de la spec). Son 70 tablas con
# cientos de campos de cuatro letras cuyo diccionario completo —tipos, indices y
# referencias— vive en `azure-apps/sigrid_tablas.md`. Cada ficha remite alli con
# el `grep` de su bloque. Lo que SI se documenta aqui es lo que ese documento no
# dice: que tabla alimenta que parte del datamart, cual esta vacia, cual se
# ingiere sin que nadie la use, y como se carga.
#
# **NINGUNA de estas tablas es superficie de consulta.** Aqui no hay semantica de
# negocio, y quien pregunte sobre negocio tiene la respuesta ya traducida aguas
# abajo. Cada ficha dice donde.
#
# ---------------------------------------------------------------------------
# LA REGLA DE ORO NO SE COPIA AQUI. Esta en `R-SIGRID-CON` (00_global.yaml).
# ---------------------------------------------------------------------------
# Esta cabecera tuvo una version resumida de la regla, y **divergio**: la
# septima pasada de review corrigio la regla publicada y la copia de aqui
# sobrevivio intacta, afirmando lo contrario y declarandose «la misma regla».
# Fue el quinto rechazo por el patron de la copia, y por eso ahora hay un
# barrido automatico (`tests/test_f006_copias.py`) que mira **el texto crudo,
# comentarios incluidos**.
#
# Regla de mantenimiento: lo que el agente tiene que saber va en la regla o en
# la ficha, que son lo que se publica. Un comentario que repite una afirmacion
# publicada es una copia esperando a divergir.
#
# ---------------------------------------------------------------------------
# De donde sale lo que estas fichas afirman
# ---------------------------------------------------------------------------
# Cada afirmacion se deriva de la fuente que GOBIERNA el hecho, y no de la que
# habla de algo parecido. Costo dos revisiones aprenderlo:
#
#   que corre de noche          -> `Dockerfile` (`CMD ["run-all", "--full"]`)
#   como carga segun la bandera -> `ingest_raw_step.py`
#   como se llama la bandera    -> los `click.option` de `main.py`
#   que campos propios existen  -> nuestro SQL, que no correria contra una
#                                  columna inexistente
#
# `sigrid_tablas.md` **no esta en esa lista**: es la conversion literal de un PDF
# de 380 paginas, no se deja segmentar, y los dos intentos de derivar de el
# produjeron una afirmacion falsa. Sirve para consultar una columna concreta a
# mano; no para respaldar una ficha.
#
# Contrastado con `config/tables_sigrid.yaml` (las 65 entradas y sus
# `exclude_columns`) y con `etl_sigrid/infrastructure/postgres/sql/`.

version: 1
esquema: raw

objetos:

  con:
    tipo: tabla
    capa: origen
    consumo_recomendado: false
    motivo_no_consumo: >-
      Es la tabla central de Sigrid, no una tabla de negocio: mezcla obras,
      proveedores, facturas, albaranes y todo lo demas en las mismas filas,
      distinguidos por `tip`. Para obras esta `maestro.obras`, para proveedores
      `maestro.proveedores` y para documentos de compra `compras.contratos`,
      `compras.albaranes` y `compras.facturas`.
    descripcion: >-
      **Conceptos.** El corazon del modelo de Sigrid y la tabla de la que
      cuelga casi todo lo demas. Aqui viven `cod` (codigo), `res` (el nombre
      legible; **no existe `nom`**), `fec` (fecha de alta como entero
      `YYYYMMDD`), `est` (estado), `fecbaj` (fecha de baja) y `obr`. Las
      tablas "Propiedades de `con`" —`obr`, `prv`, `ctr`, `dcf` y las demas—
      comparten su `ide` con una fila de aqui, y por eso casi toda consulta
      contra Sigrid empieza uniendo con esta tabla.

      **Que significa cada columna**: esta ficha no las documenta (DA-2), y
      el diccionario completo de campos, tipos e indices esta en
      `azure-apps/sigrid_tablas.md`, en el bloque `con`. Se localiza con
      `grep -n "^| con " azure-apps/sigrid_tablas.md`, que devuelve el
      arranque del bloque **y tambien las filas de otras tablas con un campo
      llamado `con`**: la de entidad es la que lleva la descripcion en la
      segunda columna. No se copia aqui porque seria una segunda version que
      acabaria divergiendo.

      **Como se carga.** El job nocturno desplegado arranca `run-all --full`
      —lo fija el `CMD` del `Dockerfile`, y `infra/80_create_job.ps1` avisa
      de que el alcance esta escrito ahi y en ningun sitio mas—, asi que
      cada noche la tabla **se recarga entera**: `TRUNCATE` y todo de nuevo
      desde Sigrid. Un cambio hecho ayer en Sigrid esta aqui esta manana.

      Sin `--full` —el valor por defecto, tipico al lanzar `ingest` a mano
      en local— la carga es un **append por `MAX(ide)`**: solo entran las
      filas con `ide` mayor que el maximo guardado, y entonces una fila
      modificada en Sigrid no vuelve a leerse. Los dos modos existen; el que
      corre de noche es el primero.

      **No se traen** 1 columna: solo `ima`, la imagen del concepto.
      Preguntar por ella aqui no devuelve nulo, devuelve "columna
      inexistente".

      **EL MEMO DEL DOCUMENTO SI SE TRAE, DESDE F-080** (2026-09-11). La
      pestana "Texto" que se ve en una factura de compra o en un contrato
      se pinta desde este memo de la superclase, y no desde el campo
      homonimo de la tabla del documento: informado en 108.527 de 165.759
      facturas (65,5 %) frente a 474 de 165.658 en `dcf` (0,3 %). Quien
      quiera leerlo ya partido en comentarios tiene
      `compras.documento_comentarios`, y entero, `compras.documento_texto`.
    grano: Una fila por concepto, identificada por `ide`.
    clave_negocio: [ide]
    paso_etl: ingest_raw
    refresco: nocturno
    columnas: {}

