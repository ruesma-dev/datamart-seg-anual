    grano: Una fila por partida o capitulo de obra, identificada por `ide`.
    clave_negocio: [ide]
    paso_etl: ingest_raw
    refresco: nocturno
    columnas: {}

  obrparpre:
    tipo: tabla
    capa: origen
    consumo_recomendado: false
    motivo_no_consumo: >-
      Es el presupuesto SIN explotar a meses y con la ambiguedad de `fas` sin
      resolver. `stg.presupuesto` lo normaliza, `stg.plan_mensual` lo explota y
      `mart.fact_seguimiento_mensual` elige ademas la version vigente.
      Consultarla directamente es donde se producen los importes multiplicados.
    descripcion: >-
      **Obras: Presupuestos y mediciones.** La tabla mas voluminosa que se
      ingiere y el origen de todo el seguimiento economico: importes por
      obra, partida, ambito y fase.

      Se carga por **append por `MAX(ide)`**: cada noche se piden a Sigrid
      solo las filas con `ide` mayor que el maximo ya guardado. La
      consecuencia practica es que **una fila modificada en Sigrid no se
      refresca** aqui, y una borrada alli se queda. La recarga completa
      existe —`--full-refresh`, que hace `TRUNCATE`— pero **`run-all` no la
      pasa**: hay que lanzarla a mano.

      **No se traen** 3 columnas de esta tabla: textos largos, observaciones
      e imagenes. Preguntar por ellas aqui no devuelve nulo, devuelve
      "columna inexistente".

      Se pide paginada de 5000 en 5000.

      **Que significa cada columna**: esta ficha no las documenta (DA-2), y
      el diccionario completo de campos, tipos e indices esta en
      `azure-apps/sigrid_tablas.md`, en el bloque `obrparpre`. Se busca con
