  rpa:
    tipo: tabla
    capa: origen
    consumo_recomendado: false
    motivo_no_consumo: >-
      Sin unirla a `con` no tiene ni codigo ni descripcion, y sin unirla a `pag` no se sabe que efectos lleva dentro. Lo que hace falta para leer un vencimiento --codigo de remesa, fecha, importe y banco-- ya viene resuelto en `compras.vencimientos`.
    descripcion: >-
      **Remesas de pago** (3.919 filas MEDIDAS el 2026-09-11), a donde apunta `pag.remide`: 40.090 de los 195.510 efectos de factura de compra estan dentro de una remesa. Trae `fecrem` (fecha de la remesa, entero AAAAMMDD), `imptot` (importe total) y el bloque bancario completo.

      **LA TRAMPA DE SIEMPRE, y van cuatro**: `rpa` es "Propiedades de `con`", o sea que **la remesa ES UN DOCUMENTO** (`tip = 27`) y ni su codigo --`RP26/0254`-- ni su descripcion --"REMESA CONFIRMING SABADELL"-- estan aqui: viven en `raw.con` con el mismo `ide`. MEDIDO: las 3.919 tienen su fila en `con`. Antes de dar por inexistente un campo de un documento de Sigrid, se mira `con`.

      Las remesas de COBRO son `rco` y no se ingieren: eso es el lado de venta (F-037).

      **Que significa cada columna**: esta ficha no las documenta (DA-2). El diccionario completo de campos, tipos e indices esta en `azure-apps/sigrid_tablas.md`, en el bloque `rpa`, y se localiza con `grep -n "^| rpa " azure-apps/sigrid_tablas.md`. No se copia aqui porque seria una segunda version que acabaria divergiendo.

      **Como se carga.** El job nocturno arranca `run-all --full` --lo fija el `CMD` del `Dockerfile`, y `infra/80_create_job.ps1` avisa de que el alcance esta escrito ahi y en ningun sitio mas--, asi que cada noche la tabla se **recarga entera** desde Sigrid: lo que cambio ayer en Sigrid esta aqui esta manana.
    grano: Una fila por remesa de pago, identificada por `ide`, el mismo de su fila en `raw.con`.
    clave_negocio: [ide]
    paso_etl: ingest_raw
    refresco: nocturno
    columnas: {}
