# config/diccionario/00_global.yaml
#
# El bloque global del diccionario semantico del datamart (F-006).
#
# Esto es lo que el agente lee ANTES de escribir una linea de SQL. Aqui van las
# convenciones, los nueve esquemas, las reglas duras que impiden respuestas
# plausibles y falsas, los ordenes de magnitud contra los que detectar un
# disparate, la bateria de aceptacion y la lista de lo que todavia no esta
# documentado.
#
# `pendientes` es un TRINQUETE (R27): solo baja. La constante PENDIENTES_MAX de
# tests/test_f006_cobertura.py vale exactamente lo que hay aqui, y al cerrar
# F-006 esta lista queda vacia.
#
# version 11 (F-042, 2026-08-29): un solo cierre por mes en los ambitos reales.
# Se retira de `mart` el aviso de dato doblado -`importe_origen` venia al doble
# en 35 celdas de 7 obras, 30.425.881,56 EUR- porque el build ya publica una
# sola fila por (obra, partida, mes, escenario). La regla que lo consigue y sus
# consecuencias visibles -que `stg.plan_mensual.version` queda con HUECOS en 9
# obras, porque se publica el numero de fase original de Sigrid sin renumerar-
# quedan descritas en las fichas de `stg.plan_mensual`,
# `mart.fact_seguimiento_mensual` y `mart.fact_seguimiento_categoria`. El aviso
# baja ademas a `mart.v_pbi_fact_categoria` y a `cierre.v_pbi_planif_vs_real`,
# que son la superficie que Power BI y el MCP abren de verdad y que no llevaban
# ninguno.
#
# version 10 (F-047, 2026-08-28): `cierre`, `compras`, `maestro` y
# `retenciones` pasan de `refresco: manual` a `nocturno` porque sus cuatro
# build entraron en `run-all`, y `R-FRESCURA-MANUAL` pasa a llamarse
# `R-FRESCURA` porque lo que decia -que la nocturna construye SOLO raw, stg y
# mart- dejo de ser cierto.

version: 11
base: sigrid_dm
titulo: Datamart de seguimiento anual de obra

# ===========================================================================
# REGLAS DURAS (R9)
# ===========================================================================
#
# No son consejos: son la diferencia entre un numero correcto y uno plausible
# y falso. Cada una nace de una trampa concreta del modelo, y varias de un
# error real que se dio y costo tiempo. Por eso todas llevan `motivo`: una
# regla sin porque se desobedece a la primera.
#
# El `ambito` es lo que hace que la regla llegue al agente: el validador
# adjunta su codigo a la ficha de cada objeto alcanzado (R12), asi que quien
# solo consulte `describir_tabla` ve sus trampas sin haber leido esto.

reglas:

  - codigo: R-FRESCURA
    titulo: Cuatro esquemas pueden quedarse atras sin tumbar la noche
    severidad: bloqueante
    ambito: [cierre, compras, maestro, retenciones]
    regla: >-
      Desde F-047 estos cuatro esquemas SI se construyen cada noche dentro de
      `run-all`, y los cuatro registran paso, asi que su fecha de build siempre
      es consultable. Lo que no cambia es que su paso NO es dependencia de
      ningun otro: si `build_cierre`, `build_compras`, `build_maestros` o
      `build_retenciones` falla, la noche continua y termina, y ese esquema se
      queda con el dato de una noche anterior mientras `raw`, `stg` y `mart`
      estan al dia. Toda respuesta que salga de ellos DEBE citar su fecha de
      build: `SELECT * FROM _meta.v_frescura WHERE paso = 'build_cierre'` (o
      `build_compras`, `build_maestros`, `build_retenciones`). Que el pipeline
      sea uno solo NO significa que todo el datamart tenga la misma frescura.
    motivo: >-
      La composicion real esta en `main.build_pipeline_steps`, y sus pasos se
      llaman —con el mismo nombre que tienen en `_meta.v_frescura.paso`, que es
      donde se consulta su frescura— `ingest_raw`, `load_excel_aux`,
      `build_stg`, `build_mart`, `build_maestros`, `build_compras`,
      `build_retenciones`, `build_cierre`, `publicar_diccionario` y
      `apply_grants`. Hasta el 2026-08-28 los cuatro se lanzaban A MANO y podian
      llevar semanas parados; peor aun, `mart` DESTRUIA cada noche
      `cierre.v_pbi_planif_vs_real` —cuelga de
      `mart.fact_seguimiento_categoria`, que `03_agg_categoria.sql` dropea con
      CASCADE— y nadie la recreaba. Dar un dato de `cierre` sin fecha es dar una
      respuesta vieja con aplomo.

  - codigo: R-IMPORTE-MES
    titulo: importe_mes no se suma entre meses; importe_origen ya es acumulado
    severidad: bloqueante
    ambito:
      - mart.fact_seguimiento_mensual
      - mart.fact_seguimiento_categoria
      - mart.v_pbi_fact
      - mart.v_pbi_fact_categoria
      - mart.v_fact_periodificado
      - stg.plan_mensual
      - cierre.fact_cierre_mensual
      - cierre.v_pbi_cierre_resumen
      - cierre.v_pbi_cierre_indirectos_detalle
      - cierre.v_pbi_cierre_generales_detalle
    regla: >-
      Todo importe del datamart viene en pareja: uno del MES y otro ACUMULADO A
      ORIGEN. Para una serie temporal se suma el del mes; el acumulado ya lleva
      dentro todos los meses anteriores, asi que sumarlo a lo largo del tiempo
      multiplica el resultado, y de un total de un periodo se toma su valor del
      ULTIMO mes, no la suma. La pareja cambia de nombre segun el esquema: en
      `mart` y en `stg` son `importe_mes` e `importe_origen`; **en `cierre` son
      `ejecutado_mes` y `ejecutado_origen`**, y la trampa es identica.
    motivo: >-
      Fue el bug de la Tanda 1.4 del cierre: multiplicaba por unas nueve veces
      (`sql/cierre/02_build_fact.sql`). Esta escrito con los nombres de los dos
      esquemas precisamente porque el bug ocurrio en `cierre` y la regla se
      redacto mirando a `mart`. El numero salia grande pero creible, que es
      exactamente lo peligroso.

  - codigo: R-UNIVERSO-OBRA
    titulo: Hay dos universos de obra y no cuentan lo mismo
    severidad: bloqueante
    ambito:
      - stg.obras
      - maestro.obras
      - mart.v_pbi_dim_obra
    regla: >-
      `stg.obras` es el universo del SEGUIMIENTO: excluye codigos
      administrativos (0001-0005, CM, CP, GG, VAR, POSTV*, BD*, GGD, GINT, OT),
      excluye codigos con cinco o mas digitos seguidos y deduplica por el
      mecanismo de Sigrid `conext.cod = '15'`. `maestro.obras` NO filtra nada:
      es superconjunto. Toda respuesta que cuente obras debe decir cual usa.
      `compras` y `retenciones` tampoco filtran por `stg.obras` y pueden traer
      obras administrativas que el seguimiento excluye.
    motivo: >-
      Los filtros estan en `sql/stg/03_obras.sql`; `sql/maestro/01_obras.sql` no
      tiene ninguno. Contar en una o en otra da cifras distintas a proposito, y
      dar la del maestro como "obras de la empresa" infla el numero.

  - codigo: R-PROVEEDOR-INTRAGRUPO
    titulo: El mayor proveedor de la empresa es la propia empresa
    severidad: bloqueante
    ambito:
      - compras.fact_compras_linea
      - compras.v_pbi_proveedor_obra
      - maestro.proveedores
      - maestro.proveedores_obra
    regla: >-
      **Todo ranking de "a quien le hemos comprado mas" tiene que decir que
      hace con las operaciones intragrupo, porque el numero 1 es la propia
      empresa.** Medido el 2026-08-25 sobre `compras.fact_compras_linea` con
      `tipo_doc IN ('FACTURA','ABONO')`: `CONSTRUCCIONES RUESMA, S.A.` (CIF
      `A81873903`) encabeza la lista con **23,8 M€**, mas del doble que el
      segundo. Y detras hay varias **UTE** —`UTE VALDEBEBAS VI` 9,7 M€,
      `UTE JARAS BOADILLA` 8,1 M€— que son coinversiones, no proveedores
      externos. Un ranking que las mezcle sin avisar dice que nuestro mayor
      proveedor somos nosotros, que es cierto y no es lo que preguntaban.
      Como no hay ninguna marca de grupo en el datamart, la unica salida hoy es
      **declararlo en la respuesta**: dar la lista tal cual y decir cuales son
      intragrupo, o excluirlos por CIF diciendo que se han excluido.
    motivo: >-
      Es uno de los seis casos de uso del humano y salio mal en la primera
      pregunta de la bateria del 2026-08-22. **Resolverlo bien exige modelar el
      intragrupo** —marcar que sociedades son del grupo y decidir que se hace
      con las UTE—, y eso no es de esta feature: aqui solo se declara la trampa
      para que ninguna respuesta la ignore.

  - codigo: R-ALBARAN-ABSURDO
    titulo: Dos lineas de un albaran de 2021 inflan las compras a 68,7 billones
    severidad: bloqueante
    ambito:
      - compras.v_pbi_albaranes_sin_facturar
      - compras.albaran_lineas
      - compras.fact_compras_linea
    regla: >-
      **Antes de dar una cifra de "entregado y no facturado", descartar las
      lineas absurdas.** Dos lineas del albaran `AC21/03345` (2021-02-28, obra
      0609, lineas 588705 y 588733, "SUMINISTRO PLATO DUCHA ACRILICO") traen
      `cantidad = 184.493.959.731` e `importe_pendiente_facturar =
      34.361.999.999.898,80 €` **cada una**. Inflan
      `compras.v_pbi_albaranes_sin_facturar` de **260,6 M€** —cifra plausible—
      a **68.724.260,6 millones de euros**, o sea 68,7 billones. Con su espejo
      negativo en `compras.albaran_lineas`. Cualquier suma sobre esas dos
      tablas tiene que llevar `WHERE abs(importe_pendiente_facturar) < 1e8`, o
      excluir ese albaran, **y decir en la respuesta que se ha excluido**.
      Si un total de compras sale por encima de mil millones de euros, no es un
      hallazgo: es esta anomalia.
    motivo: >-
      Es un problema de calidad del dato de ORIGEN, no del datamart, y por eso
      no se corrige aguas abajo. Pero el diccionario se atribuye la mision de
      que una cifra absurda **se note**, y en la bateria del 2026-08-22 no la
      cumplio: los ordenes de magnitud solo cubrian `retenciones`, asi que el
      agente dio 68,7 billones de euros con total aplomo. La barrera existia y
      no cubria el sitio donde fallo.

  - codigo: R-COSTE-CONSULTA
    titulo: Cuatro vistas no se pueden consultar, y una base compartida que cuidar
    severidad: bloqueante
    ambito:
      - mart.v_master_vigente_anual
      - mart.v_pbi_cp_tipologia
      - mart.v_fact_periodificado
      - cierre.v_pbi_cierre_indirectos_detalle
      - mart.v_master_versiones_tipadas
      - stg.plan_mensual
    regla: >-
      **Antes de lanzar una consulta hay que saber lo que cuesta**, porque esto
      corre contra `psql-albaranes-rs9k2`, **compartido con `albaranes` y
      `partes` EN PRODUCCION**, y la ventana util son 30 s. Medido el
      2026-08-25, con `SELECT * ... LIMIT 5`:
      **(1) NO SE PUEDEN CONSULTAR, ni siquiera filtradas por obra**:
      `mart.v_pbi_cp_tipologia`, `mart.v_fact_periodificado` y
      `cierre.v_pbi_cierre_indirectos_detalle` agotan **mas de 60 s**. Con
      cualquiera de las tres, la respuesta correcta es "no puedo consultarla" y
      el motivo, no una consulta que se va a cortar.
      **(2) SOLO FILTRADA**: `mart.v_master_vigente_anual` agota los 40 s con
      `LIMIT 5` y responde en **20 s** con `WHERE obra_id = ... AND anio = ...`.
      Nunca sin filtro de obra.
      **(3) CARAS PERO VIABLES, una sola vez y agregando**:
      `mart.v_master_versiones_tipadas` **16 s**, un `count(*)` de
      `stg.plan_mensual` **25 s**, uno de `compras.fact_compras_linea` **10 s**.
      **(4) BARATAS**: `maestro.obras`, `cierre.v_pbi_cierre_resumen`,
      `compras.v_pbi_proveedor_obra` y `compras.v_pbi_partida_coste`, todas por
      debajo de 5 s. Empezar siempre por estas.
    motivo: >-
      El diccionario no tenia ninguna nocion de coste: ni un `[LENTO]`, ni un
      "filtra siempre por obra". La bateria de aceptacion del 2026-08-22 se
      choco **cinco veces** con el timeout de 30 s, y
      `mart.v_master_vigente_anual` —marcada como recomendada y anunciada como
      la que responde que version de plan rige en una obra— no respondia nada.
      Un agente que no sabe que es caro lanza consultas que se cortan o, peor,
      consultas que terminan y molestan a dos aplicaciones en produccion.

  - codigo: R-OBRA-ACTIVA
    titulo: El datamart NO sabe si una obra esta activa. Las dos columnas mienten
    severidad: bloqueante
    ambito:
      - stg.obras
      - maestro.obras
      - cierre.v_pbi_cierre_cabecera
    regla: >-
      **"Cuantas obras activas tenemos" NO se puede responder con el datamart, y
      hay que decirlo en vez de dar un numero.** Las DOS columnas que lo
      aparentan valen TRUE para todas las filas: `stg.obras.activa` es un
      literal `TRUE AS activa` (583 de 583) y `maestro.obras.es_activa` se
      deriva de `con.fecbaj`, que **no se informa nunca** (919 de 919 activas,
      0 con fecha de baja, medido el 2026-08-25). Un recuento con cualquiera de
      las dos devuelve el total de obras disfrazado de obras activas. Lo que si
      discrimina, con sus limites: `maestro.obras.estado_id` reparte las 919 en
      once valores (465 en el 25, 226 en el 1, 175 en el 15 = EN CURSO), pero su
      catalogo de Sigrid **no esta ingerido**, asi que hay codigos sin nombre; y
      `cierre.v_pbi_cierre_cabecera` da **107 obras con inicio real y sin fin
      real**, que es la mejor aproximacion a "en curso" que hay hoy, pero solo
      cubre 583 de las 919. Cualquier respuesta tiene que decir cual de los tres
      criterios usa y a cuantas obras alcanza.
    motivo: >-
      `sql/stg/03_obras.sql` escribe `activa` como constante. Una columna que se
      llama `activa` y siempre dice TRUE es una trampa perfecta: nadie la
      comprueba. **Y esta regla llevaba diecisiete pasadas apartando de esa
      trampa para empujar a la gemela, que miente igual**: la bateria de
      aceptacion del 2026-08-22 midio `es_activa` TRUE en las 919 filas. Una
      regla que desvia de una trampa hacia otra identica es peor que no tener
      regla, porque da confianza injustificada.

  - codigo: R-VERSION-MASTER
    titulo: En stg.plan_mensual conviven TODAS las versiones master
    severidad: bloqueante
    ambito:
      - stg.plan_mensual
      - mart.v_master_versiones_tipadas
      - mart.v_master_vigente_anual
    regla: >-
      Consultar `stg.plan_mensual` filtrando solo por obra y ambito multiplica
      los importes por el numero de versiones master de esa obra. La version
      vigente solo esta resuelta AGUAS ABAJO: para planificado se va a
      `mart.fact_seguimiento_mensual`, nunca a `stg`. Ademas, solo son master
      vigente las de tipo 'Planif Inicial', 'ABC' y 'Cuatrimestral'; las de
      'Cierre mensual' NO reemplazan al plan.
    motivo: >-
      Los ambitos master (8 y 11) guardan una fila por version y mes. `mart`
      elige la vigente por mes con la regla de `sql/mart/02_build_fact.sql`; el
      que va a `stg` directamente se salta esa eleccion y suma todas.

  - codigo: R-FAS-AMBIGUO
    titulo: fas significa dos cosas y cambia de nombre en cada capa
    severidad: bloqueante
    ambito:
      - stg.presupuesto
      - stg.plan_mensual
      - stg.fases
      - raw.obrfas
      - raw.obrfasamb
    regla: >-
      En los ambitos REALES (3 = coste, 7 = venta) `fas` es el MES, y `fas = 0`
      es el "Previsto" vivo. En los ambitos MASTER (8 = coste, 11 = venta) `fas`
      es el NUMERO DE VERSION. Ademas cambia de nombre segun donde mires: se
      llama `fase_num` en `stg.presupuesto`, `version` en `stg.plan_mensual` y
      `fasnum` en `raw.obrfas`. Nunca cruces las dos lecturas.
    motivo: >-
      Es la ambiguedad estructural del modelo de Sigrid, verificada en los DDL
      de `sql/stg/01_ddl.sql`. Tratar una version como si fuera un mes produce
      series temporales inventadas.

  - codigo: R-SIGRID-CON
    titulo: La regla de oro de Sigrid, sin la cual `raw` es ilegible
    severidad: bloqueante
    ambito:
      - raw
    regla: >-
      Antes de escribir cualquier consulta contra `raw`, seis cosas.

      **1. `ide` es la clave de las 31 tablas.** Se llama igual en todas, es el
      indice primario y es unico. Un campo que acaba en `ide` —`conide`,
      `entide`, `obride`— es una referencia a el.

      **2. Diez tablas son "Propiedades de `con`" en 1:1**: `obr`, `prv`, `cen`,
      `ctr`, `com`, `dca`, `dcf`, `cob`, `pag` y `rec`. No son entidades
      completas: son la extension especifica de un concepto y comparten su `ide`
      con una fila de `con`. Unirlas por `ide` nunca multiplica.

      **3. `con` trae `cod`, `res` y `fec`** —codigo, nombre legible y fecha de
      alta— **y es de donde el datamart los toma para esas diez**. Pero **no
      asumas que un campo esta en `con` solo porque exista alli**: hay tablas
      cuyos campos propios el ETL lee **sin pasar por `con`**, y estas son, con
      el campo exacto: `auxmun` (`auxmun.res`); `auxobramb` (`auxobramb.cod`, `auxobramb.res`); `auxobrcla` (`auxobrcla.res`); `auxobrtip` (`auxobrtip.res`); `auxpro` (`auxpro.res`); `conext` (`conext.cod`); `ctrpro` (`ctrpro.res`); `dcapro` (`dcapro.res`); `dcfpro` (`dcfpro.res`); `obrfas` (`obrfas.res`); `obrfasamb` (`obrfasamb.fec`, `obrfasamb.res`); `obrparpar` (`obrparpar.cod`, `obrparpar.res`); `prv` (`prv.cif`, `prv.raz`). Ahi el valor bueno es el de la tabla, no el de
      `con`.

      **4. Y hay tablas que no cuelgan de `con` en absoluto**: `auxobramb`, `obrfas`, `obrfasamb`, `obrparpre`
      no se unen a `raw.con` en ningun SQL de este repositorio, asi que para
      ellas el JOIN de los puntos 2 y 3 **no existe**; su nombre esta en su
      propio `res` o no esta.

      **5. Las fechas son enteros `YYYYMMDD`**, y el valor `0` no es una fecha
      sino el NULL, porque Sigrid no guarda nulos en los enteros. Lo mismo vale
      para las referencias: un `entide` a 0 significa "sin asignar". Por eso el
      ETL las envuelve en `NULLIF(..., 0)` y las convierte con
      `stg.fn_sigrid_date_to_date`.

      **6. Hay referencias POLIMORFICAS, y no se pueden unir a ciegas.** En las
      lineas de documento de compra, `docoriide` apunta al documento de origen
      **y `docoritip` dice a que tabla**: 44 es contrato y 14 albaran. Unir
      `docoriide` sin filtrar antes por `docoritip` cruza lineas con documentos
      de otro tipo que casualmente comparten `ide`. Es lo que hace
      `compras/01_documentos.sql`:
      `CASE WHEN l.docoritip = 44 THEN NULLIF(l.docoriide, 0) END`.

      El nombre legible que usa todo el datamart es **`con.res`**: no hay una
      sola referencia a `con.nom` en el repositorio.
    motivo: >-
      Todo lo que afirma esta regla se **deriva de este repositorio**, que es la
      unica fuente de primera mano que tenemos sobre el origen: nuestro SQL no
      correria contra una columna inexistente, asi que cada `alias.campo` que
      aparece ahi es una columna real. La lista del punto 3 y la del punto 4 las
      genera un test (`tests/test_f006_fuente_que_gobierna.py`) barriendo
      `sql/**`, y la regla queda en rojo si dejan de coincidir.

      **Lo que esta regla NO dice, y es deliberado**: que campos existen en
      Sigrid y el datamart no lee. Esa pregunta solo la responde
      `azure-apps/sigrid_tablas.md`, que es la conversion literal de un PDF de
      380 paginas y **no se deja segmentar de forma fiable**. Intentarlo produjo
      dos afirmaciones falsas en dos revisiones seguidas —un campo `res`
      atribuido a `cen` que en realidad es de `cenrep`, tabla que ni se
      ingiere, y una lista de excepciones con una sola acertada
      de siete—. Para preguntar por una columna concreta, ese documento; para
      fiarse de una afirmacion, este repositorio.

      Ninguno de los seis puntos falla con un dato raro que invite a mirar:
      `con.nom` falla con "columna inexistente", consultar `obr` sin unir a `con`
      devuelve una obra sin codigo, y un `MIN(fecha)` que no excluya el cero
      devuelve cero, que parece un dato y no lo es.
    orden: 13

  - codigo: R-CLAVE-SUSTITUTA
    titulo: Las claves BIGSERIAL cambian en cada build
    severidad: bloqueante
    ambito:
      - mart.fact_seguimiento_mensual
      - mart.fact_seguimiento_categoria
      - mart.v_pbi_fact
      - mart.v_pbi_fact_categoria
      - stg.plan_mensual
      - cierre.fact_cierre_mensual
    regla: >-
      `fact_id`, `fact_cat_id`, `plan_id` y `cierre_id` son BIGSERIAL sobre
      tablas que se reconstruyen enteras en cada build: se reasignan. No sirven
      como identificador estable, no se guardan fuera del datamart y no se le
      ensenan al usuario. Para identificar algo se usa su clave de negocio.
      EXCEPCION: `aux.periodificacion_partida.regla_id` tambien es BIGSERIAL
      pero su tabla se crea con `CREATE TABLE IF NOT EXISTS` y nadie la
      reconstruye, asi que ese si es estable.
    motivo: >-
      Las tablas afectadas se recrean con DROP + CREATE o se truncan en cada
      build (`sql/mart/01_ddl.sql`, `sql/cierre/01_ddl_fact.sql`, y
      `stg.plan_mensual` desde el propio paso). Un `fact_id` citado en un
      informe de ayer apunta hoy a otra fila.

  - codigo: R-ABONO-NEGATIVO
    titulo: En compras los abonos ya entran con signo negativo
    severidad: bloqueante
    ambito:
      - compras.fact_compras_linea
      - compras.facturas
      - compras.factura_lineas
      - compras.v_pbi_proveedor_obra
      - compras.v_pbi_contrato_consumo
      - compras.v_pbi_partida_coste
    regla: >-
      Los documentos de tipo ABONO llegan con su signo natural, es decir en
      negativo. Un `SUM(importe)` sobre FACTURA y ABONO ya da el facturado neto:
      restarlos otra vez, o filtrarlos fuera y restarlos aparte, produce un
      resultado equivocado en el doble de la cifra abonada.
    motivo: >-
      Esta escrito en el propio SQL: `sql/compras/03_views.sql` dice "los ABONOS
      restan (signo natural)" y las vistas los agregan junto a las facturas.

  - codigo: R-LINEA-ID-NO-UNICA
    titulo: linea_id NO es unico en compras.fact_compras_linea
    severidad: bloqueante
    ambito:
      - compras.fact_compras_linea
    regla: >-
      La tabla no tiene clave primaria declarada y `linea_id` NO identifica una
      fila: viene de tres tablas distintas de Sigrid (`ctrpro`, `dcapro` y
      `dcfpro`) cuyos identificadores colisionan. La clave real es el par
      `(tipo_doc, linea_id)`. Un COUNT DISTINCT sobre `linea_id` pierde filas y
      un JOIN por `linea_id` a secas las duplica.
    motivo: >-
      La tabla se crea con `CREATE TABLE ... AS` uniendo los tres origenes
      (`sql/compras/02_fact_linea.sql`), sin PK y sin renumerar.

  - codigo: R-RETENCION-NO-JOIN-LINEAS
    titulo: Nunca unir un efecto de retencion a las lineas de su factura
    severidad: bloqueante
    ambito:
      - retenciones.movimientos
      - retenciones.v_src_lineas_compra
      - retenciones.v_src_lineas_venta
      - compras.factura_lineas
    regla: >-
      `retenciones.movimientos` tiene UN registro por efecto, con el importe
      total retenido. Unirlo a las lineas del documento origen multiplica ese
      importe por el numero de lineas de la factura. Si hace falta el detalle,
      se agrega primero por documento y se une despues por documento, nunca por
      linea.
    motivo: >-
      Es el error real que dio 38,9 M€ de retencion en UNA sola obra, siendo esa
      la cifra de toda la empresa. De ahi salio la nota global del prototipo
      `mcp-bbdd`, y de ahi sale esta regla.

  - codigo: R-COMPRAS-SIN-IVA
    titulo: Los importes de compras son sin IVA; importe_contratado lleva IVA
    severidad: bloqueante
    ambito:
      - compras
      - maestro.proveedores_obra
    regla: >-
      Todos los importes del esquema `compras` son SIN IVA (base imponible de
      linea). En cambio `maestro.proveedores_obra.importe_contratado` es
      `SUM(ctr.totdoc)`, el TOTAL DEL DOCUMENTO CON IVA. No son comparables: la
      diferencia entre ambas cifras no es sobrecoste ni ahorro, es el impuesto.
    motivo: >-
      `sql/compras/02_fact_linea.sql` dice "todos los importes SIN IVA" y
      `sql/maestro/03_proveedores_obra.sql` suma `t.totdoc` de `raw.ctr`.
      Compararlos da desviaciones falsas del orden del 21 %.

  - codigo: R-COMPRAS-TIPO-DOC
    titulo: Seis tipos de documento conviven en la misma tabla
    severidad: bloqueante
    ambito:
      - compras.fact_compras_linea
    regla: >-
      `compras.fact_compras_linea` mezcla CONTRATO, ALBARAN, PROFORMA, NOTA,
      FACTURA y ABONO (mas OTRO) en la misma tabla. Sumar `importe` sin filtrar
      `tipo_doc` suma el mismo gasto hasta tres veces: contratado, albaranado y
      facturado son tres momentos del MISMO coste, no tres costes. Se filtra
      siempre por el `tipo_doc` que responde la pregunta.
    motivo: >-
      Los tipos los asigna `compras.fn_tipo_documento` sobre `(con.tip, serie)`.
      Es la nota global del prototipo `mcp-bbdd`: "no filtrar tipo_doc triplica".

# ===========================================================================
# ORDENES DE MAGNITUD (R10)
# ===========================================================================
#
# Para que el agente detecte una cifra absurda ANTES de darla por buena. No son
# recuentos por objeto —esos envejecen mal y nadie los actualiza (DA-6)—, sino
# los cuatro totales de empresa que se mueven poco y que ya sirvieron para
# cazar el error de retenciones en el prototipo.

ordenes_de_magnitud:
  - concepto: Retenido VIVO a proveedores, pendiente de devolver, en toda la empresa
    valor_aproximado: 34700000
    unidad: EUR
    criterio: saldo_vivo
    fuente: >-
      LEEME_RETENCIONES_R1.md, tabla del modelo: efectos de `pag` con
      `retide <> 0` y `fecrea = 0`. NO es el total practicado historicamente:
      lo ya liquidado no cuenta aqui.
  - concepto: Retenido VIVO por clientes, pendiente de cobrar, en toda la empresa
    valor_aproximado: 21900000
    unidad: EUR
    criterio: saldo_vivo
    fuente: >-
      LEEME_RETENCIONES_R1.md, misma tabla: efectos de `cob` con `retide <> 0`
      y `fecrea = 0`.
  - concepto: Efectos de retencion practicados a proveedores, vivos y liquidados
    valor_aproximado: 25124
    unidad: filas
    criterio: total
    fuente: >-
      LEEME_RETENCIONES_R1.md, tabla del modelo: filas de `pag` con
      `retide <> 0`, sin filtrar por estado.
  - concepto: Efectos de retencion practicados por clientes, vivos y liquidados
    valor_aproximado: 2219
    unidad: filas
    criterio: total
    fuente: >-
      LEEME_RETENCIONES_R1.md, tabla del modelo: filas de `cob` con
      `retide <> 0`, sin filtrar por estado.

  # -------------------------------------------------------------------------
  # COMPRAS, MART y CIERRE. Anadidos el 2026-08-25 por T40.
  #
  # Hasta ese dia estas cuatro entradas eran las de `retenciones` y NADA MAS:
  # el mecanismo existia y no cubria el sitio donde fallo. En `compras`
  # aparecieron 68,7 BILLONES de euros y ninguna barrera salto, porque no habia
  # ninguna barrera que saltar para ese esquema.
  # -------------------------------------------------------------------------
  - concepto: Facturado neto a proveedores en un ano completo, toda la empresa
    valor_aproximado: 113600000
    unidad: EUR
    criterio: anual
    fuente: >-
      Medido el 2026-08-25 sobre `compras.fact_compras_linea` con
      `tipo_doc IN ('FACTURA','ABONO')`. La serie sube de forma sostenida:
      53,0 M€ en 2022, 70,9 en 2023, 91,2 en 2024 y 113,6 en 2025. **Una cifra
      de compras anual fuera del rango 40-150 M€ esta mal**: casi siempre por
      sumar CONTRATO, ALBARAN y FACTURA juntos, que es el mismo coste contado
      tres veces (R-COMPRAS-TIPO-DOC).
  - concepto: Entregado y pendiente de facturar, toda la empresa
    valor_aproximado: 260600000
    unidad: EUR
    criterio: total
    fuente: >-
      Medido el 2026-08-25 sobre `compras.v_pbi_albaranes_sin_facturar`
      **descartando dos lineas anomalas**. Sin descartarlas la vista suma
      **68.724.260,6 millones de euros** —68,7 billones—, y esa es la cifra que
      sale por defecto: ver R-ALBARAN-ABSURDO. Si este numero pasa de mil
      millones, la respuesta esta contaminada por la anomalia.
  - concepto: Coste real de toda la empresa en un ano, en el seguimiento
    valor_aproximado: 105900000
    unidad: EUR
    criterio: anual
    fuente: >-
      Medido el 2026-08-25 sobre `mart.fact_seguimiento_mensual` en 2024. Los
      cuatro escenarios de ese ano van juntos y en el mismo orden de magnitud:
      Coste Real 105,9 M€, Coste Planificado 112,8, Venta Real 110,1 y Venta
      Planificada 115,2. **Un escenario que se despegue de los otros en mas de
      un 30 % suele ser un filtro de escenario mal puesto**, no un hallazgo.
  - concepto: Coste real acumulado de la obra mas grande de la empresa
    valor_aproximado: 32700000
    unidad: EUR
    criterio: maximo
    fuente: >-
      Medido el 2026-08-25 sobre `mart.fact_seguimiento_mensual`, escenario
      Coste Real, agregando por obra en toda su historia. **Es el techo por
      obra**: cualquier cifra de una sola obra por encima de 40 M€ es fan-out,
      normalmente el JOIN a lineas de factura que R-RETENCION-NO-JOIN-LINEAS
      prohibe y que ya dio 38,9 M€ en una obra.
  - concepto: Venta ejecutada de toda la empresa en un ano, en el cierre
    valor_aproximado: 110000000
    unidad: EUR
    criterio: anual
    fuente: >-
      Medido el 2026-08-25 sobre `cierre.fact_cierre_mensual` en 2024, sumando
      `ejecutado_mes`. Sus otros tres conceptos del mismo ano: DIRECTOS
      73,3 M€, INDIRECTOS 15,8 y GENERALES 11,2. La venta del cierre y la del
      seguimiento (110,0 y 110,1 M€) **tienen que parecerse**: si no lo hacen,
      uno de los dos lados esta mal filtrado.

# ===========================================================================
# CONVENCIONES (R4)
# ===========================================================================
#
# Las tres cosas que se equivocan solas: el IVA, las fechas de Sigrid y la zona
# horaria de los timestamps.

convenciones:
  moneda: EUR
  importes_iva: >-
    Los importes del esquema `compras` son SIN IVA (base imponible de linea).
    El unico importe CON IVA del datamart es
    `maestro.proveedores_obra.importe_contratado`, que es SUM(ctr.totdoc), el
    total del documento. No son comparables entre si.
  fechas: >-
    En `raw` las fechas son enteros con formato YYYYMMDD y el valor 0 significa
    NULL, no el ano 0. A partir de `stg` ya vienen tipadas como DATE. Hay cuatro
    funciones de conversion, una por esquema (`stg.fn_sigrid_date_to_date`,
    `compras.fn_sigrid_date`, `retenciones.fn_sigrid_date`, `maestro.fn_fecha`).
  timestamps: >-
    Los timestamps de `_meta` son UTC SIN zona horaria (TIMESTAMP, escritos con
    datetime.utcnow()). Compararlos contra un now() local da el desfase de
    Espana como antiguedad, que en verano son dos horas.
  identidad_sigrid: >-
    En Sigrid `ide` es la clave universal, y hay tablas que son "propiedades de
    `con` 1:1". **Lo que hay que saber antes de consultar `raw` esta en la regla
    `R-SIGRID-CON`, que es la unica version**: cuales son esas tablas, de que
    lado sale cada campo y que tablas no cuelgan de `con` en absoluto.

    Esta entrada no lo repite a proposito. Cuando lo repetia, se quedo atras: la
    regla corrigio donde vive cada campo y amplio la lista de tablas, y esta
    convencion siguio publicando la version anterior, con dos tablas menos.
    Eran dos versiones publicadas que se contradecian.

# ===========================================================================
# EJES DEL MODELO (R4)
# ===========================================================================
#
# El seguimiento cruza dos ejes y produce cuatro escenarios. Los literales de
# `escenario` son EXACTAMENTE estos: el agente los va a poner en un WHERE, y
# estan fijados en mart.v_pbi_dim_escenario.

ejes:
  - eje: magnitud
    valores: [COSTE, VENTA]
    significa: Que se mide, el coste de ejecutar o la venta al cliente.
  - eje: naturaleza
    valores: [REAL, PLANIFICADO]
    significa: Lo que ha pasado frente a lo que estaba previsto que pasara.
  - eje: escenario
    valores:
      - Coste Real
      - Coste Planificado
      - Venta Real
      - Venta Planificada
    significa: >-
      El cruce de los dos anteriores, y la columna por la que se filtra de
      verdad. Cada escenario viene de un ambito de Sigrid: Coste Real del 3,
      Venta Real del 7, Coste Planificado del 8 y Venta Planificada del 11.

# ===========================================================================
# ESQUEMAS (R4)
# ===========================================================================
#
# Son NUEVE. Los informes de exploracion dicen ocho y se equivocan.
# Ojo a la trampa de nombres: el esquema se llama `aux` y su carpeta de SQL es
# `sql/auxiliar/`.

esquemas:

  mart:
    titulo: Seguimiento mensual listo para consumo
    para_que_sirve: >-
      Es la superficie principal para preguntas de planificacion y produccion:
      cuanto se ha producido y cuanto se habia planificado, mes a mes, por obra
      y partida. Aqui la version master vigente YA esta resuelta, que es lo que
      lo hace consultable directamente.
    consumo_recomendado: true
    refresco: nocturno
    pasos_etl: [build_mart]

  cierre:
    titulo: Cierre economico mensual de obra
    para_que_sirve: >-
      Ejecutado y previsto por obra y mes, con gastos y beneficio derivados, mas
      la cabecera de la obra (cliente, tecnico, presupuestos y modificados). Es
      lo que responde "cuanto llevamos ejecutado a cierre del mes M".
    consumo_recomendado: true
    refresco: nocturno
    pasos_etl: [build_cierre]

  compras:
    titulo: Mundo documental de la compra a proveedores
    para_que_sirve: >-
      Contratos, albaranes, proformas, notas, facturas y abonos de proveedor, a
      nivel de linea y sin IVA. Responde a quien se ha comprado, cuanto se ha
      contratado, que hay albaranado sin facturar y que coste lleva cada
      partida.
    consumo_recomendado: true
    refresco: nocturno
    pasos_etl: [build_compras]

  retenciones:
    titulo: Retenciones de garantia practicadas y sufridas
    para_que_sirve: >-
      Un registro por efecto de retencion, en los dos sentidos: lo retenido a
      proveedores y lo que los clientes nos retienen. Con saldo vivo, fechas
      prevista y real de liquidacion, y marca de vencida sin liquidar.
    consumo_recomendado: true
    refresco: nocturno
    pasos_etl: [build_retenciones]

  maestro:
    titulo: Maestros de consulta directa
    para_que_sirve: >-
      Obras, proveedores y la relacion proveedor-obra derivada de los contratos,
      pensados para consultarse tal cual. `maestro.obras` es el universo SIN
      filtrar, superconjunto de `stg.obras`.
    consumo_recomendado: true
    refresco: nocturno
    pasos_etl: [build_maestros]

  _meta:
    titulo: Instrumentacion del propio ETL
    para_que_sirve: >-
      Responde "de cuando es el dato que me estas dando". Guarda una fila por
      ejecucion de paso, el estado de cada tabla de `raw` y, desde F-006, el
      diccionario semantico publicado. Es de donde sale la fecha de build que
      toda respuesta tiene que citar.
    consumo_recomendado: true
    refresco: nocturno
    pasos_etl: [ingest_raw, build_stg, build_mart]

  aux:
    titulo: Parametrizacion auxiliar del mart
    para_que_sirve: >-
      Reglas de periodificacion de coste que la vista `mart.v_fact_periodificado`
      aplica. Hoy la tabla se crea VACIA por diseno: no se periodifica nada y la
      vista es un passthrough.
    consumo_recomendado: false
    refresco: estatico
    pasos_etl: []

  stg:
    titulo: Capa intermedia de preparacion
    para_que_sirve: >-
      Normaliza Sigrid y explota la planificacion a nivel mensual. NO es
      superficie de consulta: en `stg.plan_mensual` conviven todas las versiones
      master y consultarla sin filtrar version multiplica los importes. Lo que
      se pregunta esta aguas abajo, en `mart` y en `cierre`.
    consumo_recomendado: false
    refresco: nocturno
    pasos_etl: [build_stg]

  raw:
    titulo: Copia literal de Sigrid
    para_que_sirve: >-
      Reflejo tabla a tabla del SQL Server de Sigrid, sin transformar y sin
      semantica de negocio: nombres de cuatro letras, fechas como enteros y el
      valor 0 en lugar de NULL. Su diccionario real es `azure-apps/sigrid_tablas.md`.
      No se consulta para responder preguntas de negocio.
    consumo_recomendado: false
    refresco: nocturno
    pasos_etl: [ingest_raw]

# ===========================================================================
# COLUMNAS TECNICAS QUE NO SON NEGOCIO
# ===========================================================================
#
# Instrumentacion del ETL. Ensucian el catalogo y no responden nada.

ocultar:
  - _ingested_at
  - _source_tiemod
  - _built_at

# ===========================================================================
# BATERIA DE ACEPTACION (R39, R41)
# ===========================================================================
#
# El criterio de exito de F-006, escrito aqui para que el agente tambien pueda
# leerlo. Recuento honesto: de 18 preguntas, **13 se responden hoy, 3 a medias
# y 2 no se pueden responder**. Un "no puedo responderlo con esta base, y este
# es el motivo" es una respuesta CORRECTA; inventarse una cifra, no.
#
# Cuatro son preguntas TRAMPA deliberadas (P9, P10, P11, P16): si el agente cae
# en una, no ha fallado el agente, ha fallado la ficha del objeto, y hay que
# corregirla antes de cerrar la feature.

preguntas_aceptacion:

  - id: P1
    pregunta: Que proveedores nos han facturado mas
    objetos_esperados:
      - compras.v_pbi_proveedor_obra
      - compras.fact_compras_linea
    respuesta_correcta: >-
      Importes SIN IVA. Los abonos ya restan porque entran en negativo, asi que
      no se vuelven a restar. No se pierden las filas con obra_id nulo, que son
      estructura y gastos generales. Si baja al grano de linea, agrupa por
      (tipo_doc, linea_id) y no por linea_id a secas.
    reglas_implicadas: [R-ABONO-NEGATIVO, R-COMPRAS-SIN-IVA, R-LINEA-ID-NO-UNICA]
    estado: respondible

  - id: P2
    pregunta: Que retenciones tengo de los proveedores de la obra X
    objetos_esperados:
      - retenciones.movimientos
      - retenciones.v_pbi_retenciones_vivas
    respuesta_correcta: >-
      Filtra sentido = 'PROVEEDOR'. Da `saldo_vivo` por defecto y menciona que
      existe la otra lectura, `neto_practicado`, y que pueden divergir. NO une
      el efecto a las lineas de su factura. Senala las filas con obra_id nulo y
      num_obras_documento > 1, que son facturas repartidas entre varias obras.
      Cita la fecha de build de `build_retenciones`: se refresca de noche, pero
      su paso puede fallar sin tumbar el resto de la carga.
    reglas_implicadas: [R-RETENCION-NO-JOIN-LINEAS, R-FRESCURA]
    estado: respondible
    nota: >-
      La vista cruzada obra x proveedor no existe: las dos agregadas cortan por
      un eje cada una. Llega con F-039.

  - id: P3
    pregunta: Quien fue el proveedor de fontaneria de la obra X
    objetos_esperados:
      - compras.contratos
    respuesta_correcta: >-
      Declara explicitamente que es una HEURISTICA sobre texto libre (un LIKE
      sobre `contratos.descripcion`) y que el datamart no tiene taxonomia de
      oficio. Nunca presenta el resultado como una clasificacion.
    estado: parcial
    bloqueada_por: F-036

  - id: P4
    pregunta: Cual es el flujo de caja de la obra X
    objetos_esperados: []
    respuesta_correcta: >-
      "El datamart no tiene tesoreria." No hay ni un objeto de cobros o pagos en
      los nueve esquemas. Cualquier numero es incorrecto, incluida la tentacion
      de dar el facturado como si fuera caja.
    estado: bloqueada
    bloqueada_por: F-037

  - id: P5
    pregunta: De la obra X, lo facturado por contrato, lo que hay en albaran sin facturar y los comparativos
    objetos_esperados:
      - compras.v_pbi_contrato_consumo
      - compras.v_pbi_albaranes_sin_facturar
    respuesta_correcta: >-
      Contrato y albaran se responden. Solo ALBARAN y PROFORMA cuentan como
      pendientes de facturar, y la sobrefacturacion conserva signo negativo.
      **El comparativo no existe como objeto** y hay que decirlo: `raw.com`,
      `raw.comlin` y `raw.comprv` estan ingeridos pero ningun SQL los lee.
    estado: parcial
    bloqueada_por: F-038

  - id: P6
    pregunta: Cual es la planificacion mensual de la obra X
    objetos_esperados:
      - mart.fact_seguimiento_mensual
      - mart.v_master_versiones_tipadas
    respuesta_correcta: >-
      Va a `mart`, NO a `stg.plan_mensual`, donde conviven todas las versiones.
      Usa `importe_mes` y no suma `importe_origen` a lo largo del tiempo.
      Menciona que las versiones de tipo 'Cierre mensual' no reemplazan al plan.
    reglas_implicadas: [R-VERSION-MASTER, R-IMPORTE-MES]
    estado: respondible

  - id: P7
    pregunta: Cuanto llevamos ejecutado en la obra X a cierre del mes M, en venta y en coste
    objetos_esperados:
      - cierre.v_pbi_cierre_resumen
      - cierre.v_pbi_cierre_cabecera
    respuesta_correcta: >-
      CITA LA FECHA DE BUILD de `build_cierre`: el esquema se refresca de noche,
      pero su paso puede haber fallado sin tumbar el resto de la carga. Los
      porcentajes van contra la VENTA de esa misma columna y ese mismo mes, no
      contra el presupuesto global.
    reglas_implicadas: [R-FRESCURA]
    estado: respondible

  - id: P8
    pregunta: Que obras se desvian mas de su master vigente en coste directo
    objetos_esperados:
      - mart.fact_seguimiento_categoria
      - mart.v_master_vigente_anual
    respuesta_correcta: >-
      Separa magnitud (COSTE/VENTA) y naturaleza (REAL/PLANIFICADO) y no mezcla
      ambitos. Filtra categoria = 'CD' para coste directo. Compara sobre la
      misma ventana temporal en los dos escenarios.
    reglas_implicadas: [R-VERSION-MASTER]
    estado: respondible

  - id: P9
    pregunta: Cuantas obras activas tenemos
    objetos_esperados:
      - maestro.obras
      - stg.obras
    respuesta_correcta: >-
      DECLARA QUE UNIVERSO USA: `maestro.obras` no filtra nada y `stg.obras`
      excluye administrativas y códigos de cinco o mas digitos. Y usa
      `maestro.obras.es_activa`, NO `stg.obras.activa`, que esta cableada a TRUE
      y vale TRUE para todas.
    reglas_implicadas: [R-UNIVERSO-OBRA, R-OBRA-ACTIVA]
    estado: respondible
    es_trampa: true

  - id: P10
    pregunta: Cual es el presupuesto de la obra X
    objetos_esperados:
      - stg.presupuesto
    respuesta_correcta: >-
      Usa el importe TOTAL sin distribucion mensual, no la suma de
      `plan_mensual`. Para coste (ambitos 3 y 8) `importe`; para venta (ambitos
      7 y 11) `importe_oficial`, que lleva los coeficientes que Sigrid aplica
      solo en venta. Filtra la fase correcta.
    reglas_implicadas: [R-FAS-AMBIGUO, R-VERSION-MASTER]
    estado: respondible
    es_trampa: true

  - id: P11
    pregunta: Dame la evolucion mensual del coste directo de la obra X en el ano A
    objetos_esperados:
      - mart.fact_seguimiento_mensual
    respuesta_correcta: >-
      Usa `importe_mes`. Si suma `importe_origen` a lo largo de los meses, la
      respuesta es INCORRECTA aunque el numero parezca razonable: multiplica por
      unas nueve veces.
    reglas_implicadas: [R-IMPORTE-MES]
    estado: respondible
    es_trampa: true

  - id: P12
    pregunta: Que tenemos en albaranes sin facturar
    objetos_esperados:
      - compras.v_pbi_albaranes_sin_facturar
    respuesta_correcta: >-
      Usa `compras.v_pbi_albaranes_sin_facturar`, que SI filtra por tipo: solo
      ALBARAN y PROFORMA. Y no generaliza la regla: en
      `compras.v_pbi_contrato_consumo` el pendiente se suma sin filtrar, asi que
      alli las NOTA tambien cuentan. Cita la fecha de build de `compras`, o
      advierte de que no es consultable.
    reglas_implicadas: [R-COMPRAS-TIPO-DOC, R-FRESCURA]
    estado: respondible

  - id: P13
    pregunta: Que retenciones vencen este trimestre y siguen vivas
    objetos_esperados:
      - retenciones.v_pbi_retenciones_vencidas
      - retenciones.v_pbi_retenciones_vivas
    respuesta_correcta: >-
      Usa las vistas de vivas y vencidas en lugar de recalcular el estado, y
      cita la fecha de build de `build_retenciones`: su paso puede haber fallado
      esta noche sin tumbar el resto de la carga.
    reglas_implicadas: [R-FRESCURA]
    estado: respondible

  - id: P14
    pregunta: Cuales son las diez partidas con mas coste incurrido de la obra X
    objetos_esperados:
      - compras.v_pbi_partida_coste
    respuesta_correcta: >-
      Advierte de que `compras` no filtra por `stg.obras` y puede traer obras
      administrativas que el seguimiento excluye. Y dice que el puente entre el
      coste planificado de la partida y el incurrido documental **no existe
      todavia** como objeto, aunque `partida_id` los une.
    reglas_implicadas: [R-UNIVERSO-OBRA]
    estado: parcial
    bloqueada_por: F-039

  - id: P15
    pregunta: De cuando es el dato que me estas dando
    objetos_esperados:
      - _meta.v_frescura
    respuesta_correcta: >-
      Devuelve el ultimo OK y el ultimo intento POR SEPARADO —que un paso haya
      fallado esta noche no borra el dato bueno de ayer— y la version del
      diccionario publicado. Da la frescura DEL PASO que construyo el objeto de
      la pregunta, no la del pipeline: los diez pasos de la noche tienen cada
      uno la suya y uno puede haber fallado.
    reglas_implicadas: [R-FRESCURA]
    estado: respondible
    nota: >-
      Es la prueba de aceptacion de R15 y R16. Cuando exista `_meta.v_diccionario`
      (bloque E), la respuesta sale de UNA sola consulta.

  - id: P16
    pregunta: Cuanto le hemos comprado al proveedor P en toda la empresa este ano
    objetos_esperados:
      - compras.fact_compras_linea
    respuesta_correcta: >-
      FILTRA `tipo_doc`: sumar sin filtrar cuenta contratado, albaranado y
      facturado como si fueran tres costes distintos. No trata `linea_id` como
      unico. Y no compara el resultado con
      `maestro.proveedores_obra.importe_contratado`, que lleva IVA.
    reglas_implicadas: [R-COMPRAS-TIPO-DOC, R-LINEA-ID-NO-UNICA, R-COMPRAS-SIN-IVA]
    estado: respondible
    es_trampa: true

  - id: P17
    pregunta: Quienes son nuestros diez mayores clientes
    objetos_esperados: []
    respuesta_correcta: >-
      "No lo tenemos": la tabla `cli` de Sigrid no se ingiere y las ventas
      (`dvf`/`dvfpro`) tampoco. Del cliente solo conocemos el nombre, via
      `raw.con.res` a traves de `obr.entide`. No hay importe facturado a cliente
      en el datamart.
    estado: bloqueada
    bloqueada_por: F-040

  - id: P18
    pregunta: Que obras estan mal configuradas, sin planificado en algun mes
    objetos_esperados:
      - mart.v_master_versiones_tipadas
      - mart.fact_seguimiento_mensual
    respuesta_correcta: >-
      Reconoce el sintoma: obras que solo tienen versiones de tipo 'Cierre
      mensual', que no reemplazan al plan. Y que un mes sin fila de la version
      vigente da importes 0 sin dejar por ello de ser la vigente.
    reglas_implicadas: [R-VERSION-MASTER]
    estado: respondible

