# version 23 (F-083, 2026-09-16): NI UN OBJETO NUEVO. `compras.facturas` gana
# CINCO COLUMNAS y el esquema deja de tener una sola nocion de «estado». Nace de
# un correo de Administracion: «una cosa es el estado del efecto de pago que hay
# dentro de una factura, y otra distinta el estado de la propia factura». Tenia
# razon: lo unico publicado era `compras.vencimientos.estado_pago`, que es el del
# EFECTO, asi que el circuito de aprobacion de la factura -contabilizada,
# aprobada por jefe de obra, aprobada Administracion, retenida, rechazada- no se
# podia consultar. Ahora `compras.facturas` publica `estado_id`, `estado_codigo`
# y `estado`, leidos de `con.est` (la superclase, NO `dcf`) con `tip = 15` y
# traducidos por la PAREJA (tipo, estado), que es la trampa que el propio
# catalogo declara. Se filtra por `estado_codigo` y no por el literal: `REC` y
# `REC_ADM` se llaman los dos «Recibida».
#
# Y LAS TRES FECHAS, que es la otra mitad. `fecha_factura` (`dcf.fecdoc`, la del
# documento del proveedor) y `fecha_alta` (`con.fec`, la del alta en Sigrid) se
# publican separadas; `fecha` NO se toca, es la de alta y se conserva por
# compatibilidad. **Se separan en el 77,8 % de las facturas** (mediana 4 dias,
# p95 42), asi que elegir la equivocada desplaza cualquier serie temporal de
# compras. Las fichas de las tres se nombran unas a otras a proposito, y la de
# `compras.vencimientos.estado_pago` devuelve el aviso en sentido contrario: la
# confusion se puede entrar por cualquiera de las dos puertas.

# version 24 (F-084, 2026-09-16): UN OBJETO NUEVO —la funcion auxiliar
# `compras.fn_estado_documento`— y el mismo trabajo de F-083 para el CONTRATO.
# `compras.contratos` gana `estado_id`, `estado_codigo` y `estado`, leidos de
# `con.est` con `tip = 44` y traducidos por la PAREJA (tipo, estado). Ni una de
# las doce columnas de siempre se toca: verificado columna a columna contra la
# tabla viva, 0 filas que no casan de 18.978.
#
# LA TRADUCCION DEJA DE ESTAR COPIADA. F-083 escribio su lateral a mano dentro
# del bloque FACTURAS; en vez de duplicarlo para CONTRATOS, los dos llaman ahora
# a `compras.fn_estado_documento(tipo, estado)`. Lo que se gana no son lineas:
# el tipo de documento pasa a ser argumento obligatorio, asi que la union «solo
# por estado_id» —la que publica el literal de otro documento sin romper el
# build— ya no se puede escribir. La guarda anti-multiplicacion vive dentro de
# la funcion y por eso protege a las dos tablas a la vez.
#
# LO QUE ESTA VERSION DECLARA QUE **NO** SE PUEDE RESPONDER, y es la mitad que
# importa. Compras pregunta por «los contratos que llevan mas de tres semanas
# enviados sin firmar». Los ENVIADOS ya se listan: 818, de 567 proveedores y 241
# obras. El «mas de tres semanas», NO: el datamart no guarda cuando cambio el
# estado —la foto diaria es F-067— y `con.tiemod` es la ultima modificacion del
# DOCUMENTO, que no es la fecha del cambio de estado, y ademas ni siquiera se
# publica. La ficha lo dice en vez de insinuar un proxy, porque un «lleva X
# dias» falso es peor que un «no se puede saber».
#
# Y UN HALLAZGO QUE AHORRA TIEMPO AL SIGUIENTE: el circuito de firma NO sirve
# para el contrato. De las 70.346 firmas de `raw.confir` medidas el 2026-09-16
# hay CERO de contrato; son de comparativos, facturas y obras. En el origen
# tampoco estan, asi que el ESTADO es la unica via.

