  # aparecieron 68,7 BILLONES de euros y ninguna barrera salto, porque no habia
  # ninguna barrera que saltar para ese esquema.
  # -------------------------------------------------------------------------
  - concepto: Facturado neto a proveedores en un ano completo, toda la empresa
    valor_aproximado: 113600000
    unidad: EUR
