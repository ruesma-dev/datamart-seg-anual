# ===========================================================================
# CONVENCIONES (R4)
# ===========================================================================
#
# Las tres cosas que se equivocan solas: el IVA, las fechas de Sigrid y la zona
# horaria de los timestamps.

convenciones:
  moneda: EUR
  importes_iva: >-
    Lineas de `compras` SIN IVA; totales de cabecera (`total_factura`,
    `total_documento`, `total_a_pagar`) y
    `maestro.proveedores_obra.importe_contratado` CON IVA. No se comparan:
    regla `R-COMPRAS-SIN-IVA`.
  fechas: >-
    Las fechas del datamart son DATE. En Sigrid son enteros YYYYMMDD con 0
    como NULL (no el ano 0); las convierte el ETL.
  timestamps: >-
    Los timestamps de `_meta` son UTC SIN zona horaria (TIMESTAMP, escritos con
    datetime.utcnow()). Compararlos contra un now() local da el desfase de
    Espana como antiguedad, que en verano son dos horas.
  # No repite el contenido de `R-SIGRID-CON` A PROPOSITO: cuando lo repetia se
  # quedo atras (la regla amplio la lista de tablas y esta convencion siguio
  # publicando la version anterior: dos versiones que se contradecian). F-147:
  # la regla ya no se publica (`fuera_mcp`); esta linea dice por que. F-149:
  # tampoco la NOMBRA, porque la IA leia una referencia a una regla que no
  # puede consultar (lo vigila `tests/test_f149_mcp_sin_reglas_no_publicadas.py`).
  identidad_sigrid: >-
    `raw` (la copia de Sigrid) no se consulta desde el MCP. Como se lee
    Sigrid -la clave `ide`, las tablas que son propiedades de `con` y de que
    lado sale cada campo- es guia interna del ETL.

# ===========================================================================
# EJES DEL MODELO (R4)
# ===========================================================================
#
# El seguimiento cruza dos ejes y produce cuatro escenarios. Los literales de
# `escenario` son EXACTAMENTE estos: el agente los va a poner en un WHERE, y
# estan fijados en mart.v_pbi_dim_escenario.

ejes:
  - eje: magnitud
    valores: [COSTE, VENTA]
    significa: Que se mide, el coste de ejecutar o la venta al cliente.
  - eje: naturaleza
    valores: [REAL, PLANIFICADO]
    significa: Lo que ha pasado frente a lo que estaba previsto que pasara.
  - eje: escenario
    valores:
      - Coste Real
      - Coste Planificado
      - Venta Real
      - Venta Planificada
    significa: >-
      El cruce de los dos anteriores, y la columna por la que se filtra de
      verdad. Cada escenario viene de un ambito de Sigrid: Coste Real del 3,
      Venta Real del 7, Coste Planificado del 8 y Venta Planificada del 11.

# ===========================================================================
# ESQUEMAS (R4)
# ===========================================================================
#
# Son los de `ESQUEMAS_DEL_DATAMART` (eran nueve hasta F-057). Los informes de
# exploracion decian ocho y se equivocaban.
# Ojo a la trampa de nombres: el esquema se llama `aux` y su carpeta de SQL es
# `sql/auxiliar/`.

esquemas:

  mart:
    titulo: Seguimiento mensual listo para consumo
    para_que_sirve: >-
      Es la superficie principal para preguntas de planificacion y produccion:
      cuanto se ha producido y cuanto se habia planificado, mes a mes, por obra
      y partida. Aqui la version master vigente YA esta resuelta, que es lo que
      lo hace consultable directamente.
    consumo_recomendado: true
    refresco: nocturno
    pasos_etl: [build_mart]

  cierre:
    titulo: Cierre economico mensual de obra
    para_que_sirve: >-
      Ejecutado y previsto por obra y mes, con gastos y beneficio derivados, mas
      la cabecera de la obra (cliente, tecnico, presupuestos y modificados). Es
      lo que responde "cuanto llevamos ejecutado a cierre del mes M".
    consumo_recomendado: true
    refresco: nocturno
    pasos_etl: [build_cierre]

  compras:
    titulo: Mundo documental de la compra a proveedores
    para_que_sirve: >-
      Contratos, albaranes, proformas, notas, facturas y abonos de proveedor:
      lineas SIN IVA y cabeceras CON IVA (`R-COMPRAS-SIN-IVA`). A quien se
      compra, cuanto se contrata, que hay albaranado sin facturar y el coste
      por partida; tambien formas de pago, comparativos, alarmas y el estado
      de cada documento (`compras.v_estado_documentos`, de `rac`, F-132).
    consumo_recomendado: true
    refresco: nocturno
    pasos_etl: [build_compras]

  retenciones:
    titulo: Retenciones de garantia practicadas y sufridas
    para_que_sirve: >-
      Un registro por efecto de retencion, a proveedores y de clientes, con
      saldo vivo, fechas de liquidacion y marca de vencida. La de PROVEEDOR la
      manda la contabilidad: `retenciones.saldo_contable` (por proveedor y
      obra), cuadrada con los efectos en `retenciones.v_cuadre_proveedor` y
      con su vencimiento en `retenciones.v_retencion_contable_obra`.
    consumo_recomendado: true
    refresco: nocturno
    pasos_etl: [build_retenciones]

  personal:
    titulo: Quien ha trabajado en cada obra y cuantas horas
    para_que_sirve: >-
      Recursos (personas, medios y consumos) y las lineas de parte que atan
      persona, horas y obra: horas imputadas, quien trabajo y su coste.
      TRAMPA: la cantidad de una linea NO son horas (mezcla HORA, DIA, MES y
      UD): usa `personal.v_pbi_horas_obra_mes`. CONTIENE DATOS PERSONALES
      (nombre, NIF y DNI), autorizados por el responsable del dato el
      2026-09-18.
    consumo_recomendado: true
    refresco: nocturno
    pasos_etl: [build_personal]

  contabilidad:
    titulo: La contabilidad financiera, el mayor y el plan de cuentas
    para_que_sirve: >-
      La contabilidad financiera de las 38 empresas desde 2008, sin los
      apuntes de personal: el plan de cuentas (`contabilidad.plan_cuentas`),
      el mayor (`contabilidad.mayor`) y los saldos por cuenta y mes
      (`contabilidad.saldos_cuenta_mes`). TRAMPA: el saldo es `importe_saldo`
      (`R-SALDO-CONTABLE`). No es el plan analitico de
      `maestro.cuentas_analiticas`.
    consumo_recomendado: true
    refresco: nocturno
    pasos_etl: [build_contabilidad]

  contabilidad_restringida:
    titulo: La contabilidad COMPLETA, con la informacion de personal (solo perfil total del MCP y rol autorizado)
    para_que_sirve: >-
      La misma contabilidad que `contabilidad`, pero COMPLETA: con nominas,
      cuentas de trabajadores, prestamos, anticipos y embargos (F-135). Solo
      la leen el perfil total del MCP (`mcp_sigrid_dm_total`) y el grupo
      `sigrid_dm_autorizado_ro`; para los demas, «permission denied». No se
      suma con `contabilidad` (`R-PERFILES`).
    consumo_recomendado: true
    refresco: nocturno
    pasos_etl: [build_contabilidad]

  tesoreria:
    titulo: La cartera de cobros y pagos (sin los pagos de personal)
    para_que_sirve: >-
      La cartera de efectos de cobro y pago (`tesoreria.efectos`): que vence
      y que nos deben (`R-TESORERIA-ESTADO`: BAJA no se suma). Y los
      ingredientes de la caja futura: lo pactado, el devengo pendiente de cada
      obra y las hipotesis para pasarlo a caja, que hay que declarar
      (`R-CAJA-HIPOTESIS`). Sin los pagos de personal.
    consumo_recomendado: true
    refresco: nocturno
    pasos_etl: [build_tesoreria]

  tesoreria_restringida:
    titulo: La cartera COMPLETA, con los pagos de personal (solo perfil total del MCP y rol autorizado)
    para_que_sirve: >-
      La misma cartera que `tesoreria`, pero COMPLETA: con los pagos de
      nomina, embargo y cuota (F-037). Solo la leen el perfil total del MCP
      (`mcp_sigrid_dm_total`) y el grupo `sigrid_dm_autorizado_ro`; para los
      demas, «permission denied». No se suma con `tesoreria` (`R-PERFILES`) y
      vale `R-TESORERIA-ESTADO`.
    consumo_recomendado: true
    refresco: nocturno
    pasos_etl: [build_tesoreria]

  compras_restringida:
    titulo: Las alarmas COMPLETAS de los documentos, con recursos y partes (solo perfil total del MCP y rol autorizado)
    para_que_sirve: >-
      Lo de compras que nombra a trabajadores o es del proveedor: las alarmas
      COMPLETAS, con las de recursos y partes (F-138), y la cuenta bancaria de
      cada documento (F-128). Solo lo leen el perfil total del MCP
      (`mcp_sigrid_dm_total`) y el grupo `sigrid_dm_autorizado_ro`. No se suma
      con `compras.documento_alarmas` (`R-PERFILES`).
    consumo_recomendado: true
    refresco: nocturno
    pasos_etl: [build_compras]

  descompuestos:
    titulo: De que se compone cada partida, por origen
    para_que_sirve: >-
      Composicion de cada partida, por ORIGEN: Estudios (MASTER_ESTUDIO, el
      master 0, o ESTUDIO donde no lo hay; juntas, `v_pbi_master_estudio` y
      `v_pbi_estudio`), la planificacion del jefe de obra (PLANIF_JO) y las
      demas versiones del master. Los origenes no se suman
      (`R-DESCOMPUESTO-ORIGEN`). Desde el 2026-09-29:
      `descompuestos._versiones_cargadas`.
    consumo_recomendado: true
    refresco: nocturno
    pasos_etl: [ingest_descompuestos, build_descompuestos]

  maestro:
    titulo: Maestros y dimensiones de consulta directa
    para_que_sirve: >-
      Obras, proveedores y la relacion proveedor-obra de los contratos, el
      puente centro de coste -> obra y los catalogos de estados de documento y
      de cuentas analiticas, para consultarse tal cual. `maestro.obras` es el
      universo SIN filtrar (superconjunto de `stg.obras`), con direccion y las
      marcas de que datos tiene cada obra.
    consumo_recomendado: true
    refresco: nocturno
    pasos_etl: [build_maestros]

  _meta:
    titulo: Instrumentacion del propio ETL
    para_que_sirve: >-
      Responde "de cuando es el dato que me estas dando". Guarda una fila por
      ejecucion de paso, el estado de cada tabla de `raw` y, desde F-006, el
      diccionario semantico publicado. Es de donde sale la fecha de build que
      toda respuesta tiene que citar.
    consumo_recomendado: true
    refresco: nocturno
    pasos_etl: [ingest_raw, build_stg, build_mart]

  aux:
    titulo: Parametrizacion auxiliar del mart
    para_que_sirve: >-
      Reglas de periodificacion de coste que la vista `mart.v_fact_periodificado`
      aplica. Hoy la tabla se crea VACIA por diseno: no se periodifica nada y la
      vista es un passthrough.
    consumo_recomendado: false
    refresco: estatico
    pasos_etl: []

  stg:
    titulo: Capa intermedia de preparacion, y tambien superficie de consulta
    para_que_sirve: >-
      Normaliza Sigrid y explota la planificacion por mes. SI se consulta:
      presupuesto por partida y ambito (tambien los que `mart` no construye,
      como la certificacion), el arbol de partidas y las fases. Lo resuelto
      aguas abajo es mas comodo en `mart` y `cierre`. TRAMPA: en
      `stg.plan_mensual` conviven todas las versiones master
      (`R-VERSION-MASTER`).
    consumo_recomendado: true
    refresco: nocturno
    pasos_etl: [build_stg]

  raw:
    titulo: Copia literal de Sigrid
    para_que_sirve: >-
      Reflejo tabla a tabla del SQL Server de Sigrid, sin transformar y sin
      semantica de negocio: nombres de cuatro letras, fechas como enteros y el
      valor 0 en lugar de NULL. Su diccionario real es `azure-apps/sigrid_tablas.md`.
      No se consulta para responder preguntas de negocio.
    consumo_recomendado: false
    refresco: nocturno
    pasos_etl: [ingest_raw]

# ===========================================================================
# COLUMNAS TECNICAS QUE NO SON NEGOCIO
# ===========================================================================
#
# Instrumentacion del ETL. Ensucian el catalogo y no responden nada.

ocultar:
  - _ingested_at
  - _source_tiemod
  - _built_at

# ===========================================================================
# BATERIA DE ACEPTACION (R39, R41)
# ===========================================================================
#
# El criterio de exito de F-006, escrito aqui para que el agente tambien pueda
# leerlo. Recuento honesto: de 18 preguntas, **13 se responden hoy, 3 a medias
# y 2 no se pueden responder**. Un "no puedo responderlo con esta base, y este
# es el motivo" es una respuesta CORRECTA; inventarse una cifra, no.
#
# Cuatro son preguntas TRAMPA deliberadas (P9, P10, P11, P16): si el agente cae
# en una, no ha fallado el agente, ha fallado la ficha del objeto, y hay que
# corregirla antes de cerrar la feature.

preguntas_aceptacion:

  - id: P1
    pregunta: Que proveedores nos han facturado mas
    objetos_esperados:
      - compras.v_pbi_proveedor_obra
      - compras.fact_compras_linea
    respuesta_correcta: >-
      Importes SIN IVA. Los abonos ya restan porque entran en negativo, asi que
      no se vuelven a restar. No se pierden las filas con obra_id nulo, que son
      estructura y gastos generales. Si baja al grano de linea, agrupa por
      (tipo_doc, linea_id) y no por linea_id a secas.
    reglas_implicadas: [R-COMPRAS-LINEA, R-COMPRAS-SIN-IVA]
    estado: respondible

  - id: P2
    pregunta: Que retenciones tengo de los proveedores de la obra X
    objetos_esperados:
      - retenciones.movimientos
      - retenciones.v_pbi_retenciones_vivas
    respuesta_correcta: >-
      Filtra sentido = 'PROVEEDOR' y, para lo pendiente, estado = 'VIVA': las
      filas BAJA (agrupados, divididos, anulados) no se suman nunca (F-094).
      Da `saldo_vivo` por defecto y menciona que
      existe la otra lectura, `neto_practicado`, y que pueden divergir. NO une
      el efecto a las lineas de su factura. La obra se filtra por `obra_id`
      (la de `maestro.obras` desde F-094) o por `codigo_obra`. Senala las filas con obra_id nulo y
      num_obras_documento > 1, que son facturas repartidas entre varias obras.
      Cita la fecha de build de `build_retenciones`: se refresca de noche, pero
      su paso puede fallar sin tumbar el resto de la carga.
    reglas_implicadas: [R-RETENCION-NO-JOIN-LINEAS, R-FRESCURA]
    estado: respondible
    nota: >-
      La vista cruzada obra x proveedor no existe: las dos agregadas cortan por
      un eje cada una. Llega con F-039.

  - id: P3
    pregunta: Quien fue el proveedor de fontaneria de la obra X
    objetos_esperados:
      - compras.contratos
    respuesta_correcta: >-
      Declara explicitamente que es una HEURISTICA sobre texto libre (un LIKE
      sobre `contratos.descripcion`) y que el datamart no tiene taxonomia de
      oficio. Nunca presenta el resultado como una clasificacion.
    estado: parcial
    bloqueada_por: F-036

  - id: P4
    pregunta: Cual es el flujo de caja de la obra X
    objetos_esperados: []
    respuesta_correcta: >-
      "El datamart no tiene tesoreria." No hay ni un objeto de cobros o pagos en
      los diez esquemas. Cualquier numero es incorrecto, incluida la tentacion
      de dar el facturado como si fuera caja.
    estado: bloqueada
    bloqueada_por: F-037

  - id: P5
    pregunta: De la obra X, lo facturado por contrato, lo que hay en albaran sin facturar y los comparativos
    objetos_esperados:
      - compras.v_pbi_contrato_consumo
      - compras.v_pbi_albaranes_sin_facturar
      - compras.comparativos
    respuesta_correcta: >-
      Contrato y albaran se responden. Solo ALBARAN y PROFORMA cuentan como
      pendientes de facturar, y la sobrefacturacion conserva signo negativo.
      Los comparativos salen de `compras.comparativos` filtrando su `obra_id`,
      con los cuatro importes por su nombre y sin llamar a ninguno «el»
      importe: el contratado (`importe_contratado`) se repite en los
      comparativos que comparten contrato y no se suma entre ellos, y el
      adjudicado se da con y sin `adjudicado_atipico`. Todo SIN IVA. Cita la
      fecha de build de `build_compras`.
    reglas_implicadas: [R-COMPRAS-SIN-IVA, R-FRESCURA]
    estado: respondible

  - id: P6
    pregunta: Cual es la planificacion mensual de la obra X
    objetos_esperados:
      - mart.fact_seguimiento_mensual
      - mart.v_master_versiones_tipadas
    respuesta_correcta: >-
      Va a `mart`, NO a `stg.plan_mensual`, donde conviven todas las versiones.
      Usa `importe_mes` y no suma `importe_origen` a lo largo del tiempo.
      Menciona que las versiones de tipo 'Cierre mensual' no reemplazan al plan.
    reglas_implicadas: [R-VERSION-MASTER, R-IMPORTE-MES]
    estado: respondible

  - id: P7
    pregunta: Cuanto llevamos ejecutado en la obra X a cierre del mes M, en venta y en coste
    objetos_esperados:
      - cierre.v_pbi_cierre_resumen
      - cierre.v_pbi_cierre_cabecera
    respuesta_correcta: >-
      CITA LA FECHA DE BUILD de `build_cierre`: el esquema se refresca de noche,
      pero su paso puede haber fallado sin tumbar el resto de la carga. Los
      porcentajes van contra la VENTA de esa misma columna y ese mismo mes, no
      contra el presupuesto global.
    reglas_implicadas: [R-FRESCURA]
    estado: respondible

  - id: P8
    pregunta: Que obras se desvian mas de su master vigente en coste directo
    objetos_esperados:
      - mart.fact_seguimiento_categoria
      - mart.v_master_vigente_anual
    respuesta_correcta: >-
      Separa magnitud (COSTE/VENTA) y naturaleza (REAL/PLANIFICADO) y no mezcla
      ambitos. Filtra categoria = 'CD' para coste directo. Compara sobre la
      misma ventana temporal en los dos escenarios.
    reglas_implicadas: [R-VERSION-MASTER]
    estado: respondible

  - id: P9
    pregunta: Cuantas obras activas tenemos
    objetos_esperados:
      - maestro.obras
      - stg.obras
    respuesta_correcta: >-
      DECLARA QUE UNIVERSO USA: `maestro.obras` no filtra nada y `stg.obras`
      excluye administrativas y códigos de cinco o mas digitos. Y usa
      `maestro.obras.es_activa`, NO `stg.obras.activa`, que esta cableada a TRUE
      y vale TRUE para todas.
    reglas_implicadas: [R-UNIVERSO-OBRA, R-OBRA-ACTIVA]
    estado: respondible
    es_trampa: true

  - id: P10
    pregunta: Cual es el presupuesto de la obra X
    objetos_esperados:
      - stg.presupuesto
    respuesta_correcta: >-
      Usa el importe TOTAL sin distribucion mensual, no la suma de
      `plan_mensual`, y `importe` en coste y en venta: es el presupuesto SIN
      coeficientes, el que se compara con el ejecutado y el coste (F-118).
      `importe_oficial` es la venta CON los coeficientes del contrato, lo que se
      factura; darla solo si se pide eso, y decirlo, sin mezclarla con la otra.
      Filtra la fase correcta.
    reglas_implicadas: [R-FAS-AMBIGUO, R-VERSION-MASTER, R-VENTA-COEFICIENTES]
    estado: respondible
    es_trampa: true

  - id: P11
    pregunta: Dame la evolucion mensual del coste directo de la obra X en el ano A
    objetos_esperados:
      - mart.fact_seguimiento_mensual
    respuesta_correcta: >-
      Usa `importe_mes`. Si suma `importe_origen` a lo largo de los meses, la
      respuesta es INCORRECTA aunque el numero parezca razonable: multiplica por
      unas nueve veces.
    reglas_implicadas: [R-IMPORTE-MES]
    estado: respondible
    es_trampa: true

  - id: P12
    pregunta: Que tenemos en albaranes sin facturar
    objetos_esperados:
      - compras.v_pbi_albaranes_sin_facturar
    respuesta_correcta: >-
      Usa `compras.v_pbi_albaranes_sin_facturar`, que SI filtra por tipo: solo
      ALBARAN y PROFORMA. Y no generaliza la regla: en
      `compras.v_pbi_contrato_consumo` el pendiente se suma sin filtrar, asi que
      alli las NOTA tambien cuentan. Cita la fecha de build de `compras`, o
      advierte de que no es consultable.
    reglas_implicadas: [R-COMPRAS-LINEA, R-FRESCURA]
    estado: respondible

  - id: P13
    pregunta: Que retenciones vencen este trimestre y siguen vivas
    objetos_esperados:
      - retenciones.v_pbi_retenciones_vencidas
      - retenciones.v_pbi_retenciones_vivas
    respuesta_correcta: >-
      Usa las vistas de vivas y vencidas en lugar de recalcular el estado, y
      cita la fecha de build de `build_retenciones`: su paso puede haber fallado
      esta noche sin tumbar el resto de la carga.
    reglas_implicadas: [R-FRESCURA]
    estado: respondible

  - id: P14
    pregunta: Cuales son las diez partidas con mas coste incurrido de la obra X
    objetos_esperados:
      - compras.v_pbi_partida_coste
    respuesta_correcta: >-
      Advierte de que `compras` no filtra por `stg.obras` y puede traer obras
      administrativas que el seguimiento excluye. Y dice que el puente entre el
      coste planificado de la partida y el incurrido documental **no existe
      todavia** como objeto, aunque `partida_id` los une.
    reglas_implicadas: [R-UNIVERSO-OBRA]
    estado: parcial
    bloqueada_por: F-039

  - id: P15
    pregunta: De cuando es el dato que me estas dando
    objetos_esperados:
      - _meta.v_frescura
    respuesta_correcta: >-
      Devuelve el ultimo OK y el ultimo intento POR SEPARADO —que un paso haya
      fallado esta noche no borra el dato bueno de ayer— y la version del
      diccionario publicado. Da la frescura DEL PASO que construyo el objeto de
      la pregunta, no la del pipeline: los diez pasos de la noche tienen cada
      uno la suya y uno puede haber fallado.
    reglas_implicadas: [R-FRESCURA]
    estado: respondible
    nota: >-
      Es la prueba de aceptacion de R15 y R16. Cuando exista `_meta.v_diccionario`
      (bloque E), la respuesta sale de UNA sola consulta.

  - id: P16
    pregunta: Cuanto le hemos comprado al proveedor P en toda la empresa este ano
    objetos_esperados:
      - compras.fact_compras_linea
    respuesta_correcta: >-
      FILTRA `tipo_doc`: sumar sin filtrar cuenta contratado, albaranado y
      facturado como si fueran tres costes distintos. No trata `linea_id` como
      unico. Y no compara el resultado con
      `maestro.proveedores_obra.importe_contratado`, que lleva IVA.
    reglas_implicadas: [R-COMPRAS-LINEA, R-COMPRAS-SIN-IVA]
    estado: respondible
    es_trampa: true

  - id: P17
    pregunta: Quienes son nuestros diez mayores clientes
    objetos_esperados: []
    respuesta_correcta: >-
      "No lo tenemos": la tabla `cli` de Sigrid no se ingiere y las ventas
      (`dvf`/`dvfpro`) tampoco. Del cliente solo conocemos el nombre, via
      `raw.con.res` a traves de `obr.entide`. No hay importe facturado a cliente
      en el datamart.
    estado: bloqueada
    bloqueada_por: F-040

  - id: P18
    pregunta: Que obras estan mal configuradas, sin planificado en algun mes
    objetos_esperados:
      - mart.v_master_versiones_tipadas
      - mart.fact_seguimiento_mensual
    respuesta_correcta: >-
      Reconoce el sintoma: obras que solo tienen versiones de tipo 'Cierre
      mensual', que no reemplazan al plan. Y que un mes sin fila de la version
      vigente da importes 0 sin dejar por ello de ser la vigente.
    reglas_implicadas: [R-VERSION-MASTER]
    estado: respondible

  # P19-P22 (F-038, acceptance 13): las cuatro que el MCP tiene que responder
  # sin que nadie le explique nada.
  - id: P19
    pregunta: Cuantos comparativos hay por actividad
    objetos_esperados:
      - compras.comparativos
    respuesta_correcta: >-
      Agrupa `compras.comparativos` por `actividad` (o `actividad_id`), que es
      la actividad de verdad (`com.natide`), y NO por `nombre_comparativo`, que
      es texto libre. Cuenta aparte los que tienen la actividad a NULL. No
      confunde la actividad con el texto de `dbo.log`. Cita la fecha de build
      de `build_compras`.
    reglas_implicadas: [R-FRESCURA]
    estado: respondible

  - id: P20
    pregunta: Cuanto se ahorro en el concurso de los comparativos de la obra X
    objetos_esperados:
      - compras.comparativos
    respuesta_correcta: >-
      Suma `ahorro_concurso`: la oferta REAL mas cara menos la mas barata, SIN
      IVA, solo en los comparativos con dos o mas ofertas reales con importe.
      No recalcula el ahorro con las ofertas de `compras.comparativo_ofertas`
      sin quitar las ficticias (OBJETIVO, OFICINA TECNICA, PLANIFICACION). Dice
      en cuantos comparativos hubo concurso que medir. Cita la fecha de build
      de `build_compras`.
    reglas_implicadas: [R-COMPRAS-SIN-IVA, R-FRESCURA]
    estado: respondible

  - id: P21
    pregunta: Quien aprobo el comparativo X y cuando
    objetos_esperados:
      - compras.comparativos
    respuesta_correcta: >-
      Busca el comparativo por `codigo_comparativo` y da `aprobado_por` y
      `fecha_aprobacion`, con su `estado`. Si estan a NULL dice que el
      comparativo no esta en un estado final de firma y que esa fecha NO
      EXISTE, en vez de inventarla con `fecha_alta`; si hay firmas pendientes
      (`n_firmas_pendientes`), lo dice. Cita la fecha de build de
      `build_compras`.
    reglas_implicadas: [R-FRESCURA]
    estado: respondible

  - id: P22
    pregunta: Acabo en contrato el comparativo X
    objetos_esperados:
      - compras.comparativos
    respuesta_correcta: >-
      Usa `compras.comparativos.contrato_id` --con `codigo_contrato` y
      `fecha_contrato`--, que lee las lineas del comparativo. NO usa
      `compras.contratos.comparativo_id`, que es la cabecera del contrato y
      solo cubre el 56 %: con ella responderia NO en miles de casos en que es
      SI. Cita la fecha de build de `build_compras`.
    reglas_implicadas: [R-FRESCURA]
    estado: respondible

  # P23-P26 (F-067): las preguntas del correo de Compras y la de Juan Romero.
  - id: P23
    pregunta: Que contratos llevan mas de tres semanas enviados y sin firmar
    objetos_esperados:
      - compras.v_estado_documentos
      - compras.contratos
    respuesta_correcta: >-
      Filtra `compras.v_estado_documentos` por `tipo_documento = 'CONTRATO'`,
      `estado_codigo = 'EPF'` y `dias_en_estado > 21`, y une con
      `compras.contratos` para proveedor y obra. Da `en_estado_desde` como la
      fecha del envio (sale de `rac`, al segundo) y quien lo envio. Avisa de
      los envios antiguos sin cerrar: la mayoria de esos contratos se enviaron
      hace años y nadie los cerro en Sigrid (el 2026-10-08, 785 de 809, y solo
      23 enviados de 2025 en adelante), asi que los separa por fecha de envio.
      NO usa `fecha_ultima_modificacion` (`con.tiemod`). Cita la fecha de
      build de `build_compras`.
    reglas_implicadas: [R-FRESCURA]
    estado: respondible

  - id: P24
    pregunta: Cuando cambio de estado la factura X y por que estados ha pasado
    objetos_esperados:
      - compras.documento_procesos
    respuesta_correcta: >-
      Lee los pasos de `compras.documento_procesos` de la factura, ordenados
      por `orden`: cada uno con su estado de origen y de destino, la fecha y la
      hora (Madrid) y quien lo dio. Dice que es la historia NETA: un paso
      deshecho en Sigrid ya no esta, y el datamart no sabe cuando se deshizo
      (eso solo lo guarda `dbo.log`, que no se ingiere: F-105).
    reglas_implicadas: [R-FRESCURA]
    estado: respondible

  - id: P25
    pregunta: >-
      Cuantos comparativos hay por actividad, y que proveedores ganan
      comparativos de varias actividades
    objetos_esperados:
      - compras.comparativos
    respuesta_correcta: >-
      Agrupa `compras.comparativos` por `actividad`, y por
      `proveedor_ganador_id` contando actividades distintas. Avisa de los 877
      comparativos con contrato y sin ganadora unica, cuyo proveedor sale de
      `contrato_id`. No habla de actividades «validadas»: no existen en Sigrid.
    reglas_implicadas: [R-FRESCURA]
    estado: respondible

  - id: P26
    pregunta: Que hemos recibido con el codigo 2 MOMOSA en el albaran AC26/28510
    objetos_esperados:
      - compras.albaran_lineas
      - compras.albaranes
    respuesta_correcta: >-
      Busca el albaran por `codigo_albaran` y lista sus lineas de
      `compras.albaran_lineas` con su `codigo_alternativo` («codigo 2», que
      pone el jefe de obra en el DPC), su `necesidad_id` y si vienen de
      contrato (`contrato_linea_id`). Sabe que el codigo 2 es texto libre sin
      normalizar.
    reglas_implicadas: [R-FRESCURA]
    estado: respondible

