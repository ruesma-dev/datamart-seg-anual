#
# UN MATIZ NUEVO QUE ANTES NO EXISTIA: al materializar, `CURRENT_DATE` deja de
# evaluarse en cada consulta. El "ano en curso" y el "mes de corte" de
# `fact_cp_tipologia` son los de la NOCHE DEL BUILD, no los de quien pregunta.
# Con refresco nocturno solo se nota el dia 1 de cada mes antes de la carga, y
