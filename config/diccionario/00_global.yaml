# version 55 (F-144, 2026-10-18): SI NO SE INDICA EMPRESA, ES CONSTRUCCIONES
# RUESMA. Orden del humano: «en general si no se indica empresa es construcciones
# ruesma. es criterio general». Regla dura nueva `R-EMPRESA-POR-DEFECTO`, junto a
# `R-CODIGO-POR-EMPRESA` (que remite a ella): sin empresa en la pregunta se
# filtra `empresa_id = 1` en todo objeto con empresa, la IA DICE que lo ha
# supuesto, no se aplica si se pide otra empresa, varias, el grupo o una UTE, y
# nunca se suman empresas sin decirlo. Sin objetos ni columnas nuevos. La regla
# nombra objeto a objeto donde hay empresa y donde solo `obra_id` (lo recorre
# `tests/test_f144_empresa_por_defecto.py`); en los objetos sin ninguna de las
# dos el criterio no se aplica y la respuesta avisa de que mezcla las empresas.

