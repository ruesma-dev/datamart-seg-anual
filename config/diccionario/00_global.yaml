version: 63
base: sigrid_dm
titulo: Datamart de seguimiento anual de obra

# ===========================================================================
# REGLAS DURAS (R9)
# ===========================================================================
#
# No son consejos: son la diferencia entre un numero correcto y uno plausible
# y falso. Cada una nace de una trampa concreta del modelo, y varias de un
# error real que se dio y costo tiempo. Por eso todas llevan `motivo`: una
# regla sin porque se desobedece a la primera.
#
# El `ambito` es lo que hace que la regla llegue al agente: el validador
# adjunta su codigo a la ficha de cada objeto alcanzado (R12), asi que quien
# solo consulte `describir_tabla` ve sus trampas sin haber leido esto.

reglas:

  # F-147 (v59): toda regla lleva `resumen` -la ORDEN corta que basta sola y
  # que `contexto_bbdd` sirve en lugar de `regla` + `motivo`, que son el
  # detalle para `describir_tabla`- y una `entrega`: `resumen` (por defecto),
  # `entera` (se sirve entera siempre) o `fuera_mcp` (no se publica). Revision
  # una a una, decidida por el humano el 2026-10-22:
  # `specs/F-147-presupuesto-contexto-mcp/revision_reglas.md`. Lo que salio de
  # las reglas al acortarlas o fundirlas esta en la ficha de su objeto.

  - codigo: R-FRESCURA
    titulo: Ocho esquemas pueden quedarse atras sin tumbar la noche
    severidad: bloqueante
    ambito: [cierre, compras, compras_restringida, maestro, retenciones, personal, contabilidad, contabilidad_restringida, tesoreria, tesoreria_restringida, descompuestos]
    resumen: >-
      Cita la fecha del dato en toda respuesta de cierre, compras, maestro,
      retenciones, personal, contabilidad, tesorería o descompuestos: cada uno
      se construye aparte y puede ir una noche atrasado. Fecha: «ESTADO POR
      ESQUEMA» o `_meta.v_frescura`.
    regla: >-
      Estos ocho esquemas (once con `contabilidad_restringida`,
      `tesoreria_restringida` y `compras_restringida`, que construyen el mismo
      `build_contabilidad`, el mismo `build_tesoreria` y el mismo
      `build_compras`) SI se construyen cada noche dentro de
      `run-all`, y los ocho registran paso, asi que su fecha de build siempre es
      consultable. Lo que no cambia es que su paso NO es dependencia de ningun
      otro: si `build_cierre`, `build_compras`, `build_maestros`,
      `build_retenciones`, `build_personal`, `build_contabilidad`,
      `build_tesoreria` o `build_descompuestos` falla (o su ingesta
      `ingest_descompuestos`, que lo salta), la noche continua y termina, y ese
      esquema se queda con el dato de una noche anterior mientras `raw`, `stg` y
      `mart` estan al dia. Toda respuesta que salga de ellos DEBE citar su fecha
      de build: `SELECT * FROM _meta.v_frescura WHERE paso = 'build_cierre'` (o
      `build_compras`, `build_maestros`, `build_retenciones`, `build_personal`,
      `build_contabilidad`, `build_tesoreria`, `build_descompuestos`).
      `compras.vencimientos` es una vista de `tesoreria.efectos`: su frescura
      es la de `build_tesoreria`. Que el pipeline sea uno solo NO significa que
      todo el datamart tenga la misma frescura.
    motivo: >-
      La composicion real esta en `main.build_pipeline_steps`, y sus pasos se
      llaman —con el mismo nombre que tienen en `_meta.v_frescura.paso`, que es
      donde se consulta su frescura— `ingest_raw`, `load_excel_aux`,
      `build_stg`, `build_mart`, `build_maestros`, `build_tesoreria`,
      `build_compras`, `build_retenciones`, `build_personal`,
      `build_contabilidad`, `ingest_descompuestos`, `build_descompuestos`,
      `build_cierre`, `publicar_diccionario` y `apply_grants`. Hasta el 2026-08-28 cuatro de
      ellos se lanzaban A MANO y podian llevar semanas parados; peor aun, `mart`
      DESTRUIA cada noche `cierre.v_pbi_planif_vs_real` —cuelga de
      `mart.fact_seguimiento_categoria`, que `03_agg_categoria.sql` dropea con
      CASCADE— y nadie la recreaba. `personal` (F-057, 2026-09-18) nacio ya
      dentro de la nocturna y con la misma propiedad, y esta vez a proposito:
      un fallo del SQL de personal no puede dejar al `mart` sin construir.
      `contabilidad` (F-056, 2026-09-26), `descompuestos` (F-097,
      2026-09-28) y `tesoreria` (F-037, 2026-10-13), igual. Dar un dato de
      cualquiera de los ocho sin fecha es dar una respuesta vieja con aplomo.

  - codigo: R-IMPORTE-MES
    titulo: importe_mes no se suma entre meses; importe_origen ya es acumulado
    severidad: bloqueante
    ambito:
      - mart.fact_seguimiento_mensual
      - mart.fact_seguimiento_categoria
      - mart.v_pbi_fact
      - mart.v_pbi_fact_categoria
      - mart.v_fact_periodificado
      - stg.plan_mensual
      - cierre.fact_cierre_mensual
      - cierre.v_pbi_cierre_resumen
      - cierre.v_pbi_cierre_indirectos_detalle
      - cierre.v_pbi_cierre_generales_detalle
    resumen: >-
      Los importes van en pareja mes/acumulado (`importe_mes`/`importe_origen`;
      en `cierre`, `ejecutado_mes`/`ejecutado_origen`). Para series suma el del
      mes; el acumulado NUNCA se suma entre meses: de un periodo se toma su
      último mes.
    regla: >-
      Todo importe del datamart viene en pareja: uno del MES y otro ACUMULADO A
      ORIGEN. Para una serie temporal se suma el del mes; el acumulado ya lleva
      dentro todos los meses anteriores, asi que sumarlo a lo largo del tiempo
      multiplica el resultado, y de un total de un periodo se toma su valor del
      ULTIMO mes, no la suma. La pareja cambia de nombre segun el esquema: en
      `mart` y en `stg` son `importe_mes` e `importe_origen`; **en `cierre` son
      `ejecutado_mes` y `ejecutado_origen`**, y la trampa es identica.
    motivo: >-
      Fue el bug de la Tanda 1.4 del cierre: multiplicaba por unas nueve veces
      (`sql/cierre/02_build_fact.sql`). Esta escrito con los nombres de los dos
      esquemas precisamente porque el bug ocurrio en `cierre` y la regla se
      redacto mirando a `mart`. El numero salia grande pero creible, que es
      exactamente lo peligroso.

  - codigo: R-VENTA-COEFICIENTES
    titulo: La venta con coeficientes no se mezcla con la venta sin ellos, el ejecutado ni el coste
    severidad: bloqueante
    ambito:
      - stg.presupuesto
      - cierre.fact_cierre_mensual
      - cierre.v_pbi_cierre_resumen
      - cierre.v_pbi_cierre_cabecera
      - tesoreria.devengo_pendiente_partida
      - tesoreria.devengo_pendiente_obra_mes
      - tesoreria.devengo_corte_obra
    resumen: >-
      Cierres, beneficio y análisis usan la venta SIN coeficientes (`importe`,
      `final_importe`). La CON coeficientes (`importe_oficial`,
      `*_con_coeficientes`) es lo facturado: nunca se suma ni compara con
      ejecutado, coste ni venta sin ellos.
    regla: >-
      Hay DOS ventas. La SIN coeficientes (`stg.presupuesto.importe`,
      `cierre.*.final_importe`, `presupuesto_inicial_venta`,
      `presupuesto_vigente_venta`) es la que se usa para cierres, beneficio y
      analisis, y es la unica comparable con el ejecutado y con el coste. La CON
      coeficientes (`stg.presupuesto.importe_oficial`,
      `final_importe_con_coeficientes`, las columnas `_con_coeficientes` de la
      cabecera) es lo que se factura al cliente. NUNCA se suma, resta ni
      compara una venta con coeficientes con el ejecutado, con el coste o con
      una venta sin ellos: ni un beneficio, ni un pendiente, ni un %, ni unos
      modificados. Y NO HAY EJECUTADO CON COEFICIENTES: la venta real no los
      guarda, asi que un «ejecutado con coeficientes» seria inventado.
    motivo: >-
      Hasta F-118 el cierre sumaba la venta final con coeficientes
      (`importe_oficial`, el `impcoe` de Sigrid) y le restaba un ejecutado y un
      coste que no los llevan: en el cierre de agosto de 2026 la 0702 daba
      +1.695.571,87 EUR de beneficio final donde son -790.718,46, y 42 obras
      tenian la venta final inflada (511 filas-mes, 2021-2026). Decision del
      humano del 2026-09-29: sin coeficientes para cierres y analisis, y la otra
      aparte. El coeficiente por contrato (F-099), en la ficha de
      `stg.presupuesto.importe_oficial`.

  - codigo: R-UNIVERSO-OBRA
    titulo: Hay dos universos de obra y no cuentan lo mismo
    severidad: bloqueante
    ambito:
      - stg.obras
      - maestro.obras
      - mart.v_pbi_dim_obra
    resumen: >-
      Dos universos: `stg.obras` (seguimiento, sin códigos administrativos) y
      `maestro.obras` (todas las fichas, una por empresa y código). Al contar
      obras di cuál usas; `compras` y `retenciones` no filtran por `stg.obras`.
    regla: >-
      `stg.obras` es el universo del SEGUIMIENTO: excluye codigos
      administrativos (0001-0005, CM, CP, GG, VAR, POSTV*, BD*, GGD, GINT, OT),
      excluye codigos con cinco o mas digitos seguidos y deduplica por el
      mecanismo de Sigrid `conext.cod = '15'`. `maestro.obras` NO filtra nada:
      es superconjunto, con una fila por FICHA (una por empresa y codigo, F-102).
      Toda respuesta que cuente obras debe decir cual usa. `compras` y
      `retenciones` tampoco filtran por `stg.obras` y pueden traer obras
      administrativas que el seguimiento excluye. Que ficha elige `stg.obras`
      cuando un codigo tiene varias lo dice su ficha.
    motivo: >-
      Los filtros estan en `sql/stg/03_obras.sql`; `sql/maestro/01_obras.sql` no
      tiene ninguno. Contar en una o en otra da cifras distintas a proposito, y
      dar la del maestro como "obras de la empresa" infla el numero.

  - codigo: R-CODIGO-POR-EMPRESA
    titulo: El codigo de una obra o de un recurso solo es unico dentro de su empresa
    severidad: bloqueante
    ambito:
      - maestro.obras
      - maestro.v_obra_fichas
      - stg.obras
      - personal.partes_lineas
      - personal.partes
      - personal.recursos
      - retenciones.movimientos
      - retenciones.apuntes_contables
      - retenciones.saldo_contable
      - retenciones.fin_obra
      - retenciones.v_retencion_contable_obra
      - maestro.centros_coste
      - compras.contratos
      - compras.albaran_lineas
      - compras.factura_lineas
      - compras.fact_compras_linea
      - maestro.cuentas_analiticas
      - contabilidad.plan_cuentas
      - contabilidad.mayor
    resumen: >-
      Un código de obra, recurso o cuenta solo es único dentro de su empresa:
      cruza, filtra y agrega con `empresa_id` o por
      `clave_obra`/`clave_recurso`/`clave_cuenta` (`1-0581`). Los hechos llevan
      el `obra_id` de la ficha de SU empresa.
    regla: >-
      En Sigrid las obras y los recursos son POR EMPRESA: el mismo codigo existe
      una vez por empresa --Ruesma (1), Porsan (28), cada UTE-- y es la misma
      obra, o la misma persona, vista desde cada una, SIN CONSOLIDAR. **Por
      `codigo_obra` o `codigo_recurso` se cruza, se filtra y se agrega SIEMPRE
      junto con `empresa_id`, o por la clave legible**: `clave_obra` en
      `maestro.obras` y en las vistas de `compras` con obra, y `clave_recurso` en
      `personal.recursos`, las dos con la forma `<empresa>-<codigo>` (`1-0581`,
      `27-0581`). Cruzar solo por el codigo devuelve duplicados o coge la ficha
      que no es. `maestro.obras.es_ficha_principal` marca la ficha de Ruesma de
      cada codigo, y `obra_principal_id` apunta a ella solo como REFERENCIA: no
      sirve para agregar hechos de otras empresas, porque sumaria lo de la UTE
      en la obra de Ruesma. Los hechos (`compras`, `retenciones`, `personal`)
      llevan el `obra_id` de la ficha de SU empresa y no se traducen. Contar
      obras por codigo es contar `es_ficha_principal`, y hay que decirlo. Lo
      mismo vale para las cuentas analiticas (`maestro.cuentas_analiticas`) y el
      plan de cuentas financiero (`contabilidad.plan_cuentas`,
      `contabilidad.mayor`: (`empresa_id`, `codigo_cuenta`) o `clave_cuenta`).
      Y si la pregunta no indica empresa, es Construcciones Ruesma
      (`R-EMPRESA-POR-DEFECTO`).
    motivo: >-
      Medido en solo lectura (F-102, F-107 y F-056, 2026-09-23 a 26): 922
      fichas de obra para 846 codigos y 2.618 recursos, y ningun codigo de obra,
      recurso, cuenta analitica ni cuenta contable repetido dentro de una
      empresa; agregando por codigo, 84.233 lineas de compras de otras empresas
      se mezclaban con obras de Ruesma.

  - codigo: R-EMPRESA-POR-DEFECTO
    titulo: Sin empresa en la pregunta, es Construcciones Ruesma (empresa_id = 1), y se dice
    severidad: bloqueante
    ambito: [maestro, compras, compras_restringida, retenciones, personal, contabilidad, contabilidad_restringida, tesoreria, tesoreria_restringida]
    resumen: >-
      Sin empresa en la pregunta, filtra `empresa_id = 1` (Construcciones
      Ruesma) y dilo. Sin columna de empresa, llega por `obra_id` →
      `maestro.obras`; si tampoco hay obra, avisa de que la cifra mezcla todas.
      Nunca sumes empresas sin decirlo.
    regla: >-
      Es un CRITERIO GENERAL: si la pregunta no indica empresa, se entiende
      Construcciones Ruesma, `empresa_id = 1`, y la respuesta lo dice («he
      supuesto Construcciones Ruesma, `empresa_id = 1`, porque la pregunta no
      indica empresa»). NO se aplica si la pregunta pide otra empresa (Porsan es
      la 28), varias, el grupo o una UTE: entonces se filtra por las que pide y,
      si son varias, se dice si van por separado o sumadas. Nunca se suman
      empresas sin decirlo. Donde filtrar se decide OBJETO A OBJETO, y cada
      ficha dice su caso: con columna de empresa (`empresa_id`, o
      `maestro.centros_coste.empresa`), por ella; con solo `obra_id`, cruzando
      con `maestro.obras` (su `empresa_id`, o `clave_obra` que empieza por `1-`:
      `R-CODIGO-POR-EMPRESA`), y las filas sin obra quedan fuera y se cuentan; sin empresa ni
      obra, el objeto mezcla las 38 empresas: la respuesta lo dice y NO dice
      «he supuesto Construcciones Ruesma» (si la ficha da un camino comprobado
      para filtrarlo, se usa ese). `stg`, `mart`, `cierre` y `descompuestos` no
      tienen empresa: manda `R-UNIVERSO-OBRA`.
    motivo: >-
      Orden del humano del 2026-10-18, pedida primero en la sesion de
      `mcp-bbdd` («si no se dice nada es construcciones ruesma») y confirmada
      en este repositorio: «en general si no se indica empresa es construcciones
      ruesma. es criterio general». Sin ella, una pregunta sin empresa sumaria
      las 38 empresas de Sigrid --Ruesma, Porsan y cada UTE, que repiten la
      misma obra SIN CONSOLIDAR (`R-CODIGO-POR-EMPRESA`)-- o la IA elegiria una
      sin decirlo. Que la IA lo diga es sugerencia de `mcp-bbdd`: el usuario ve
      el supuesto y lo corrige. `empresa_id = 1` es 'CONSTRUCCIONES RUESMA' en
      `maestro.obras.nombre_empresa` (Azure, 2026-10-18). El inventario de que
      objeto tiene empresa, obra o ninguna vive en cada ficha desde F-147.

  - codigo: R-SALDO-CONTABLE
    titulo: El saldo contable no se suma con los cierres ni las aperturas
    severidad: bloqueante
    ambito:
      - contabilidad.plan_cuentas
      - contabilidad.mayor
      - contabilidad.saldos_cuenta_mes
      - contabilidad_restringida.plan_cuentas
      - contabilidad_restringida.mayor
      - contabilidad_restringida.saldos_cuenta_mes
    resumen: >-
      Saldo = suma de `importe_saldo`, o `saldo_acumulado` del último apunte o
      mes. Nunca `SUM(importe)` sin filtrar `clase_asiento`: CIERRE y APERTURA
      duplican. El resultado del ejercicio, sin REGULARIZACION.
    regla: >-
      El saldo de una cuenta es la suma de `importe_saldo` (en el mayor o en
      `contabilidad.saldos_cuenta_mes`) y el saldo a una fecha es
      `saldo_acumulado` del ultimo apunte o mes hasta ella. **Nunca
      `SUM(importe)` sin filtrar `clase_asiento`**: los apuntes de CIERRE y
      APERTURA de cada ejercicio mueven el mismo importe dos veces, y sumar el
      historico quitando solo los CIERRE cuenta cada apertura encima del
      movimiento que ya resume. SALDO_INICIAL (la apertura de una cuenta sin
      cierre el ejercicio anterior) SI cuenta. En los grupos 6 y 7 la
      REGULARIZACION de fin de ejercicio deja la cuenta a cero: el resultado de
      un ejercicio se lee sin ella. Los grupos del plan (niveles 1-4) no tienen
      apuntes: su saldo se agrega desde las cuentas auxiliares por los
      ancestros de `contabilidad.plan_cuentas`, dentro de la empresa.
    motivo: >-
      Medido el 2026-09-26 en solo lectura: la cuenta `1-4308000197` tiene 641
      apuntes y un saldo de 1.189.275,13; sumando todo su historico sin los
      CIERRE salen 7.742.538,38, una cifra plausible y falsa. `apu.cla` solo
      marca la clase a veces (los cierres de 2020, las aperturas de 2021 y 290
      regularizaciones vienen con 0), por eso la clase se publica ya resuelta
      en `clase_asiento`. Con la regla, la subcuenta 434 de la empresa 1 en 2026
      da 5.345.557,80, lo mismo que la pantalla de Sigrid.

  - codigo: R-PERFILES
    titulo: El perfil restringido ve menos que el estandar; *_restringida es solo del total
    severidad: bloqueante
    entrega: entera
    ambito:
      - contabilidad
      - contabilidad_restringida
      - tesoreria
      - tesoreria_restringida
      - personal
      - compras_restringida
      - compras.documento_alarmas
      - compras.vencimientos
      - compras.v_facturas_pago
      - compras.v_control_forma_pago
      - compras.documento_procesos
      - compras.documento_adjuntos
      - retenciones.apuntes_contables
    resumen: >-
      Usa siempre el esquema general; `*_restringida` es solo del perfil total
      y solo si piden personal (nóminas, embargos, cuentas, alarmas de recursos
      y partes); nunca se suman con la general. «permission denied» no se
      rodea: di que tu perfil no lo ve.
    regla: >-
      Tres perfiles: TOTAL ⊃ ESTANDAR ⊃ RESTRINGIDO. El TOTAL (y el grupo
      `sigrid_dm_autorizado_ro`) lee ademas los `*_restringida`; el ESTANDAR,
      el consumo salvo `raw` y `*_restringida`; el RESTRINGIDO
      (administrativos), lo del estandar MENOS el esquema `contabilidad` entero
      (`contabilidad.mayor`, `contabilidad.saldos_cuenta_mes`; tampoco el mayor
      analitico), `tesoreria` y `personal`. SI lee `retenciones` y `compras`.
      «restringida» = reservada al perfil total: los `*_restringida` son del
      perfil TOTAL y NO del perfil restringido. «permission denied» no se
      rodea: ni el mayor desde `retenciones.apuntes_contables`, ni personas
      desde los logins de `compras`, ni la cartera desde
      `compras.vencimientos`; responde que el perfil no lo incluye.
    motivo: >-
      Decisiones del humano (F-135, F-037, F-138, F-141; F-146 el 2026-10-21). El MCP no
      filtra el diccionario por perfil y esta regla trata de lo que el perfil
      no ve: por eso se sirve entera. Lo que falta en cada general, en su
      ficha.

  - codigo: R-TESORERIA-ESTADO
    titulo: En la cartera de cobros y pagos BAJA no se suma, y fecha real vacia no es pendiente
    severidad: bloqueante
    ambito: [tesoreria, tesoreria_restringida, compras.vencimientos]
    resumen: >-
      Filtra siempre `estado_tesoreria`: BAJA nunca se suma; REALIZADO es
      pagado o cobrado y PREVISTO pendiente. `fecha_real` vacía NO es
      pendiente. Caja = PREVISTO y NOT `previsto_antiguo`. En
      `compras.vencimientos`: `estado_pago` y `efecto_anulado`.
    regla: >-
      Filtra SIEMPRE por `estado_tesoreria`. BAJA (efecto dividido, agrupado o
      anulado) NO se suma nunca: su dinero ya esta en los efectos hijos.
      REALIZADO es lo pagado o cobrado y PREVISTO lo pendiente. NO uses
      `fecha_real IS NULL` como «pendiente»: desde 2020 el pago por remesa
      queda Pagado (estado 10) SIN fecha real, y esos efectos son REALIZADO.
      La cartera de un flujo de caja es `estado_tesoreria = 'PREVISTO' AND NOT
      previsto_antiguo`: el previsto vencido hace mas de 2 anos es deuda sin
      puntear que hay que depurar en Sigrid, no caja; si lo incluyes, dilo. Un
      PREVISTO vencido (y no antiguo) es una deuda que sigue viva o un efecto
      sin puntear: no lo presentes como pagado. Para el neto de caja suma
      `importe_flujo` (+ en COBRO, - en PAGO). Esto es CARTERA, no devengo:
      convertir la planificacion de obra en caja es una hipotesis que tienes
      que declarar (`R-CAJA-HIPOTESIS`). En `compras.vencimientos` el estado es
      `estado_pago` y la baja `efecto_anulado`: la misma trampa con otros
      nombres.
    motivo: >-
      Medido el 2026-10-13 en solo lectura: 89.779 pagos y 8.548 cobros (35 %)
      estan de baja; con ellos el cobro previsto seria 385,4 M EUR frente a los
      47,5 del saldo de clientes. 41.884 pagos y 2.106 cobros estan Pagados sin
      fecha real (casi todos desde 2020): con la fecha como criterio contarian
      como previstos. Sin la baja, PAGO previsto 80,1 M EUR frente a 78,8 del
      grupo 40+41, pero con 3,9 M EUR de previsto antiguo que la contabilidad
      no sostiene (223 cuentas cuadran al centimo solo sin el). Mismo patron
      que F-094 en las retenciones: efectos antiguos no punteados.

  - codigo: R-CAJA-HIPOTESIS
    titulo: No hay caja proyectada; pasar devengo a caja exige declarar todas las hipotesis
    severidad: bloqueante
    entrega: resumen
    ambito:
      - tesoreria.devengo_corte_obra
      - tesoreria.devengo_pendiente_obra_mes
      - tesoreria.devengo_pendiente_partida
      - tesoreria.hipotesis_caja
      - tesoreria.hipotesis_caja_obra
      - tesoreria.condiciones_contrato_compra
      - tesoreria.condiciones_contrato_cliente
      - tesoreria.plazos_forma_pago
      - tesoreria.efectos
      - mart.fact_seguimiento_mensual
    resumen: >-
      No hay caja proyectada: sigue la receta de la ficha de
      `tesoreria.hipotesis_caja`, sin repetir la cartera, y declara TODAS las
      hipótesis de `tesoreria.hipotesis_caja_obra` con valor y nivel: DEFECTO,
      OBRA o USUARIO (manda).
    regla: >-
      Sigue la RECETA de la ficha de `tesoreria.hipotesis_caja`, en su orden
      (siete pasos; cada hipotesis dice el suyo en `paso_receta`). El
      datamart NO tiene una caja proyectada: tiene sus ingredientes. Para
      proyectar cobros y pagos parte de `tesoreria.devengo_corte_obra` y
      `tesoreria.devengo_pendiente_obra_mes` (el devengo pendiente de la ultima
      version master, ya DESCONTADO partida a partida de lo ejecutado desde
      ella: H18) y aplica las hipotesis de `tesoreria.hipotesis_caja_obra`. En
      la respuesta DECLARA TODAS las hipotesis del catalogo
      (`tesoreria.hipotesis_caja`), cada una con su valor y su nivel, sin que
      te lo pidan: USUARIO si el usuario dio el valor en la conversacion (y
      manda), OBRA si viene de la obra (YAML o contratos), DEFECTO si es el
      del catalogo. Avisa de las que no estan validadas (`validado` falso) y
      di las que no aplican y por que. El devengo va SIN IVA: el IVA y su
      liquidacion son hipotesis aparte (H12-H14). No cuentes dos veces lo que
      ya esta en la cartera: lo PREVISTO vivo (`cartera_viva`), lo emitido
      despues del cierre (`cartera_emitida_tras_cierre`) y los albaranes sin
      facturar (H16, H20, H21).
    motivo: >-
      Decision del humano del 2026-10-24/25 (F-140): convertir devengo en caja
      depende de plazos, retenciones, IVA y criterios que Negocio aun no ha
      validado (las 23 hipotesis se publican con `validado` falso). Una cifra
      de caja sin sus hipotesis parece un dato y es una suposicion. Medido el
      2026-10-25: el pendiente (133,20 M EUR de coste) supera en 19 M EUR al
      plan restante (113,98) porque las obras van retrasadas, y en las 21
      obras hay 36,4 M EUR de pagos ya en cartera viva: sin la frontera se
      contarian dos veces. F-150 (2026-10-28): sin un orden, la IA combinaba
      los ingredientes distinto en cada conversacion; la receta fija el orden,
      las hipotesis pasan a 27 y la venta se cobra con el coeficiente, el IVA
      y la retencion del contrato de cada partida.

  - codigo: R-DESCOMPUESTO-ORIGEN
    titulo: Los descompuestos no se mezclan entre origenes ni entre versiones
    severidad: bloqueante
    ambito:
      - descompuestos.lineas
      - descompuestos.cuadre_partida
      - descompuestos.elementos
      - descompuestos.v_pbi_master_planif_jo
      - descompuestos.v_pbi_master_estudio
    resumen: >-
      Filtra o agrupa siempre por `origen`: ESTUDIO, MASTER_ESTUDIO, PLANIF_JO
      y los MASTER_* no se suman. En el master filtra una versión (`fase_num`)
      o `es_vigente`, o cada línea cuenta una vez por versión. Orígenes, lado a
      lado por partida.
    regla: >-
      Toda consulta sobre `descompuestos.lineas` o `descompuestos.cuadre_partida`
      filtra o agrupa por `origen`: ESTUDIO y MASTER_ESTUDIO (Estudios),
      PLANIF_JO (la planificacion de compras del jefe de obra) y los otros dos
      del master (MASTER_PRE_ABC, MASTER_PLANIF_JO) son cosas distintas, y
      sumarlos da un descompuesto que no existe. LA FASE VIVA: coste fase 0
      (ambito 3, `fase_num` 0) es el presupuesto de coste que el jefe de obra
      evoluciona dia a dia, sin historia; su descompuesto es la planificacion de
      compras (PLANIF_JO), y su «Descomposicion» ya no es Estudios. Que origen
      es Estudios en cada obra lo dicen las fichas de
      `descompuestos.v_pbi_master_estudio` y `descompuestos.v_pbi_estudio`. Si
      una partida no tiene descompuesto de Estudios, el cuadre de su origen de
      Estudios dice SIN_DESCOMPUESTO. En el master, ademas, hay una copia POR
      VERSION: se filtra por `fase_num` (una version concreta) o por
      `es_vigente`; sin filtrar, cada linea cuenta tantas veces como versiones
      tenga la obra. Para comparar Estudios con el jefe de obra se ponen los
      dos origenes LADO A LADO por partida, nunca se suman. Las vistas
      `v_pbi_*` ya llevan el origen cableado.
    motivo: >-
      Medido el 2026-09-27: la «Descomposicion» de COSTE se reescribe con la
      planificacion (7.866 de 42.958 partidas son copia de su `dncpro`), el
      master tiene 3.023 versiones con una copia del descompuesto cada una
      (mediana 14 por obra, hasta 46) y la misma partida vale distinto en cada
      origen: la 03.05.02 de la 0695 son 112,55 en la version 1 del master,
      118,61 en la ABC y 177,95 en la planificacion. Sumar origenes o versiones
      da una cifra plausible y falsa. Medido el 2026-10-02 (F-123): donde hay
      master 0, la «Descomposicion» de la fase viva tenia las mismas lineas y la
      misma suma por unidad que la version 0 en 26.833 de 26.959 partidas, y
      era NO_CUADRA en 18.132 de 24.855 (su precio ya se habia movido), frente
      al master 0, que cuadra en 34.174 de 34.849: la fase viva no es Estudios.

  - codigo: R-PROVEEDOR-INTRAGRUPO
    titulo: El mayor proveedor de la empresa es la propia empresa
    severidad: bloqueante
    ambito:
      - compras.fact_compras_linea
      - compras.v_pbi_proveedor_obra
      - maestro.proveedores
      - maestro.proveedores_obra
    resumen: >-
      En un ranking de proveedores el nº 1 es la propia Ruesma (CIF A81873903)
      y detrás hay UTE del grupo. No hay marca de intragrupo: dalo tal cual
      diciendo cuáles son, o exclúyelos por CIF y dilo.
    regla: >-
      **Todo ranking de "a quien le hemos comprado mas" tiene que decir que
      hace con las operaciones intragrupo, porque el numero 1 es la propia
      empresa**: `CONSTRUCCIONES RUESMA, S.A.` (CIF `A81873903`), con mas del
      doble que el segundo. Y detras hay varias **UTE** del grupo (`UTE
      VALDEBEBAS VI`, `UTE JARAS BOADILLA`...) que son coinversiones, no
      proveedores externos. Un ranking que las mezcle sin avisar dice que
      nuestro mayor proveedor somos nosotros, que es cierto y no es lo que
      preguntaban. Como no hay ninguna marca de grupo en el datamart, la unica
      salida hoy es **declararlo en la respuesta**: dar la lista tal cual y
      decir cuales son intragrupo, o excluirlos por CIF diciendo que se han
      excluido.
    motivo: >-
      Es uno de los seis casos de uso del humano y salio mal en la primera
      pregunta de la bateria del 2026-08-22. Medido sobre
      `compras.fact_compras_linea` (FACTURA y ABONO): 23,8 M€ de Ruesma el
      2026-08-25 y 29,5 M€ el 2026-10-22, por delante de `UTE VALDEBEBAS VI`
      (9,7 M€). Resolverlo bien exige modelar el intragrupo y no es de esta
      regla: aqui solo se declara la trampa.

  - codigo: R-SIGRID-CON
    titulo: La regla de oro de Sigrid, sin la cual `raw` es ilegible
    severidad: bloqueante
    # F-147: guia del que escribe el SQL del ETL, no de la IA. `raw` no esta en
    # la lista blanca de `mcp-bbdd` y ningun login del MCP tiene USAGE sobre el
    # (comprobado en Azure el 2026-10-22): no se publica en `_meta`.
    entrega: fuera_mcp
    ambito:
      - raw
    resumen: >-
      Antes de escribir SQL contra `raw`: `ide` es la clave, diez tablas son
      propiedades 1:1 de `con`, ciertos campos se leen de su tabla y no de
      `con`, las fechas son enteros YYYYMMDD con 0 = NULL y las referencias
      polimórficas se filtran por tipo.
    regla: >-
      Antes de escribir cualquier consulta contra `raw`, seis cosas.

      **1. `ide` es la clave de las 80 tablas.** Se llama igual en todas, es el
      indice primario y es unico. Un campo que acaba en `ide` —`conide`,
      `entide`, `obride`— es una referencia a el.

      **2. Diez tablas son "Propiedades de `con`" en 1:1**: `obr`, `prv`, `cen`,
      `ctr`, `com`, `dca`, `dcf`, `cob`, `pag` y `rec`. No son entidades
      completas: son la extension especifica de un concepto y comparten su `ide`
      con una fila de `con`. Unirlas por `ide` nunca multiplica.

      **3. `con` trae `cod`, `res` y `fec`** —codigo, nombre legible y fecha de
      alta— **y es de donde el datamart los toma para esas diez**. Pero **no
      asumas que un campo esta en `con` solo porque exista alli**: hay tablas
      cuyos campos propios el ETL lee **sin pasar por `con`**, y estas son, con
      el campo exacto: `apu` (`apu.fec`, `apu.res`); `auxala` (`auxala.cod`, `auxala.res`); `auxban` (`auxban.res`); `auxcob` (`auxcob.cod`, `auxcob.res`); `auxefc` (`auxefc.res`); `auxefp` (`auxefp.res`); `auxemp` (`auxemp.res`); `auxhor` (`auxhor.cod`, `auxhor.res`); `auxrestip` (`auxrestip.res`); `auxmun` (`auxmun.res`); `auxnap` (`auxnap.res`); `auxobramb` (`auxobramb.cod`, `auxobramb.res`); `auxobrcla` (`auxobrcla.res`); `auxobrtip` (`auxobrtip.res`); `auxpag` (`auxpag.cod`, `auxpag.res`); `auxpro` (`auxpro.res`); `auxpronat` (`auxpronat.cod`, `auxpronat.res`); `conest` (`conest.cod`, `conest.res`); `conext` (`conext.cod`); `confir` (`confir.cod`, `confir.fec`); `ctrpro` (`ctrpro.res`); `dcapro` (`dcapro.res`); `dcfpro` (`dcfpro.res`); `dcopro` (`dcopro.res`); `dncpro` (`dncpro.fec`, `dncpro.res`); `gra` (`gra.cod`, `gra.fec`, `gra.res`); `obrfas` (`obrfas.res`); `obrfasamb` (`obrfasamb.fec`, `obrfasamb.res`); `hmores` (`hmores.fec`); `obrctr` (`obrctr.cod`, `obrctr.res`); `obrparpar` (`obrparpar.cod`, `obrparpar.res`); `prv` (`prv.cif`, `prv.raz`); `rac` (`rac.fec`, `rac.res`); `res` (`res.cif`); `usu` (`usu.cod`, `usu.res`). Ahi el valor bueno es el de la tabla, no el de
      `con`.

      **4. Y hay tablas que no cuelgan de `con` en absoluto**: `auxhor`, `auxobramb`, `dvf`, `hmores`, `obrfas`, `obrfasamb`, `obrparpre`, `reshor`
      no se unen a `raw.con` en ningun SQL de este repositorio, asi que para
      ellas el JOIN de los puntos 2 y 3 **no existe**; su nombre esta en su
      propio `res` o no esta.

      **5. Las fechas son enteros `YYYYMMDD`**, y el valor `0` no es una fecha
      sino el NULL, porque Sigrid no guarda nulos en los enteros. Lo mismo vale
      para las referencias: un `entide` a 0 significa "sin asignar". Por eso el
      ETL las envuelve en `NULLIF(..., 0)` y las convierte con
      `stg.fn_sigrid_date_to_date`.

      **6. Hay referencias POLIMORFICAS, y no se pueden unir a ciegas.** En las
      lineas de documento de compra, `docoriide` apunta al documento de origen
      **y `docoritip` dice a que tabla**: 44 es contrato y 14 albaran. Unir
      `docoriide` sin filtrar antes por `docoritip` cruza lineas con documentos
      de otro tipo que casualmente comparten `ide`. Es lo que hace
      `compras/01_documentos.sql`:
      `CASE WHEN l.docoritip = 44 THEN NULLIF(l.docoriide, 0) END`.

      El nombre legible que usa todo el datamart es **`con.res`**: no hay una
      sola referencia a `con.nom` en el repositorio.
    motivo: >-
      Todo lo que afirma esta regla se **deriva de este repositorio**, que es la
      unica fuente de primera mano que tenemos sobre el origen: nuestro SQL no
      correria contra una columna inexistente, asi que cada `alias.campo` que
      aparece ahi es una columna real. La lista del punto 3 y la del punto 4 las
      genera un test (`tests/test_f006_fuente_que_gobierna.py`) barriendo
      `sql/**`, y la regla queda en rojo si dejan de coincidir.

      **Lo que esta regla NO dice, y es deliberado**: que campos existen en
      Sigrid y el datamart no lee. Esa pregunta solo la responde
      `azure-apps/sigrid_tablas.md`, que es la conversion literal de un PDF de
      380 paginas y **no se deja segmentar de forma fiable**. Intentarlo produjo
      dos afirmaciones falsas en dos revisiones seguidas —un campo `res`
      atribuido a `cen` que en realidad es de `cenrep`, tabla que ni se
      ingiere, y una lista de excepciones con una sola acertada
      de siete—. Para preguntar por una columna concreta, ese documento; para
      fiarse de una afirmacion, este repositorio.

      Ninguno de los seis puntos falla con un dato raro que invite a mirar:
      `con.nom` falla con "columna inexistente", consultar `obr` sin unir a `con`
      devuelve una obra sin codigo, y un `MIN(fecha)` que no excluya el cero
      devuelve cero, que parece un dato y no lo es.

  - codigo: R-ALBARAN-ABSURDO
    titulo: Dos lineas absurdas de un albaran de 2021 inflan cualquier suma de compras
    severidad: bloqueante
    # F-147 (D5): se mantiene DE MOMENTO, minima y sin cifras que envejezcan.
    # Se retira cuando Administracion corrija las dos lineas en Sigrid.
    ambito:
      - compras.v_pbi_albaranes_sin_facturar
      - compras.albaran_lineas
      - compras.fact_compras_linea
    resumen: >-
      Excluye las 2 líneas absurdas del albarán AC21/03345 (obra 0609): toda
      suma de compras lleva `abs(importe…) < 1e8` y lo dice. Un total de
      compras por encima de mil millones de euros es esta anomalía, no un
      hallazgo.
    regla: >-
      Las lineas 588705 y 588733 del albaran `AC21/03345` (obra 0609) traen un
      importe absurdo, con su espejo en `compras.albaran_lineas`. Toda suma
      lleva `abs(<importe>) < 1e8` y la respuesta dice que se excluyen.
    motivo: >-
      Error del dato de ORIGEN, que Administracion corregira en Sigrid. En la
      bateria del 2026-08-22 el agente dio la cifra inflada con aplomo.

  - codigo: R-OBRA-ACTIVA
    titulo: Obra activa es la obra VIVA de la nocturna; activa y es_activa mienten
    severidad: bloqueante
    ambito:
      - stg.obras
      - maestro.obras
      - stg.fases
      - _meta.v_frescura_obra
    resumen: >-
      «Obra activa» = obra VIVA de la nocturna (F-025): `estado_id` fuera de
      (1, 11, 25), código que no sea de 6 dígitos y alguna fase en `stg.fases`
      en los últimos 12 meses. `stg.obras.activa` y `maestro.obras.es_activa`
      valen TRUE siempre: no sirven.
    regla: >-
      El criterio es el de la ventana de la nocturna (F-025), sin inventar
      otro: `config/business_rules.yaml` -> `ventana`, que aplica
      `etl_sigrid/domain/ventana.py`. Una obra esta VIVA si su estado no es 1
      (EN ESTUDIO), 11 (NO PRESENTADA) ni 25 (CERRADA), su codigo no es
      administrativo de seis digitos y tiene alguna fase en `stg.fases` en los
      ultimos 12 meses, contados en meses enteros (justo 12 cuenta). Consulta
      equivalente sobre `maestro.obras`, mas `R-EMPRESA-POR-DEFECTO`:
      `SELECT o.empresa_id, o.codigo_obra FROM maestro.obras o JOIN (SELECT
      obra_id, MAX(make_date(anio, GREATEST(mes, 1), 1)) AS ultima FROM
      stg.fases WHERE anio BETWEEN 1990 AND 2100 GROUP BY obra_id) f ON
      f.obra_id = o.obra_id WHERE o.estado_id NOT IN (1, 11, 25) AND
      o.codigo_obra !~ '^[0-9]{6}$' AND (date_part('year', current_date) -
      date_part('year', f.ultima)) * 12 + date_part('month', current_date) -
      date_part('month', f.ultima) <= 12`. `_meta.v_frescura_obra` con `motivo
      = 'ventana' AND NOT congelada` no es equivalente: una obra viva sin filas
      va como `sin_filas` y los domingos todas van como `completa`.
      `stg.obras.activa` es un literal TRUE y `maestro.obras.es_activa` sale de
      una fecha de baja que Sigrid no informa: contar con cualquiera de las dos
      da el total disfrazado.
    motivo: >-
      Hasta la v58 esta regla decia que la pregunta no se podia responder,
      cuando el repositorio ya definia la obra viva para la nocturna (F-025).
      Medido en Azure el 2026-10-22 con la consulta de arriba: 41 obras, todas
      de la empresa 1; con `_meta.v_frescura_obra`, 40.

  - codigo: R-VERSION-MASTER
    titulo: En stg.plan_mensual conviven TODAS las versiones master
    severidad: bloqueante
    ambito:
      - stg.plan_mensual
      - mart.master_versiones_tipadas
      - mart.master_vigente_anual
      - mart.v_master_versiones_tipadas
      - mart.v_master_vigente_anual
    resumen: >-
      En `stg.plan_mensual` conviven todas las versiones master: filtrar solo
      por obra y ámbito multiplica. El planificado vigente está en
      `mart.fact_seguimiento_mensual`; 'Cierre mensual' nunca es master
      vigente.
    regla: >-
      Consultar `stg.plan_mensual` filtrando solo por obra y ambito multiplica
      los importes por el numero de versiones master de esa obra. La version
      vigente solo esta resuelta AGUAS ABAJO: para planificado se va a
      `mart.fact_seguimiento_mensual`, nunca a `stg`. Ademas, solo son master
      vigente las de tipo 'Planif Inicial', 'ABC' y 'Cuatrimestral'; las de
      'Cierre mensual' NO reemplazan al plan.
    motivo: >-
      Los ambitos master (8 y 11) guardan una fila por version y mes. `mart`
      elige la vigente por mes con la regla de `sql/mart/02_build_fact.sql`; el
      que va a `stg` directamente se salta esa eleccion y suma todas.

  - codigo: R-FAS-AMBIGUO
    titulo: fas significa dos cosas y cambia de nombre en cada capa
    severidad: bloqueante
    ambito:
      - stg.presupuesto
      - stg.plan_mensual
      - stg.fases
      - raw.obrfas
      - raw.obrfasamb
    resumen: >-
      `fas` es el MES en los ámbitos reales (3 coste, 7 venta; 0 = previsto
      vivo) y la VERSIÓN en los master (8, 11). Se llama `fase_num` en
      `stg.presupuesto` y `version` en `stg.plan_mensual`. No cruces las dos
      lecturas.
    regla: >-
      En los ambitos REALES (3 = coste, 7 = venta) `fas` es el MES, y `fas = 0`
      es el "Previsto" vivo. En los ambitos MASTER (8 = coste, 11 = venta) `fas`
      es el NUMERO DE VERSION. Ademas cambia de nombre segun donde mires: se
      llama `fase_num` en `stg.presupuesto` y `version` en `stg.plan_mensual`.
      Nunca cruces las dos lecturas.
    motivo: >-
      Es la ambiguedad estructural del modelo de Sigrid, verificada en los DDL
      de `sql/stg/01_ddl.sql`. Tratar una version como si fuera un mes produce
      series temporales inventadas.

  - codigo: R-CLAVE-SUSTITUTA
    titulo: Las claves BIGSERIAL cambian en cada build
    severidad: bloqueante
    ambito:
      - mart.fact_seguimiento_mensual
      - mart.fact_seguimiento_categoria
      - mart.v_pbi_fact
      - mart.v_pbi_fact_categoria
      - stg.plan_mensual
      - cierre.fact_cierre_mensual
    resumen: >-
      `fact_id`, `fact_cat_id`, `plan_id` y `cierre_id` se renumeran en cada
      build: no los enseñes ni los guardes como identificador; usa la clave de
      negocio.
    regla: >-
      `fact_id`, `fact_cat_id`, `plan_id` y `cierre_id` son BIGSERIAL sobre
      tablas que se reconstruyen enteras en cada build: se reasignan. No sirven
      como identificador estable, no se guardan fuera del datamart y no se le
      ensenan al usuario. Para identificar algo se usa su clave de negocio.
      EXCEPCION: `aux.periodificacion_partida.regla_id` tambien es BIGSERIAL
      pero su tabla se crea con `CREATE TABLE IF NOT EXISTS` y nadie la
      reconstruye, asi que ese si es estable.
    motivo: >-
      Las tablas afectadas se recrean con DROP + CREATE o se truncan en cada
      build (`sql/mart/01_ddl.sql`, `sql/cierre/01_ddl_fact.sql`, y
      `stg.plan_mensual` desde el propio paso). Un `fact_id` citado en un
      informe de ayer apunta hoy a otra fila.

  - codigo: R-PARTIDA-CODIGO-NO-UNICO
    titulo: El codigo de partida NO es unico ni dentro de su obra; se une por partida_id
    severidad: bloqueante
    ambito:
      - stg.partidas
      - mart.v_pbi_dim_partida
      - mart.v_pbi_dim_partida_niveles
      - mart.fact_seguimiento_mensual
      - mart.v_fact_periodificado
      - compras.v_pbi_partida_coste
      - cierre.v_pbi_dim_subcategoria_ci
    resumen: >-
      Une y cuenta partidas por `partida_id`, nunca por obra + código: el mismo
      código se repite en la obra (bloques, fases, contratos) y multiplica
      importes. Agrupar por código vale si lo dices; al usuario, la ruta de
      capítulos.
    regla: >-
      No cruces tablas por obra + código de partida: usa `partida_id`. Agrupar
      por código es válido si se quiere sumar todas las copias del concepto
      (por ejemplo, la misma partida en todos los bloques o fases), y hay que
      decirlo. Para identificar una partida ante el usuario, enseña su ruta de
      capítulos.

      Por qué: el mismo código cuelga de varios capítulos de la MISMA obra
      —uno por contrato o expediente, por vivienda tipo, bloque o fase, o por
      raíz paralela—, y cada copia es una partida distinta: 5.202 códigos
      repetidos en 158 obras (2026-09-25). Un JOIN por `(obra_id,
      codigo_partida)` multiplica importes: en la obra 0437 el coste real pasa
      de 883.460,55 EUR a 3.474.491,83. Añadir el contrato no lo arregla (4.437
      siguen repetidos) y `ruta_capitulos` tampoco es clave (155 repetidas):
      para unir y contar partidas, solo `partida_id`.
    motivo: >-
      F-109, medido en solo lectura el 2026-09-25: 5.202 pares `(obra_id,
      codigo_partida)` repetidos, 8.933 filas de mas, 158 obras (92 del
      seguimiento), identicos en `stg.partidas` y `mart.v_pbi_dim_partida`.
      Tres fichas de este diccionario afirmaban que el codigo identificaba la
      partida dentro de su obra. Unir el hecho con la dimension por obra y
      codigo infla la historia en 12.108.634,53 EUR de Coste Real (47 obras) y
      13.145.742,76 EUR de Venta Real (53). Hoy ningun SQL del repositorio une
      asi —todo va por `partida_id`—: el riesgo es el SQL libre del MCP, de
      Power BI o de un informe. Redaccion decidida por el humano el
      2026-09-26: unir por codigo, nunca; agrupar por codigo, declarandolo.

  - codigo: R-RETENCION-NO-JOIN-LINEAS
    titulo: Nunca unir un efecto de retencion a las lineas de su factura
    severidad: bloqueante
    ambito:
      - retenciones.movimientos
      - retenciones.v_src_lineas_compra
      - retenciones.v_src_lineas_venta
      - compras.factura_lineas
    resumen: >-
      `retenciones.movimientos` lleva un registro por efecto con el total
      retenido: nunca lo unas a líneas de factura (multiplica por nº de
      líneas). Agrega antes por documento y une por documento.
    regla: >-
      `retenciones.movimientos` tiene UN registro por efecto, con el importe
      total retenido. Unirlo a las lineas del documento origen multiplica ese
      importe por el numero de lineas de la factura. Si hace falta el detalle,
      se agrega primero por documento y se une despues por documento, nunca por
      linea.
    motivo: >-
      Es el error real que dio 38,9 M€ de retencion en UNA sola obra, siendo esa
      la cifra de toda la empresa. De ahi salio la nota global del prototipo
      `mcp-bbdd`, y de ahi sale esta regla.

  - codigo: R-COMPRAS-SIN-IVA
    titulo: Las lineas de compras son sin IVA; los totales de cabecera e importe_contratado lo llevan
    severidad: bloqueante
    ambito:
      - compras
      - maestro.proveedores_obra
    resumen: >-
      Los importes de línea de `compras` son SIN IVA; llevan IVA los totales de
      cabecera (`total_factura`, `total_documento`, `total_a_pagar`) y
      `maestro.proveedores_obra.importe_contratado`. No los compares: la
      diferencia es el impuesto.
    regla: >-
      Los importes de LINEA de `compras` (`compras.fact_compras_linea`,
      `compras.factura_lineas`, `compras.albaran_lineas` y las vistas que los
      agregan) son SIN IVA: base imponible de linea. Llevan IVA los totales de
      CABECERA que se publican desde F-128 -`total_factura` y `total_a_pagar`
      de `compras.facturas` (con `cuota_iva` aparte), y `total_documento` y
      `total_a_pagar` de `compras.albaranes`- y
      `maestro.proveedores_obra.importe_contratado`, que es `SUM(ctr.totdoc)`,
      el total del contrato. Un importe de linea no se compara con un total con
      IVA: la diferencia no es sobrecoste ni ahorro, es el impuesto (y, en
      `total_a_pagar`, tambien las retenciones).
    motivo: >-
      `sql/compras/02_fact_linea.sql` construye las lineas sin IVA y
      `sql/maestro/03_proveedores_obra.sql` suma `t.totdoc` de `raw.ctr`:
      compararlos da desviaciones falsas del orden del 21 %. Hasta la v58 esta
      regla negaba el IVA de las cabeceras que publica F-128.

  - codigo: R-COMPRAS-LINEA
    titulo: compras.fact_compras_linea mezcla tipos de documento y su clave es (tipo_doc, linea_id)
    severidad: bloqueante
    ambito:
      - compras.fact_compras_linea
      - compras.facturas
      - compras.factura_lineas
      - compras.v_pbi_proveedor_obra
      - compras.v_pbi_contrato_consumo
      - compras.v_pbi_partida_coste
    resumen: >-
      `compras.fact_compras_linea` mezcla CONTRATO, ALBARAN, PROFORMA, NOTA,
      FACTURA, ABONO y OTRO: filtra siempre `tipo_doc` (son el mismo coste en
      tres momentos). Su clave es (`tipo_doc`, `linea_id`). Los ABONO ya
      restan: no los restes otra vez.
    regla: >-
      `compras.fact_compras_linea` mezcla CONTRATO, ALBARAN, PROFORMA, NOTA,
      FACTURA y ABONO (mas OTRO): sumar `importe` sin filtrar `tipo_doc` suma
      el mismo gasto hasta tres veces, porque contratado, albaranado y
      facturado son tres momentos del MISMO coste. `linea_id` NO identifica una
      fila: viene de tres tablas de Sigrid (`ctrpro`, `dcapro`, `dcfpro`) cuyos
      identificadores colisionan, y la clave es `(tipo_doc, linea_id)`; un
      COUNT DISTINCT de `linea_id` pierde filas y un JOIN por `linea_id` a secas
      las duplica. Los ABONO llegan con su signo natural (negativo): un
      `SUM(importe)` sobre FACTURA y ABONO ya es el facturado neto, y
      restarlos otra vez da un error del doble de lo abonado.
    motivo: >-
      Los tipos los asigna `compras.fn_tipo_documento` sobre `(con.tip, serie)`
      y la tabla une los tres origenes sin clave primaria
      (`sql/compras/02_fact_linea.sql`); `sql/compras/03_views.sql` agrega los
      abonos junto a las facturas con su signo. Es la nota global del prototipo
      `mcp-bbdd`: «no filtrar tipo_doc triplica».

# ===========================================================================
# ORDENES DE MAGNITUD (R10)
# ===========================================================================
#
# Para que el agente detecte una cifra absurda ANTES de darla por buena. No son
# recuentos por objeto —esos envejecen mal y nadie los actualiza (DA-6)—, sino
# los cuatro totales de empresa que se mueven poco y que ya sirvieron para
# cazar el error de retenciones en el prototipo.

ordenes_de_magnitud:
  - concepto: >-
      Retenido VIVO a proveedores segun la CONTABILIDAD, la cifra que manda
      (`retenciones.saldo_contable`, suma de `saldo`)
    valor_aproximado: 8760000
    unidad: EUR
    criterio: saldo_vivo
    fuente: >-
      Medido el 2026-09-22 en Sigrid en solo lectura (F-095, consulta B1 de
      progress/spec_F-095.md): 8.760.524,49 EUR, el saldo de todas las cuentas
      `prv.cueretide`; remedido el 2026-09-24 en el datamart con la regla de
      `sql/retenciones/03_apuntes_contables.sql`: 8.775.052,87 EUR; y medido el
      2026-09-25 en el primer build con `raw.rac` (`SUM(saldo)` de
      `retenciones.saldo_contable`): 8.778.606,70 EUR. Es la suma de ALTA, BAJA
      y SALDO_INICIAL; **una cifra del orden de 60 M EUR** es que se han sumado
      los asientos de cierre o de apertura (52,12 M EUR por lado), y **una del
      orden de 10,5 M EUR** es que se ha sumado solo por obra, dejando fuera la
      fila sin obra, que es NEGATIVA (-1,74 M EUR el 2026-09-25). Los efectos
      vivos dan 8,36 M EUR (8.362.932,53 el 2026-09-25): la diferencia se
      explica proveedor a proveedor en `retenciones.v_cuadre_proveedor`.
  - concepto: Retenido VIVO a proveedores segun los EFECTOS (el detalle; manda la contabilidad)
    valor_aproximado: 8350000
    unidad: EUR
    criterio: saldo_vivo
    fuente: >-
      Medido el 2026-09-22 (F-094) en solo lectura con el SELECT de
      `sql/retenciones/01_movimientos.sql`: 8.345.506,03 € en 7.752 efectos
      de `pag` con `retide <> 0`, `fecrea = 0`, `con.fecbaj = 0` y `con.est`
      fuera de 10 (Pagado), 14 (Agrupados) y 15 (Divididos). Hasta F-094 aqui
      ponia 34,7 M€: salia solo de `fecrea` y contaba los agrupados junto a su
      agrupador y lo ya pagado, 4,3 veces lo real. **Una cifra de proveedor del
      orden de 35 M€ es ese error**: se esta sumando sin filtrar
      `estado = 'VIVA'`. NO es el total practicado historicamente: lo ya
      liquidado no cuenta aqui.
  - concepto: >-
      Retenido VIVO por clientes segun los efectos, SIN VERIFICAR: la
      contabilidad da 13,8 M EUR y el criterio de proveedor daria 2,1 M EUR
      (pendiente de su feature propia)
    valor_aproximado: 21900000
    unidad: EUR
    criterio: saldo_vivo
    fuente: >-
      LEEME_RETENCIONES_R1.md, misma tabla: efectos de `cob` con `retide <> 0`
      y `fecrea = 0` (22,16 M€ el 2026-09-22). **SIN VERIFICAR**: F-094 midio
      que el criterio de proveedor no vale para `cob` y que la contabilidad
      de las cuentas de retencion de cliente da 13,81 M€; queda para una
      feature propia. Es el orden de lo que publica el datamart, no un saldo
      contrastado.
  - concepto: Efectos de retencion practicados a proveedores, vivos y liquidados
    valor_aproximado: 25631
    unidad: filas
    criterio: total
    fuente: >-
      Medido en la base el 2026-09-23, tras la nocturna que construyo F-094:
      25.631 filas de `pag` con `retide <> 0`, sin filtrar por estado (7.751
      VIVA + 2.369 LIQUIDADA + 15.511 BAJA). F-094 no borra filas, solo las
      reclasifica. Hasta hoy aqui ponia 25.124, de LEEME_RETENCIONES_R1.md.
  - concepto: Efectos de retencion practicados por clientes, vivos y liquidados
    valor_aproximado: 2238
    unidad: filas
    criterio: total
    fuente: >-
      Medido en la base el 2026-09-23: 2.238 filas de `cob` con
      `retide <> 0`, sin filtrar por estado (2.196 VIVA + 42 LIQUIDADA).
      Hasta hoy aqui ponia 2.219, de LEEME_RETENCIONES_R1.md.

