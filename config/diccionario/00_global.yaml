# version 18 (F-079, 2026-09-09): TODO LO EXPUESTO ES PARA CONSULTA, y `stg`
# deja de estar desaconsejado. El esquema `stg` y sus SIETE objetos que no son
# funciones -`plan_mensual`, `presupuesto`, `partidas`, `obras`, `fases`,
# `version_master_vigente`, `ambitos`- pasan a `consumo_recomendado: true` y
# pierden su `motivo_no_consumo`. Lo que decian esos motivos eran PREFERENCIAS
# DE ENRUTADO -«capa intermedia», «para consultar partidas esta
# `mart.v_pbi_dim_partida`»- y el efecto era el contrario del buscado: el MCP
# tiene `stg` entre sus esquemas autorizados, asi que desaconsejarlo solo
# conseguia que el agente no mirase donde si hay dato. El caso que lo zanja: el
# ambito de certificacion vive en `stg.presupuesto` -que no filtra por ambito- y
# en ningun sitio aguas abajo.
#
# NO SE PIERDE NINGUNA ADVERTENCIA DE CORRECCION, y eran CUATRO, no dos. Las
# cuatro se mueven a la `descripcion` de su ficha, que es texto publicado:
# 1. `stg.plan_mensual`: aqui conviven TODAS las versiones master y consultar
#    sin filtrar version MULTIPLICA los importes. Llega ademas por la regla dura
#    `R-VERSION-MASTER`, bloqueante, cuyo ambito incluye la tabla.
# 2. `stg.obras.activa` no significa nada -constante TRUE-, y `es_activa`
#    tampoco. Llega ademas por `R-OBRA-ACTIVA` y por el propio significado de la
