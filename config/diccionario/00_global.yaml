# 3. `stg.version_master_vigente` resuelve la version de forma GLOBAL y no
#    coincide con `mart`, que la elige mes a mes, en los meses pasados.
# 4. `stg.ambitos.uso_seguimiento` esta DESFASADA: filtrar por ella da una
#    respuesta incompleta.
#
# NO cambian las 11 funciones `fn_*` (una funcion no se consulta: se llama desde
# el SQL del build) ni los 9 objetos rotos, vacios o de instrumentacion
# (`mart.v_pbi_cp_tipologia` -que arregla F-078-,
