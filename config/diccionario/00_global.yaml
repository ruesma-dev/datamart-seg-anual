# config/diccionario/00_global.yaml
#
# El bloque global del diccionario semantico del datamart (F-006).
#
# Este fichero se sirve casi entero al agente en su primera llamada: es lo que
# lee ANTES de escribir una linea de SQL. Aqui van las convenciones, los nueve
# esquemas, las reglas duras que impiden respuestas plausibles y falsas, los
# ordenes de magnitud contra los que detectar un disparate, y la lista de lo
# que todavia no esta documentado.
#
# `pendientes` es un TRINQUETE (R27): solo baja. La constante PENDIENTES_MAX de
# tests/test_f006_cobertura.py tiene que valer exactamente lo que hay aqui, y
# al cerrar F-006 esta lista queda vacia.

