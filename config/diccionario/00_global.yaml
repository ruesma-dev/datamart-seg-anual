# vez que les toco. OJO CON LAS CIFRAS, corregido en la version 16 con la
# nocturna del 2026-09-07 delante: el CRITERIO dice 40 vivas / 880 congeladas,
# pero la CONDUCTA real de una noche es 592 rehechas / 328 congeladas, porque
# 552 obras entran por no tener filas construidas y 512 siguen vacias despues.
# Esas 552 se rehacen todas las noches: su dato tiene horas, no seis dias. NO SE BORRAN Y SIGUEN CONSULTABLES: el build borra solo las obras que
# va a reinsertar, en la misma transaccion, asi que una obra congelada conserva
# exactamente sus filas y sus importes. La ventana no cambia ni una cifra;
# cambia DE CUANDO ES. Se anaden las fichas de `_meta.obra_build` y
# `_meta.v_frescura_obra` -que es donde se responde "de cuando es el dato de
# esta obra", y hay que citarla cuando la pregunta sea sobre una obra concreta-
# y se avisa en las de `stg.plan_mensual` y `stg.presupuesto`. La ficha de
# `maestro.obras.estado_id` deja de decir que su catalogo no se ingiere: los
# catorce estados de `conest` (tipo 42) quedan documentados con su nombre,
# verificados contra Sigrid el 2026-09-02.
