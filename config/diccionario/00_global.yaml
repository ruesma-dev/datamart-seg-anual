# version 21 (F-080, 2026-09-12): CINCO OBJETOS NUEVOS EN `compras` y tres
# tablas nuevas en `raw`, y ninguno se quita ni se renombra. Ya se puede
# preguntar CUANDO VENCE una factura de compra, si esta pagada, con que forma de
# pago y que se ha escrito sobre ella.
#
# `compras.vencimientos` son los **195.510 efectos de pago** de las facturas de
# compra, uno por fila, con su estado LEIDO de `raw.conest` (tip 25, 10 estados)
# y no derivado. `compras.v_facturas_pago` los resume por factura junto con su
# forma de pago, resuelta contra la dimension de F-073.
# `compras.v_control_forma_pago` enfrenta la forma de pago de la factura con la
# de su contrato, sin filtrar las que cuadran. Y `compras.documento_texto` /
# `compras.documento_comentarios` publican la pestaña «Texto»: el memo integro y
# el memo partido en comentarios con su fecha, su hora y su autor.
#
# LA TRAMPA QUE HAY QUE LEER ANTES DE SUMAR NADA DE VENCIMIENTOS: **sumar los
# importes de todos los efectos de una factura los cuenta hasta tres veces**.
# El efecto que se dividio se queda en la tabla ANULADO junto a sus hijos, y el
# estado no lo distingue. **89.228 de 255.148 efectos estan de baja (34,97 %)**
# y 76.215 de los 195.510 de factura (39,0 %): se filtran con
# `efecto_anulado = false`, que es lo que reproduce el numero de la cabecera de
# Sigrid (verificado sobre `FR25/04222`: 92.478,49 filtrando, 288.123,92 sin
# filtrar). Y dos avisos mas: `fecha_real` vacia **no significa «vivo»** (61,8 %
# la tienen asi, frente a los 10.607 pagos de cartera viva de F-037), y en
# `documento_comentarios` **`orden` 1 es el comentario MAS RECIENTE**, porque
# Sigrid apila en descendente.
#
# LO QUE NO SE PUBLICA, Y POR QUE: el enlace del efecto hijo a su efecto de
# origen. `pag.padide`, el campo que lo prometia, vale 0 en los 255.148 efectos,
# igual que `con.serie` (de ahi que la serie se derive con `compras.fn_serie`).
# Regla que deja esta feature: antes de diseñar sobre un campo del origen, se
# mide su cobertura.
#
# `raw` gana `auxnap` (3 naturalezas de pago), `auxban` (1.690 bancos y
# sucursales) y `rpa` (3.919 remesas de pago), y `con.tex` deja de excluirse de
# la ingesta: es donde vive el texto de la factura (65,5 %), no en `dcf.tex`
# (0,3 %). Se corrige de paso una afirmacion FALSA de la cabecera de
# `compras.yaml`, que decia que el esquema no se refresca de noche y que su
# fecha de build no es consultable: dejo de ser cierto en F-047.

# version 22 (F-078, 2026-09-15): TRES OBJETOS NUEVOS, Y UNA REGLA DE COSTE QUE
# DEJA DE SER CIERTA. `mart.v_pbi_cp_tipologia` era la unica `v_pbi_` sin tabla
# detras: se recalculaba entera en cada consulta -6,6 millones de unidades de
# coste estimado, cinco recorridos de `stg.plan_mensual` (29,8 M de filas, 11 GB)
# y un `WindowAgg` sobre 11,8 M de filas intermedias-, colgaba a Power BI en el
# paso de Navegacion y mataba cualquier pregunta del MCP que la tocase. Se
# materializa en `mart.master_versiones_tipadas`, `mart.master_vigente_anual`
# -calculada YA contra la anterior, que es lo que mata el `WindowAgg`- y
# `mart.fact_cp_tipologia`. Las TRES VISTAS SE QUEDAN, con el mismo nombre y las
# mismas columnas: el informe de Power BI no cambia ni una linea.
#
# LO QUE ESTO OBLIGA A CORREGIR, y es la mitad importante de esta version:
# la regla del coste de consulta (retirada en F-147) declaraba PUBLICAMENTE que `mart.v_pbi_cp_tipologia` no se
# podia consultar y que `mart.v_master_vigente_anual` solo filtrada por obra.
# Era verdad y ha dejado de serlo. Un aviso de coste caduca, y dejarlo puesto
# aparta al agente de la respuesta buena con la misma seguridad con que antes lo
# salvaba: los tres salen del ambito de la regla, `v_pbi_cp_tipologia` pasa a
# `consumo_recomendado: true` y pierde su `motivo_no_consumo`. La regla pasa de
