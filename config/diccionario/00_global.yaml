# config/diccionario/00_global.yaml
#
# El bloque global del diccionario semantico del datamart (F-006).
#
# Esto es lo que el agente lee ANTES de escribir una linea de SQL. Aqui van las
# convenciones, los doce esquemas, las reglas duras que impiden respuestas
# plausibles y falsas, los ordenes de magnitud contra los que detectar un
# disparate, la bateria de aceptacion y la lista de lo que todavia no esta
# documentado.
#
# `pendientes` es un TRINQUETE (R27): solo baja. La constante PENDIENTES_MAX de
# tests/test_f006_cobertura.py vale exactamente lo que hay aqui, y al cerrar
# F-006 esta lista queda vacia.
#
# version 41 (F-113, 2026-10-03): LA CATEGORIA SALE DEL CAPITULO, NO DE LETRAS
# SUELTAS. `stg.partidas.categoria` (y las seis `categoria` de `mart` que la
# copian) es la del capitulo CD/CI/CP MAS CERCANO: la raiz por prefijo de su
# codigo y un intermedio solo si su codigo es exactamente CD/CI/CP (sin puntos
# ni espacios). Antes se buscaban las letras en cualquier posicion de la raiz
# (`AVDA_FRANCIA` era CI). `capitulo_raiz_cod` pasa a ser informativo, y
# `raw.auxobrtca`/`raw.obrparpar` dejan de prometer un catalogo CD/CI/CP que no
# existe: `tcaide` = 0 en todas las filas y `auxobrtca` son tres oficios. Sin
# objetos ni columnas nuevos.
#
# version 40 (F-123, 2026-10-02): ESTUDIOS ES EL MASTER 0 (decision del humano
# del 2026-10-02). En `descompuestos`, la version 0 del master pasa a llamarse
# MASTER_ESTUDIO (antes llevaba el nombre de F-097, que ya no existe) y
# `elementos.lineas_master_inicial` pasa a `lineas_master_estudio`; ESTUDIO (la
# «Descomposicion» de coste fase 0) solo se publica en las obras sin master 0;
# vista nueva `descompuestos.v_pbi_master_estudio`, con las columnas de
# `v_pbi_estudio` (juntas son Estudios entero). `R-DESCOMPUESTO-ORIGEN` explica
# la FASE VIVA (coste fase 0, el presupuesto que el jefe de obra evoluciona dia
# a dia; su descompuesto es PLANIF_JO) y la regla de Estudios, sin regla nueva.
#
# version 39 (F-120, 2026-10-01): EL FACTOR DEL DESCOMPUESTO (correos de Elena
# Diaz, Control de Costes, del 30-09 y el 01-10). El campo 14 del texto `des` es
# «factor x rendimiento» cuando la linea tiene FACTOR (`1.22x0.003`) y F-097 lo
# dejaba sin rendimiento ni importe unitario: `descompuestos.lineas` y las tres
# vistas `v_pbi_*` publican `factor` (1 sin factor, NULL sin campo) al final,
# `rendimiento` limpio e `importe_unitario` = factor x rendimiento x precio;
# PLANIF_JO aplica `dncpro.faccan`. Las fichas de ESTUDIO dicen que sus
# cantidades siguen la medicion ACTUAL y que el importe de Estudios es medicion
# x precio de la version 0; se retira el aviso caducado de «master incompleto
# hasta la primera carga» (hecha el 2026-09-29).
#
# version 38 (F-118, 2026-09-30): LA SERIE REAL DENSA Y LA VENTA SIN
# COEFICIENTES (correo de Juan Romero del 2026-09-29; F-051 y F-103 absorbidas).
# Tres cambios de significado. (1) El mes de las filas reales es el del TEXTO
# de la fase (`stg.fn_mes_de_fase`, nueva, con `stg.fn_parse_mes_texto`), con
# filas de RELLENO (`es_relleno`) en los meses anteriores de una fase de rango;
# `mart` y `cierre` lo leen de `stg` y `nombre_mes` sale de `anio_mes`. (2) La
# serie real de cada partida es DENSA: la que sale de un cierre se DESHACE en el
# (`es_deshacer`, se anula el acumulado anterior) y el movimiento resta el mes
# anterior de la serie, asi que `SUM(importe_mes)` es el acumulado del ultimo
# cierre sin excepciones. (3) La venta final del cierre va SIN coeficientes
# (`importe`), y la venta con coeficientes, lo que se factura, se publica aparte:
# `cierre.fact_cierre_mensual.final_importe_con_coeficientes`, su columna en
# `v_pbi_cierre_resumen` y dos en `v_pbi_cierre_cabecera`. Regla dura nueva
# `R-VENTA-COEFICIENTES`; la P10 deja de mandar `importe_oficial` para la venta.
# `v_pbi_planif_vs_real` pasa a una fila por clave.
#
# version 37 (F-097, 2026-09-28): LOS DESCOMPUESTOS DE LAS PARTIDAS. Entra el
# esquema `descompuestos` --el duodecimo--, con DOS pasos de la nocturna:
# `ingest_descompuestos` trae de Sigrid el texto `obrparpre.des` de forma
# INCREMENTAL por version del master (estado en `descompuestos._des_texto` y
# `_versiones_cargadas`, que `--full` no trunca) y `build_descompuestos` lo
# trocea: `descompuestos.lineas` (una fila por linea, con ORIGEN: ESTUDIO,
# PLANIF_JO, MASTER_INICIAL, MASTER_PRE_ABC, MASTER_PLANIF_JO),
# `descompuestos.cuadre_partida` (descompuesto frente al precio de la partida),
# `descompuestos.elementos` (catalogo por obra con su producto) y tres vistas
# `v_pbi_*` con el origen cableado. Regla dura nueva `R-DESCOMPUESTO-ORIGEN`:
# nunca se mezclan origenes y el master se filtra por version. `R-FRESCURA`
# alcanza al esquema nuevo. El master sale INCOMPLETO hasta la primera carga
# (MANUAL); los tipos 3 y 11 son PROVISIONALES (D8).
#
# version 36 (F-056, 2026-09-26): EL MAYOR Y EL PLAN DE CUENTAS. Entra el
# esquema `contabilidad` --el undecimo--, construido por `build_contabilidad`
# (sexto build de negocio de `run-all`, del que no depende nadie) desde `raw` y
# `maestro.centros_coste`: `contabilidad.plan_cuentas` (el plan FINANCIERO como
# arbol por prefijo dentro de la empresa: 44.778 grupos de `con.tip = 16` y
# 34.196 cuentas auxiliares de `cua`, 38 empresas), `contabilidad.mayor` (una
# fila por apunte, 2.166.701, con la clase del asiento, el saldo, la obra por
# el centro y el tercero) y `contabilidad.saldos_cuenta_mes` (cuenta x empresa x
# ejercicio x mes). Regla dura nueva `R-SALDO-CONTABLE`: el saldo es
# `importe_saldo`/`saldo_acumulado`, CIERRE y APERTURA no se suman. `R-FRESCURA`
# y `R-CODIGO-POR-EMPRESA` alcanzan al esquema nuevo. Se corrigen las fichas de
