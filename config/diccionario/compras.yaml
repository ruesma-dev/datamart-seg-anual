      Funcion auxiliar del build de compras, usada solo dentro del SQL que
      construye el esquema.
    descripcion: >-
      Extrae el prefijo alfabetico inicial del codigo de un documento de Sigrid
      y lo pasa a mayusculas: de un codigo que empieza por "AC" saca "AC". Si el
      codigo no empieza por letras devuelve **cadena vacia, no nulo**, que es lo
      que hace que `compras.fn_tipo_documento` acabe clasificandolo como OTRO en
      vez de dejarlo sin tipo.
    grano: null
