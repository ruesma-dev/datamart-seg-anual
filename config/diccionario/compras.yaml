      `compras.v_estado_documentos` (F-067).
    grano: null
    clave_negocio: []
    paso_etl: build_compras
    refresco: nocturno
    columnas: {}
    relaciones: []
    ejemplos_preguntas: []

  vencimientos:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      Los EFECTOS DE PAGO de la factura de compra: la pestana «Vencimientos» de
      la factura, fila a fila. Cuando vence cada pago, de cuanto es, en que
      estado esta, por que banco y cuenta sale, si esta en una remesa y si esta
      anulado. **195.510 efectos sobre 165.737 facturas**, medido el 2026-09-11.

      **LA TRAMPA QUE MAS CARA SALE: SUMAR LOS IMPORTES DE TODOS LOS EFECTOS DE
      UNA FACTURA LA CUENTA HASTA TRES VECES.** El efecto nace partido en `_01`
      (el pago) y `_02` (la retencion); si luego se divide, los hijos van en
      serie `DIV` y **el original se queda en la tabla, anulado**; si se remesa,
      se agrupan en `AGR`. **89.228 de los 255.148 efectos de Sigrid estan de
      baja (34,97 %)** y, cinendose a los de factura de compra, **76.215 de
      195.510 (39,0 %)**: sin filtrar, uno de cada tres es un fantasma. Se
      excluyen con `efecto_anulado = false`, y eso es lo que reproduce el numero
      que Sigrid enseña en la cabecera. Verificado sobre `FR25/04222`, una
      factura con ocho efectos: los cinco vivos suman 92.478,49 y, sin la
      retencion viva, 87.854,56 --los dos numeros de la cabecera--, mientras que
      sumarlos todos da 288.123,92. **El estado NO distingue al anulado**: los
      tres anulados de esa factura estan «Aprobado».

      **NO SE PUBLICA el enlace del efecto hijo a su efecto de origen**, y no es
      un olvido: `pag.padide`, el campo del ERP que lo prometia, vale **0 en los
      255.148 efectos** (medido dos veces, el 2026-09-10 y el 2026-09-11). La
      relacion solo se podria deducir por importes y fechas, y una
      reconstruccion a ojo no se publica como dato. Quien la necesite tiene que
      saber que no existe en el origen, no buscarla aqui.

      **Solo la COMPRA.** Los efectos de otros documentos y los cobros
      (`raw.cob`) no entran: la cartera completa de cobros y pagos es F-037 fase
      1. **Deuda declarada con F-037 (R35)**: cuando llegue se decide si absorbe
      esta tabla o la deja como vista suya; lo que no se hace es levantar una
      segunda tabla de efectos en paralelo.
    grano: >-
      Una fila por efecto de pago (`raw.pag.ide`) cuyo documento sea una factura
      de compra. `vencimiento_id` es CLAVE PRIMARIA DECLARADA, asi que el build
      falla la noche en que el grano se rompa en vez de dejar que lo descubra
      `check-unicidad` un mes despues. Una factura tiene de 1 a 16 efectos (16
      es el maximo medido), asi que **contar filas de esta tabla no cuenta
      facturas**: para eso, `COUNT(DISTINCT factura_id)` o
      `compras.v_facturas_pago`.
    clave_negocio: [vencimiento_id]
    paso_etl: build_compras
    refresco: nocturno
    columnas:
      vencimiento_id:
        significado: >-
          Identificador del efecto en Sigrid (`pag.ide`). Es tambien el `ide` de
          su fila en `raw.con`, porque el efecto ES un documento (`tip = 25`).
        agregacion: no_sumable
      factura_id:
        significado: >-
          Identificador de la factura de compra de la que cuelga el efecto
          (`pag.conide`). Enlaza con `compras.facturas.factura_id`.
        agregacion: no_sumable
      codigo_factura:
        significado: >-
          Codigo de la factura tal y como se ve en Sigrid (`FR25/04222`), leido
          del documento de la factura.
      codigo_efecto:
        significado: >-
          Codigo del efecto tal y como lo enseña la rejilla (`FR26/06051_01`,
          `DIV25/0156`), LITERAL de `con.cod`. No se compone de nada: el sufijo
          `_01` / `_02` viene almacenado, y reconstruirlo con un ordinal
          acertaria solo mientras el orden coincidiera.
      descripcion_efecto:
        significado: >-
          La columna «Descripcion» de la rejilla, de `con.res`: "Pago 1 de 2...",
          "Retencion...". Texto libre del ERP.
      serie_efecto:
        significado: >-
          Prefijo alfabetico del codigo del efecto, derivado con
          `compras.fn_serie`: `FR` el efecto inicial, `DIV` una division, `AGR`
          una agrupacion al remesar, `NO` un pago sin serie de factura. Sirve
          para saber POR QUE existe un efecto. No sale de la columna de serie
          del origen: **`con.serie` existe y vale 0 en los 255.148 efectos**,
          asi que publicarla habria dado una columna de ceros con un nombre
          convincente.
      fecha_emision:
        significado: Fecha de emision del efecto (`pag.fecreaemi`), ya tipada.
        agregacion: no_sumable
        nulo_significa: El efecto no tiene fecha de emision informada.
      fecha_vencimiento:
        significado: >-
          Fecha en la que el efecto vence. Es la columna por la que se ordena
          cualquier pregunta de "que vence en...".
        agregacion: no_sumable
        nulo_significa: El efecto no tiene fecha de vencimiento informada.
      fecha_real:
        significado: >-
          Fecha real de pago (`pag.fecrea`), cuando esta punteada. **OJO: QUE
          ESTE VACIA NO SIGNIFICA QUE EL EFECTO ESTE VIVO.** Son 120.843 de los
          195.510 efectos de factura (61,8 %) sin fecha real, e incluyen
          vencimientos pasados sin puntear; la cartera viva que midio F-037 son
          10.607 pagos, doce veces menos. Esta columna avisa de la FECHA de
          pago, no del ESTADO: el estado es `estado_pago`.
        agregacion: no_sumable
        nulo_significa: >-
          El efecto no tiene fecha real de pago anotada. NO quiere decir que
          este pendiente: 61,8 % de los efectos estan asi.
      importe:
        significado: >-
          Importe del efecto (`pag.tot`). **No se puede sumar sobre todos los
          efectos de una factura sin filtrar `efecto_anulado`**: ver la trampa
          de la descripcion.
      estado_pago_codigo:
        significado: >-
          Codigo del estado del efecto (`con.est`), conservado junto al nombre
          para poder filtrar sin depender del literal. `10` es Pagado.
        agregacion: no_sumable
      estado_pago:
        significado: >-
          Estado del efecto, LEIDO de `raw.conest` filtrando `tip = 25` (el tipo
          del efecto). Son **10 estados medidos**: 1 Pendiente, 2 Aprobado, 3
          Emitido, 5 En cartera, 7 Remesado, 10 Pagado, 12 Devuelto, 14
          Agrupados, 15 Divididos, 20 Anticipado; PDT, APR, CAR y PAG son sus
          abreviaturas en pantalla. El `tip = 25` no es un adorno: sin el, la
          misma cifra significa otra cosa en una factura o en una obra. **El
          estado NO se deriva de `fecha_real`** --se probo y era falso-- y **no
          marca la anulacion**, que es `efecto_anulado`.

          **Y NO ES EL ESTADO DE LA FACTURA.** Esto dice por donde va el EFECTO
          de pago (pendiente, remesado, pagado, devuelto); por donde va la
          FACTURA en su circuito de aprobacion --contabilizada, aprobada por
          jefe de obra, aprobada Administracion, retenida, rechazada-- lo dice
          `compras.facturas.estado`. Confundir las dos columnas es lo que hizo
          nacer F-083: hasta el 2026-09-16 esta era la unica columna de estado
          del esquema, y un listado de «facturas sin aprobar» hecho con ella
          media el pago, no la aprobacion.
        nulo_significa: El estado del efecto no existe en el catalogo de estados.
      efecto_anulado:
        significado: >-
          Cierto cuando el efecto esta dado de baja en Sigrid (`con.fecbaj`
          distinto de 0): lo que la pantalla pinta en rojo con un aspa.
          **FILTRAR POR ESTA COLUMNA ES OBLIGATORIO PARA SUMAR IMPORTES**: 39,0
          % de los efectos de factura estan de baja porque su efecto original se
          dividio o se agrupo, y siguen en la tabla a proposito para que se
          pueda ver la historia sin que falsee las sumas.
      fecha_anulacion:
        significado: Fecha en la que se dio de baja el efecto, ya tipada.
        agregacion: no_sumable
        nulo_significa: El efecto no esta anulado.
      medio_pago_id:
        significado: >-
          Identificador del medio de pago del efecto (`pag.efeide`, catalogo
          `raw.auxefp`). El 0 de Sigrid se publica como NULL.
        agregacion: no_sumable
        nulo_significa: El efecto no tiene medio de pago informado.
      medio_pago:
        significado: >-
          Nombre del medio de pago: TRANSFERENCIA, PAGARE, CONFIRMING, CHEQUE,
          LETRA... Es el mismo catalogo que resuelve `compras.formas_pago`.
        nulo_significa: >-
          El efecto no tiene medio de pago informado, o el que tiene no existe
          en el catalogo.
      naturaleza_pago_id:
        significado: >-
          Identificador de la naturaleza del pago (`pag.natide`, catalogo
          `raw.auxnap`, 3 filas).
        agregacion: no_sumable
        nulo_significa: El efecto no tiene naturaleza informada.
      naturaleza_pago:
        significado: >-
          Naturaleza del pago: NOMINA, EMBARGO o CUOTA. Son solo 3 valores y
          casi todos los efectos van sin ella.
        nulo_significa: El efecto no tiene naturaleza informada.
      cuenta_contable_id:
        significado: >-
          Identificador de la cuenta contable del efecto (`pag.cueide`).
        agregacion: no_sumable
        nulo_significa: El efecto no tiene cuenta contable informada.
      cuenta_contable:
        significado: >-
          Numero de la cuenta contable (`4100006400`). Se lee de `raw.con`, no
          de `raw.cua`: la cuenta contable **tambien es un documento** de Sigrid
          (`tip = 17`) y `cua` no tiene ni `cod` ni `res` --unirse a ella daria
          una columna vacia--.
      cuenta_contable_nombre:
        significado: Nombre de la cuenta contable, de `con.res`.
        nulo_significa: El efecto no tiene cuenta contable informada.
      banco_id:
        significado: >-
          Identificador de la entidad bancaria del efecto. Es `pag.banban`, que
          apunta al `ide` de `raw.auxban` --no al codigo de banco: medido, casan
          110.460 de 110.477--.
        agregacion: no_sumable
        nulo_significa: El efecto no tiene banco informado.
      banco:
        significado: Nombre de la entidad bancaria, de `auxban.res`.
        nulo_significa: El efecto no tiene banco informado.
      sucursal_id:
        significado: >-
          Identificador de la sucursal (`pag.bansuc`), que apunta al `ide` del
          MISMO catalogo `raw.auxban` en una segunda union: `auxban.tipsuc`
          separa las 442 entidades de las 1.248 sucursales.
        agregacion: no_sumable
        nulo_significa: El efecto no tiene sucursal informada.
      sucursal:
        significado: Nombre de la sucursal, de `auxban.res`.
        nulo_significa: El efecto no tiene sucursal informada.
      retencion_id:
        significado: >-
          Identificador de la retencion asociada al efecto (`pag.retide`), para
          23.180 efectos de factura. **Lo que significa exactamente --si marca
          el efecto que ES la retencion o el que la tiene-- NO se ha medido en
          esta feature**, asi que se publica el identificador y no ninguna
          interpretacion suya. Las retenciones estan en el esquema
          `retenciones`.
        agregacion: no_sumable
        nulo_significa: El efecto no tiene retencion asociada.
      centro_coste_id:
        significado: >-
          Identificador del centro de coste del efecto (`pag.cenide`).
          Traducible con `maestro.centros_coste`.
        agregacion: no_sumable
        nulo_significa: El efecto no tiene centro de coste informado.
      remesa_id:
        significado: >-
          Identificador de la remesa de pago en la que va el efecto
          (`pag.remide`, tabla `raw.rpa`). 40.090 de los 195.510 efectos de
          factura estan en una remesa.
        agregacion: no_sumable
        nulo_significa: El efecto no esta en ninguna remesa.
      codigo_remesa:
        significado: >-
          Codigo de la remesa (`RP26/0254`), leido de `raw.con`: la remesa
          **tambien es un documento** (`tip = 27`) y `raw.rpa` no tiene columna
          `cod`.
        nulo_significa: El efecto no esta en ninguna remesa.
      fecha_remesa:
        significado: Fecha de la remesa (`rpa.fecrem`), ya tipada.
        agregacion: no_sumable
        nulo_significa: El efecto no esta en ninguna remesa.
      importe_remesa:
        significado: >-
          Importe total de la remesa completa (`rpa.imptot`). **NO es el importe
          de este efecto**, que es `importe`: se repite igual en todos los
          efectos de la misma remesa, asi que sumarlo cuenta la remesa tantas
          veces como efectos lleve.
        agregacion: no_sumable
        nulo_significa: El efecto no esta en ninguna remesa.
    relaciones:
      - de: factura_id
        a: compras.facturas.factura_id
        cardinalidad: "N:1"
        porque: Para la cabecera de la factura, su proveedor y su obra.
      - de: factura_id
        a: compras.v_facturas_pago.factura_id
        cardinalidad: "N:1"
        porque: >-
          Para la forma de pago de la factura y el resumen de sus efectos, ya
          agregado y con los anulados fuera.
    ejemplos_preguntas:
      - Cuando vence la factura X y esta pagada
      - Que facturas vencen la semana que viene y por cuanto
      - Que efectos de pago van en la remesa R
      - Que facturas tienen algun efecto devuelto

  v_facturas_pago:
    tipo: vista
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      La FORMA DE PAGO de cada factura de compra, con el resumen de sus efectos
      ya agregado: con que forma de pago se pago, con que medio, por que banco y
      cuenta, cuantos efectos tiene, cuando vence el primero y el ultimo y
      cuanto suman los que estan vivos. Una fila por factura, para poder
      preguntar por la factura sin bajar al efecto.

      La forma de pago sale de `dcf.pagide` resuelto contra
      `compras.formas_pago` (la dimension, F-073), y NO se duplica aqui.
      `formula_pago_documento` y `condiciones_pago` son lo que guarda la propia
      factura, que puede no coincidir con el catalogo.

      **LOS DOS IMPORTES AGREGADOS EXCLUYEN LOS EFECTOS ANULADOS** (39 % de los
      de factura) porque sumarlos todos cuenta el efecto original dividido junto
      con sus hijos: es lo que reproduce el numero que Sigrid enseña. En cambio
      `num_efectos` los cuenta TODOS y `num_efectos_anulados` dice cuantos son,
      para que la resta se pueda hacer. Son dos criterios distintos en la misma
      fila, a proposito.
    grano: >-
      Una fila por factura de compra (`compras.facturas`), incluidas las que no
      tienen ningun efecto: el resumen entra por un LEFT JOIN a un CTE ya
      agregado por `factura_id`, que es lo que impide que la cabecera se
      multiplique por sus efectos.
    clave_negocio: [factura_id]
    paso_etl: build_compras
    refresco: nocturno
    columnas:
      factura_id:
        significado: Identificador de la factura de compra en Sigrid.
        agregacion: no_sumable
      codigo_factura: Codigo de la factura tal y como se ve en Sigrid.
      fecha_factura:
        significado: Fecha de la factura, ya tipada.
        agregacion: no_sumable
      proveedor_id:
        significado: Identificador del proveedor que factura.
        agregacion: no_sumable
        nulo_significa: La factura no tiene proveedor informado.
      proveedor_nombre: Nombre del proveedor.
      forma_pago_id:
        significado: >-
          Identificador de la forma de pago de la factura (`dcf.pagide`), que es
          el `forma_pago_id` de `compras.formas_pago`.
        agregacion: no_sumable
        nulo_significa: La factura no declara forma de pago.
      codigo_forma_pago:
        significado: Codigo de la forma de pago (`CFCH60`, `TR30`).
        nulo_significa: La factura no declara forma de pago.
      forma_pago:
        significado: >-
          Nombre de la forma de pago ("CONFIRMING CH 60 dias"), que suele llevar
          el plazo dentro del propio literal.
        nulo_significa: La factura no declara forma de pago.
      plazo_formula:
        significado: >-
          El plazo tal y como lo guarda el catalogo de Sigrid, **VERBATIM**.
          **NO ES UN NUMERO DE DIAS**: es una formula, y `30 450R` es un valor
          real del catalogo. La mayoria de las filas trae solo un numero ("60",
          "90") y por eso es tan facil tratarla como cantidad y salir con una
          cifra plausible y falsa. No se suma, no se compara y no se ordena como
          numero.
        nulo_significa: La factura no declara forma de pago.
      formula_pago_documento:
        significado: >-
          La formula de pago que guarda la PROPIA factura (`dcf.pagfor`), tal
          cual. Puede no coincidir con la del catalogo, y por eso se publica
          aparte en vez de elegir una de las dos.
        nulo_significa: La factura no guarda formula propia.
      condiciones_pago:
        significado: >-
          Las condiciones de pago escritas en la factura (`dcf.pagtex`), texto
          libre. Se lee; no se interpreta.
        nulo_significa: La factura no tiene condiciones escritas.
      medio_pago_id:
        significado: Identificador del medio de pago de la factura (`dcf.efeide`).
        agregacion: no_sumable
        nulo_significa: La factura no declara medio de pago.
      medio_pago:
        significado: >-
          Nombre del medio de pago de la factura: TRANSFERENCIA, PAGARE,
          CONFIRMING, CHEQUE... Puede diferir del medio que trae la forma de
          pago del catalogo.
        nulo_significa: La factura no declara medio de pago.
      naturaleza_pago:
        significado: >-
          Naturaleza del pago de la factura (`dcf.cypnatide`, catalogo
          `raw.auxnap`): NOMINA, EMBARGO o CUOTA.
        nulo_significa: La factura no declara naturaleza de pago.
      cuenta_contable:
        significado: >-
          Numero de la cuenta contable de la factura (`dcf.cueide`), leido de
          `raw.con` porque la cuenta contable es un documento de Sigrid.
        nulo_significa: La factura no tiene cuenta contable informada.
      cuenta_transferencia_id:
        significado: >-
          Identificador de la cuenta de transferencia de la factura
          (`dcf.banide`), **SIN RESOLVER a proposito**: a que tabla apunta no
          esta medido, y en esta feature unir por parecido ya salio mal cuatro
          veces. Sirve para agrupar facturas por cuenta, no para saber cual es.
        agregacion: no_sumable
        nulo_significa: La factura no declara cuenta de transferencia.
      banco:
        significado: >-
          Nombre de la entidad bancaria de la factura (`dcf.banban` contra
          `raw.auxban`, la misma clave medida en los efectos).
        nulo_significa: La factura no declara banco.
      sucursal:
        significado: Nombre de la sucursal bancaria (`dcf.bansuc` contra `raw.auxban`).
        nulo_significa: La factura no declara sucursal.
      num_efectos:
        significado: >-
          Cuantos efectos de pago tiene la factura, **CONTANDO LOS ANULADOS**.
          Es a proposito: `num_efectos_anulados` dice cuantos de esos estan de
          baja, y la resta da los vivos. Ojo al cruzarlo con
          `importe_efectos_vivos`, que SI los excluye: son dos criterios
          distintos en la misma fila.
      num_efectos_anulados:
        significado: >-
          Cuantos de los efectos de la factura estan dados de baja porque su
          efecto original se dividio o se agrupo. El 39 % de los efectos de
          factura lo estan, asi que esto no es un caso raro.
      num_efectos_pagados:
        significado: >-
          Cuantos efectos VIVOS estan en estado «Pagado» (el 10 de
          `raw.conest`). Se usa el estado y no la fecha real, que esta vacia en
          el 62 % de los efectos sin que eso signifique nada.
      primer_vencimiento:
        significado: >-
          Fecha de vencimiento mas temprana entre los efectos VIVOS de la
          factura.
        agregacion: no_sumable
        nulo_significa: La factura no tiene ningun efecto vivo.
      ultimo_vencimiento:
        significado: >-
          Fecha de vencimiento mas tardia entre los efectos VIVOS. Es la fecha
          en la que la factura queda pagada del todo si todo se cumple.
        agregacion: no_sumable
        nulo_significa: La factura no tiene ningun efecto vivo.
      importe_efectos_vivos:
        significado: >-
          Suma del importe de los efectos de la factura **excluyendo los
          anulados** (`efecto_anulado = false`). Es el numero que Sigrid enseña
          en la cabecera de la pestaña de vencimientos. Sumar sin ese filtro da
          hasta tres veces mas.
        nulo_significa: La factura no tiene ningun efecto vivo.
      importe_efectos_pagados:
        significado: >-
          Suma del importe de los efectos vivos que estan en estado «Pagado».
          Comparado con `importe_efectos_vivos` da lo que queda por pagar de esa
          factura.
        nulo_significa: La factura no tiene ningun efecto vivo pagado.
    relaciones:
      - de: factura_id
        a: compras.vencimientos.factura_id
        cardinalidad: "1:N"
        porque: Para el detalle efecto a efecto, que aqui esta agregado.
      - de: forma_pago_id
        a: compras.formas_pago.forma_pago_id
        cardinalidad: "N:1"
        porque: Para el catalogo completo de la forma de pago.
    ejemplos_preguntas:
      - Con que forma de pago se pago la factura X
      - Que facturas van por confirming y cuanto suman
      - Cuanto queda por pagar de las facturas del proveedor P

  v_control_forma_pago:
    tipo: vista
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      La forma de pago de la factura de compra ENFRENTADA a la de su contrato,
      para ver donde no coinciden. No filtra: las que cuadran salen igual, con
      `forma_pago_coincide` en cierto, porque «cuantas no cuadran» sin el
      denominador no significa nada.

      El enlace factura-contrato **no es nuevo**: es el mismo que usa
      `compras.v_pbi_contrato_consumo` (linea facturada directa contra contrato,
      o via el albaran de origen). Dos reglas para la misma cosa divergen, y la
      segunda se descubre cuando las dos cifras ya estan en un informe.

      **FACTURAS QUE SE QUEDAN FUERA: 85.324 de 165.759 facturas de compra
      (51,5 %, medido el 2026-09-11) no cuelgan de ningun contrato**, asi que no
      aparecen aqui. Esta vista NO sirve para contar facturas de compra ni para
      juzgar la cobertura de contratacion: solo compara las que si tienen
      contrato.

      La forma de pago del contrato se lee de `raw.ctr.pagide`, no de
      `compras.contratos`, que todavia no la publica (eso es F-067).

      **LA OBRA ES DE UNA EMPRESA (F-102).** Cada fila lleva la ficha de obra de la empresa de su documento, y acaba en `empresa_id` y `clave_obra`. **Agregar por `codigo_obra` mezcla empresas** --la UTE dentro de la obra de Ruesma, que no se consolida--: se agrega por `clave_obra`, o por `codigo_obra` junto con `empresa_id`. Medido el 2026-09-23: 1.774 de las 81.665 filas llevan la ficha de una empresa distinta de Ruesma.
    grano: >-
      Una fila por PAR (`factura_id`, `contrato_id`). No es una fila por
      factura: una factura con lineas de dos contratos sale dos veces, asi que
      **contar filas aqui no cuenta facturas** --para eso,
      `COUNT(DISTINCT factura_id)`--.
    clave_negocio: [factura_id, contrato_id]
    paso_etl: build_compras
    refresco: nocturno
    columnas:
      factura_id:
        significado: Identificador de la factura de compra.
        agregacion: no_sumable
      codigo_factura: Codigo de la factura tal y como se ve en Sigrid.
      fecha_factura:
        significado: Fecha de la factura, ya tipada.
        agregacion: no_sumable
      contrato_id:
        significado: >-
          Identificador del contrato al que se imputa alguna linea de la
          factura, por linea directa o via el albaran de origen.
        agregacion: no_sumable
      codigo_contrato: Codigo del contrato tal y como se ve en Sigrid.
      obra_id:
        significado: Identificador de la obra del contrato.
        agregacion: no_sumable
        nulo_significa: El contrato no tiene obra informada.
      codigo_obra:
        significado: Codigo de la obra del contrato.
        nulo_significa: El contrato no tiene obra informada.
      proveedor_id:
        significado: Identificador del proveedor de la factura.
        agregacion: no_sumable
        nulo_significa: La factura no tiene proveedor informado.
      proveedor_nombre: Nombre del proveedor de la factura.
      forma_pago_factura_id:
        significado: Identificador de la forma de pago declarada en la FACTURA.
        agregacion: no_sumable
        nulo_significa: La factura no declara forma de pago.
      forma_pago_factura:
        significado: Nombre de la forma de pago declarada en la FACTURA.
        nulo_significa: La factura no declara forma de pago.
      plazo_formula_factura:
        significado: >-
          Plazo de la forma de pago de la factura, VERBATIM del catalogo: no es
          un numero de dias.
        nulo_significa: La factura no declara forma de pago.
      forma_pago_contrato_id:
        significado: >-
          Identificador de la forma de pago declarada en el CONTRATO
          (`raw.ctr.pagide`).
        agregacion: no_sumable
        nulo_significa: El contrato no declara forma de pago.
      forma_pago_contrato:
        significado: Nombre de la forma de pago declarada en el CONTRATO.
        nulo_significa: El contrato no declara forma de pago.
      plazo_formula_contrato:
        significado: >-
          Plazo de la forma de pago del contrato, VERBATIM del catalogo: no es
          un numero de dias.
        nulo_significa: El contrato no declara forma de pago.
      forma_pago_comparable:
        significado: >-
          Cierto solo si las DOS partes declaran forma de pago. Cuando es falso
          no hay discrepancia que afirmar: falta el dato en un lado, y eso no es
          lo mismo que un conflicto. **Filtrar por esta columna antes de contar
          discrepancias** evita convertir un hueco en un incumplimiento.
      forma_pago_coincide:
        significado: >-
          Cierto cuando factura y contrato declaran la MISMA forma de pago. Es
          falso tanto si son distintas como si falta una de las dos:
          `forma_pago_comparable` distingue los dos casos.
      empresa_id:
        significado: >-
          Empresa de la ficha de obra del contrato (F-102), de
          `maestro.v_obra_fichas`: `1` es Ruesma, `28` Porsan y el resto UTE; el
          nombre esta en `maestro.obras.nombre_empresa`. En Sigrid la obra es POR
          EMPRESA y cada documento lleva la ficha de SU empresa: aqui no se
          traduce a la de Ruesma, porque no se consolida.
        agregacion: no_sumable
        nulo_significa: La fila no tiene obra (`obra_id` NULL).
      clave_obra:
        significado: >-
          Clave legible y UNICA de la ficha de obra, `<empresa>-<codigo>`
          (`1-0581`, `27-0581`). **Se agrega por `clave_obra`, no por
          `codigo_obra`**: el codigo se repite en cada empresa y agregar por el
          mezcla empresas --mete la UTE dentro de la obra de Ruesma, que no se
          consolida--. Se cruza con `maestro.obras.clave_obra`.
        nulo_significa: La fila no tiene obra (`obra_id` NULL).
    relaciones:
      - de: clave_obra
        a: maestro.obras.clave_obra
        cardinalidad: "N:1"
        porque: >-
          La ficha de obra por su clave legible (F-102): la misma union que por
          `obra_id`, pero legible. Es tambien la llave por la que agregar: por
          `codigo_obra` se juntan fichas de empresas distintas. `clave_obra` es
          clave alternativa de `maestro.obras` (F-108), unica (922 para 922 el
          2026-09-24) y vigilada por `check-unicidad`: unir no multiplica filas.
      - de: factura_id
        a: compras.v_facturas_pago.factura_id
        cardinalidad: "N:1"
        porque: Para el resto del detalle de pago de la factura.
      - de: contrato_id
        a: compras.contratos.contrato_id
        cardinalidad: "N:1"
        porque: Para la cabecera del contrato, su obra y su proveedor.
    ejemplos_preguntas:
      - Que facturas no cuadran con la forma de pago de su contrato
      - Cuantas facturas con contrato cumplen la forma de pago pactada
      - Que proveedores facturan con una forma de pago distinta de la contratada

  documento_texto:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      El memo de la pestaña «Texto» del documento de compra, INTEGRO y tal y
      como llega: los comentarios que la gente ha ido escribiendo en la factura
      o en el contrato, concatenados por el propio ERP.

      **SALE DE `con.tex`, NO DE `dcf.tex` NI DE `ctr.tex`.** Medido: `con.tex`
      esta informado en el **65,5 %** de las facturas (108.527 de 165.759) y en
      el 8,5 % de los contratos, mientras que `dcf.tex` lo esta en el **0,3 %** y
      `ctr.tex` en el 3,9 %. Quien busque el texto en la tabla del documento
      concluira que las facturas no tienen comentarios, y es falso.

      Para leer comentario a comentario --con su fecha, su hora y su autor-- esta
      `compras.documento_comentarios`, que es este mismo texto ya partido.
    grano: >-
      Una fila por documento con memo, `documento_id` como clave primaria
      declarada. Solo facturas (`tip = 15`) y contratos (`tip = 44`); los
      documentos sin memo NO salen, y los comparativos (`tip = 46`, 5.707 con
      texto) tampoco: son de F-067.
    clave_negocio: [documento_id]
    paso_etl: build_compras
    refresco: nocturno
    columnas:
      documento_id:
        significado: >-
          Identificador del documento en Sigrid (`con.ide`). Es el mismo
          `factura_id` de `compras.facturas` o `contrato_id` de
          `compras.contratos`.
        agregacion: no_sumable
      tipo_documento_codigo:
        significado: >-
          El `tip` de Sigrid: 15 factura o abono, 44 contrato. Se conserva para
          filtrar sin depender del literal.
        agregacion: no_sumable
        valores: [15, 44]
      tipo_documento:
        significado: >-
          Que clase de documento es, resuelto con `compras.fn_tipo_documento`.
        valores: [FACTURA, ABONO, CONTRATO, OTRO]
      codigo_documento:
        significado: Codigo del documento tal y como se ve en Sigrid.
      texto:
        significado: >-
          El memo completo, sin tocar. Es texto libre acumulado por personas:
          sirve para leerlo y para buscar dentro, no para decidir con el sin
          leerlo. Los comentarios van separados por una linea de guiones y cada
          uno suele cerrar con `[dd/mm/aaaa hh:mm:ss Usuario: login]`.
      bytes:
        significado: >-
          Tamaño del memo en bytes. El mayor medido en una factura son 11.580;
          la media, unos 280.
      num_comentarios:
        significado: >-
          Cuantos comentarios tiene el memo, que es exactamente cuantas filas
          tiene este documento en `compras.documento_comentarios`.
    relaciones:
      - de: documento_id
        a: compras.documento_comentarios.documento_id
        cardinalidad: "1:N"
        porque: Para leer los comentarios uno a uno, con su fecha y su autor.
    ejemplos_preguntas:
      - Que dice el texto de la factura X
      - Que facturas mencionan una retencion en su texto

  documento_comentarios:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      El memo del documento ya PARTIDO en comentarios, uno por fila, con su
      fecha, su hora y su autor cuando se pueden reconocer. Es la tabla a la que
      hay que ir para «que se dijo de esta factura y cuando».

      Tabla materializada en la carga nocturna, no vista: son unos 110.000 memos
      y partirlos en cada lectura seria trabajo repetido para siempre.

      **LO QUE NO CASA CON LA PLANTILLA SE PUBLICA IGUAL** (y suele ser lo mas
      interesante: el comentario que alguien escribio fuera del formulario).
      Cuando el bloque no cierra con el sello `[dd/mm/aaaa hh:mm:ss Usuario:
      login]` --texto escrito a mano, la linea automatica que añade la propia
      aplicacion, o un sello incompleto--, `sello_reconocido` es falso, `fecha`,
      `hora` y `usuario` van a **NULL** --nunca a una etiqueta inventada-- y el
      `cuerpo` es el bloque ENTERO. Una fecha imposible dentro del sello
      (`31/02/2026`) tampoco cuenta como reconocida, para no publicar un dia que
      nadie escribio.

      El separador y el sello estan escritos UNA SOLA VEZ en
      `etl_sigrid/domain/texto_comentarios.py`, que es donde se prueban; el SQL
      usa esos mismos literales.
    grano: >-
      Una fila por comentario, clave `(documento_id, orden)` declarada. Un
      documento tiene tantas filas como bloques tenga su memo, y eso es lo que
      dice `compras.documento_texto.num_comentarios`.
    clave_negocio: [documento_id, orden]
    paso_etl: build_compras
    refresco: nocturno
    columnas:
      documento_id:
        significado: >-
          Identificador del documento en Sigrid al que pertenece el comentario.
        agregacion: no_sumable
      orden:
        significado: >-
          Posicion del comentario dentro del memo. **`orden` 1 ES EL MAS
          RECIENTE**, porque Sigrid apila los comentarios en descendente: el
          `orden` mas alto es el mas ANTIGUO, normalmente el alta del documento.
          Pedir «el ultimo comentario» es pedir `orden = 1`, no el maximo.
        agregacion: no_sumable
      sello_reconocido:
        significado: >-
          Cierto si el bloque cerraba con el sello `[dd/mm/aaaa hh:mm:ss
          Usuario: login]` y su fecha existe en el calendario. Cuando es falso,
          `fecha`, `hora` y `usuario` estan a NULL y el `cuerpo` es el bloque
          entero: el comentario NO se descarta por no casar.
      fecha:
        significado: Fecha en la que se escribio el comentario, del sello.
        agregacion: no_sumable
        nulo_significa: >-
          El bloque no traia un sello reconocible, asi que no se sabe cuando se
          escribio.
      hora:
        significado: >-
          Hora a la que se escribio el comentario (`hh:mm:ss`), del sello, como
          texto.
        nulo_significa: El bloque no traia un sello reconocible.
      usuario:
        significado: >-
          Login de quien escribio el comentario, del sello. Es el usuario de
          Sigrid, no el nombre de la persona.
        nulo_significa: >-
          El bloque no traia un sello reconocible, asi que no se sabe quien lo
          escribio. No se rellena con ninguna etiqueta.
      cuerpo:
        significado: >-
          El comentario sin el sello cuando hay sello, y el bloque ENTERO cuando
          no. Es la columna que hay que leer.
      bloque:
        significado: >-
          El trozo INTEGRO tal y como sale del memo, sello incluido. Se publica
          aparte del cuerpo porque unir los bloques de un documento en su orden
          reproduce el memo original sin perder un caracter: es la unica forma
          de comprobar que el partido no se ha tragado nada.
      bytes:
        significado: Tamaño del bloque en bytes.
    relaciones:
      - de: documento_id
        a: compras.documento_texto.documento_id
        cardinalidad: "N:1"
        porque: Para el memo completo del documento y su recuento.
    ejemplos_preguntas:
      - Que fue lo ultimo que se dijo de la factura X
      - Quien escribio el ultimo comentario del contrato C
      - Que comentarios escribio el usuario U este mes

  comparativos:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      El COMPARATIVO DE OFERTAS de Sigrid (F-038): el documento en el que se
      invita a varios proveedores, se comparan sus ofertas y se adjudica. Una
      fila por comparativo, con su obra, su ACTIVIDAD (`com.natide`), su
      estado, su contrato, cuantas ofertas tuvo, el ahorro del concurso y
      quien lo aprobo y cuando. El detalle oferta a oferta esta en
      `compras.comparativo_ofertas`.

      **CUATRO IMPORTES, Y NINGUNO ES «EL» IMPORTE DEL COMPARATIVO** (decision
      del humano el 2026-09-18: «quiero todos, no uno»). Todos SIN IVA. Si la
      pregunta no precisa, se dan los cuatro con su nombre:
      (A) `importe_ofertado_documento_ganadora`, el documento de la oferta
      ganadora (`dco.totbas`); (B) `importe_ofertado_lineas_ganadora`, la suma
      de sus lineas; (C) `importe_adjudicado_lineas`, las lineas del concurso
      (`comlin.can x pre`); (D) `importe_contratado`, las lineas del contrato.
      Cuadre medido el 2026-10-04 sobre los 17.876 comparativos con una sola
      ganadora: A=B al euro en el **99,6 %**, A=C en el **89,8 %** y A=D en el
      **41 %**. D no cuadra por grano: un contrato sale de varios comparativos
      y evoluciona despues. El «no cuadran» de la medicion de septiembre era,
      sobre todo, el IVA: medido sobre el total del documento, que lo lleva.

      **EL ADJUDICADO TIENE 52 ATIPICOS QUE SON LA MITAD DEL TOTAL.** Medido el
      2026-10-04: 52 comparativos cuyo adjudicado supera 10 veces su mayor
      oferta y 100.000 EUR suman **602,5 M€ de 1.246,2 M€** (el 1610000 solo,
      363,2 M€ contra una oferta maxima de 2.200 EUR). No se borran: se marcan
      en `adjudicado_atipico`. «El adjudicado total» se da SIEMPRE con y sin
      ellos: sin ellos son **641,0 M€**. Y siguen dentro, sin sanear, **14.585**
      lineas con precio 0 y **4.206** lineas negativas (-22,2 M€).

      **EL AHORRO DEL CONCURSO SOLO CUENTA OFERTAS REALES**: los
      **6.904** comparativos con dos o mas ofertas reales con importe ahorran
      **72,7 M€** (sin IVA). Las cifras anteriores (15.597 comparativos, 186,5
      M€) metian las ofertas ficticias y el IVA.

      **LO QUE `com` NO TRAE, para que nadie lo busque**: las siete fechas
      (`fecent`, `feclim`, `fecsum`, `feccon`, `fecinirec`, `fecfinrec`,
      `fecdiv`) estan vacias en origen --entre las cuatro que tienen algo, 136
      valores en 20.261 documentos-- y `ppoide`, `prmide`, `pexide`, `tipsub` y
      `horlim` estan a 0 en todos. La fecha de alta es `con.fec` (100 %).

      **DOS TRAMPAS DE `dbo.log`, la otra fuente de firmas de Sigrid** (no
      ingerida; este objeto usa `confir`): `log.ide` NO es el documento, es la
      clave del propio log --el enlace es `(cod, emp, tip)` y unir por `ide` da
      118 coincidencias que parecen un join--; y `log.res` NO es la actividad,
      es el NOMBRE del comparativo. La actividad es `actividad`, de
      `com.natide`.

      **POR ACTIVIDAD Y POR ADJUDICATARIO (F-067, acceptance 3 del correo de
      Compras)**: las dos preguntas se responden aqui, sin otro objeto.
      «Comparativos por actividad»: agrupar por `actividad`
      (`actividad_id` informado en el 99,2 %). «Proveedores adjudicatarios con
      comparativos de distintas actividades»: agrupar por
      `proveedor_ganador_id` (ganadora unica en el 87,7 %) y contar
      actividades distintas; medido el 2026-10-06, 1.535 de 4.188 proveedores
      ganadores tienen comparativos de mas de una actividad. **Ojo**: 877
      comparativos tienen contrato y NO tienen ganadora unica; su proveedor
      sale del contrato, por `contrato_id`, y no de `proveedor_ganador_id`.
      Las actividades «validadas» del proveedor no existen en Sigrid (F-055).
    grano: >-
      Una fila por comparativo de `raw.com` (20.378 el 2026-10-04), incluidos
      los que no tienen ofertas (319), lineas (264) o firmas.
      `comparativo_id` es clave primaria declarada.
    clave_negocio: [comparativo_id]
    paso_etl: build_compras
    refresco: nocturno
    columnas:
      comparativo_id:
        significado: Identificador del comparativo en Sigrid (`com.ide` = `con.ide`).
        agregacion: no_sumable
      codigo_comparativo: Codigo del comparativo tal y como se ve en Sigrid.
      nombre_comparativo: >-
        Titulo del comparativo (`con.res`), escrito a mano: suele nombrar el
        oficio («MOVIMIENTO DE TIERRAS», «PINTURA»), pero es texto libre. Para
        agrupar por oficio esta `actividad`.
      fecha_alta:
        significado: >-
          Fecha de alta del comparativo en Sigrid (`con.fec`), informada al 100
          %. Es la fecha de CREACION del documento; no es la del cambio de
          estado (cada paso, con su fecha y hora, esta en
          `compras.documento_procesos`) ni la de aprobacion (`fecha_aprobacion`).
        agregacion: no_sumable
      obra_id:
        significado: >-
          Obra del comparativo (`com.obride`), la ficha de la empresa del
          documento, como en el resto de `compras` (F-102).
        nulo_significa: El comparativo no se imputa a ninguna obra.
        agregacion: no_sumable
      codigo_obra: Codigo de obra tal y como se teclea en Sigrid.
      nombre_obra: Nombre legible de la obra, de `con.res`.
      empresa_id:
        significado: Empresa de la ficha de obra, de `maestro.v_obra_fichas`.
        nulo_significa: El comparativo no tiene obra.
        agregacion: no_sumable
      clave_obra:
        significado: Clave legible y unica de la obra, `empresa-codigo` ('1-0581').
        nulo_significa: El comparativo no tiene obra.
      actividad_id:
        significado: >-
          La ACTIVIDAD del comparativo (`com.natide` -> `auxpronat`): que se
          compra (DRENAJE Y URBANIZACION, SUMINISTRO DE MATERIALES,
          SUBCONTRATA...). Informada en el 99,25 % y casa al 100 %.
        nulo_significa: El comparativo no tiene actividad informada.
        agregacion: no_sumable
      actividad:
        significado: >-
          Nombre de la actividad. Es el eje para «cuantos comparativos por
          actividad»; NO lo es `nombre_comparativo`, que es texto libre.
        nulo_significa: El comparativo no tiene actividad informada.
      estado_id:
        significado: >-
          Codigo interno del estado del DOCUMENTO (`con.est`), que solo
          significa algo dentro del tipo 46 (comparativo). Para filtrar, usa
          `estado` o `estado_codigo`.
        agregacion: no_sumable
      estado_codigo:
        significado: >-
          Mnemonico del estado del comparativo en el catalogo del tipo 46.
          Filtra por aqui y no por el literal.
        nulo_significa: El estado no figura en el catalogo del tipo 46.
      estado:
        significado: >-
          Estado del comparativo traducido por la PAREJA (46, estado). Medido
          el 2026-10-04: APROBADO 18.801 de 20.378; el resto se reparte entre
          EN ELABORACION, APROBADO UTE, Aprobado Dir. Compras, los rechazos y
          los propuestos.
        nulo_significa: El estado no figura en el catalogo del tipo 46.
      contrato_id:
        significado: >-
          El contrato en el que acabo el comparativo, leido de las LINEAS del
          comparativo (`comlin.ctride`): 18.633 comparativos. Es la columna
          para «¿acabo en contrato?». NO uses `compras.contratos.comparativo_id`
          para eso: es la cabecera del contrato (`ctr.comide`) y solo cubre el
          56 %. Un comparativo tiene como mucho un contrato (el build falla si
          no); un contrato puede venir de varios comparativos (3.960).
        nulo_significa: >-
          El comparativo no tiene ninguna linea adjudicada a contrato: no acabo
          (todavia) en contrato.
        agregacion: no_sumable
      codigo_contrato:
        significado: Codigo del contrato, de `con.cod`.
        nulo_significa: El comparativo no acabo en contrato.
      fecha_contrato:
        significado: Fecha de alta del contrato, de `con.fec`.
        nulo_significa: El comparativo no acabo en contrato.
        agregacion: no_sumable
      n_ofertas:
        significado: >-
          Ofertas del comparativo, INCLUIDAS las ficticias de planificacion.
          Para «cuantos proveedores ofertaron» usa `n_ofertas_reales`.
        agregacion: suma
      n_ofertas_reales:
        significado: Ofertas de proveedores reales (no ficticias).
        agregacion: suma
      n_ofertas_reales_con_importe:
        significado: >-
          Ofertas reales con importe de documento mayor que 0. Son las que
          entran en `oferta_real_minima`, `oferta_real_maxima` y
          `ahorro_concurso`.
        agregacion: suma
      n_ofertas_ganadoras:
        significado: >-
          Ofertas en estado «Aceptada definitivamente» (`con.est = 6`, tipo
          12). Lo normal es 1; con 0 no hay ganadora, y con mas de una NO se
          elige: la ganadora y sus importes quedan a NULL.
        agregacion: suma
      oferta_ganadora_id:
        significado: La oferta ganadora, si es unica (`compras.comparativo_ofertas.oferta_id`).
        nulo_significa: Ninguna ganadora, o mas de una (`n_ofertas_ganadoras`).
        agregacion: no_sumable
      proveedor_ganador_id:
        significado: Proveedor de la oferta ganadora (`dco.entide`).
        nulo_significa: Ninguna ganadora, o mas de una, o la ganadora sin proveedor.
        agregacion: no_sumable
      proveedor_ganador_nombre:
        significado: Nombre del proveedor en la oferta ganadora (`dco.entres`).
        nulo_significa: Ninguna ganadora, o mas de una.
      importe_ofertado_documento_ganadora:
        significado: >-
          (A) El documento de la oferta ganadora, SIN IVA (`dco.totbas`).
          Ganadoras medidas el 2026-10-04: 17.878, 589,1 M€.
        nulo_significa: Ninguna ganadora, o mas de una.
        unidad: EUR
        agregacion: suma
      importe_ofertado_lineas_ganadora:
        significado: >-
          (B) La suma de las lineas de la oferta ganadora que responden a una
          linea del comparativo, SIN IVA. Cuadra con (A) en el 99,6 %.
        nulo_significa: Ninguna ganadora, mas de una, o la ganadora sin lineas.
        unidad: EUR
        agregacion: suma
      importe_adjudicado_lineas:
        significado: >-
          (C) Lo ADJUDICADO en las lineas del concurso, `SUM(comlin.can x
          comlin.pre)`, SIN IVA: 1.246,2 M€ en total, de los que 602,5 M€ son
          de los 52 atipicos. Sumalo SIEMPRE con y sin `adjudicado_atipico`.
          Lleva sin sanear 14.585 lineas con precio 0 y 4.206 negativas.
        nulo_significa: El comparativo no tiene lineas.
        unidad: EUR
        agregacion: suma
      adjudicado_atipico:
        significado: >-
          Cierto si el adjudicado supera 10 veces la MAYOR oferta del
          comparativo (de todas, tambien las ficticias) y 100.000 EUR. Un corte
          y no una lista: con 3 veces en vez de 10 salen 65 en vez de 52. El
          importe se publica igual; esta marca sirve para quitarlo de las
          sumas.
        nulo_significa: >-
          No se puede juzgar: el comparativo no tiene ninguna oferta con
          importe mayor que 0, o no tiene lineas. Medido: 11 comparativos de
          mas de 100.000 EUR sin oferta con importe (3,0 M€).
      importe_contratado:
        significado: >-
          (D) Lo CONTRATADO: suma de las lineas del contrato del comparativo
          (`compras.contrato_lineas`), SIN IVA. **ES DEL CONTRATO, NO DEL
          COMPARATIVO**: se repite en todos los comparativos que comparten
          contrato (3.960 contratos vienen de varios). Sumarlo entre
          comparativos lo cuenta varias veces; para un total, suma por
          `contrato_id` DISTINTO.
        nulo_significa: El comparativo no acabo en contrato, o el contrato no tiene lineas.
        unidad: EUR
        agregacion: no_sumable
      oferta_real_minima:
        significado: La oferta REAL mas barata (documento, SIN IVA), sin ficticias.
        nulo_significa: Menos de dos ofertas reales con importe.
        unidad: EUR
        agregacion: suma
      oferta_real_maxima:
        significado: La oferta REAL mas cara (documento, SIN IVA), sin ficticias.
        nulo_significa: Menos de dos ofertas reales con importe.
        unidad: EUR
        agregacion: suma
      ahorro_concurso:
        significado: >-
          El ahorro del concurso: oferta real mas cara menos la mas barata, SIN
          IVA, solo cuando hay dos o mas ofertas reales con importe. Las
          ofertas ficticias NUNCA entran (entre ellas darian otros 63,5 M€ que
          no son ahorro de nada). No es el ahorro sobre el objetivo.
        nulo_significa: >-
          Menos de dos ofertas reales con importe: no hubo concurso que medir.
        unidad: EUR
        agregacion: suma
      n_firmas:
        significado: Firmas del circuito de aprobacion (`confir`) del comparativo.
        agregacion: suma
      n_firmas_pendientes:
        significado: >-
          Firmas PENDIENTES (`confir.fir = 0`, que ademas no tienen fecha).
          Medido: 6.498 firmas pendientes.
        agregacion: suma
      fecha_aprobacion:
        significado: >-
          La fecha de la ULTIMA firma del circuito, solo cuando el estado
          actual del comparativo es el estado final (`estfin`) de sus firmas,
          o sea, cuando el circuito se cerro (APROBADO, APROBADO UTE, Aprobado
          Dir. Compras). Desde el alta tarda de media 19,8 dias.
        nulo_significa: >-
          El comparativo no esta en un estado final de firma (EN ELABORACION,
          PROPUESTO, RECHAZADO...): para esos estados la fecha de APROBACION NO
          EXISTE. No es un dato que falte, es un dato que no hay. Cuando paso
          el comparativo a su estado actual, y quien lo hizo, si se sabe: es el
          paso con `es_ultimo` en `compras.documento_procesos` (F-085).
        agregacion: no_sumable
      aprobado_por:
        significado: >-
          Login de quien firmo el ultimo paso del circuito (`confir.usu`), con
          la misma condicion que `fecha_aprobacion`. Es el usuario de Sigrid,
          no el nombre de la persona. Quien firmo cada escalon (JEFO, JG, DCOM)
          esta en `compras.comparativo_firmas`.
        nulo_significa: >-
          El comparativo no esta en un estado final de firma: quien firmo el
          ultimo paso de un comparativo rechazado no lo «aprobo».
    relaciones:
      - de: comparativo_id
        a: compras.comparativo_ofertas.comparativo_id
        cardinalidad: "1:N"
        porque: Para las ofertas una a una, con su proveedor, su importe y si es ficticia.
      - de: comparativo_id
        a: compras.comparativo_lineas.comparativo_id
        cardinalidad: "1:N"
        porque: Para las lineas del concurso una a una, con su partida y lo adjudicado.
      - de: comparativo_id
        a: compras.comparativo_objetivo.comparativo_id
        cardinalidad: "1:1"
        porque: Para el coste objetivo del comparativo y si casa con su base del descompuesto.
      - de: comparativo_id
        a: compras.comparativo_firmas.comparativo_id
        cardinalidad: "1:N"
        porque: Para quien firmo cada escalon del circuito y cuando.
      - de: contrato_id
        a: compras.contratos.contrato_id
        cardinalidad: "N:1"
        porque: >-
          Para el contrato en que acabo el comparativo. Varios comparativos
          pueden acabar en el mismo contrato.
      - de: obra_id
        a: maestro.obras.obra_id
        cardinalidad: "N:1"
        porque: Para el nombre, la empresa y el cliente de la obra.
    ejemplos_preguntas:
      - Que proveedores ganan comparativos de mas de una actividad
      - Cuantos comparativos hay por actividad
      - Cuanto se ahorro en los concursos de la obra X
      - Quien aprobo el comparativo X y cuando
      - Acabo en contrato el comparativo X
      - Cuanto se adjudico en comparativos este ano, con y sin atipicos
      - Que comparativos estan pendientes de firma

  comparativo_ofertas:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      TODAS las ofertas de cada comparativo, una fila por oferta, con su
      proveedor, su importe SIN IVA, su estado (rechazada, aceptada,
      pendiente...) y si es FICTICIA.

      **LAS OFERTAS FICTICIAS.** Dentro de un comparativo hay ofertas de
      proveedores INVENTADOS por la propia Ruesma --el OBJETIVO, la OFICINA
      TECNICA, la PLANIFICACION (cuatrimestral, fase 0, ABC)--, que sirven de
      referencia. Contarlas como reales estropea el numero de ofertantes, la
      oferta mas barata y el ahorro. Medido el 2026-10-04: **32.896 ficticias
      de 71.302 ofertas, 1.298,8 M€ sin IVA, el 45 % del ofertado**. Para
      cualquier pregunta de mercado, filtra `NOT es_ficticia`.

      **EL CRITERIO**: ficticia = CIF falso (`A99999999` u `A00000000`), o CIF
      vacio Y nombre de familia; con CIF real, nunca. El CIF falso SOLO cubre
      el **30 %**: **172** entidades ficticias tienen el CIF vacio, y la misma
      entidad firma como OBJETIVO, OFICINA TECNICA o PLANIFICADO. La familia la
      dice el NOMBRE de la oferta, normalizado (sin tildes ni signos), y la
      regla vive escrita una sola vez en `etl_sigrid/domain/comparativos.py`.
      Una ficticia con un nombre NUEVO y CIF vacio entraria como real: la
      consulta de control es mirar las ofertas con `proveedor_cif` nulo y
      `NOT es_ficticia` agrupadas por `proveedor_nombre`.

      **EL IMPORTE ES `dco.totbas`, la base SIN IVA**; `dco.totdoc` lleva IVA
      y no se publica. **EL PROVEEDOR ES `dco.entide`** (99,86 %); el del
      invitado (`comprv.prvide`) solo esta al 18 % y unir por el pierde el 82
      % de las ofertas.
    grano: >-
      Una fila por oferta invitada (`raw.comprv`, cuyo documento de oferta es
      unico), incluidas las ficticias. `oferta_id` es clave primaria declarada.
    clave_negocio: [oferta_id]
    paso_etl: build_compras
    refresco: nocturno
    columnas:
      oferta_id:
        significado: Identificador del documento de oferta en Sigrid (`dco.ide` = `con.ide`).
        agregacion: no_sumable
      invitacion_id:
        significado: Identificador de la invitacion al proveedor (`comprv.ide`).
        agregacion: no_sumable
      comparativo_id:
        significado: Comparativo al que pertenece la oferta.
        agregacion: no_sumable
      posicion:
        significado: Posicion de la oferta dentro del comparativo (`comprv.pos`).
        agregacion: no_sumable
      codigo_oferta: Codigo del documento de oferta en Sigrid.
      fecha_oferta:
        significado: Fecha de alta de la oferta en Sigrid (`con.fec`).
        agregacion: no_sumable
      proveedor_id:
        significado: >-
          Proveedor de la oferta, de `dco.entide` y NUNCA de `comprv.prvide`
          (18 %). En las ficticias es la entidad inventada.
        nulo_significa: La oferta no tiene proveedor informado.
        agregacion: no_sumable
      proveedor_codigo:
        significado: Codigo de la entidad en la oferta (`dco.entcod`).
        nulo_significa: La oferta no trae codigo de entidad.
      proveedor_nombre:
        significado: >-
          Nombre del proveedor TAL Y COMO VA EN LA OFERTA (`dco.entres`). Es
          el que decide la familia ficticia, no el maestro de proveedores.
        nulo_significa: La oferta no trae nombre.
      proveedor_cif:
        significado: CIF del proveedor en la oferta (`dco.entcif`).
        nulo_significa: >-
          La oferta no trae CIF: es un proveedor real sin CIF (13.998 ofertas)
          o una ficticia sin CIF falso (23.078); `es_ficticia` los separa.
      es_ficticia:
        significado: >-
          Cierto si la oferta es de un proveedor inventado (OBJETIVO, OFICINA
          TECNICA, PLANIFICACION...). Ver el criterio en la descripcion.
      familia_ficticia:
        significado: >-
          Que referencia es la oferta ficticia, decidida por el nombre en este
          orden: OBJETIVO, OFICINA_TECNICA, CUATRIMESTRAL, FASE_0, ABC,
          PLANIFICACION. Con CIF falso y un nombre que no dice nada,
          `A99999999` es OBJETIVO y `A00000000` OFICINA_TECNICA.
        nulo_significa: La oferta es REAL.
        valores: [OBJETIVO, OFICINA_TECNICA, CUATRIMESTRAL, FASE_0, ABC, PLANIFICACION]
      estado_id:
        significado: >-
          Codigo interno del estado de la oferta (`con.est`), que solo
          significa algo en el tipo 12. Usa `estado` o `estado_codigo`.
        agregacion: no_sumable
      estado_codigo:
        significado: Mnemonico del estado de la oferta en el catalogo del tipo 12.
        nulo_significa: El estado no figura en el catalogo del tipo 12.
      estado:
        significado: >-
          Resultado de la oferta: Rechazada, Aceptada definitivamente,
          Pendiente, Recibida, Precios solicitados.
        nulo_significa: El estado no figura en el catalogo del tipo 12.
      es_ganadora:
        significado: >-
          Cierto si la oferta esta «Aceptada definitivamente» (`con.est = 6`,
          tipo 12). Medido: 4 ganadoras ficticias (0,1 M€).
      importe_ofertado_documento:
        significado: >-
          (A) Total del documento de oferta SIN IVA (`dco.totbas`). Sumarlo
          sin filtrar `es_ficticia` mezcla mercado y referencias inventadas.
        unidad: EUR
        agregacion: suma
      importe_ofertado_lineas:
        significado: >-
          (B) Suma de las lineas de la oferta que responden a una linea del
          comparativo, SIN IVA. El precio de la linea ya es neto: su descuento
          no se vuelve a aplicar.
        nulo_significa: La oferta no tiene lineas de comparativo.
        unidad: EUR
        agregacion: suma
      n_lineas:
        significado: Lineas de la oferta que responden a una linea del comparativo.
        agregacion: suma
    relaciones:
      - de: comparativo_id
        a: compras.comparativos.comparativo_id
        cardinalidad: "N:1"
        porque: Para la cabecera del comparativo, su obra, su actividad y su contrato.
      - de: oferta_id
        a: compras.comparativo_oferta_lineas.oferta_id
        cardinalidad: "1:N"
        porque: Para las lineas de la oferta, con su descuento y, en el OBJETIVO, su base.
    ejemplos_preguntas:
      - Que proveedores ofertaron en el comparativo X y cuanto
      - Que ofertas son ficticias en el comparativo X
      - A cuantos comparativos se presento el proveedor P y cuantos gano

  comparativo_lineas:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      Las LINEAS DEL CONCURSO de cada comparativo (F-038, Fase 2): lo que se
      pide y lo que se adjudica, una fila por linea de `comlin`, con su
      cantidad, su precio adjudicado, el contrato en que acabo y la PARTIDA de
      su necesidad (`dncpro.paride`), que es la llave hacia el descompuesto.
      Todo SIN IVA. Lo que oferto cada proveedor en cada linea esta en
      `compras.comparativo_oferta_lineas`.

      Sumadas por comparativo dan
      `compras.comparativos.importe_adjudicado_lineas` (salvo el redondeo al
      centimo de cada linea), y llevan sus mismas trampas: 14.585 lineas con
      precio 0, 4.206 negativas y los 52 comparativos con adjudicado atipico,
      que son la mitad del total. «El adjudicado» se da con y sin ellos
      (`compras.comparativos.adjudicado_atipico`).
    grano: >-
      Una fila por linea de comparativo de `raw.comlin` (198.626 el
      2026-10-04). `linea_id` es clave primaria declarada.
    clave_negocio: [linea_id]
    paso_etl: build_compras
    refresco: nocturno
    columnas:
      linea_id:
        significado: Identificador de la linea del comparativo en Sigrid (`comlin.ide`).
        agregacion: no_sumable
      comparativo_id:
        significado: Comparativo al que pertenece la linea (`comlin.comide`).
        agregacion: no_sumable
      numero_linea:
        significado: Numero de la linea dentro del comparativo (`comlin.numlin`).
        agregacion: no_sumable
      posicion:
        significado: Posicion de la linea en el comparativo (`comlin.pos`).
        agregacion: no_sumable
      contrato_id:
        significado: >-
          Contrato al que se adjudico la linea (`comlin.ctride`). Todas las
          lineas de un comparativo van al mismo contrato: el build falla si no.
        nulo_significa: La linea no esta adjudicada a ningun contrato.
        agregacion: no_sumable
      linea_necesidad_id:
        significado: >-
          La linea de necesidad de compra de la que sale (`comlin.dncproide` =
          `dncpro.ide`), la planificacion de compras de la obra. Es el
          `dncpro_id` de `descompuestos.lineas`.
        nulo_significa: La linea no viene de una necesidad de compra.
        agregacion: no_sumable
      partida_id:
        significado: >-
          Partida de la necesidad (`dncpro.paride`): la llave hacia
          `descompuestos.lineas` y hacia la base del coste objetivo.
        nulo_significa: La linea no viene de una necesidad, o la necesidad no tiene partida.
        agregacion: no_sumable
      linea_oferta_ganadora_id:
        significado: >-
          La linea de oferta a la que apunta la adjudicacion (`comlin.dcoproide`),
          en `compras.comparativo_oferta_lineas.linea_oferta_id`.
        nulo_significa: La linea no apunta a ninguna linea de oferta.
        agregacion: no_sumable
      cantidad:
        significado: Cantidad adjudicada (`comlin.can`), 0 si no viene. Mezcla unidades.
        agregacion: no_sumable
      precio:
        significado: Precio unitario adjudicado (`comlin.pre`), SIN IVA, 0 si no viene.
        unidad: EUR
        agregacion: no_sumable
      importe_adjudicado:
        significado: >-
          `cantidad x precio` de la linea, SIN IVA, redondeado al centimo.
          Sumalo SIEMPRE con y sin los comparativos de `adjudicado_atipico`.
        unidad: EUR
        agregacion: suma
    relaciones:
      - de: comparativo_id
        a: compras.comparativos.comparativo_id
        cardinalidad: "N:1"
        porque: Para la cabecera del comparativo, su obra, su actividad y si su adjudicado es atipico.
      - de: contrato_id
        a: compras.contratos.contrato_id
        cardinalidad: "N:1"
        porque: Para el contrato al que se adjudico la linea.
      - de: partida_id
        a: descompuestos.lineas.partida_id
        cardinalidad: "N:N"
        porque: >-
          Para el descompuesto de la partida. Tiene una copia por ORIGEN y por
          version: filtra el origen y la version antes de unir, nunca sumes
          origenes distintos.
    ejemplos_preguntas:
      - Que se adjudico linea a linea en el comparativo X
      - Que lineas del comparativo X acabaron en el contrato C
      - Cuanto se adjudico en comparativos por partida en la obra X

  comparativo_oferta_lineas:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      Lo que OFERTO cada proveedor en cada linea del comparativo (F-038, Fase
      2): una fila por linea de oferta que responde a una linea del concurso
      (`dcopro` con `comlinide > 0`), de TODAS las ofertas, con la ficticia
      marcada como en `compras.comparativo_ofertas`. Para cualquier pregunta
      de mercado, filtra `NOT es_ficticia`: las ficticias no cuentan en el
      numero de ofertantes, la oferta minima ni el ahorro.

      **EL DESCUENTO ES TEXTO.** `descuento_texto` es `dcopro.dto` tal cual:
      TEXTO con coma decimal ('10,08%'), y tratarlo como numero revienta. El
      numero esta en `porcentaje_descuento`. Hay porcentajes NEGATIVOS: son un
      recargo, no un descuento. Y el `precio` YA es neto:
      `importe_ofertado_linea` es `cantidad x precio` en las 786.710 lineas
      medidas, y el porcentaje es el que produjo ese precio, no uno que haya
      que volver a aplicar.

      **LA BASE DEL COSTE OBJETIVO (D4, decidida por el humano el
      2026-10-04).** En las lineas de la oferta OBJETIVO con porcentaje (83.329
      medidas), `precio_base` es el precio del elemento de
      `descompuestos.lineas`, de su obra y su partida, del que sale el
      objetivo: precio = base x (1 - %), con 0,011 EUR + 0,2 % del precio de
      tolerancia. La base es la de la primera ABC del master si casa; si no,
      la de la version ANTERIOR a la ABC mas reciente que case; nunca una
      posterior. En las obras sin ABC, solo Estudios (el master 0, o la
      Descomposicion de coste donde no lo hay). Si no casa, se publica la de
      la regla con `casa_base` falso. Dentro de cada version, el elemento es
      el de igual linea de necesidad (`dncpro_id`) si casa; si no casa o no lo
      hay, el que case por precio en esa partida y version (decision del
      humano, 2026-10-05). Por producto no se puede: la 0696 usa el mismo
      producto para un vallado de 69,70 y una malla de 28,97.

      **Medido con esta regla publicada el 2026-10-05** (el SQL de este objeto,
      en solo lectura): de **84.084** lineas OBJETIVO con porcentaje casan
      **24.425 (29,0 %)**: 11.409 con la primera ABC, 5.468 con una version
      anterior y 7.548 con Estudios en obras sin ABC; **59.570** no casan
      (`casa_base` falso) y **89** no tienen descompuesto en su partida
      (`casa_base` NULL). La spec lo previo el 2026-10-04 sobre 83.329: casan
      24.263 (29,1 %), y de las que no, **12.351** casarian con una version
      posterior a la ABC y **21.789** de obras sin ABC con otra version del
      master: las fechas apuntan a que la base real es la version VIGENTE al
      hacer el comparativo, y Negocio puede ampliar la regla. Un `casa_base`
      falso no es un error del dato.

      **Lee el descompuesto de la noche anterior**: `build_compras` corre antes
      que `build_descompuestos`. La primera ABC y el master 0 estan
      congelados, asi que el desfase no cambia la base; si
      `build_descompuestos` falla, la base es la de otra noche.
    grano: >-
      Una fila por linea de oferta de `raw.dcopro` que responde a una linea
      del comparativo (`comlinide > 0`), de una oferta de
      `compras.comparativo_ofertas` (~787.000 el 2026-10-04).
      `linea_oferta_id` es clave primaria declarada.
    clave_negocio: [linea_oferta_id]
    paso_etl: build_compras
    refresco: nocturno
    columnas:
      linea_oferta_id:
        significado: Identificador de la linea de oferta en Sigrid (`dcopro.ide`).
        agregacion: no_sumable
      oferta_id:
        significado: Oferta a la que pertenece la linea (`compras.comparativo_ofertas`).
        agregacion: no_sumable
      comparativo_id:
        significado: Comparativo de su oferta.
        agregacion: no_sumable
      comparativo_linea_id:
        significado: >-
          La linea del concurso a la que responde (`dcopro.comlinide`), en
          `compras.comparativo_lineas.linea_id`.
        agregacion: no_sumable
      producto_id:
        significado: >-
          Producto de compras de la linea (`dcopro.proide`). No identifica el
          elemento del descompuesto: un mismo producto sirve para cosas
          distintas.
        nulo_significa: La linea no trae producto.
        agregacion: no_sumable
      descripcion:
        significado: Descripcion de la linea tal y como la escribio el proveedor (`dcopro.res`).
      unidad_medida:
        significado: Unidad de medida de la linea (`dcopro.unimed`), vacia si no la trae.
      cantidad:
        significado: Cantidad ofertada (`dcopro.can`), 0 si no viene. Mezcla unidades.
        agregacion: no_sumable
      precio:
        significado: >-
          Precio unitario ofertado (`dcopro.pre`), SIN IVA y YA NETO: el
          descuento de la linea ya esta aplicado. 0 si no viene.
        unidad: EUR
        agregacion: no_sumable
      importe_ofertado_linea:
        significado: >-
          Importe de la linea (`dcopro.tot` = `cantidad x precio`), SIN IVA.
          Sumado por oferta da `importe_ofertado_lineas` de
          `compras.comparativo_ofertas`. Sumarlo sin filtrar `es_ficticia`
          mezcla mercado y referencias inventadas.
        unidad: EUR
        agregacion: suma
      descuento_texto:
        significado: >-
          El descuento TAL CUAL lo guarda Sigrid (`dcopro.dto`): TEXTO con coma
          decimal y el signo %, como '10,08%' o '-168%'. Convertirlo a numero
          por las bravas revienta; usa `porcentaje_descuento`. Vacio cuando la
          linea no trae descuento (el 88 % de las lineas).
      porcentaje_descuento:
        significado: >-
          El descuento en tanto por cien (10,08 = 10,08 %), de
          `compras.fn_porcentaje_dto`. Negativo = RECARGO. Es el que produjo el
          precio, que ya es neto: no se vuelve a aplicar.
        nulo_significa: La linea no trae descuento, o su texto no tiene la forma `-12,5%`.
        agregacion: no_sumable
      es_ficticia:
        significado: Cierto si la oferta de la linea es ficticia (`compras.comparativo_ofertas.es_ficticia`).
      familia_ficticia:
        significado: La familia ficticia de su oferta (OBJETIVO, OFICINA_TECNICA...).
        nulo_significa: La oferta es REAL.
        valores: [OBJETIVO, OFICINA_TECNICA, CUATRIMESTRAL, FASE_0, ABC, PLANIFICACION]
      base_regla:
        significado: >-
          La regla de la base de la obra (D2): `ABC` si la obra tiene primera
          ABC en el master; si no, `ESTUDIOS`.
        nulo_significa: La linea no es de una oferta OBJETIVO con porcentaje.
        valores: [ABC, ESTUDIOS]
      precio_base:
        significado: >-
          Precio del elemento del descompuesto que sirve de base (D4): el que
          casa o, si ninguno casa, el de la version de la regla.
        nulo_significa: >-
          La linea no es OBJETIVO con porcentaje, o en su partida no se
          identifica el elemento: ni por la linea de necesidad ni por un
          precio que case.
        unidad: EUR
        agregacion: no_sumable
      origen_base:
        significado: >-
          De donde sale la base: el origen y la version del descompuesto, como
          'ABC v3', 'MASTER_PRE_ABC v2', 'MASTER_ESTUDIO v0' o 'ESTUDIO v0'.
        nulo_significa: No hay `precio_base`.
      casa_base:
        significado: >-
          Cierto si base x (1 - %) da el precio con la tolerancia (D4). Falso
          («no casa») si la partida tiene descompuesto en alguna version, la
          admita la regla o no, y ninguna de las que admite casa.
        nulo_significa: >-
          La linea no es OBJETIVO con porcentaje, o su partida no tiene
          descompuesto en NINGUNA version (89 lineas el 2026-10-05).
    relaciones:
      - de: oferta_id
        a: compras.comparativo_ofertas.oferta_id
        cardinalidad: "N:1"
        porque: Para el proveedor, el estado y el importe de documento de la oferta.
      - de: comparativo_linea_id
        a: compras.comparativo_lineas.linea_id
        cardinalidad: "N:1"
        porque: Para comparar lo ofertado con lo adjudicado en la misma linea, y su partida.
    ejemplos_preguntas:
      - Que oferto cada proveedor en cada linea del comparativo X
      - Que descuento sobre que base lleva el objetivo del comparativo X
      - Que lineas del objetivo no casan con el descompuesto de la obra X

  comparativo_objetivo:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      El COSTE OBJETIVO de cada comparativo (F-038, Fase 2): la oferta
      ficticia OBJETIVO que Ruesma mete en el comparativo como referencia,
      una fila por comparativo que la tiene. Medido el 2026-10-04: 12.259
      ofertas OBJETIVO en 11.420 comparativos; 1.126 tienen dos o tres, y
      vale la MAS RECIENTE. Su importe es su documento, SIN IVA; su
      porcentaje, el de sus lineas si es uno solo (7.399 con uno, 48 con
      varios, 4.813 sin ninguno).

      **CONTRA QUE BASE (D4)**: `base_regla` dice si la obra tiene primera ABC
      (`ABC`) o no (`ESTUDIOS`), y `pct_importe_casa_base` que parte del
      importe de sus lineas con porcentaje reproduce base x (1 - %) del
      descompuesto. Medido con la regla publicada el 2026-10-05: casan 24.425
      de 84.084 lineas (29,0 %); la spec lo previo el 2026-10-04 en 24.263 de
      83.329 (29,1 %). Un porcentaje bajo NO es un error: la regla es la que decidio
      el humano (la primera ABC, o una version anterior; nunca una
      posterior; Estudios en obras sin ABC) y Negocio puede ampliarla. El
      detalle linea a linea esta en `compras.comparativo_oferta_lineas`.

      Lee `descompuestos` de la noche anterior: `build_compras` corre antes
      que `build_descompuestos`.
    grano: >-
      Una fila por comparativo con al menos una oferta OBJETIVO.
      `comparativo_id` es clave primaria declarada.
    clave_negocio: [comparativo_id]
    paso_etl: build_compras
    refresco: nocturno
    columnas:
      comparativo_id:
        significado: El comparativo (`compras.comparativos.comparativo_id`).
        agregacion: no_sumable
      oferta_objetivo_id:
        significado: >-
          La oferta OBJETIVO elegida: la de fecha de alta mas reciente y, a
          igual fecha, la de mayor identificador.
        agregacion: no_sumable
      n_ofertas_objetivo:
        significado: Cuantas ofertas OBJETIVO tiene el comparativo (1, 2 o 3).
        agregacion: suma
      importe_objetivo:
        significado: >-
          El documento de la oferta OBJETIVO, SIN IVA (`dco.totbas`). Ejemplo,
          la 0696 (comparativo 2754136): 94.853,91 EUR.
        unidad: EUR
        agregacion: suma
      porcentaje_objetivo:
        significado: >-
          El porcentaje de las lineas de la oferta OBJETIVO, en tanto por cien,
          cuando todas las que lo traen llevan el mismo.
        nulo_significa: Sus lineas no traen porcentaje, o traen varios distintos.
        agregacion: no_sumable
      base_regla:
        significado: >-
          La regla de la base de la obra del comparativo: `ABC` si la obra
          tiene primera ABC en el master; si no, `ESTUDIOS`.
        valores: [ABC, ESTUDIOS]
      pct_importe_casa_base:
        significado: >-
          Porcentaje (0-100) del importe de las lineas con porcentaje de la
          oferta OBJETIVO cuya base del descompuesto casa (D4).
        nulo_significa: La oferta OBJETIVO no tiene lineas con porcentaje.
        agregacion: no_sumable
    relaciones:
      - de: comparativo_id
        a: compras.comparativos.comparativo_id
        cardinalidad: "1:1"
        porque: Para la obra, la actividad, el contrato y las demas magnitudes del comparativo.
      - de: oferta_objetivo_id
        a: compras.comparativo_ofertas.oferta_id
        cardinalidad: "N:1"
        porque: Para la oferta OBJETIVO como oferta, con su estado y su fecha.
    ejemplos_preguntas:
      - Cual es el coste objetivo del comparativo X y con que porcentaje
      - En que comparativos de la obra X el objetivo no casa con su base
      - Cuanto se adjudico por encima o por debajo del objetivo

  comparativo_firmas:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      El CIRCUITO DE FIRMAS de cada comparativo, escalon a escalon (F-038,
      Fase 2, D3): una fila por firma de `confir`, con su circuito (COMVAL, el
      normal; COAVAL, las ampliaciones; y variantes UTE, JEFINST, DIRGEN y
      DIRPRO), su escalon (JEFO, JG, DCOM...), quien firmo y cuando. Medido el
      2026-10-04: 66.469 firmas de comparativo, 6.498 pendientes.

      **«LA FIRMA DEL JEFE DE GRUPO» NO ES UNA FILA**: un escalon se REPITE
      cuando el comparativo vuelve tras un rechazo (5.375 comparativos
      repiten escalon). Para «quien firmo como JG» toma la ultima FIRMADA de
      ese escalon por `fecha` y `hora`; para quien APROBO el comparativo, usa
      `compras.comparativos.aprobado_por`. El campo `ord` (orden obligatorio)
      de Sigrid vale 0 siempre y no se publica: el orden lo da la fecha. Los
      PROCESOS del comparativo --validar, aprobacion del jefe de grupo,
      adjudicacion, rechazos-- con su estado de origen y de destino, quien y
      cuando, estan en `compras.documento_procesos` (F-085), igual que los de
      facturas, contratos y obras: las firmas de aqui son el detalle escalon a
      escalon, con las PENDIENTES.
    grano: >-
      Una fila por firma de `raw.confir` de un comparativo (`conide` en
      `raw.com`). `firma_id` es clave primaria declarada.
    clave_negocio: [firma_id]
    paso_etl: build_compras
    refresco: nocturno
    columnas:
      firma_id:
        significado: Identificador de la firma en Sigrid (`confir.ide`).
        agregacion: no_sumable
      comparativo_id:
        significado: Comparativo firmado (`confir.conide`).
        agregacion: no_sumable
      circuito:
        significado: >-
          Codigo del proceso de firma (`confir.cod`): COMVAL el circuito
          normal, COAVAL el de las ampliaciones, y sus variantes.
      escalon:
        significado: >-
          El rol que firma en ese paso (`confir.rol`): JEFO (jefe de obra), JG
          (jefe de grupo), DCOM (direccion de compras) y otros.
      usuario:
        significado: Login de Sigrid de quien firma (`confir.usu`), no el nombre de la persona.
      fecha:
        significado: Fecha de la firma (`confir.fec`).
        nulo_significa: La firma esta pendiente (6 pendientes medidas si tienen fecha).
        agregacion: no_sumable
      hora:
        significado: Hora de la firma (`confir.hor`), para ordenar firmas del mismo dia.
        agregacion: no_sumable
      pendiente:
        significado: >-
          Cierto si la firma esta PENDIENTE (`confir.fir = 0`). Es la misma
          definicion que `compras.comparativos.n_firmas_pendientes`.
      firma_digital_valida:
        significado: Cierto si la firma esta marcada como firmada OK (`confir.firok = 1`).
      estado_final_id:
        significado: >-
          Estado del comparativo (`con.est`, tipo 46) en que deja el documento
          el circuito al cerrarse (`confir.estfin`). Cuando el estado actual del
          comparativo es este, el circuito se cerro (`fecha_aprobacion`).
        agregacion: no_sumable
    relaciones:
      - de: comparativo_id
        a: compras.comparativos.comparativo_id
        cardinalidad: "N:1"
        porque: Para el estado del comparativo, su obra y su fecha de aprobacion.
    ejemplos_preguntas:
      - Quien firmo cada escalon del comparativo X y cuando
      - Que comparativos tiene pendientes de firma el usuario U
      - Cuanto tarda de media cada escalon en firmar

  fn_normalizar_nombre:
    tipo: funcion
    capa: operacion
    consumo_recomendado: false
    motivo_no_consumo: >-
      Funcion auxiliar del build de compras: la usa `compras.fn_familia_ficticia`.
    descripcion: >-
      Normaliza el nombre de una oferta para reconocer la familia ficticia:
      mayusculas, sin tildes, todo lo que no sea letra o cifra a un espacio.
      Sus literales son los de `etl_sigrid/domain/comparativos.py` (F-038).
    grano: null
    clave_negocio: []
    paso_etl: build_compras
