  historial_estados:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      La FOTO DIARIA de estados de contratos (tipo 44) y facturas (tipo 15),
      guardada POR TRAMOS: cada fila dice que un documento estuvo en un estado
      desde una foto hasta otra (F-067). Es lo unico del datamart que sabe
      CUANDO cambio de estado un documento, porque en Sigrid esa fecha NO
      EXISTE: `concam` no audita el estado y `confir` no tiene firmas de
      contrato. **ES HISTORIA QUE NO SE RECONSTRUYE**: el resto de `compras` se
      rehace cada noche y esta tabla no; si se borrara, la historia volveria a
      empezar de cero, porque no hay copia en Sigrid. Tampoco la borra `python
      main.py reset-compras`, que vacia el resto del esquema y la conserva. **LA HISTORIA EMPIEZA EL
      DIA DEL DESPLIEGUE** de F-067: lo anterior no esta. La primera foto es la
      LINEA BASE (`es_linea_base`): «ya estaba en ese estado; desde cuando, no
      se sabe». **La foto de un dia D** se reconstruye con `desde <= D AND (hasta
      IS NULL OR hasta > D)`. Para el estado ACTUAL y los dias que lleva, usa
      `compras.v_estado_documentos`, que ya hace la cuenta. Y NO uses
      `compras.contratos.fecha_ultima_modificacion` como fecha del cambio de
      estado: es la ultima modificacion del documento, que la firma no mueve.
    grano: >-
      Una fila por TRAMO: un documento en un estado entre dos fotos. Clave
      `(documento_id, desde)`. Como mucho UN tramo abierto (`hasta` NULL) por
      documento, y lo garantiza un indice unico parcial.
    clave_negocio: [documento_id, desde]
    paso_etl: build_compras
    refresco: nocturno
    columnas:
      documento_id:
        significado: >-
          El documento de Sigrid (`con.ide`): un `contrato_id` de
          `compras.contratos` si `tipo_documento_codigo` es 44 y un
          `factura_id` de `compras.facturas` si es 15.
        agregacion: no_sumable
      tipo_documento_codigo:
        significado: >-
          Tipo de documento de Sigrid (`con.tip`): 44 contrato, 15 factura. Solo
          esos dos; el comparativo no esta porque sus firmas ya tienen fecha.
        agregacion: no_sumable
        valores: [44, 15]
      estado_id:
        significado: >-
          Codigo interno del estado (`con.est`), CRUDO: solo significa algo con
          su tipo de documento. Traducido esta en `compras.v_estado_documentos`.
        agregacion: no_sumable
        nulo_significa: El documento no tenia estado en Sigrid en esa foto.
      desde:
        significado: >-
          Primera foto que vio el documento en este estado. **El cambio ocurrio
          entre `observado_antes` y `desde`, no a una hora exacta**: la foto es
          diaria, con la ingesta de la noche.
        agregacion: no_sumable
      hasta:
        significado: >-
          Primera foto que ya no lo vio en este estado (por un cambio o porque
          desaparecio de Sigrid).
        agregacion: no_sumable
        nulo_significa: Es el tramo VIGENTE, el documento sigue en ese estado.
      observado_antes:
        significado: >-
          La foto anterior a `desde`: el cambio ocurrio despues de este
          instante. Si la nocturna fallo una noche, la ventana es de dos dias.
        agregacion: no_sumable
        nulo_significa: >-
          Tramo de la LINEA BASE: el documento ya estaba en ese estado el dia
          del despliegue y no se sabe desde cuando.
      es_linea_base:
        significado: >-
          Verdadero en los tramos abiertos por la PRIMERA foto: su `desde` es el
          dia del despliegue, no el del cambio, asi que la antiguedad que dan es
          un MINIMO («lleva al menos N dias»).
        agregacion: no_sumable
      motivo_cierre:
        significado: >-
          Por que se cerro el tramo: CAMBIO (paso a otro estado, y hay un tramo
          siguiente) o DESAPARECIDO (el documento ya no esta en Sigrid).
        valores: [CAMBIO, DESAPARECIDO]
        nulo_significa: El tramo esta abierto, con `hasta` a NULL.
    relaciones:
      - de: documento_id
        a: compras.v_estado_documentos.documento_id
        cardinalidad: "N:1"
        porque: >-
          Para el estado actual traducido de un documento con historia. Los
          desaparecidos no estan en la vista. Para ir a la cabecera, filtra
          antes `tipo_documento_codigo` (44 a `compras.contratos.contrato_id`,
          15 a `compras.facturas.factura_id`).
    ejemplos_preguntas:
      - Cuando cambio de estado la factura X y por que estados ha pasado
      - Cuantos contratos han pasado a firmado esta semana
      - En que estado estaba el contrato C el dia D

  historial_estados_fotos:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      Una fila por cada FOTO DIARIA tomada de los estados de contratos y
      facturas (F-067), con sus contadores. Sirve para dos cosas: saber DESDE
      CUANDO hay historia (la primera fila, la linea base, es el dia del
      despliegue) y si la historia tiene HUECOS (una noche sin fila es una
      noche en que la foto no se tomo, y el cambio de esos dias se vio con dos
      noches de ventana). **NO SE RECONSTRUYE**, como
      `compras.historial_estados`, y `reset-compras` tambien la conserva.
    grano: Una fila por foto tomada. Clave `observado_en`.
    clave_negocio: [observado_en]
    paso_etl: build_compras
    refresco: nocturno
    columnas:
      observado_en:
        significado: >-
          El instante que retrata la foto: la ultima carga de `raw.con` de esa
          noche. Es el `desde` de los tramos que abrio y el `hasta` de los que
          cerro.
        agregacion: no_sumable
      tomada_en:
        significado: >-
          Cuando corrio el build que tomo la foto. Si va muy por detras de
          `observado_en`, el build se relanzo a mano.
        agregacion: no_sumable
      es_linea_base:
        significado: >-
          Verdadero solo en la primera foto, la del despliegue: sus tramos no
          saben desde cuando estaban en su estado.
        agregacion: no_sumable
      n_documentos:
        significado: >-
          Documentos de contrato y factura presentes en Sigrid esa noche (unos
          185.800 el 2026-10-06), que es tambien los tramos vigentes tras la foto.
        agregacion: no_sumable
      n_cambios:
        significado: >-
          Documentos que cambiaron de estado desde la foto anterior. Del orden
          de decenas a cientos por noche; miles es sospechoso.
        agregacion: suma
      n_altas:
        significado: >-
          Documentos nuevos (o que reaparecen) desde la foto anterior. En la
          linea base son todos.
        agregacion: suma
      n_desaparecidos:
        significado: >-
          Documentos que ya no estan en Sigrid desde la foto anterior (borrados).
          Una ingesta a medias no llega aqui: si faltara mas del 2 %, el build
          falla y no toma la foto.
        agregacion: suma
    relaciones: []
    ejemplos_preguntas:
      - Desde cuando hay historia de estados de contratos y facturas
      - Ha habido alguna noche sin foto de estados

  v_estado_documentos:
    tipo: vista
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      El estado ACTUAL de cada contrato y cada factura y CUANTO LLEVA en el,
      sacado de la foto diaria (`compras.historial_estados`, F-067). Es la
      respuesta a «que contratos llevan mas de tres semanas enviados y sin
      firmar»: `estado_codigo = 'EPF' AND tipo_documento = 'CONTRATO' AND
      dias_en_estado > 21`. **LA HISTORIA EMPIEZA EL DIA DEL DESPLIEGUE**: lo
      que estaba en su estado antes de la primera foto lleva
      `antiguedad_es_minima` verdadero, y entonces `dias_en_estado` es un
      MINIMO («lleva al menos N dias»), no la antiguedad exacta. **En cuanto
      ese minimo supera 21, «mas de tres semanas» es una respuesta cierta**,
      porque un minimo mayor que 21 ya es mas de tres semanas; por debajo, en la linea
      base, no se sabe y hay que decirlo. **El cambio ocurrio entre
      `cambio_observado_tras` y `en_estado_desde`**, no a una hora exacta: la
      foto se toma una vez por noche. Los dias se calculan AL CONSULTAR, en
      hora de Madrid; `ultima_foto` dice de cuando es la ultima foto, y si se
      ha quedado atras la historia se ha parado. **NO uses
      `compras.contratos.fecha_ultima_modificacion` (`con.tiemod`) para esto**:
      es la ultima modificacion del documento y NO es la fecha del cambio de
      estado (la firma no la mueve).
    grano: >-
      Una fila por documento de contrato o factura presente en la ultima foto:
      su tramo abierto. Clave `documento_id`.
    clave_negocio: [documento_id]
    paso_etl: build_compras
    refresco: nocturno
    columnas:
      documento_id:
        significado: >-
          El documento (`con.ide`): es el `contrato_id` de `compras.contratos`
          o el `factura_id` de `compras.facturas`, segun `tipo_documento`.
        agregacion: no_sumable
      tipo_documento_codigo:
        significado: Tipo de documento de Sigrid, 44 contrato o 15 factura.
        agregacion: no_sumable
        valores: [44, 15]
      tipo_documento:
        significado: >-
          CONTRATO o FACTURA. Filtra por aqui antes de unir con la cabecera:
          los dos tipos comparten la columna `documento_id`.
        valores: [CONTRATO, FACTURA]
      estado_id:
        significado: >-
          Codigo interno del estado (`con.est`); solo significa algo con su
          tipo de documento. Para filtrar, usa `estado_codigo`.
        agregacion: no_sumable
        nulo_significa: El documento no tiene estado en Sigrid.
      estado_codigo:
        significado: >-
          Mnemonico del estado, lo estable para filtrar: en contratos PFP, EPF
          (enviado pendiente de firma), RFP, COMD, FIR, TER, RES; en facturas
          los de `compras.facturas.estado_codigo`.
        nulo_significa: >-
          El estado no casa con el catalogo de su tipo, o el documento no tiene
          estado.
      estado:
        significado: >-
          Nombre del estado, traducido por la pareja (tipo, estado) contra el
          catalogo de Sigrid, igual que en `compras.contratos` y `compras.facturas`.
        nulo_significa: Igual que en `estado_codigo`.
      en_estado_desde:
        significado: >-
          Fecha y hora (Madrid) de la primera foto que vio el documento en este
          estado. En la linea base es el dia del despliegue, no el del cambio.
        agregacion: no_sumable
      cambio_observado_tras:
        significado: >-
          Fecha y hora (Madrid) de la foto anterior: el cambio ocurrio entre
          esta y `en_estado_desde`.
        agregacion: no_sumable
        nulo_significa: >-
          Linea base: el documento ya estaba en ese estado el dia del
          despliegue y no se sabe desde cuando.
      antiguedad_es_minima:
        significado: >-
          Verdadero si el tramo es de la LINEA BASE: `dias_en_estado` es
          entonces un minimo («al menos N dias»). Falso: el cambio se vio, y los
          dias son exactos con la ventana de una noche.
        agregacion: no_sumable
      dias_en_estado:
        significado: >-
          Dias de calendario (Madrid) desde `en_estado_desde` hasta hoy. Un
          MINIMO si `antiguedad_es_minima`. Se calcula al consultar.
        unidad: dias
        agregacion: no_sumable
      ultima_foto:
        significado: >-
          Fecha y hora (Madrid) de la ultima foto tomada. Si no es de la ultima
          noche, la foto se ha parado y `dias_en_estado` sigue contando sin
          haber mirado si el estado cambio.
        agregacion: no_sumable
        nulo_significa: Todavia no se ha tomado ninguna foto.
    relaciones:
      - de: documento_id
        a: compras.contratos.contrato_id
        cardinalidad: "1:1"
        porque: >-
          Para la cabecera del contrato (proveedor, obra). Solo las filas de
          `tipo_documento` CONTRATO; filtra antes.
      - de: documento_id
        a: compras.facturas.factura_id
        cardinalidad: "1:1"
        porque: >-
          Para la cabecera de la factura (proveedor, fechas). Solo las filas de
          `tipo_documento` FACTURA; filtra antes.
    ejemplos_preguntas:
      - Que contratos llevan mas de tres semanas enviados sin firmar
      - Cuanto lleva la factura X en su estado actual
      - Que facturas llevan mas de un mes sin aprobar

  necesidades:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      El DOCUMENTO DE NECESIDADES DE COMPRA de Sigrid (`dnc`, F-067), que en
      Ruesma es el DOCUMENTO DE PLANIFICACION DE COMPRAS (DPC) de la obra: el
      jefe de obra planifica en el que va a comprar, con su codigo 2 para
      agruparlo, y de sus lineas cuelgan los comparativos, contratos,
      albaranes y facturas. Es UNO POR OBRA: 271 de los 277 son el documento
      de su obra (`es_la_de_la_obra`), con el codigo y el nombre de la obra.
      Sus LINEAS estan en `descompuestos.v_pbi_planif_jo` (`dncpro_id`).
      **No se publica su estado**: los 277 estan «En curso» en Sigrid, asi que
      el estado no informa de nada.
    grano: Una fila por documento de necesidades (`raw.dnc`). Clave `necesidad_id`.
    clave_negocio: [necesidad_id]
    paso_etl: build_compras
    refresco: nocturno
    columnas:
      necesidad_id:
        significado: >-
          Identificador del documento en Sigrid (`dnc.ide`, `con.ide`). Es el
          `necesidad_id` de las lineas de contrato, albaran y factura.
        agregacion: no_sumable
      codigo_necesidad:
        significado: >-
          Codigo del documento tal y como se ve en Sigrid; es el de la obra
          (por ejemplo `0727.0`).
      nombre:
        significado: Nombre del documento en Sigrid, que es el de la obra.
      fecha_alta:
        significado: Fecha de alta del documento en Sigrid (`con.fec`), ya tipada.
        agregacion: no_sumable
        nulo_significa: Sigrid no tiene fecha de alta para el documento.
      obra_id:
        significado: >-
          La obra del documento (`dnc.obride`), la ficha de su empresa como en
          el resto de `compras`. 274 de los 277 la tienen.
        agregacion: no_sumable
        nulo_significa: El documento no esta asignado a ninguna obra.
      codigo_obra:
        significado: Codigo de la obra tal y como se teclea en Sigrid.
        nulo_significa: El documento no tiene obra.
      nombre_obra:
        significado: Nombre legible de la obra, de `con.res`.
        nulo_significa: El documento no tiene obra.
      es_la_de_la_obra:
        significado: >-
          Verdadero si la obra apunta a este documento como SU documento de
          necesidades (`obr.dncide`): 271 de 277. Los demas son documentos
          huerfanos o de prueba; sus lineas no estan en
          `descompuestos.v_pbi_planif_jo`, que solo lee el de la obra.
        agregacion: no_sumable
      n_lineas:
        significado: >-
          Cuantas lineas de necesidad tiene el documento (`raw.dncpro`); 0 si
          ninguna.
        agregacion: suma
    relaciones:
      - de: obra_id
        a: maestro.obras.obra_id
        cardinalidad: "N:1"
        porque: >-
          Para el nombre, la empresa y la clave de la obra (F-102).
      - de: necesidad_id
        a: compras.albaran_lineas.necesidad_id
        cardinalidad: "1:N"
        porque: >-
          Para lo entregado que sale de este DPC. Igual con
          `compras.contrato_lineas` y `compras.factura_lineas`.
    ejemplos_preguntas:
      - Cual es el documento de planificacion de compras de la obra X
      - Cuantas lineas tiene la planificacion de compras de cada obra

  documento_procesos:
    tipo: tabla
    capa: consumo
    consumo_recomendado: true
    descripcion: >-
      **QUIEN HIZO QUE PASO DE CADA DOCUMENTO, DESDE QUE ESTADO, A CUAL Y
      CUANDO** (F-085): el historial de PROCESOS de facturas, contratos,
      comparativos y obras, una fila por paso de la ventana «Procesos» de
      Sigrid (`raw.rac`): el proceso («Comprobar factura», «Aprobar factura»,
      «Enviar para la firma», «Adjudicacion compras»...), el estado de ORIGEN y
      el de DESTINO ya traducidos, el login y el nombre de quien lo lanzo, la
      fecha y la hora al segundo (hora local de Madrid, la de pantalla) y, en
      el paso de contabilizar, el asiento. ~1,01 M filas el 2026-10-07; cubre
      desde 2008.

      **COBERTURA, medida el 2026-10-07**: facturas 166.840 de 166.936
      (99,94 %), contratos 18.539 de 19.093 (97,1 %), comparativos 19.822 de
      20.426 (97,0 %) y obras 666 de 923 (72,2 %). Los documentos que faltan
      **no han salido de su estado inicial** (facturas en REC o RECGG,
      contratos en PFP, comparativos y obras sin procesar): no tienen pasos
      porque nadie los ha procesado, no porque falte el dato.

      **ES LA HISTORIA NETA, NO LA BRUTA**: en Sigrid «Deshacer proceso» BORRA
      el paso, asi que aqui esta el camino que el documento recorrio de
      verdad. Una aprobacion deshecha no aparece. La historia bruta (altas,
      modificaciones, pasos deshechos) y la marca de firma digital estan en
      `dbo.log`, que no se ingiere (F-105).

      **EL ESTADO ACTUAL ES EL DESTINO DEL ULTIMO PASO** (`es_ultimo`): coincide
      con el estado del documento en el 99,96 % de las facturas, el 99,99 % de
      los contratos, el 99,98 % de los comparativos y el 100 % de las obras.
      `encaja_con_anterior` falso marca un cambio de estado hecho fuera de un
      proceso (el 2,2 % de las facturas tiene alguno): la cadena tiene un salto,
      no un error del ETL.

      **QUIEN**: `usuario` es el LOGIN de Sigrid (`jmvargas`) y
      `nombre_usuario` el nombre de su ficha de usuario, casado sin distinguir
      mayusculas ni espacios. Hay nombre en el **93,0 % de las filas**: el resto
      son logins sin ficha de usuario en Sigrid (usuarios antiguos o de
      sistema), y entonces `nombre_usuario` es nulo pero `usuario` sigue ahi.
      **El DNI y el empleado NO estan aqui**: estan solo en
      `personal.usuarios_sigrid`, el esquema autorizado para datos personales,
      que casa con `usuario` por el login.

      **LA APROBACION DE UNA FACTURA ESTA AQUI, NO EN EL CIRCUITO DE FIRMAS
      (`confir`)**: sus 3.474 filas DOCVAL de factura no tienen ninguna firma
      y el 97,4 % de esas facturas ya esta aprobada para pago por proceso. Las
      firmas del comparativo escalon a escalon, con las PENDIENTES, la
      propuesta y el importe, estan en `compras.comparativo_firmas`.

      Une con `compras.facturas`, `compras.contratos` y `compras.comparativos`
      por `documento_id`, **filtrando antes `familia`**: el mismo documento no
      es de dos familias, pero un `documento_id` de obra no esta en ninguna de
      esas tablas.
    grano: >-
      Una fila por paso de `raw.rac` de un documento de las familias FACTURA
      (15), CONTRATO (44), COMPARATIVO (46) u OBRA (42). `paso_id` es clave
      primaria declarada; `(documento_id, orden)` tambien es unica.
    clave_negocio: [paso_id]
    claves_alternativas: [[documento_id, orden]]
    paso_etl: build_compras
    refresco: nocturno
    columnas:
      paso_id:
        significado: Identificador del paso en Sigrid (`rac.ide`).
        agregacion: no_sumable
      documento_id:
        significado: >-
          El documento (`rac.conide`, `con.ide`): el `factura_id`,
          `contrato_id` o `comparativo_id` de las tablas de `compras`, o la obra.
        agregacion: no_sumable
      tipo_documento_codigo:
        significado: Tipo de documento de Sigrid (`con.tip`) - 15, 44, 46 o 42.
        valores: [15, 44, 46, 42]
        agregacion: no_sumable
      familia:
        significado: Familia del documento, el nombre de `tipo_documento_codigo`.
        valores: [FACTURA, CONTRATO, COMPARATIVO, OBRA]
      codigo_documento:
        significado: Codigo del documento tal y como se ve en Sigrid (`FR26/10025`).
      proceso_id:
        significado: >-
          El proceso del catalogo de Sigrid (`rac.conproide`).
        nulo_significa: >-
          Proceso fuera del catalogo (el 8,6 % de los pasos de Sigrid, sobre
          todo de efectos): su nombre viene igual en `proceso`.
        agregacion: no_sumable
      proceso:
        significado: >-
          Nombre del proceso tal y como lo muestra Sigrid («Comprobar factura»,
          «Aprobar factura», «Enviar para la firma»...). El rol con que se
          aprobo sale de este nombre y del estado destino, no de otra columna.
      estado_origen_id:
        significado: Estado del documento ANTES del paso (`rac.est1`), numero por tipo.
        agregacion: no_sumable
      estado_origen_codigo:
        significado: Codigo del estado de origen (`conest.cod`), traducido por la pareja tipo-estado.
        nulo_significa: El estado no esta en el catalogo de estados de su tipo (3 casos).
      estado_origen:
        significado: Nombre del estado de origen (`conest.res`).
        nulo_significa: El estado no esta en el catalogo de estados de su tipo.
      estado_destino_id:
        significado: Estado del documento DESPUES del paso (`rac.est2`), numero por tipo.
        agregacion: no_sumable
      estado_destino_codigo:
        significado: >-
          Codigo del estado de destino (APJO, APRJG, EPF...), traducido por la
          pareja tipo-estado. El del paso con `es_ultimo` es el estado actual.
        nulo_significa: El estado no esta en el catalogo de estados de su tipo (4 casos).
      estado_destino:
        significado: Nombre del estado de destino (`conest.res`).
        nulo_significa: El estado no esta en el catalogo de estados de su tipo.
      usuario:
        significado: >-
          LOGIN de Sigrid de quien lanzo el paso (`rac.usu`), tal cual. Es el
          mismo login de `compras.comparativo_firmas.usuario` y de
          `personal.usuarios_sigrid.login` (casar en mayusculas y sin espacios).
      nombre_usuario:
        significado: >-
          Nombre de la ficha de usuario de Sigrid de ese login (`usu.res`).
          DATO PERSONAL autorizado (D4, 2026-10-07).
        nulo_significa: >-
          El login no tiene ficha de usuario en Sigrid (7 % de las filas):
          quien fue lo dice `usuario`.
      fecha:
        significado: Fecha del paso (`rac.fec`), ya tipada.
        nulo_significa: Sigrid no tiene fecha para el paso.
        agregacion: no_sumable
      hora:
        significado: Hora del paso (`rac.hor`), hora local de Madrid, al segundo.
        nulo_significa: Sigrid no tiene hora para el paso (2 de 2,5 M).
        agregacion: no_sumable
      momento:
        significado: Fecha y hora del paso juntas, hora local de Madrid.
        nulo_significa: Falta la fecha o la hora.
        agregacion: no_sumable
      asiento_id:
        significado: >-
          El asiento contable que genero el paso (`rac.asiide`): solo lo tiene
          el de contabilizar.
        nulo_significa: El paso no contabiliza (comprobar, aprobar, firmar...).
        agregacion: no_sumable
      orden:
        significado: >-
          Posicion del paso en la cadena de su documento, desde 1, por fecha,
          hora y `paso_id`.
        agregacion: no_sumable
      es_ultimo:
        significado: >-
          Verdadero en el ultimo paso del documento: su estado destino es el
          estado actual del documento (99,96 % de las facturas).
      encaja_con_anterior:
        significado: >-
          Verdadero si el estado de origen es el destino del paso anterior;
          falso si hay un salto (un cambio de estado fuera de un proceso).
        nulo_significa: Es el primer paso del documento.
      dias_desde_anterior:
        significado: Dias, con dos decimales, desde el paso anterior del mismo documento.
        nulo_significa: Es el primer paso o falta la fecha u hora de alguno de los dos.
        agregacion: promedio
    relaciones:
      - de: documento_id
        a: compras.facturas.factura_id
        cardinalidad: "N:1"
        porque: Los pasos de una factura, filtrando antes `familia = 'FACTURA'`.
      - de: documento_id
        a: compras.contratos.contrato_id
        cardinalidad: "N:1"
        porque: Los pasos de un contrato, filtrando antes `familia = 'CONTRATO'`.
      - de: documento_id
        a: compras.comparativos.comparativo_id
        cardinalidad: "N:1"
        porque: Los pasos de un comparativo, filtrando antes `familia = 'COMPARATIVO'`.
    ejemplos_preguntas:
      - Quien aprobo la factura X y cuando
      - Que facturas aprobo Fulano este mes
      - Cuanto tarda un contrato desde que se envia a la firma hasta que se firma
      - Por que estados paso el comparativo C y quien lanzo cada paso
