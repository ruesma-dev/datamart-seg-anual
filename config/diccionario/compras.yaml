  fn_sigrid_tiempo:
    tipo: funcion
    capa: operacion
    consumo_recomendado: false
    motivo_no_consumo: >-
      Funcion auxiliar del build de compras. La tabla que la usa ya publica la
      fecha convertida (`compras.contratos.fecha_ultima_modificacion`): no hay
