      Funcion auxiliar del build de compras. `compras.comparativo_oferta_lineas`
      ya publica su resultado en `porcentaje_descuento`.
    descripcion: >-
      Convierte el descuento de una linea de oferta (`dcopro.dto`, TEXTO con
      coma decimal como '10,08%', y negativo si es un recargo) a numero en
      tanto por cien. Lo que no casa con el patron es NULL, nunca un error ni
      un cero. El patron vive escrito una sola vez en
      `etl_sigrid/domain/comparativos.py` (F-038), y un test comprueba que el
