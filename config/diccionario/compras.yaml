    descripcion: >-
      Convierte una FECHA SERIE de Sigrid —como `con.tiemod`, la ultima
      modificacion del documento— en fecha y hora: dias desde el 1899-12-30
      (la epoca de Delphi) con la hora en la parte decimal; 46300,537627 es el
      2026-10-05 a las 12:54:10. El 0 sale NULL. **Trampa medida el
