# config/tables_sigrid.yaml
#
# Declara qué tablas de Sigrid se extraen al esquema raw de Postgres.
#
# Cada entrada define:
#   source_table       : nombre de la tabla en Sigrid (esquema dbo)
#   target_table       : nombre destino en Postgres (esquema raw)
#   id_column          : columna usada como cursor de paginación (típicamente "ide")
#   incremental_column : columna timestamp para carga incremental (típicamente "tiemod")
#   where              : filtro SQL opcional (sin la palabra WHERE)
#   exclude_columns    : columnas binarias o pesadas que no queremos extraer
#   page_size          : filas por petición HTTP (opcional, default SIGRID_API_PAGE_SIZE).
#                        Bájalo para tablas con columnas texto/blob pesadas (ej. obrparpre.planif).
#
# El ETL determina dinámicamente los tipos consultando INFORMATION_SCHEMA.COLUMNS
# de Sigrid y los mapea a tipos Postgres. No hace falta hardcodear columnas aquí.

tables:

  - source_table: con
    target_table: con
    id_column: ide
    incremental_column: tiemod
    where: null
    exclude_columns:
      - ima    # imagen del concepto, binario pesado
      - tex    # texto libre largo, no lo usamos en seguimiento
    # page_size: omitido → usa default global

  - source_table: conext
    target_table: conext
    id_column: ide
    incremental_column: null   # conext no tiene tiemod estándar; refresco completo
    where: null
    exclude_columns: []

  - source_table: obr
    target_table: obr
    id_column: ide
    incremental_column: tiemod
    where: null
    exclude_columns: []

  - source_table: obrparpar
    target_table: obrparpar
    id_column: ide
    incremental_column: tiemod
    where: null
    exclude_columns:
      - tex    # descripción larga, no usada en seguimiento
      - med    # medición desglosada (binario)
      - des    # descomposición desglose (texto largo)

  - source_table: obrparpre
    target_table: obrparpre
    id_column: ide
    incremental_column: tiemod
    where: null
    exclude_columns:
      - tex    # descripción larga
      - med    # medición desglosada (binario pesado)
      - des    # descomposición desglose
      # planif SÍ lo necesitamos (cadena de planificación temporal)
    # planif es TEXT ilimitado; bajamos el page_size para no saturar memoria
    # de la Function App si las cadenas planif son muy largas.
    page_size: 5000

  - source_table: obrfas
    target_table: obrfas
    id_column: ide
    incremental_column: tiemod
    where: null
    exclude_columns: []

  - source_table: obrfasamb
    target_table: obrfasamb
    id_column: ide
    incremental_column: tiemod
    where: null
    exclude_columns: []
    # Fases × Ámbito. Aporta `plafec`: fecha de inicio de planificación por
    # (obride, amb, fas). El parser de la columna `planif` de obrparpre usa esta
    # fecha como ancla del mes 1; mes 2 = plafec + 1 mes, etc.

  - source_table: obrctr
    target_table: obrctr
    id_column: ide
    incremental_column: tiemod
    where: null
    exclude_columns:
      - tex    # descripción larga del contrato (no usamos)
      - obs    # observaciones del contrato (texto libre)
    # Contratos de obra. Aporta las fechas reales/previstas (fecreaact,
    # fecprefin, fecreaini, fecreafin, fecpreini, etc.) que en Ruesma están
    # mejor mantenidas aquí que en raw.obr. Una obra puede tener varios
    # contratos; en stg se elige el más antiguo (inicio) y el más reciente
    # con fecprefin (fin). Cruce: obrctr.obride → obr.ide.

  - source_table: cen
    target_table: cen
    id_column: ide
    incremental_column: null   # catálogo estable, refresco completo
    where: null
    exclude_columns:
      - tex    # observaciones largas si existieran
    # Centros de coste. Tabla con MUCHAS columnas según el PDF (cnaeide,
    # ctacot, calcabide, direcciones, teléfonos…) pero a nosotros nos basta
    # con ide + res para mostrar el texto en la cabecera del cierre. El ETL
    # acepta cualquier columna que venga; aquí solo evitamos texto libre.

  - source_table: auxobrtip
    target_table: auxobrtip
    id_column: ide
    incremental_column: null   # catálogo estable, refresco completo
    where: null
    exclude_columns: []
    # Tipos de obra (referenciado por obr.obrtipide).

  - source_table: auxobrcla
    target_table: auxobrcla
    id_column: ide
    incremental_column: null   # catálogo estable, refresco completo
    where: null
    exclude_columns: []
    # Clases de obra (referenciado por obr.obrclaide).

  - source_table: auxobramb
    target_table: auxobramb
    id_column: ide
    incremental_column: null   # catálogo estable, refresco completo
    where: null
    exclude_columns: []

  - source_table: auxobrtca
    target_table: auxobrtca
    id_column: ide
    incremental_column: null   # catálogo estable, refresco completo
    where: null
    exclude_columns: []
    # Catálogo de "tipos de capítulo" (CD/CI/CP/...) referenciado por
    # obrparpar.tcaide. Nos permite clasificar categorías de partida
    # directamente desde Sigrid sin depender de heurísticas sobre el
    # código del capítulo raíz.

  # ===========================================================================
  # MAESTROS para consulta externa: direcciones de obra y proveedores.
  # No intervienen en el seguimiento/cierre; alimentan el schema `maestro`.
  # ===========================================================================

  - source_table: condir
    target_table: condir
    id_column: ide
    incremental_column: null     # no consta tiemod en la doc; refresco completo
    where: null
    exclude_columns:
      - dirtex   # observaciones de la dirección (texto ilimitado)
      - eiotex   # descripción con. envío (texto ilimitado)
    # Direcciones de conceptos (1N). conide → con.ide. Como la OBRA es un `con`
    # (obr.ide = con.ide) y el PROVEEDOR también (prv.ide = con.ide), esta tabla
    # da la dirección tanto de obras como de proveedores. Campos útiles:
    # dir1, dir2, dircpo (CP), munide→auxmun, proide→auxpro, dir (completa),
    # tel, ele (email). Una entidad puede tener varias direcciones (pos/tipo).

  - source_table: obrprv
    target_table: obrprv
    id_column: ide
    incremental_column: null     # no consta tiemod en la doc; refresco completo
    where: null
    exclude_columns:
      - tex    # observaciones largas
    # Obras: Proveedores (1N). Lista de proveedores por obra.
    # Cruce: obrprv.obride → obr.ide. Trae cod (código proveedor) y
    # res (nombre proveedor). El enlace al maestro de proveedor (CIF) se
    # resolverá en stg/maestro tras verificar la clave real (probable por cod).

  - source_table: prv
    target_table: prv
    id_column: ide
    incremental_column: null     # extiende con; sin tiemod propio garantizado
    where: null
    exclude_columns: []
    # Proveedores (Propiedades de con, mismo ide). Aporta cif (CIF/NIF),
    # raz (razón social), tipsub (subcontratista). La dirección viene de
    # condir (conide = prv.ide). El nombre también está en con.res.

  - source_table: auxpro
    target_table: auxpro
    id_column: ide
    incremental_column: null   # catálogo estable, refresco completo
    where: null
    exclude_columns: []
    # Provincias. Decodifica condir.proide → res (nombre provincia).

  - source_table: auxmun
    target_table: auxmun
    id_column: ide
    incremental_column: null   # catálogo estable, refresco completo
    where: null
    exclude_columns: []
    # Municipios. Decodifica condir.munide → res (nombre municipio).

  - source_table: ctr
    target_table: ctr
    id_column: ide
    incremental_column: tiemod   # si diera error, ponlo a null (refresco completo)
    where: null
    exclude_columns:
      - tex    # texto largo
      - obs    # observaciones
    # Contratos de compra. Vínculo obra↔proveedor: ctr.obride → obr.ide,
    # ctr.entide → con/prv (proveedor). Aporta importes (totdoc, tot…).
    # Fuente de "proveedores de la obra X".
  # ===========================================================================
  # MÓDULO COMPRAS (Tandas C1/C2) — comparativos, albaranes y facturas
  #
  # NOTA SOBRE exclude_columns: todas estas tablas comparten la misma lista de
  # exclusión, que cubre TODOS los nombres de columna de tipo texto ilimitado o
  # binario que usa Sigrid en documentos (tex, med, des, obs, ima, emptex,
  # dirtex, eiotex, desesp, texcom, serdesdat, texobs, coestr).
  # Motivo: el ETL descarta esas columnas al CREAR la tabla en Postgres pero
  # las pediría en el SELECT si no se excluyen, y el COPY falla con
  # "no existe la columna X". Excluir un nombre que la tabla no tiene es
  # inofensivo (el filtro simplemente no encuentra coincidencia), así que se
  # aplica la lista completa a todas y se evita ir descubriéndolas de una en
  # una. Ninguna de esas columnas la necesitan los SQL del schema compras.
  # ctr y prv ya están arriba. dcapropar/dcfpropar NO se ingieren (vacías en
  # Ruesma: la partida viene en la propia línea dcapro.paride / dcfpro.paride).
  # Volúmenes 2026-07: dcapro 1,13M · dcfpro 1,08M · dca 305k · dcf 163k ·
  # ctrpro 241k · com 20k. Primera ingesta completa ≈ 10-15 min.
  # ===========================================================================

  - source_table: com
    target_table: com
    id_column: ide
    incremental_column: tiemod
    where: null
    exclude_columns:
      - tex
      - med
      - des
      - obs
      - ima
      - emptex
      - dirtex
      - eiotex
      - desesp
      - texcom
      - serdesdat
      - texobs
      - coestr
    # Comparativos de ofertas. com.obride → obra. Referenciado por
    # ctr.comide / dca.comide / dcf.comide (comparativo origen).

  - source_table: comlin
    target_table: comlin
    id_column: ide
    incremental_column: tiemod
    where: null
    exclude_columns:
      - tex
      - med
      - des
      - obs
      - ima
      - emptex
      - dirtex
      - eiotex
      - desesp
      - texcom
      - serdesdat
      - texobs
      - coestr
    # Detalle del comparativo (líneas por oferta).

  - source_table: comprv
    target_table: comprv
    id_column: ide
    incremental_column: tiemod
    where: null
    exclude_columns:
      - tex
      - med
      - des
      - obs
      - ima
      - emptex
      - dirtex
      - eiotex
      - desesp
      - texcom
      - serdesdat
      - texobs
      - coestr
    # Proveedores invitados/ofertantes del comparativo.

  - source_table: ctrpro
    target_table: ctrpro
    id_column: ide
    incremental_column: tiemod
    where: null
    exclude_columns:
      - tex
      - med
      - des
      - obs
      - ima
      - emptex
      - dirtex
      - eiotex
      - desesp
      - texcom
      - serdesdat
      - texobs
      - coestr
    # Líneas de contrato de compra. docide→ctr, paride (partida),
    # canser (cantidad servida), tot (importe línea sin IVA).

  - source_table: dca
    target_table: dca
    id_column: ide
    incremental_column: tiemod
    where: null
    exclude_columns:
      - tex
      - med
      - des
      - obs
      - ima
      - emptex
      - dirtex
      - eiotex
      - desesp
      - texcom
      - serdesdat
      - texobs
      - coestr
      - dircon1
      - dircon2
      - dircon3
      - dirdir1
      - dirdir2
      - dirdir3
      - eittra
      - pagfor
      - pagtex
      - texent
    # Cabecera de albarán de compra (tip=14). ctride → contrato (0 = directo).
    # Código/serie/fecha viven en con (mismo ide). Series Ruesma:
    # AC (albarán), PROF (proforma/cert. subcontrata), NTC (nota).

  - source_table: dcapro
    target_table: dcapro
    id_column: ide
    incremental_column: tiemod
    where: null
    exclude_columns:
      - tex
      - med
      - des
      - obs
      - ima
      - emptex
      - dirtex
      - eiotex
      - desesp
      - texcom
      - serdesdat
      - texobs
      - coestr
    page_size: 5000   # tabla grande (1,1M) con muchas columnas
    # Líneas de albarán. obride/paride EN LA LÍNEA. canfac = cantidad ya
    # facturada (base de "albaranado sin facturar"). linoriide→ctrpro con
    # docoritip=44 = trazabilidad a la línea de contrato.

  - source_table: dcf
    target_table: dcf
    id_column: ide
    incremental_column: tiemod
    where: null
    exclude_columns:
      - tex
      - med
      - des
      - obs
      - ima
      - emptex
      - dirtex
      - eiotex
      - desesp
      - texcom
      - serdesdat
      - texobs
      - coestr
      - dircon1
      - dircon2
      - dircon3
      - dirdir1
      - dirdir2
      - dirdir3
      - eittra
      - pagfor
      - pagtex
      - texent
    # Cabecera de factura de compra (tip=15). Series: FR/FRGG (factura),
    # AB/ABGG (abono, importes negativos).

  - source_table: dcfpro
    target_table: dcfpro
    id_column: ide
    incremental_column: tiemod
    where: null
    exclude_columns:
      - tex
      - med
      - des
      - obs
      - ima
      - emptex
      - dirtex
      - eiotex
      - desesp
      - texcom
      - serdesdat
      - texobs
      - coestr
    page_size: 5000   # tabla grande (1,1M)
    # Líneas de factura, gemela de dcapro: obride/paride propios.
    # linoriide→dcapro (docoritip=14) = factura de albarán;
    # linoriide→ctrpro (docoritip=44) = factura directa de contrato.

  - source_table: dcfprodes
    target_table: dcfprodes
    id_column: ide
    incremental_column: null   # tabla mínima (~267 filas), refresco completo
    where: null
    exclude_columns:
      - tex
      - med
      - des
      - obs
      - ima
      - emptex
      - dirtex
      - eiotex
      - desesp
      - texcom
      - serdesdat
      - texobs
      - coestr
    # Destinos de líneas de factura. Residual en Ruesma; se ingiere por
    # completitud de la trazabilidad.

  # ===========================================================================
  # MÓDULO RETENCIONES (Tanda R1) — garantías retenidas
  # Una retención se materializa como EFECTO con retide <> 0:
  #   pag → la practicamos a un PROVEEDOR   (25.124 efectos, 34,7 M€ vivos)
  #   cob → nos la practica un CLIENTE      ( 2.219 efectos, 21,9 M€ vivos)
  # La regla contractual (5 %) vive en obrctr.coegar, ya ingerido.
  # Los avales (avr/ava) NO se usan en Ruesma: no se ingieren.
  # ===========================================================================

  - source_table: cob
    target_table: cob
    id_column: ide
    incremental_column: tiemod
    where: null
    exclude_columns: []
    # Cobros/efectos de cliente (21.643 filas). Con retide <> 0 son las
    # retenciones que el cliente nos practica. conide → factura de venta
    # (con.tip=11), cenide → obra, fecven = devolución prevista,
    # fecrea = 0 mientras siga retenida.

  - source_table: pag
    target_table: pag
    id_column: ide
    incremental_column: tiemod
    where: null
    exclude_columns:
      - blores   # motivo de bloqueo (texto libre)
    # Pagos/efectos a proveedor (252.189 filas). Con retide <> 0 son las
    # retenciones de garantía que practicamos. conide → factura de compra
    # (con.tip=15). Misma semántica de fechas que cob.

  - source_table: rec
    target_table: rec
    id_column: ide
    incremental_column: null   # catálogo estable (2.177 filas)
    where: null
    exclude_columns: []
    # Catálogo de retenciones/recargos. Extiende con: el nombre legible está
    # en con.res, NO en rec (rec no tiene cod ni res propios).
    # El tipo dominante en Ruesma es ide=558368 (97 % de los efectos).

  # ===========================================================================
  # MODULO PERSONAL (F-066, tanda P) -- recursos, empleados y partes de trabajo
  #
  # Lo pidio Juan Romero el 2026-09-03: el datamart sabe lo que CUESTA una obra
  # en material y subcontrata, pero no quien ha trabajado en ella ni cuantas
  # horas. Las horas NO estan en `hmo` (6.850 cabeceras de parte) sino en
  # `hmores` (328.760 lineas, con recurso, obra, fecha, cantidad e importe).
  #
  # DATOS PERSONALES, decidido por el humano el 2026-09-06: `emp` y `res` se
  # traen ENTERAS salvo exclusiones tecnicas (binario y texto ilimitado). No se
  # excluye ninguna columna por ser dato personal -- ni DNI, ni Seguridad
  # Social, ni cuenta bancaria, ni domicilio, ni credenciales de acceso--; lo
  # que se publique de eso lo decide F-057, no `raw`. La ficha de cada tabla en
  # `config/diccionario/raw.yaml` DECLARA que contiene. Aviso que va con la
  # decision: `mcp_sigrid_dm_ro` lee todos los esquemas, `raw` incluido.
  # ===========================================================================

  - source_table: res
    target_table: res
    id_column: ide
    incremental_column: null   # medido 2026-09-06: `res` no tiene tiemod
    where: null
    exclude_columns: []
    # Recursos (2.610 filas, 55 columnas, tip=33 en con). 1.723 de baja.
    # Medido: ninguna columna binaria ni de texto ilimitado, asi que entra
    # entera. Incluye el NIF de la persona en `cif` (informado en 626).
    # Criterio de negocio de Juan Romero: los recursos en rojo estan de baja y
    # no se consideran; todos los de alta van codificados "Apellidos, Nombre".

  - source_table: emp
    target_table: emp
    id_column: ide
    incremental_column: null   # medido 2026-09-06: `emp` no tiene tiemod
    where: null
    exclude_columns:
      - ima      # la foto del empleado (Binario ilimitado)
      - dir      # y las diez siguientes son Texto ilimitado
      - dirtex
      - web
      - tex
      - eleloc
      - disobs
      - podtex
      - traele
      - tracta
      - obsnom
    # Empleados (1.352 filas, 161 columnas, tip=43 en con). Las 11 de arriba
    # son EXACTAMENTE las 11 columnas ilimitadas que tiene la tabla, medidas el
    # 2026-09-06 contra INFORMATION_SCHEMA: la exclusion es tecnica, no de
    # negocio. Si `emp` pasa de 161 columnas, revisar la lista: una columna de
    # texto ilimitado nueva entraria sin querer.

  - source_table: hmo
    target_table: hmo
    id_column: ide
    incremental_column: null
    where: null
    exclude_columns: []
    # Cabecera del parte de trabajo (6.850 filas, 16 columnas). Medido: no
    # tiene ninguna columna ilimitada, ni siquiera `tex`. `reside` solo viene
    # informado en 6 filas: el recurso esta en la LINEA, no en la cabecera.

  - source_table: hmores
    target_table: hmores
    id_column: ide
    incremental_column: null
    where: null
    exclude_columns:
      - tex    # observaciones de la linea (Texto ilimitado)
    # LAS HORAS (328.760 filas, 56 columnas). Es la tabla que faltaba: `reside`
    # informado en el 99,9 %, `obride` en el 99,6 % (536 obras distintas), mas
    # fecha, cantidad e importe por linea. Sin ella no se puede responder
    # "horas por obra", que es lo que F-057 tiene que construir.

  # ===========================================================================
  # MODULO CONTABILIDAD (F-066, tanda K) -- la otra version de la verdad
  #
  # El datamart vive del PRESUPUESTO y del SEGUIMIENTO: lo que se planifico y
  # lo que el jefe de obra cerro cada mes. La contabilidad es lo que de verdad
  # se contabilizo, y con ella se puede contrastar por primera vez el coste de
  # seguimiento contra el coste contable de la misma obra.
  #
  # NINGUNA DE LAS CUATRO TIENE `tiemod` (medido el 2026-09-06), asi que no hay
  # carga incremental posible por columna de corte: van enteras. La nocturna ya
  # recarga entera de todos modos (`CMD` del Dockerfile: `run-all --full`).
  #
  # El plan de cuentas NO entra aqui: la jerarquia vive en `con` (tip=16,
  # 44.778 filas de 38 empresas), que ya se ingiere; `cua` solo EXTIENDE las
  # cuentas imputables. La fecha del asiento tambien sale de `con`.
  # ===========================================================================

  - source_table: cua
    target_table: cua
    id_column: ide
    incremental_column: null
    where: null
    exclude_columns: []
    # Plan de cuentas (34.139 filas, 16 columnas). "Propiedades de con" 1:1:
    # extiende las cuentas imputables (33.875 de nivel 5 frente a 254 de nivel
    # 0). El codigo y el nombre legibles salen de `con`, no de aqui.
    # Medido: ninguna columna ilimitada.

  - source_table: asi
    target_table: asi
    id_column: ide
    incremental_column: null
    where: null
    exclude_columns: []
    # Asientos contables (783.386 filas, 7 columnas, tip=20 en con). 0
    # huerfanos medidos. La FECHA del asiento es `con.fec` (entero AAAAMMDD),
    # no vive aqui. Medido: ninguna columna ilimitada.

  - source_table: apu
    target_table: apu
    id_column: ide
    incremental_column: null
    where: null
    exclude_columns:
      - tex    # texto libre del apunte (Texto ilimitado)
    # APUNTES CONTABLES (2.154.543 filas, 36 columnas): la tabla mas grande que
    # se ha traido nunca, por encima de `con` (2,18 M).
    #
    # POR QUE ENTERA Y NO PARTIDA (DA-1 de la spec): no tiene `tiemod`, asi que
    # el incremental por columna de corte esta descartado. Partir por empresa
    # ahorra <= 10 % (emp=1 es el 89,9 % de los apuntes) y exige una subconsulta
    # a `con` via `asi`; por ejercicio, 2017+ es el 85 %. Se reabre solo si la
    # medicion de la primera nocturna pasa de 15 minutos.
    #
    # Medido y contra lo que la ficha de F-056 suponia: `fec` viene informada
    # en el 100 % de las filas. La atribucion a obra va por `cenide` (54 %) y
    # NO por `obr` (informado en 142 filas y con 2 obras distintas).

  - source_table: apa
    target_table: apa
    id_column: ide
    incremental_column: null
    where: null
    exclude_columns:
      - tex
    # Desglose analitico del apunte (709.403 filas, 20 columnas): `cenide` en
    # el 99,98 %, `apuide` en el 88 %, `obride` en 0. Candidata a fuente de la
    # cuenta de resultados por obra de F-058. No es el puente obra<->centro de
    # coste que F-045 busca: `obride` esta a cero en todas.
