  #
  # Nueve tablas que el origen tiene y este ETL no traia, y sin las cuales la
  # mitad de lo que el censo del 2026-09-09 propone construir no se puede
  # escribir. Medidas una a una contra Sigrid ese dia por `sigrid-api` en solo
  # lectura (INFORMATION_SCHEMA.COLUMNS y COUNT(*)); el detalle esta en
  # `progress/explore_F-074_las_nueve.md`. `ide` es `int` y UNICO en las nueve
  # (COUNT(*) = COUNT(DISTINCT ide)), asi que sirve de cursor sin reservas.
  #
  # SOLO TRES TIENEN `tiemod` -- `auxdpt`, `auxhor` y `auxrestip`, en `float`
  # (fecha serie) y poblado al 100 %. Las otras seis NO TIENEN NINGUNA COLUMNA
  # DE TIPO FECHA: lo que lo parece (`fec`, `fecalt`, `fecult`, `fecultact`) es
  # un entero AAAAMMDD, que no sirve de corte.
  #
  # Y ESO NO ABRE NINGUN AGUJERO, aunque lo parezca. `incremental_column` NO es
  # un interruptor de modo de carga: lo unico que decide es si `copy_rows`
  # rellena `_source_tiemod` con el sello del origen. QUIEN DECIDE COMO SE
  # CARGA ES EL `CMD` DEL `Dockerfile`, que arranca `run-all --full`, o sea
  # TRUNCATE y recarga entera de TODAS las tablas cada noche. Por eso "esta
  # tabla no tiene tiemod" significa "su fila de raw no lleva sello de origen",
  # y NO "lo que se modifique en Sigrid no volvera a bajar": eso solo es cierto
  # lanzando `ingest` a mano sin `--full`. Es el error exacto que F-006 cometio
  # dos veces seguidas y que `tests/test_f006_fuente_que_gobierna.py` existe
  # para impedir. La consecuencia practica es que NO hace falta ninguna recarga
  # completa por tabla, y por eso aqui no se inventa ninguna: el ETL no sabe
  # hacerla y no la necesita.
